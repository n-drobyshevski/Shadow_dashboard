<script>
/**
 * Pages.dashboard — port of Tableau_de_bord.py (docs/API.md §6), typeset per docs/DESIGN.md.
 *
 * KPI strip, compliance gauges, risk bars, "Détail conformité" leader rows, score histograms (all on
 * the filtered data of the selected month), then the Google Sheets import section + import ledger.
 *
 * Read-only mode (lecteur, !State.canEdit()): no import form (api_importMonth is admin only); the import
 * ledger stays, alone in a « Derniers imports » section (api_getImportLog is allowed).
 */
(function () {
  'use strict';

  var el = UI.el;
  var KEY_POSTE = Core.KEY_POSTE;
  var KEY_APP = Core.KEY_APP;

  var board = null;         // Charts.board of the rendered body (purged on re-render / leave)
  var view = null;          // {body, month} of the mounted page (filter changes re-render the body in place)
  var lastImport = null;    // result of the last successful import (warnings survive the re-mount)
  var importLogCache = null;

  // ------------------------------------------------------------------------------ helpers

  function toneFor(rate, total) {
    if (!total) return null;
    return rate >= Core.threshold() ? 'ok' : 'ko';
  }

  /** "■ Sous le seuil · 5 conformes sur 7 · seuil 80 %" under a gauge (status always in words). */
  function gaugeCaption(rate, ok, total, noun) {
    if (!total) return el('p', { class: 'chart-caption' }, 'Aucun' + (noun === 'application' ? 'e ' : ' ') + noun + ' dans la sélection.');
    return Charts.thresholdCaption({ items: [{ rate: rate, ok: ok, total: total }] });
  }

  /** One "Détail conformité" row: label ……… count (share), expandable to the affected names. */
  function detailItem(id, label, count, total, items, keyField) {
    var names = items.map(function (r) { return Core.str(r[keyField]) || '(sans nom)'; });
    var share = total ? ['(', UI.fmtPctNode(count / total * 100), ')'] : '';
    var summary = el('summary', { class: 'detail-summary' },
      el('span', { class: 'detail-label' }, label),
      el('span', { class: 'leader', 'aria-hidden': 'true' }),
      el('span', { class: 'detail-value' },
        el('span', { class: 'detail-count' + (count > 0 ? ' is-ko' : '') }, UI.fmtNum(count)),
        el('span', { class: 'detail-share' }, share)));
    // A zero row has nothing to reveal: it does not toggle.
    if (!names.length) summary.addEventListener('click', function (e) { e.preventDefault(); });
    var body = names.length ?
      el('ul', { class: 'detail-list' }, names.map(function (n) { return el('li', null, n); })) : null;
    return el('details', { class: 'detail-item' + (count > 0 ? '' : ' is-zero'), dataset: { detail: id } }, summary, body);
  }

  function nonItems(list, field) {
    return list.filter(function (r) { return Core.str(r[field]) === 'Non'; });
  }

  // ------------------------------------------------------------------------------ dashboard body

  function renderDashboard(body, s, md) {
    var f = State.filtered(md);
    var postes = f.postes;
    var apps = f.applications;
    var k = Core.computeKpis(postes, apps);
    board = Charts.board();

    var note = UI.filterNote('all');
    if (note) body.appendChild(note);
    if (!postes.length && !apps.length) {
      body.appendChild(UI.empty('Aucun poste ni application ne correspond aux filtres sélectionnés.'));
    }

    // KPI strip
    body.appendChild(UI.kpiStrip([
      { key: 'total_postes', title: 'Postes inventoriés', value: UI.fmtNum(k.total_postes) },
      { key: 'postes_conformes', title: 'Postes conformes', value: UI.fmtNum(k.postes_conformes),
        sub: UI.fmtPctNode(k.taux_postes), tone: toneFor(k.taux_postes, k.total_postes) },
      { key: 'total_apps', title: 'Applications inventoriées', value: UI.fmtNum(k.total_apps) },
      { key: 'apps_conformes', title: 'Applications conformes', value: UI.fmtNum(k.apps_conformes),
        sub: UI.fmtPctNode(k.taux_apps), tone: toneFor(k.taux_apps, k.total_apps) }
    ]));

    // Gauges
    body.appendChild(el('div', { class: 'grid grid-2' },
      board.section('Conformité des postes', 'chart-gauge-postes', function (box) { Charts.gauge(box, k.taux_postes); },
        gaugeCaption(k.taux_postes, k.postes_conformes, k.total_postes, 'poste')),
      board.section('Conformité des applications', 'chart-gauge-apps', function (box) { Charts.gauge(box, k.taux_apps); },
        gaugeCaption(k.taux_apps, k.apps_conformes, k.total_apps, 'application'))));

    // Risk bars
    body.appendChild(el('div', { class: 'grid grid-2' },
      board.section('Risques — Postes', 'chart-risk-postes', function (box) { Charts.riskBars(box, Core.riskCounts(postes)); }),
      board.section('Risques — Applications', 'chart-risk-apps', function (box) { Charts.riskBars(box, Core.riskCounts(apps)); })));

    // Conformity details
    body.appendChild(UI.section('Détail conformité',
      el('div', { class: 'grid grid-2' },
        el('div', { class: 'detail-block', id: 'detail-postes' },
          el('h3', { class: 'subsection-title' }, 'Postes'),
          el('div', { class: 'detail-rows' },
            detailItem('postes_sans_edr', 'Sans EDR', k.postes_sans_edr, k.total_postes, nonItems(postes, 'EDR Decathlon'), KEY_POSTE),
            detailItem('postes_non_it', 'Non IT Decathlon', k.postes_non_it, k.total_postes, nonItems(postes, 'IT Decathlon'), KEY_POSTE),
            detailItem('postes_hors_reseau', 'Hors réseau Decathlon', k.postes_hors_reseau, k.total_postes,
              nonItems(postes, 'Réseau Decathlon'), KEY_POSTE))),
        el('div', { class: 'detail-block', id: 'detail-apps' },
          el('h3', { class: 'subsection-title' }, 'Applications'),
          el('div', { class: 'detail-rows' },
            detailItem('apps_sans_sip', 'Sans SIP', k.apps_sans_sip, k.total_apps, nonItems(apps, 'SIP'), KEY_APP),
            detailItem('apps_sans_contrat', 'Sans contrat', k.apps_sans_contrat, k.total_apps, nonItems(apps, 'Contrat'), KEY_APP),
            detailItem('apps_sans_galink', 'Sans Galink', k.apps_sans_galink, k.total_apps, nonItems(apps, 'Galink'), KEY_APP),
            detailItem('apps_sans_idp', 'Sans IDP', k.apps_sans_idp, k.total_apps, nonItems(apps, 'IDP'), KEY_APP))))));

    // Histograms
    function scores(list) {
      return list.map(function (r) { return r._score; }).filter(function (v) { return v !== null && v !== undefined; });
    }
    body.appendChild(el('div', { class: 'grid grid-2' },
      board.section('Distribution des scores — Postes', 'chart-hist-postes', function (box) { Charts.histogram(box, scores(postes)); }),
      board.section('Distribution des scores — Applications', 'chart-hist-apps', function (box) { Charts.histogram(box, scores(apps)); })));

    board.draw();
  }

  // ------------------------------------------------------------------------------ import section

  function confirmMessage(month) {
    return 'L’export de ' + Fmt.monthLong(month) + ' existe déjà. Ré-importer écrase les postes, applications et le ' +
      'référentiel de ce mois (Galink/IDP sont conservés). Continuer ?';
  }

  function importLabel(month) { return State.get().months.indexOf(month) >= 0 ? 'Ré-importer' : 'Importer'; }

  function importPanel(s) {
    var button = el('button', { type: 'submit', class: 'btn btn-primary', id: 'import-button' }, importLabel(s.currentMonth));
    var field = UI.monthField({ id: 'import-month', name: 'month', value: s.currentMonth || '', options: s.months,
      required: true, labelledBy: 'import-month-label',
      onValidate: function (msg) { UI.fieldError(field, msg ? 'Mois invalide (format attendu : AAAA-MM).' : ''); },
      onChange: function (v) { button.textContent = importLabel(v); } });
    field.control.addEventListener('input', function () {
      var v = field.getValue();
      if (v) button.textContent = importLabel(v);
    });
    // Server errors only (field errors go under the field, UI.fieldError).
    var status = el('div', { id: 'import-status', class: 'import-status', role: 'status', 'aria-live': 'polite' });

    function showError(err) {
      UI.clear(status).appendChild(UI.errorState(err));
    }

    function runImport(month, overwrite) {
      UI.clear(status);
      field.setDisabled(true);
      var p = api.call('api_importMonth', { month: month, overwrite: !!overwrite });
      UI.busy(button, p, 'Import en cours…').then(null, function () {});
      return p.then(function (res) {
        lastImport = res;
        importLogCache = null;
        field.setDisabled(false);
        var c = res.counts || {};
        UI.toast('Import terminé — ' + UI.fmtNum(c.postes) + ' postes, ' + UI.fmtNum(c.applications) + ' applications.', 'success');
        var before = State.get().month;
        State.invalidate();
        return State.refreshBootstrap().then(function () {
          var now = State.get().month;
          if (now !== res.month) State.set({ month: res.month });       // triggers a re-mount
          else if (before === res.month) App.refresh();                  // same month: re-mount explicitly
          // else: refreshBootstrap already switched to res.month and the App re-mounted.
        });
      }, function (err) {
        field.setDisabled(false);
        if (err.code === 'MONTH_EXISTS' && !overwrite) {
          return UI.confirm(confirmMessage(month), { title: 'Mois déjà importé', okLabel: 'Ré-importer', danger: true })
            .then(function (ok) { return ok ? runImport(month, true) : null; });
        }
        var shown = err.code === 'NOT_CONFIGURED' ?
          new Error('La source n’est pas configurée. Renseignez-la dans ' + UI.quote('Paramètres') + '.') : err;
        if (status.isConnected) showError(shown);
        UI.errorToast(shown);
        return null;
      });
    }

    var errorLine = el('p', { class: 'field-error', id: 'import-month-err', hidden: true });
    var form = el('form', { class: 'import-form', novalidate: true, onSubmit: function (e) {
      e.preventDefault();
      if (button.getAttribute('aria-busy') === 'true') return;
      var msg = field.validate();
      UI.fieldError(field, msg ? 'Mois invalide (format attendu : AAAA-MM).' : '');
      if (msg) { field.focus(); return; }
      runImport(field.getValue(), false);
    } },
      el('label', { for: 'import-month', id: 'import-month-label', class: 'field-label' }, 'Mois de l’export'),
      el('div', { class: 'inline-form' }, field, button),
      errorLine);

    var sourceLine = s.sourceUrl ?
      el('p', { class: 'muted small' }, 'Source : ', UI.extLink(s.sourceUrl, s.sourceTitle || 'Google Sheet source')) :
      el('p', { class: 'muted small' }, 'Aucune source configurée.');

    var logBox = el('div', { class: 'import-log', id: 'import-log' });
    var panel = UI.section('Importer depuis Google Sheets',
      el('div', { class: 'grid grid-2 import-grid' },
        el('div', { class: 'import-card' },
          el('p', { class: 'page-lede' }, 'Crée un instantané mensuel des onglets ' + UI.quote('Suivi des postes') + ', ' +
            UI.quote('Suivi des applications') + ' et ' + UI.quote('Référentiel') + ' du Google Sheet source.'),
          sourceLine, form, status, lastImportBlock()),
        el('div', { class: 'import-history' },
          el('h3', { class: 'subsection-title' }, 'Derniers imports'),
          logBox)));
    panel.id = 'import-panel';
    loadImportLog(logBox);
    return panel;
  }

  /** Lecteurs: the import ledger alone (no form, no source line: the source sheet is private to admins). */
  function importHistoryPanel() {
    var logBox = el('div', { class: 'import-log', id: 'import-log' });
    var panel = UI.section('Derniers imports', logBox);
    panel.id = 'import-history-panel';
    loadImportLog(logBox);
    return panel;
  }

  function lastImportBlock() {
    if (!lastImport) return null;
    var c = lastImport.counts || {};
    var warnings = lastImport.warnings || [];
    return el('div', { class: 'alert ' + (warnings.length ? 'alert-warning' : 'alert-success'), id: 'import-result',
      dataset: { month: lastImport.month } },
      el('p', null, 'Dernier import : ' + Fmt.monthLong(lastImport.month) + ' — ',
        el('span', { class: 'num' }, UI.fmtNum(c.postes)), ' postes, ',
        el('span', { class: 'num' }, UI.fmtNum(c.applications)), ' applications, ',
        el('span', { class: 'num' }, UI.fmtNum(c.referentiel)), ' catégories de référentiel' +
        (lastImport.overwritten ? ' (mois écrasé)' : '') +
        (lastImport.carriedOver ? ' · ' + lastImport.carriedOver + ' valeur(s) Galink/IDP reprise(s)' : '') + '.'),
      warnings.length ? el('ul', { class: 'warning-list' }, warnings.map(function (w) { return el('li', null, w); })) : null);
  }

  /** Warnings of one import: a hidden row listing them, revealed by the count button of its row. */
  function importWarnings(e, i) {
    var w = e.warnings || [];
    if (!w.length) return { toggle: null, detail: null };
    var detailId = 'import-warnings-' + i;
    var detail = el('tr', { class: 'import-warnings-row', id: detailId, hidden: true },
      el('td', { colspan: '6' }, el('ul', { class: 'warning-list' }, w.map(function (t) { return el('li', null, t); }))));
    var toggle = el('button', { type: 'button', class: 'btn btn-quiet btn-sm import-warn-toggle',
      'aria-expanded': 'false', 'aria-controls': detailId,
      'aria-label': w.length + ' alerte' + (w.length > 1 ? 's' : '') + ' d’import — afficher le détail',
      onClick: function () {
        var open = toggle.getAttribute('aria-expanded') !== 'true';
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        detail.hidden = !open;
      } }, String(w.length));
    return { toggle: toggle, detail: detail };
  }

  function loadImportLog(box) {
    UI.asyncBlock(box, {
      load: function () {
        return importLogCache ? importLogCache : api.call('api_getImportLog', null).then(function (log) {
          importLogCache = log || [];
          return importLogCache;
        });
      },
      placeholder: function () { return UI.loading('Chargement de l’historique…', { small: true }); },
      small: true,
      error: { prefix: 'Historique indisponible' },
      render: function (log) {
        var entries = log.slice(0, 5);
        if (!entries.length) { box.appendChild(UI.empty('Aucun import pour le moment.', { small: true })); return; }
        var warn = entries.map(importWarnings);
        function count(key) { return function (e) { return UI.fmtNum((e.counts || {})[key]); }; }
        box.appendChild(UI.table({
          className: 'import-table',
          columns: [
            { label: 'Mois', cell: function (e) { return Fmt.monthLong(e.month); } },
            { label: 'Importé le', mono: true, cell: function (e) { return Fmt.dateTime(e.imported_at); } },
            { label: 'Postes', num: true, cell: count('postes') },
            { label: 'Applis', num: true, cell: count('applications') },
            { label: 'Référentiel', num: true, cell: count('referentiel') },
            { label: 'Alertes', num: true, cell: function (e, i) { return warn[i].toggle || el('span', { class: 'faint' }, '—'); } }
          ],
          rows: entries,
          rowAttrs: function (e) { return { dataset: { month: e.month } }; },
          extraRows: function (e, i) { return warn[i].detail; }
        }));
      }
    });
  }

  // ------------------------------------------------------------------------------ page

  function mount(root) {
    purgeCharts();
    view = null;
    var s = State.get();
    var canEdit = State.canEdit();
    root.appendChild(UI.monthHeader({ title: 'Tableau de bord', month: s.month, kickerId: 'dashboard-caption' }));

    if (!s.months.length) {
      // Empty state: one line of ink-2 text; the import section right below is the action (admins only).
      var empty = UI.empty(canEdit ? 'Aucune donnée importée.' :
        'Aucun mois importé. Un administrateur doit importer les données.');
      empty.id = 'dashboard-empty';
      root.appendChild(empty);
      if (canEdit) root.appendChild(importPanel(s));
      return;
    }

    var body = el('div', { class: 'dashboard-body', id: 'dashboard-body' });
    root.appendChild(body);
    root.appendChild(canEdit ? importPanel(s) : importHistoryPanel());
    view = { body: body, month: s.month, ready: false };
    var v = view;
    UI.asyncBlock(body, {
      load: function () { return State.loadMonth(v.month); },
      placeholder: function () { return UI.skeleton('dashboard', { label: 'Chargement des données…' }); },
      error: UI.monthError(v.month),
      render: function (md) { v.ready = true; renderDashboard(body, State.get(), md); }
    });
  }

  /** Filter change: only the figures and charts re-render (the import section and its history stay). */
  function update(changed) {
    var md = view && view.ready && State.getMonthData(view.month);
    if (!md || changed.length !== 1 || changed[0] !== 'filters') return false;
    purgeCharts();
    UI.clear(view.body);
    renderDashboard(view.body, State.get(), md);
    return true;
  }

  function purgeCharts() {
    if (board) board.purge();
  }

  function unmount() {
    view = null;
    purgeCharts();
  }

  window.Pages = window.Pages || {};
  window.Pages.dashboard = { id: 'dashboard', title: 'Tableau de bord', mount: mount, unmount: unmount, update: update };
})();
</script>
