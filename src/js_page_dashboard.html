<script>
/**
 * Pages.dashboard — port of Tableau_de_bord.py (docs/API.md §6).
 *
 * KPI cards, conformity gauges, risk bars, conformity details, score histograms (all on the
 * filtered data of the selected month), then the Google Sheets import panel + import history.
 */
(function () {
  'use strict';

  var el = UI.el;
  var KEY_POSTE = Core.KEY_POSTE;
  var KEY_APP = Core.KEY_APP;

  var token = 0;            // bumped on every mount/unmount: stale async renders are dropped
  var chartEls = [];
  var lastImport = null;    // result of the last successful import (warnings survive the re-mount)
  var importLogCache = null;

  // ------------------------------------------------------------------------------ helpers

  function header(s) {
    return el('header', { class: 'page-header' },
      el('h1', { class: 'page-title' }, '👻 Tableau de bord — Shadow IT'),
      s.month ? el('p', { class: 'page-caption', id: 'dashboard-caption' }, 'Export : ' + s.month) : null);
  }

  function filterNote(s) {
    var f = s.filters || {};
    var parts = [];
    if ((f.equipes || []).length) parts.push('Équipe : ' + f.equipes.join(', '));
    if ((f.batiments || []).length) parts.push('Bâtiment / Labo : ' + f.batiments.join(', ') + ' (postes uniquement)');
    if (!parts.length) return null;
    return el('p', { class: 'filter-note', role: 'status' }, el('span', { 'aria-hidden': 'true' }, '🔎 '),
      'Filtres actifs — ' + parts.join(' · '));
  }

  /** Card with a title and a chart box; the draw function runs once the box is in the document. */
  function chartCard(title, id, draws, drawFn) {
    var box = el('div', { class: 'chart-box', id: id, role: 'img', 'aria-label': title });
    chartEls.push(box);
    draws.push(function () { drawFn(box); });
    return el('div', { class: 'card chart-card' }, el('h3', { class: 'card-title' }, title), box);
  }

  function kpiCard(key, opts) {
    var c = UI.card(opts);
    c.dataset.kpi = key;
    return c;
  }

  function toneFor(rate, total) {
    if (!total) return null;
    return rate >= Core.THRESHOLD ? 'ok' : 'ko';
  }

  /** One conformity detail line: count badge + collapsible list of the offending items. */
  function detailItem(id, label, count, total, items, keyField) {
    var names = items.map(function (r) { return Core.str(r[keyField]) || '(sans nom)'; });
    var share = total ? ' (' + UI.fmtPct(count / total * 100) + ')' : '';
    var summary = el('summary', { class: 'detail-summary' },
      el('span', { class: 'detail-label' }, label),
      el('span', { class: 'detail-value' }, UI.badge(UI.fmtNum(count), count > 0 ? 'ko' : 'ok'),
        el('span', { class: 'muted small' }, share)));
    var body = names.length ?
      el('ul', { class: 'detail-list' }, names.map(function (n) { return el('li', null, n); })) :
      el('p', { class: 'muted small detail-none' }, 'Aucun élément.');
    return el('details', { class: 'detail-item', dataset: { detail: id } }, summary, body);
  }

  function nonItems(list, field) {
    return list.filter(function (r) { return Core.str(r[field]) === 'Non'; });
  }

  // ------------------------------------------------------------------------------ dashboard body

  function renderDashboard(body, s, md) {
    var f = State.filtered(md);
    var postes = f.postes;
    var apps = f.applications;
    var k = Core.computeKpis(postes, apps);
    var draws = [];

    var note = filterNote(s);
    if (note) body.appendChild(note);
    if (!postes.length && !apps.length) {
      body.appendChild(el('div', { class: 'alert alert-info', role: 'status' },
        'Aucun poste ni application ne correspond aux filtres sélectionnés.'));
    }

    // KPI cards
    body.appendChild(el('div', { class: 'grid grid-4 kpi-grid' },
      kpiCard('total_postes', { title: 'Postes inventoriés', value: UI.fmtNum(k.total_postes) }),
      kpiCard('postes_conformes', { title: 'Postes conformes', value: UI.fmtNum(k.postes_conformes),
        sub: UI.fmtPct(k.taux_postes), tone: toneFor(k.taux_postes, k.total_postes) }),
      kpiCard('total_apps', { title: 'Applications inventoriées', value: UI.fmtNum(k.total_apps) }),
      kpiCard('apps_conformes', { title: 'Applications conformes', value: UI.fmtNum(k.apps_conformes),
        sub: UI.fmtPct(k.taux_apps), tone: toneFor(k.taux_apps, k.total_apps) })));

    // Gauges
    body.appendChild(el('div', { class: 'grid grid-2' },
      chartCard('Conformité des postes', 'chart-gauge-postes', draws, function (box) { Charts.gauge(box, k.taux_postes); }),
      chartCard('Conformité des applications', 'chart-gauge-apps', draws, function (box) { Charts.gauge(box, k.taux_apps); })));

    // Risk bars
    body.appendChild(el('div', { class: 'grid grid-2' },
      chartCard('Risques — Postes', 'chart-risk-postes', draws, function (box) { Charts.riskBars(box, Core.riskCounts(postes)); }),
      chartCard('Risques — Applications', 'chart-risk-apps', draws, function (box) { Charts.riskBars(box, Core.riskCounts(apps)); })));

    // Conformity details
    body.appendChild(UI.section('Détail conformité',
      el('div', { class: 'grid grid-2' },
        el('div', { class: 'card detail-card', id: 'detail-postes' },
          el('h3', { class: 'card-title' }, '💻 Postes'),
          detailItem('postes_sans_edr', 'Sans EDR', k.postes_sans_edr, k.total_postes, nonItems(postes, 'EDR Decathlon'), KEY_POSTE),
          detailItem('postes_non_it', 'Non IT Decathlon', k.postes_non_it, k.total_postes, nonItems(postes, 'IT Decathlon'), KEY_POSTE),
          detailItem('postes_hors_reseau', 'Hors réseau Decathlon', k.postes_hors_reseau, k.total_postes,
            nonItems(postes, 'Réseau Decathlon'), KEY_POSTE)),
        el('div', { class: 'card detail-card', id: 'detail-apps' },
          el('h3', { class: 'card-title' }, '📦 Applications'),
          detailItem('apps_sans_sip', 'Sans SIP', k.apps_sans_sip, k.total_apps, nonItems(apps, 'SIP'), KEY_APP),
          detailItem('apps_sans_contrat', 'Sans contrat', k.apps_sans_contrat, k.total_apps, nonItems(apps, 'Contrat'), KEY_APP),
          detailItem('apps_sans_galink', 'Sans Galink', k.apps_sans_galink, k.total_apps, nonItems(apps, 'Galink'), KEY_APP),
          detailItem('apps_sans_idp', 'Sans IDP', k.apps_sans_idp, k.total_apps, nonItems(apps, 'IDP'), KEY_APP)))));

    // Histograms
    function scores(list) {
      return list.map(function (r) { return r._score; }).filter(function (v) { return v !== null && v !== undefined; });
    }
    body.appendChild(el('div', { class: 'grid grid-2' },
      chartCard('Distribution des scores — Postes', 'chart-hist-postes', draws, function (box) { Charts.histogram(box, scores(postes)); }),
      chartCard('Distribution des scores — Applications', 'chart-hist-apps', draws, function (box) { Charts.histogram(box, scores(apps)); })));

    draws.forEach(function (d) {
      try { d(); } catch (e) { console.error(e); }
    });
  }

  // ------------------------------------------------------------------------------ import panel

  function confirmMessage(month) {
    return 'Le mois ' + month + ' existe déjà. Ré-importer écrase les postes, applications et le référentiel de ce mois ' +
      '(Galink/IDP sont conservés). Continuer ?';
  }

  function importPanel(s, myToken) {
    var input = el('input', { type: 'month', id: 'import-month', class: 'input', value: s.currentMonth || '',
      required: true, placeholder: 'AAAA-MM', 'aria-describedby': 'import-status' });
    var button = el('button', { type: 'submit', class: 'btn btn-primary', id: 'import-button' }, '📥 Importer');
    var status = el('div', { id: 'import-status', class: 'import-status', role: 'status', 'aria-live': 'polite' });

    function busy(on) {
      button.disabled = on;
      input.disabled = on;
      UI.clear(status);
      if (on) status.appendChild(el('span', { class: 'muted' }, UI.spinner(), ' Import en cours…'));
    }
    function showError(msg) {
      UI.clear(status).appendChild(el('div', { class: 'alert alert-error', role: 'alert' }, '❌ ' + msg));
    }

    function runImport(month, overwrite) {
      busy(true);
      return api.call('api_importMonth', { month: month, overwrite: !!overwrite }).then(function (res) {
        lastImport = res;
        importLogCache = null;
        busy(false);
        var c = res.counts || {};
        UI.toast('✅ Import réussi : ' + c.postes + ' postes, ' + c.applications + ' applications', 'success');
        var before = State.get().month;
        State.invalidate();
        return State.refreshBootstrap().then(function () {
          var now = State.get().month;
          if (now !== res.month) State.set({ month: res.month });       // triggers a re-mount
          else if (before === res.month) App.refresh();                  // same month: re-mount explicitly
          // else: refreshBootstrap already switched to res.month and the App re-mounted.
        });
      }, function (err) {
        busy(false);
        if (err.code === 'MONTH_EXISTS' && !overwrite) {
          return UI.confirm(confirmMessage(month), { title: 'Mois déjà importé', okLabel: 'Ré-importer', danger: true })
            .then(function (ok) { return ok ? runImport(month, true) : null; });
        }
        var msg = err.code === 'NOT_CONFIGURED' ?
          'La source n’est pas configurée. Utilisez le bouton « ⚙️ Source ».' : (err.message || 'Erreur inconnue.');
        if (myToken === token) showError(msg);
        UI.toast('❌ Échec de l’import : ' + msg, 'error');
        return null;
      });
    }

    var form = el('form', { class: 'import-form', novalidate: true, onSubmit: function (e) {
      e.preventDefault();
      var month = input.value.trim();
      if (!Core.validateMonth(month)) {
        showError('Mois invalide (format attendu : AAAA-MM).');
        input.focus();
        return;
      }
      runImport(month, false);
    } },
      el('label', { for: 'import-month', class: 'field-label' }, 'Mois de l’export'),
      el('div', { class: 'inline-form' }, input, button));

    var sourceLine = s.sourceUrl ?
      el('p', { class: 'muted small' }, 'Source : ', UI.extLink(s.sourceUrl, s.sourceTitle || 'Google Sheet source')) :
      el('p', { class: 'muted small' }, 'Aucune source configurée.');

    var logBox = el('div', { class: 'import-log', id: 'import-log' });
    var panel = UI.section('📥 Importer depuis Google Sheets',
      el('div', { class: 'card import-card' },
        el('p', { class: 'muted' }, 'Crée un instantané mensuel des onglets « Suivi des postes », « Suivi des applications » ' +
          'et « Référentiel » du Google Sheet source.'),
        sourceLine, form, status, lastImportBlock()),
      el('h3', { class: 'subsection-title' }, 'Derniers imports'),
      logBox);
    panel.id = 'import-panel';
    loadImportLog(logBox, myToken);
    return panel;
  }

  function lastImportBlock() {
    if (!lastImport) return null;
    var c = lastImport.counts || {};
    var warnings = lastImport.warnings || [];
    return el('div', { class: 'alert ' + (warnings.length ? 'alert-warning' : 'alert-success'), id: 'import-result' },
      el('p', null, el('strong', null, 'Dernier import : ' + lastImport.month), ' — ' + c.postes + ' postes, ' +
        c.applications + ' applications, ' + c.referentiel + ' catégories de référentiel' +
        (lastImport.overwritten ? ' (mois écrasé)' : '') +
        (lastImport.carriedOver ? ' · ' + lastImport.carriedOver + ' valeur(s) Galink/IDP reprise(s)' : '') + '.'),
      warnings.length ? el('ul', { class: 'warning-list' }, warnings.map(function (w) { return el('li', null, '⚠️ ' + w); })) : null);
  }

  function loadImportLog(box, myToken) {
    UI.clear(box).appendChild(el('p', { class: 'muted small' }, UI.spinner(), ' Chargement…'));
    var p = importLogCache ? Promise.resolve(importLogCache) : api.call('api_getImportLog', null);
    p.then(function (log) {
      importLogCache = log || [];
      if (myToken !== token) return;
      UI.clear(box);
      var entries = importLogCache.slice(0, 5);
      if (!entries.length) { box.appendChild(UI.empty('Aucun import pour le moment.')); return; }
      box.appendChild(el('div', { class: 'table-scroll' }, el('table', { class: 'table table-compact' },
        el('thead', null, el('tr', null, ['Mois', 'Importé le', 'Postes', 'Applications', 'Référentiel', 'Avertissements']
          .map(function (h, i) { return el('th', { scope: 'col', class: i >= 2 && i <= 4 ? 'num' : null }, h); }))),
        el('tbody', null, entries.map(function (e) {
          var c = e.counts || {};
          var w = e.warnings || [];
          return el('tr', null,
            el('td', null, e.month), el('td', null, e.imported_at),
            el('td', { class: 'num' }, UI.fmtNum(c.postes)), el('td', { class: 'num' }, UI.fmtNum(c.applications)),
            el('td', { class: 'num' }, UI.fmtNum(c.referentiel)),
            el('td', { title: w.join('\n') || null }, w.length ? UI.badge(String(w.length), 'warn') : UI.badge('0', 'neutral')));
        })))));
    }, function (err) {
      if (myToken !== token) return;
      UI.clear(box).appendChild(el('p', { class: 'muted small' }, 'Historique indisponible : ' + err.message));
    });
  }

  // ------------------------------------------------------------------------------ page

  function mount(root) {
    var myToken = ++token;
    chartEls = [];
    var s = State.get();
    root.appendChild(header(s));

    if (!s.months.length) {
      root.appendChild(el('div', { class: 'alert alert-warning', role: 'status', id: 'dashboard-empty' },
        '⚠️ Aucune donnée importée.'));
      root.appendChild(importPanel(s, myToken));
      return;
    }

    var body = el('div', { class: 'dashboard-body', id: 'dashboard-body', 'aria-busy': 'true' },
      el('p', { class: 'muted' }, UI.spinner(), ' Chargement des données…'));
    root.appendChild(body);
    root.appendChild(importPanel(s, myToken));

    State.loadMonth(s.month).then(function (md) {
      if (myToken !== token) return;
      UI.clear(body);
      body.setAttribute('aria-busy', 'false');
      renderDashboard(body, State.get(), md);
    }, function (err) {
      if (myToken !== token) return;
      UI.clear(body);
      body.setAttribute('aria-busy', 'false');
      body.appendChild(el('div', { class: 'alert alert-error', role: 'alert' },
        'Impossible de charger le mois ' + s.month + ' : ' + err.message));
    });
  }

  function unmount() {
    token++;
    chartEls.forEach(function (n) { Charts.purge(n); });
    chartEls = [];
  }

  window.Pages = window.Pages || {};
  window.Pages.dashboard = { id: 'dashboard', title: 'Tableau de bord', icon: '👻', mount: mount, unmount: unmount };
})();
</script>
