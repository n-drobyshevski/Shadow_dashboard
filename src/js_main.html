<script>
/**
 * window.App — router, sidebar, configuration screen and boot (docs/API.md §5). Included last.
 *
 * Mounting: each page receives a fresh container appended to the cleared #main. A page whose async
 * work completes after the user navigated away therefore writes into a detached node instead of
 * polluting the next page.
 */
(function () {
  'use strict';

  var el = UI.el;

  /**
   * Navigation order + labels. The shell owns the labels: each one is the page title (docs/DESIGN.md
   * « Copy »), whatever the page registers. Each link leads with a 16px line icon (ICONS), the only thing
   * left visible in the collapsed rail.
   */
  var NAV = [
    { id: 'dashboard', title: 'Tableau de bord' },
    { id: 'postes', title: 'Postes' },
    { id: 'apps', title: 'Applications' },
    { id: 'timeline', title: 'Suivi temporel' },
    { id: 'actions', title: 'Suivi des actions' },
    { id: 'settings', title: 'Paramètres', admin: true }
  ];

  /**
   * « Trait » icons: 16×16 grid, 1.5px stroke, square caps and mitred joins (the hairlines and status
   * squares of the ledger). Each entry = [tag, attributes]; `fill: true` marks the solid parts.
   */
  var ICONS = {
    dashboard: [['path', { d: 'M2.5 11.5a5.5 5.5 0 0 1 11 0' }], ['path', { d: 'M8 11.5l2.5-4' }], ['path', { d: 'M1.75 13.75h12.5' }]],
    postes: [['rect', { x: 2, y: 2.75, width: 12, height: 8.25 }], ['path', { d: 'M8 11v2.5M5 13.75h6' }]],
    apps: [['rect', { x: 2, y: 2, width: 4.75, height: 4.75 }], ['rect', { x: 9.25, y: 2, width: 4.75, height: 4.75 }],
      ['rect', { x: 2, y: 9.25, width: 4.75, height: 4.75 }], ['circle', { cx: 11.6, cy: 11.6, r: 2.4 }]],
    timeline: [['path', { d: 'M2 14h12' }], ['path', { d: 'M2.5 11l3.5-4 3 2.5 4.5-5.5' }]],
    actions: [['path', { d: 'M2 4.25l1.5 1.5 2.75-3' }], ['path', { d: 'M8.5 4.25H14' }],
      ['rect', { x: 2.25, y: 9.5, width: 3.5, height: 3.5 }], ['path', { d: 'M8.5 11.25H14' }]],
    settings: [['path', { d: 'M2 4h12M2 8h12M2 12h12' }], ['rect', { x: 9, y: 2.5, width: 3, height: 3, fill: true }],
      ['rect', { x: 4, y: 6.5, width: 3, height: 3, fill: true }], ['rect', { x: 10, y: 10.5, width: 3, height: 3, fill: true }]],
    collapse: [['rect', { x: 2, y: 2.5, width: 12, height: 11 }], ['path', { d: 'M6 2.5v11' }], ['path', { d: 'M11 6l-2 2 2 2' }]],
    expand: [['rect', { x: 2, y: 2.5, width: 12, height: 11 }], ['path', { d: 'M6 2.5v11' }], ['path', { d: 'M9 6l2 2-2 2' }]]
  };
  var ROLE_LABELS = { admin: 'Administrateur', lecteur: 'Lecteur' };
  var BRAND = 'Shadow IT';
  var BRAND_SUB = 'Industry · conformité';
  var COLLAPSE_KEY = 'shadowit.sidebar';

  var sidebar = null;
  var appbar = null;
  var main = null;
  var monthSelect = null;
  var booted = false;
  var currentPage = null;
  var filtersBox = null;
  var filterOptionsMonth = null;   // month whose options are rendered in the filters box
  var suppressFilterRender = false; // filters changed by the app bar widgets themselves
  var filtersPage = null;           // page the filters box was rendered for (Bâtiment disabled on actions)

  function pages() { return window.Pages || {}; }
  /** Pages the current user may open (Paramètres is admin only). */
  function visibleNav() { return NAV.filter(function (n) { return !n.admin || State.canEdit(); }); }
  function navInfo(id) { return visibleNav().filter(function (n) { return n.id === id; })[0]; }
  function has(list, key) { return list.indexOf(key) >= 0; }
  function historyApi() { return window.google && google.script && google.script.history; }

  // ------------------------------------------------------------------------------ routing

  function go(pageId, opts) {
    var id = navInfo(pageId) ? pageId : 'dashboard';
    var fromHistory = !!(opts && opts.fromHistory);
    var h = historyApi();
    if (!fromHistory && h && typeof h.push === 'function') {
      try { h.push({ page: id }, { page: id }); } catch (e) { /* not available outside Apps Script */ }
    }
    setNavOpen(false);
    if (State.get().page === id) refresh();
    else State.set({ page: id });
  }

  function refresh() {
    if (!booted) return;
    if (!State.get().configured && !onSettings()) { renderConfigScreen(); return; }
    mountPage();
  }

  /** Paramètres is reachable before a source is configured (admins only). */
  function onSettings() { return State.get().page === 'settings' && State.canEdit(); }

  function unmountCurrent() {
    if (currentPage && typeof currentPage.unmount === 'function') {
      try { currentPage.unmount(); } catch (e) { console.error(e); }
    }
    currentPage = null;
    if (main && window.Charts) {
      Array.prototype.forEach.call(main.querySelectorAll('.js-plotly-plot'), function (n) { Charts.purge(n); });
    }
  }

  function mountPage() {
    var s = State.get();
    var info = navInfo(s.page) || visibleNav()[0];
    var page = pages()[info.id];
    unmountCurrent();
    UI.clear(main);
    var root = el('div', { class: 'page page-' + info.id, dataset: { page: info.id } });
    main.appendChild(root);
    updateNavActive();
    if (!page || typeof page.mount !== 'function') {
      root.appendChild(UI.pageHeader({ title: info.title }));
      root.appendChild(UI.empty('Page indisponible.'));
      return;
    }
    currentPage = page;
    try {
      page.mount(root);
    } catch (e) {
      console.error(e);
      root.appendChild(el('div', { class: 'alert alert-error', role: 'alert' },
        'Erreur lors de l’affichage de la page : ' + (e && e.message ? e.message : String(e))));
    }
    if (main.scrollTo) main.scrollTo(0, 0);
  }

  // ------------------------------------------------------------------------------ sidebar

  function setNavOpen(open) {
    document.body.classList.toggle('nav-open', !!open);
    var t = document.getElementById('nav-toggle');
    if (t) {
      t.setAttribute('aria-expanded', open ? 'true' : 'false');
      t.setAttribute('aria-label', open ? 'Masquer le menu' : 'Afficher le menu');
    }
  }

  /** Collapsed rail (wide screens only): remembered per browser, never required to work. */
  /** Inline SVG icon (aria-hidden: the label next to it, or the rail tooltip + sr-only label, names it). */
  function icon(name) {
    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', 'icon icon-' + name);
    svg.setAttribute('viewBox', '0 0 16 16');
    svg.setAttribute('width', '16');
    svg.setAttribute('height', '16');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('focusable', 'false');
    (ICONS[name] || []).forEach(function (part) {
      var node = document.createElementNS(NS, part[0]);
      Object.keys(part[1]).forEach(function (k) {
        if (k === 'fill') node.setAttribute('class', 'icon-fill');
        else node.setAttribute(k, String(part[1][k]));
      });
      svg.appendChild(node);
    });
    return svg;
  }

  function readCollapsed() {
    try { return window.localStorage.getItem(COLLAPSE_KEY) === 'collapsed'; } catch (e) { return false; }
  }
  function isCollapsed() { return document.body.classList.contains('nav-collapsed'); }

  function setCollapsed(on) {
    document.body.classList.toggle('nav-collapsed', !!on);
    try { window.localStorage.setItem(COLLAPSE_KEY, on ? 'collapsed' : 'open'); } catch (e) { /* private mode */ }
    syncCollapseButton();
    syncRailTooltips();
  }

  function syncCollapseButton() {
    var b = document.getElementById('nav-collapse');
    if (!b) return;
    var on = isCollapsed();
    b.setAttribute('aria-expanded', on ? 'false' : 'true');
    UI.clear(b.querySelector('.nav-collapse-glyph')).appendChild(icon(on ? 'expand' : 'collapse'));
    b.querySelector('.nav-collapse-label').textContent = on ? 'Ouvrir le menu' : 'Réduire le menu';
  }

  /** In the rail the labels are hidden: each link gets its title as a tooltip (removed when expanded). */
  function syncRailTooltips() {
    if (!sidebar) return;
    var on = isCollapsed();
    Array.prototype.forEach.call(sidebar.querySelectorAll('.nav-link'), function (b) {
      var info = navInfo(b.dataset.page);
      UI.tooltip(b, on && info ? info.title : null, { placement: 'right' });
    });
    var c = document.getElementById('nav-collapse');
    if (c) UI.tooltip(c, on ? 'Ouvrir le menu' : null, { placement: 'right' });
  }

  function updateNavActive() {
    if (!sidebar) return;
    var page = State.get().page;
    Array.prototype.forEach.call(sidebar.querySelectorAll('.nav-link'), function (b) {
      var on = b.dataset.page === page;
      b.classList.toggle('active', on);
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }

  /** "lea.reader@decathlon.com" over "Lecteur · lecture seule" at the foot of the sidebar. */
  function userLine(user) {
    if (!user || !user.email) return null;
    var role = ROLE_LABELS[user.role] || user.role;
    return el('p', { class: 'side-user', id: 'side-user' },
      el('span', { class: 'side-user-email mono' }, user.email),
      el('span', { class: 'side-user-role' }, user.role === 'admin' ? role : role + ' · lecture seule'));
  }

  function brand() {
    return el('div', { class: 'brand' },
      el('span', { class: 'brand-name' }, BRAND),
      el('span', { class: 'brand-short', 'aria-hidden': 'true' }, 'SI'),
      el('span', { class: 'brand-sub' }, BRAND_SUB));
  }

  /**
   * Right-aligned mono counts next to Postes / Applications (filtered data of the selected month), and the
   * « 3 postes sur 7 » line of the app bar while a filter is active.
   */
  function updateNavCounts() {
    var s = State.get();
    var md = s.month ? State.getMonthData(s.month) : null;
    var f = md ? State.filtered(md) : null;
    var counts = { postes: f ? f.postes.length : null, apps: f ? f.applications.length : null };
    if (sidebar) {
      Array.prototype.forEach.call(sidebar.querySelectorAll('.nav-count'), function (n) {
        var v = counts[n.dataset.count];
        n.textContent = v === null || v === undefined ? '' : UI.fmtNum(v);
      });
    }
    var line = document.getElementById('appbar-count');
    if (line) {
      var active = md && hasActiveFilters(s.filters);
      line.textContent = active ? UI.fmtNum(f.postes.length) + ' poste' + (f.postes.length > 1 ? 's' : '') +
        ' sur ' + UI.fmtNum(md.postes.length) : '';
      line.hidden = !active;
    }
  }

  function renderSidebar() {
    var s = State.get();
    UI.clear(sidebar);
    var nav = el('nav', { class: 'nav', 'aria-label': 'Pages' },
      el('ul', { class: 'nav-list' }, visibleNav().map(function (n) {
        var counted = n.id === 'postes' || n.id === 'apps';
        return el('li', null, el('button', { type: 'button', class: 'nav-link', dataset: { page: n.id },
          onClick: function () { go(n.id); } },
          el('span', { class: 'nav-glyph', 'aria-hidden': 'true' }, icon(n.id)),
          el('span', { class: 'nav-label' }, n.title),
          counted ? el('span', { class: 'nav-count', dataset: { count: n.id } }) : null));
      })));

    // Spreadsheet links are only sent to admins (the sheets are private to the deployer).
    var footer = el('div', { class: 'sidebar-footer' },
      s.dataUrl ? UI.extLink(s.dataUrl, 'Données (Google Sheet)', { class: 'side-link', id: 'link-data' }) : null,
      s.sourceUrl ? UI.extLink(s.sourceUrl, 'Source', { class: 'side-link', id: 'link-source',
        'aria-label': s.sourceTitle ? 'Source : ' + s.sourceTitle : null }) : null,
      userLine(s.user));

    var collapse = el('button', { type: 'button', class: 'nav-collapse', id: 'nav-collapse', 'aria-controls': 'sidebar',
      onClick: function () { setCollapsed(!isCollapsed()); } },
      el('span', { class: 'nav-collapse-glyph', 'aria-hidden': 'true' }),
      el('span', { class: 'nav-collapse-label' }));

    sidebar.appendChild(el('div', { class: 'sidebar-inner' }, brand(), nav, footer, collapse));
    syncCollapseButton();
    updateNavActive();
    syncRailTooltips();
    updateNavCounts();
  }

  // ------------------------------------------------------------------------------ app bar (période + filtres)

  /** Sticky bar above every page: « Période ‹ Mai 2026 › » then the Équipe / Bâtiment filters. */
  function renderAppbar() {
    var s = State.get();
    UI.clear(appbar);
    var monthOptions = s.months.length ?
      s.months.map(function (m) { return { value: m, label: Fmt.monthTitle(m) }; }) :
      [{ value: '', label: 'Aucun mois importé' }];
    monthSelect = UI.dropdown({
      id: 'month-select',
      labelledBy: 'appbar-period-label',
      options: monthOptions,
      value: s.month,
      disabled: !s.months.length,
      onChange: function (v) { if (v) State.set({ month: v }); },
      className: 'field select-field month-select'
    });
    var prev = el('button', { type: 'button', class: 'period-step', id: 'month-prev', 'aria-label': 'Mois précédent',
      onClick: function () { stepMonth(-1); } }, '‹');
    var next = el('button', { type: 'button', class: 'period-step', id: 'month-next', 'aria-label': 'Mois suivant',
      onClick: function () { stepMonth(1); } }, '›');

    filtersBox = el('div', { class: 'appbar-filters', id: 'appbar-filters' });
    filterOptionsMonth = null;

    var toggle = el('button', { type: 'button', class: 'btn btn-secondary btn-sm filters-toggle', id: 'filters-toggle',
      'aria-controls': 'appbar-filters', 'aria-expanded': 'false',
      onClick: function () { setFiltersOpen(!document.body.classList.contains('filters-open')); } },
      'Filtres', el('span', { class: 'filters-toggle-count', id: 'filters-toggle-count' }));

    appbar.appendChild(el('div', { class: 'appbar-group appbar-period' },
      el('span', { class: 'appbar-label', id: 'appbar-period-label' }, 'Période'),
      el('div', { class: 'period-stepper' }, prev, monthSelect, next)));
    appbar.appendChild(el('span', { class: 'appbar-sep', 'aria-hidden': 'true' }));
    appbar.appendChild(toggle);
    appbar.appendChild(filtersBox);
    appbar.appendChild(el('p', { class: 'appbar-count', id: 'appbar-count', role: 'status', hidden: true }));
    updateStepper();
    setFiltersOpen(false);
    renderFilters();
  }

  /** ‹ / › move to the previous / next imported month (months are sorted ascending). */
  function stepMonth(delta) {
    var s = State.get();
    var i = s.months.indexOf(s.month);
    var m = s.months[i + delta];
    if (i >= 0 && m) State.set({ month: m });
  }

  function updateStepper() {
    var s = State.get();
    var i = s.months.indexOf(s.month);
    var prev = document.getElementById('month-prev');
    var next = document.getElementById('month-next');
    if (prev) prev.disabled = i <= 0;
    if (next) next.disabled = i < 0 || i >= s.months.length - 1;
  }

  /** Below 900px the filters fold behind a « Filtres » button. */
  function setFiltersOpen(open) {
    document.body.classList.toggle('filters-open', !!open);
    var t = document.getElementById('filters-toggle');
    if (t) t.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  function syncFilterBadges(f) {
    var n = f ? (f.equipes || []).length + (f.batiments || []).length : 0;
    var c = document.getElementById('filters-toggle-count');
    if (c) c.textContent = n ? String(n) : '';
    var reset = document.getElementById('filters-reset');
    if (reset) reset.hidden = !n;
  }

  /**
   * Équipe / Bâtiment multiselects; options come from the selected month's postes. On Suivi des actions
   * only the Équipe filter applies (actions and replacements carry an équipe, no bâtiment): the Bâtiment
   * filter is disabled there, with a visible « Non applicable ici » note.
   */
  function renderFilters() {
    if (!filtersBox) return;
    var s = State.get();
    var md = s.month ? State.getMonthData(s.month) : null;
    if (s.month && !md) {
      // Load once, then render the options (the page usually triggers the same cached request).
      var month = s.month;
      UI.clear(filtersBox).appendChild(el('p', { class: 'field-help', role: 'status' }, UI.spinner(), 'Chargement des filtres…'));
      State.loadMonth(month).then(function () {
        if (State.get().month === month) renderFilters();
      }, function () {
        if (State.get().month === month) {
          UI.clear(filtersBox).appendChild(el('p', { class: 'field-help', role: 'status' }, 'Filtres indisponibles.'));
        }
      });
      return;
    }
    filterOptionsMonth = s.month;
    filtersPage = s.page;
    updateNavCounts();
    var postes = md ? md.postes : [];
    var f = s.filters || { equipes: [], batiments: [] };
    UI.clear(filtersBox);
    filtersBox.appendChild(UI.multiSelect({
      label: 'Équipe',
      options: Core.uniqueSorted(postes, 'Équipe'),
      value: f.equipes || [],
      onChange: function (values) { setFilters({ equipes: values }); }
    }));
    filtersBox.lastChild.id = 'filter-equipe';
    filtersBox.appendChild(UI.multiSelect({
      label: 'Bâtiment / Labo',
      options: Core.uniqueSorted(postes, 'Bâtiment / Labo'),
      value: f.batiments || [],
      onChange: function (values) { setFilters({ batiments: values }); }
    }));
    filtersBox.lastChild.id = 'filter-batiment';
    if (s.page === 'actions') disableFilter(filtersBox.lastChild, 'filter-batiment-na');
    // Always present (hidden when unused) so that toggling it never forces a re-render of the
    // multiselects while the user is ticking boxes.
    filtersBox.appendChild(el('button', { type: 'button', class: 'btn btn-quiet btn-sm', id: 'filters-reset',
      hidden: !hasActiveFilters(f),
      onClick: function () { State.set({ filters: { equipes: [], batiments: [] } }); } },
      'Réinitialiser'));
    syncFilterBadges(f);
  }

  /** Shows `month` in the app bar month dropdown without firing onChange. */
  function syncMonthSelect(month) {
    if (monthSelect && monthSelect.getValue() !== month) monthSelect.setValue(month);
    updateStepper();
  }

  /**
   * Disables every control of a filter widget (never colour only): the trigger reads « Non applicable »
   * and the full reason is its accessible description and tooltip.
   */
  function disableFilter(node, noteId) {
    node.classList.add('is-disabled');
    node.setAttribute('aria-disabled', 'true');
    if (typeof node.setDisabled === 'function') node.setDisabled(true);
    Array.prototype.forEach.call(node.querySelectorAll('button, input, select, [tabindex]'), function (c) {
      if ('disabled' in c) c.disabled = true; else c.setAttribute('tabindex', '-1');
      c.setAttribute('aria-describedby', noteId);
    });
    var value = node.querySelector('.dd-value');
    if (value) value.textContent = 'Non applicable';
    var reason = 'Non applicable ici : les actions n’ont pas de bâtiment.';
    node.appendChild(el('p', { class: 'filter-na sr-only', id: noteId }, reason));
    UI.tooltip(node, reason);
  }

  function hasActiveFilters(f) {
    return !!f && ((f.equipes || []).length + (f.batiments || []).length) > 0;
  }

  function setFilters(patch) {
    var f = State.get().filters || { equipes: [], batiments: [] };
    var next = { equipes: (f.equipes || []).slice(), batiments: (f.batiments || []).slice() };
    Object.keys(patch).forEach(function (k) { next[k] = patch[k]; });
    syncFilterBadges(next);
    // The widgets already show the new values: do not re-render them (keeps the open list in place).
    suppressFilterRender = true;
    State.set({ filters: next });
    suppressFilterRender = false;
    updateNavCounts();
  }

  // ------------------------------------------------------------------------------ configuration

  function sourceErrorText(err) {
    if (err && err.code === 'VALIDATION') return 'URL ou identifiant invalide. Collez l’URL complète du Google Sheet source.';
    return UI.errorText(err);
  }

  function tabsWarning(res) {
    var missing = [];
    var t = (res && res.tabsFound) || {};
    if (t.postes === false) missing.push('« ' + Core.SOURCE_TABS.postes + ' »');
    if (t.applications === false) missing.push('« ' + Core.SOURCE_TABS.applications + ' »');
    if (t.referentiel === false) missing.push('« ' + Core.SOURCE_TABS.referentiel + ' »');
    return missing.length ? 'Onglet(s) introuvable(s) : ' + missing.join(', ') : '';
  }

  function applySource(source) {
    return api.call('api_setConfig', { source: source }).then(function (res) {
      UI.toast('Source configurée — ' + (res.sourceTitle || res.sourceId) + '.', 'success');
      var warn = tabsWarning(res);
      if (warn) UI.toast(warn + '.', 'error');
      State.invalidate();
      return State.refreshBootstrap().then(function () { return res; });
    });
  }

  /** Bare shell for the screens without navigation (configuration, access refused). */
  function bareShell() {
    unmountCurrent();
    document.body.classList.add('unconfigured');
    UI.clear(sidebar);
    sidebar.appendChild(el('div', { class: 'sidebar-inner' }, brand()));
    UI.clear(appbar);
    monthSelect = null;
    filtersBox = null;
    UI.clear(main);
  }

  /** Lecteur on an app without source: nothing to do but wait for an admin. */
  function renderWaitingScreen() {
    bareShell();
    var u = State.get().user || {};
    main.appendChild(el('div', { class: 'page page-config', dataset: { page: 'unconfigured' } },
      UI.pageHeader({ kicker: BRAND + ' · configuration', title: 'Source de données' }),
      el('p', { class: 'page-lede' }, 'L’application n’est pas encore configurée. Un administrateur doit d’abord ' +
        'définir le classeur source et importer un premier mois.'),
      u.email ? el('p', { class: 'field-help' }, 'Connecté en tant que ', el('span', { class: 'mono' }, u.email),
        ' · ' + (ROLE_LABELS[u.role] || u.role) + '.') : null,
      el('div', { class: 'form-actions' },
        el('button', { type: 'button', class: 'btn btn-secondary', onClick: reboot }, 'Actualiser'))));
  }

  /** FORBIDDEN on boot: no identity, unknown account. The server message names the account. */
  function renderDeniedScreen(err) {
    bareShell();
    main.appendChild(el('div', { class: 'page page-config page-denied', dataset: { page: 'denied' } },
      UI.pageHeader({ kicker: BRAND + ' · accès', title: 'Accès refusé' }),
      el('p', { class: 'page-lede', id: 'denied-message' }, UI.errorText(err)),
      el('p', { class: 'field-help' }, 'Les accès sont gérés dans Paramètres par un administrateur de ' +
        'l’application. Une fois l’accès accordé, actualisez la page.'),
      el('div', { class: 'form-actions' },
        el('button', { type: 'button', class: 'btn btn-secondary', onClick: reboot }, 'Réessayer'))));
  }

  function reboot() {
    booted = false;
    boot();
  }

  function renderConfigScreen() {
    if (!State.canEdit()) { renderWaitingScreen(); return; }
    bareShell();
    var input = el('input', { type: 'text', id: 'config-source', class: 'input', required: true,
      placeholder: 'https://docs.google.com/spreadsheets/d/…', autocomplete: 'off',
      'aria-describedby': 'config-help config-error' });
    var error = el('p', { id: 'config-error', class: 'field-error', role: 'alert', hidden: true });
    var button = el('button', { type: 'submit', class: 'btn btn-primary', id: 'config-submit' }, 'Enregistrer la source');
    // Invalid field: red border (aria-invalid) + the message under the field, as in every form.
    function showError(msg) {
      error.textContent = msg || '';
      error.hidden = !msg;
      if (msg) input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid');
    }
    var form = el('form', { class: 'config-form', novalidate: true, onSubmit: function (e) {
      e.preventDefault();
      var value = input.value.trim();
      showError(null);
      if (!value) { showError('Ce champ est obligatoire.'); input.focus(); return; }
      button.disabled = true;
      button.classList.add('is-busy');
      var sp = UI.spinner();
      sp.removeAttribute('role'); sp.removeAttribute('aria-label'); sp.setAttribute('aria-hidden', 'true');
      UI.clear(button).appendChild(sp);
      button.appendChild(document.createTextNode('Vérification…'));
      applySource(value).catch(function (err) {
        showError(sourceErrorText(err));
        button.disabled = false;
        button.classList.remove('is-busy');
        button.textContent = 'Enregistrer la source';
        input.focus();
      });
    } },
      el('label', { for: 'config-source', class: 'field-label' }, 'URL ou ID du Google Sheet source'),
      input, error,
      el('div', { class: 'form-actions' }, button));
    main.appendChild(el('div', { class: 'page page-config', dataset: { page: 'config' } },
      UI.pageHeader({ kicker: BRAND + ' · configuration', title: 'Source de données' }),
      el('div', { class: 'config-card' },
        el('p', { class: 'field-help config-settings-link' }, 'Les accès et le seuil de conformité se règlent dans ',
          el('button', { type: 'button', class: 'btn btn-link', id: 'config-open-settings',
            onClick: function () { go('settings'); } }, 'Paramètres'), '.'),
        el('p', { id: 'config-help', class: 'page-lede' },
          'Collez l’URL (ou l’identifiant) du Google Sheet source « ShadowIT_Industry ». Il doit contenir les onglets « ' +
          Core.SOURCE_TABS.postes + ' », « ' + Core.SOURCE_TABS.applications + ' » et « ' +
          Core.SOURCE_TABS.referentiel + ' ». Chaque import en fait un instantané mensuel dans le classeur de données.'),
        form)));
    setTimeout(function () { input.focus(); }, 0);
  }

  function openSourceModal(prefill) {
    var s = State.get();
    UI.formModal({
      title: 'Changer de source',
      submitLabel: 'Enregistrer',
      fields: [{ name: 'source', label: 'URL ou ID du Google Sheet source', type: 'text', required: true,
        value: typeof prefill === 'string' ? prefill : s.sourceUrl,
        placeholder: 'https://docs.google.com/spreadsheets/d/…' }]
    }).then(function (values) {
      if (!values) return;
      applySource(values.source).catch(function (err) {
        UI.toast('Erreur : ' + sourceErrorText(err), 'error');
        openSourceModal(values.source);
      });
    });
  }

  // ------------------------------------------------------------------------------ boot

  function renderAll() {
    var s = State.get();
    if (!s.configured && !onSettings()) { renderConfigScreen(); return; }
    document.body.classList.remove('unconfigured');
    renderSidebar();
    renderAppbar();
    mountPage();
  }

  function onStateChange(s, changed) {
    if (!booted) return;
    if (has(changed, 'configured') || has(changed, 'user')) { renderAll(); return; }
    if (!s.configured) {
      // Before the first source: only Paramètres <-> configuration screen.
      if (has(changed, 'page')) renderAll();
      return;
    }
    if (has(changed, 'months') || has(changed, 'dataUrl') || has(changed, 'sourceUrl') || has(changed, 'sourceTitle')) {
      renderSidebar();
      renderAppbar();
    } else if (has(changed, 'month')) {
      syncMonthSelect(s.month);
      renderFilters();
    } else if ((has(changed, 'filters') && !suppressFilterRender) ||
        (has(changed, 'page') && (s.page === 'actions') !== (filtersPage === 'actions'))) {
      renderFilters();
    }
    if (has(changed, 'page') || has(changed, 'month') || has(changed, 'filters')) mountPage();
  }

  /** Initial page from the Apps Script URL (?page=xxx), with a short timeout outside Apps Script. */
  function initialPage() {
    return new Promise(function (resolve) {
      var done = false;
      function finish(p) { if (!done) { done = true; resolve(p); } }
      var url = window.google && google.script && google.script.url;
      if (!url || typeof url.getLocation !== 'function') { finish(null); return; }
      setTimeout(function () { finish(null); }, 1500);
      try {
        url.getLocation(function (loc) {
          var p = loc && loc.parameter && loc.parameter.page;
          // The user (and so the admin-only pages) is not known yet: mountPage falls back later.
          finish(p && NAV.some(function (n) { return n.id === p; }) ? p : null);
        });
      } catch (e) { finish(null); }
    });
  }

  function renderBootError(err) {
    UI.clear(main);
    main.appendChild(el('div', { class: 'page' },
      el('div', { class: 'alert alert-error', role: 'alert' },
        el('strong', null, 'Impossible de charger l’application. '),
        (err && err.message) || ''),
      el('button', { type: 'button', class: 'btn btn-primary', onClick: boot }, 'Réessayer')));
  }

  function boot() {
    sidebar = document.getElementById('sidebar');
    appbar = document.getElementById('appbar');
    main = document.getElementById('main');
    document.body.classList.toggle('nav-collapsed', readCollapsed());
    var toggle = document.getElementById('nav-toggle');
    if (toggle && !toggle.dataset.bound) {
      toggle.dataset.bound = '1';
      toggle.addEventListener('click', function () { setNavOpen(!document.body.classList.contains('nav-open')); });
    }
    var h = historyApi();
    if (h && typeof h.setChangeHandler === 'function') {
      try {
        h.setChangeHandler(function (e) {
          var p = e && e.state && e.state.page;
          if (p) go(p, { fromHistory: true });
        });
      } catch (e) { /* ignore */ }
    }
    Promise.all([State.refreshBootstrap(), initialPage()]).then(function (res) {
      if (res[1]) State.set({ page: res[1] });
      booted = true;
      renderAll();
    }, function (err) {
      if (err && err.code === 'FORBIDDEN') { booted = true; renderDeniedScreen(err); return; }
      console.error(err);
      renderBootError(err);
    });
  }

  State.subscribe(onStateChange);

  window.App = {
    go: go,
    refresh: refresh,
    boot: boot,
    openSourceConfig: openSourceModal,
    applySource: applySource,
    sourceErrorText: sourceErrorText,
    tabsWarning: tabsWarning,
    ROLE_LABELS: ROLE_LABELS
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
