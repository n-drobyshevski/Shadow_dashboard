<script>
// window.App: router, sidebar, app bar, configuration screen and boot. Included last.
// Each page mounts into a fresh container in the cleared #main, so a late async response
// lands in a detached node instead of the next page.
(function () {
  'use strict';

  var el = UI.el;

  // The shell owns the labels: each one is the page title, whatever the page registers.
  var NAV = [
    { id: 'dashboard', title: 'Tableau de bord' },
    { id: 'postes', title: 'Postes' },
    { id: 'apps', title: 'Applications' },
    { id: 'timeline', title: 'Suivi temporel' },
    { id: 'actions', title: 'Suivi des actions' },
    { id: 'settings', title: 'Paramètres', admin: true }
  ];

  // 16×16 line icons as [tag, attributes] parts, where fill: true marks a solid part.
  var ICONS = {
    dashboard: [['path', { d: 'M2.5 11.5a5.5 5.5 0 0 1 11 0' }], ['path', { d: 'M8 11.5l2.5-4' }], ['path', { d: 'M1.75 13.75h12.5' }]],
    postes: [['rect', { x: 2, y: 2.75, width: 12, height: 8.25 }], ['path', { d: 'M8 11v2.5M5 13.75h6' }]],
    apps: [['rect', { x: 2, y: 2, width: 4.75, height: 4.75 }], ['rect', { x: 9.25, y: 2, width: 4.75, height: 4.75 }],
      ['rect', { x: 2, y: 9.25, width: 4.75, height: 4.75 }], ['circle', { cx: 11.6, cy: 11.6, r: 2.4 }]],
    timeline: [['path', { d: 'M2 14h12' }], ['path', { d: 'M2.5 11l3.5-4 3 2.5 4.5-5.5' }]],
    actions: [['path', { d: 'M2 4.25l1.5 1.5 2.75-3' }], ['path', { d: 'M8.5 4.25H14' }],
      ['rect', { x: 2.25, y: 9.5, width: 3.5, height: 3.5 }], ['path', { d: 'M8.5 11.25H14' }]],
    settings: [['path', { d: 'M2 4h12M2 8h12M2 12h12' }], ['rect', { x: 9, y: 2.5, width: 3, height: 3, fill: true }],
      ['rect', { x: 4, y: 6.5, width: 3, height: 3, fill: true }], ['rect', { x: 10, y: 10.5, width: 3, height: 3, fill: true }]],
    collapse: [['rect', { x: 2, y: 2.5, width: 12, height: 11 }], ['path', { d: 'M6 2.5v11' }], ['path', { d: 'M11 6l-2 2 2 2' }]],
    expand: [['rect', { x: 2, y: 2.5, width: 12, height: 11 }], ['path', { d: 'M6 2.5v11' }], ['path', { d: 'M9 6l2 2-2 2' }]]
  };
  var ROLE_LABELS = { admin: 'Administrateur', lecteur: 'Lecteur' };
  // 24×24 ghost logo, also drawn inline in the mobile top bar of index.html.
  var LOGO = [
    ['path', { d: 'M5 19.5V11a7 7 0 0 1 14 0v8.5c-1.17 1.6-2.33 1.6-3.5 0s-2.33-1.6-3.5 0-2.33 1.6-3.5 0-2.33-1.6-3.5 0z' }],
    ['circle', { cx: 9.75, cy: 11, r: 1.25, fill: true }],
    ['circle', { cx: 14.25, cy: 11, r: 1.25, fill: true }]
  ];
  var BRAND = 'Shadow IT';
  var BRAND_SUB = 'Industry · conformité';
  var COLLAPSE_KEY = 'shadowit.sidebar';

  var sidebar = null;
  var appbar = null;
  var main = null;
  var periodButton = null;
  var booted = false;
  var currentPage = null;
  var filtersBox = null;
  var filterOptionsMonth = null;   // month the filter options were built for
  var suppressFilterRender = false; // set while the app bar widgets change the filters themselves
  var filtersPage = null;           // page the filters were rendered for
  var monthSwap = 0;                // bumped on every mount, so a stale month swap does not mount

  function pages() { return window.Pages || {}; }
  function visibleNav() { return NAV.filter(function (n) { return !n.admin || State.canEdit(); }); }
  function navInfo(id) { return visibleNav().filter(function (n) { return n.id === id; })[0]; }
  function has(list, key) { return list.indexOf(key) >= 0; }
  function historyApi() { return window.google && google.script && google.script.history; }

  // Routing

  function go(pageId, opts) {
    var id = navInfo(pageId) ? pageId : 'dashboard';
    var fromHistory = !!(opts && opts.fromHistory);
    var h = historyApi();
    if (!fromHistory && h && typeof h.push === 'function') {
      try { h.push({ page: id }, { page: id }); } catch (e) { /* not available outside Apps Script */ }
    }
    setNavOpen(false);
    if (State.get().page === id) refresh();
    else State.set({ page: id });
  }

  function refresh() {
    if (!booted) return;
    if (!State.get().configured && !onSettings()) { renderConfigScreen(); return; }
    mountPage();
  }

  // Admins can open Paramètres before a source is configured.
  function onSettings() { return State.get().page === 'settings' && State.canEdit(); }

  function unmountCurrent() {
    if (currentPage && typeof currentPage.unmount === 'function') {
      try { currentPage.unmount(); } catch (e) { console.error(e); }
    }
    currentPage = null;
    if (main && window.Charts) {
      Array.prototype.forEach.call(main.querySelectorAll('.js-plotly-plot'), function (n) { Charts.purge(n); });
    }
  }

  function mountPage() {
    var s = State.get();
    var info = navInfo(s.page) || visibleNav()[0];
    var page = pages()[info.id];
    monthSwap++;
    unmountCurrent();
    UI.clear(main);
    main.removeAttribute('aria-busy');
    var root = el('div', { class: 'page page-' + info.id, dataset: { page: info.id } });
    main.appendChild(root);
    updateNavActive();
    if (!page || typeof page.mount !== 'function') {
      root.appendChild(UI.pageHeader({ title: info.title }));
      root.appendChild(UI.empty('Page indisponible.'));
      return;
    }
    currentPage = page;
    try {
      page.mount(root);
    } catch (e) {
      console.error(e);
      root.appendChild(el('div', { class: 'alert alert-error', role: 'alert' },
        'Erreur lors de l’affichage de la page : ' + (e && e.message ? e.message : String(e))));
    }
    if (main.scrollTo) main.scrollTo(0, 0);
  }

  // Sidebar

  function setNavOpen(open) {
    document.body.classList.toggle('nav-open', !!open);
    var t = document.getElementById('nav-toggle');
    if (t) {
      t.setAttribute('aria-expanded', open ? 'true' : 'false');
      t.setAttribute('aria-label', open ? 'Masquer le menu' : 'Afficher le menu');
    }
  }

  // aria-hidden because a visible or sr-only label always names the icon.
  function svgFrom(parts, cls, box, size) {
    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', cls);
    svg.setAttribute('viewBox', '0 0 ' + box + ' ' + box);
    svg.setAttribute('width', String(size));
    svg.setAttribute('height', String(size));
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('focusable', 'false');
    parts.forEach(function (part) {
      var node = document.createElementNS(NS, part[0]);
      Object.keys(part[1]).forEach(function (k) {
        if (k === 'fill') node.setAttribute('class', 'icon-fill');
        else node.setAttribute(k, String(part[1][k]));
      });
      svg.appendChild(node);
    });
    return svg;
  }

  function icon(name) { return svgFrom(ICONS[name] || [], 'icon icon-' + name, 16, 16); }

  // The collapsed rail is stored in localStorage, read at once, and per account on the server,
  // because the Apps Script frame loses localStorage when the browser blocks third-party storage.
  function readLocalSidebar() {
    try {
      var v = window.localStorage.getItem(COLLAPSE_KEY);
      return v === 'collapsed' || v === 'open' ? v : null;
    } catch (e) { return null; }
  }
  function writeLocalSidebar(v) {
    try { window.localStorage.setItem(COLLAPSE_KEY, v); } catch (e) { /* storage refused, the server copy remains */ }
  }
  function isCollapsed() { return document.body.classList.contains('nav-collapsed'); }

  function applyCollapsed(on) {
    document.body.classList.toggle('nav-collapsed', !!on);
    syncCollapseButton();
    syncRailTooltips();
  }

  function setCollapsed(on) {
    var v = on ? 'collapsed' : 'open';
    applyCollapsed(on);
    writeLocalSidebar(v);
    savePrefs({ sidebar: v });
  }

  function savePrefs(patch) {
    api.call('api_savePrefs', patch).catch(function (err) { console.warn('Préférence non enregistrée : ' + UI.errorText(err)); });
  }

  // The account's stored choice wins over this browser's; a local-only choice is uploaded.
  function syncSidebarPref() {
    var server = (State.get().prefs || {}).sidebar;
    var local = readLocalSidebar();
    if (server) {
      applyCollapsed(server === 'collapsed');
      if (local !== server) writeLocalSidebar(server);
    } else if (local && State.get().user && State.get().user.email) {
      savePrefs({ sidebar: local });
    }
  }

  function syncCollapseButton() {
    var b = document.getElementById('nav-collapse');
    if (!b) return;
    var on = isCollapsed();
    b.setAttribute('aria-expanded', on ? 'false' : 'true');
    UI.clear(b.querySelector('.nav-collapse-glyph')).appendChild(icon(on ? 'expand' : 'collapse'));
    b.querySelector('.nav-collapse-label').textContent = on ? 'Ouvrir le menu' : 'Réduire le menu';
  }

  // Labels are hidden in the rail, so each link gets its title as a tooltip.
  function syncRailTooltips() {
    if (!sidebar) return;
    var on = isCollapsed();
    Array.prototype.forEach.call(sidebar.querySelectorAll('.nav-link'), function (b) {
      var info = navInfo(b.dataset.page);
      UI.tooltip(b, on && info ? info.title : null, { placement: 'right' });
    });
    var c = document.getElementById('nav-collapse');
    if (c) UI.tooltip(c, on ? 'Ouvrir le menu' : null, { placement: 'right' });
    updateSyncChip();
  }

  function updateNavActive() {
    if (!sidebar) return;
    var page = State.get().page;
    Array.prototype.forEach.call(sidebar.querySelectorAll('.nav-link'), function (b) {
      var on = b.dataset.page === page;
      b.classList.toggle('active', on);
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }

  // For an admin the role is a button that toggles the lecteur preview.
  function userLine(user) {
    if (!user || !user.email) return null;
    var role = ROLE_LABELS[user.role] || user.role;
    var roleNode;
    if (State.isAdmin()) {
      var preview = !!State.get().readerView;
      roleNode = el('button', { type: 'button', class: ['side-user-role', 'side-user-switch', preview ? 'is-preview' : null],
        id: 'side-user-role', 'aria-pressed': preview ? 'true' : 'false',
        onClick: function () { toggleReaderView('side-user-role'); } },
        preview ? 'Vue lecteur · lecture seule' : role);
      UI.tooltip(roleNode, preview ? 'Revenir à la vue ' + role.toLowerCase() : 'Voir l’application comme un lecteur',
        { placement: 'right' });
    } else {
      roleNode = el('span', { class: 'side-user-role' }, role + ' · lecture seule');
    }
    return el('p', { class: 'side-user', id: 'side-user' },
      el('span', { class: 'side-user-email mono' }, user.email), roleNode);
  }

  // The shell re-renders, so focus goes back by id to the control that was used.
  function toggleReaderView(focusId) {
    UI.tooltip(document.getElementById('side-user-role'), null); // the node is replaced, drop its tooltip first
    State.setReaderView(!State.get().readerView);
    var back = document.getElementById(focusId) || document.getElementById('side-user-role');
    if (back) back.focus();
  }

  function brand() {
    return el('div', { class: 'brand' },
      svgFrom(LOGO, 'brand-logo', 24, 28),
      el('div', { class: 'brand-text' },
        el('span', { class: 'brand-name' }, BRAND),
        el('span', { class: 'brand-sub' }, BRAND_SUB)));
  }

  // Also fills the « 3 postes sur 7 » line of the app bar while a filter is active.
  function updateNavCounts() {
    var s = State.get();
    var md = s.month ? State.getMonthData(s.month) : null;
    var f = md ? State.filtered(md) : null;
    var counts = { postes: f ? f.postes.length : null, apps: f ? f.applications.length : null };
    if (sidebar) {
      Array.prototype.forEach.call(sidebar.querySelectorAll('.nav-count'), function (n) {
        var v = counts[n.dataset.count];
        n.textContent = v === null || v === undefined ? '' : UI.fmtNum(v);
      });
    }
    var line = document.getElementById('appbar-count');
    if (line) {
      var active = md && hasActiveFilters(s.filters);
      line.textContent = active ? UI.fmtNum(f.postes.length) + ' poste' + (f.postes.length > 1 ? 's' : '') +
        ' sur ' + UI.fmtNum(md.postes.length) : '';
      line.hidden = !active;
    }
  }

  function renderSidebar() {
    var s = State.get();
    UI.clear(sidebar);
    var nav = el('nav', { class: 'nav', 'aria-label': 'Pages' },
      el('ul', { class: 'nav-list' }, visibleNav().map(function (n) {
        var counted = n.id === 'postes' || n.id === 'apps';
        return el('li', null, el('button', { type: 'button', class: 'nav-link', dataset: { page: n.id },
          onClick: function () { go(n.id); } },
          el('span', { class: 'nav-glyph', 'aria-hidden': 'true' }, icon(n.id)),
          el('span', { class: 'nav-label' }, n.title),
          counted ? el('span', { class: 'nav-count', dataset: { count: n.id } }) : null));
      })));

    // Sheet links are only sent to admins, so the lecteur preview hides them too.
    var links = !s.readerView;
    var footer = el('div', { class: 'sidebar-footer' },
      syncChip(),
      links && s.dataUrl ? UI.extLink(s.dataUrl, 'Données (Google Sheet)', { class: 'side-link', id: 'link-data' }) : null,
      links && s.sourceUrl ? UI.extLink(s.sourceUrl, 'Source', { class: 'side-link', id: 'link-source',
        'aria-label': s.sourceTitle ? 'Source : ' + s.sourceTitle : null }) : null,
      userLine(s.user));

    var collapse = el('button', { type: 'button', class: 'nav-collapse', id: 'nav-collapse', 'aria-controls': 'sidebar',
      onClick: function () { setCollapsed(!isCollapsed()); } },
      el('span', { class: 'nav-collapse-glyph', 'aria-hidden': 'true' }),
      el('span', { class: 'nav-collapse-label' }));

    sidebar.appendChild(el('div', { class: 'sidebar-inner' }, brand(), nav, footer, collapse));
    placeSyncChip();
    updateSyncChip();
    syncCollapseButton();
    updateNavActive();
    syncRailTooltips();
    updateNavCounts();
  }

  // App bar
  // When the bar is too narrow, a container query in css.html folds the filters under « Filtres ».
  function renderAppbar() {
    var s = State.get();
    UI.clear(appbar);
    periodButton = el('button', { type: 'button', class: 'period-button', id: 'period-button', 'aria-haspopup': 'dialog',
      'aria-expanded': 'false', 'aria-labelledby': 'appbar-period-label period-button', disabled: !s.months.length,
      onClick: function () { togglePeriodPanel(); } },
      el('span', { class: 'period-button-text' }), el('span', { class: 'period-button-caret dd-caret', 'aria-hidden': 'true' }));
    var prev = el('button', { type: 'button', class: 'period-step', id: 'month-prev', 'aria-label': 'Période précédente',
      onClick: function () { stepPeriod(-1); } }, '‹');
    var next = el('button', { type: 'button', class: 'period-step', id: 'month-next', 'aria-label': 'Période suivante',
      onClick: function () { stepPeriod(1); } }, '›');

    filtersBox = el('div', { class: 'appbar-filters', id: 'appbar-filters' });
    filterOptionsMonth = null;

    var toggle = el('button', { type: 'button', class: 'btn btn-secondary btn-sm filters-toggle', id: 'filters-toggle',
      'aria-controls': 'appbar-filters', 'aria-expanded': 'false',
      onClick: function () { setFiltersOpen(!document.body.classList.contains('filters-open')); } },
      'Filtres', el('span', { class: 'filters-toggle-count', id: 'filters-toggle-count' }));

    appbar.appendChild(el('div', { class: 'appbar-group appbar-period' },
      el('span', { class: 'appbar-label sr-only', id: 'appbar-period-label' }, 'Période'),
      el('div', { class: 'period-stepper' }, prev, periodButton, next)));
    appbar.appendChild(el('span', { class: 'appbar-sep', 'aria-hidden': 'true' }));
    appbar.appendChild(el('div', { class: 'filters-anchor', id: 'filters-anchor' }, toggle, filtersBox));
    appbar.appendChild(el('p', { class: 'filters-summary', id: 'filters-summary', 'aria-hidden': 'true' }));
    appbar.appendChild(el('p', { class: 'appbar-count', id: 'appbar-count', role: 'status', hidden: true }));
    // Repeated here because the sidebar may be a rail or closed.
    if (s.readerView) {
      appbar.appendChild(el('button', { type: 'button', class: 'btn btn-secondary btn-sm reader-view-exit', id: 'reader-view-exit',
        onClick: function () { toggleReaderView('reader-view-exit'); } }, 'Vue lecteur · revenir en admin'));
    }
    appbar.appendChild(el('span', { class: 'appbar-progress', id: 'appbar-progress', 'aria-hidden': 'true' }));
    syncPeriodButton();
    setFiltersOpen(false);
    renderFilters();
  }

  // Synchronisation
  // The server re-reads the current month every hour (Sync.js). The status is polled so the chip
  // can say « Nouvelles données » once the server holds newer data than the screen.
  var SYNC_POLL_MS = 10 * 60 * 1000;
  var pollingStarted = false;
  var syncing = false;        // a sync started from this tab is running
  var seenChangeAt = null;    // lastChangeAt of the data on screen, null until known
  var newData = false;
  var lastPoll = 0;
  var syncPop = null;

  function syncStatus() { return State.get().sync || {}; }

  function syncTone(st) {
    if (syncing) return 'busy';
    if (st.lastError && (!st.lastOkAt || st.lastError.at >= st.lastOkAt)) return 'ko';
    if (newData) return 'new';
    if (!st.lastOkAt) return 'off';
    return st.warnings && st.warnings.length ? 'warn' : 'ok';
  }

  // « à 14:02 » today, « le 04/05 à 10:30 » otherwise.
  function syncWhen(stamp) {
    var t = Fmt.stamp(stamp);
    var i = t.lastIndexOf(' ');
    return i < 0 ? 'à ' + t : 'le ' + t.slice(0, i) + ' à ' + t.slice(i + 1);
  }

  function syncChipText(st, tone) {
    if (tone === 'busy') return 'Synchronisation…';
    if (tone === 'ko') return 'Échec ' + Fmt.stamp(st.lastError.at);
    if (tone === 'new') return 'Nouvelles données';
    if (tone === 'off') return st.enabled ? 'En attente' : 'Synchro inactive';
    return Fmt.stamp(st.lastOkAt);
  }

  function syncSentence(st, tone) {
    if (tone === 'busy') return 'Synchronisation en cours';
    if (tone === 'ko') return 'Échec de la synchronisation ' + syncWhen(st.lastError.at);
    if (tone === 'off') return st.enabled ? 'Première synchronisation à venir' : 'Synchronisation automatique inactive';
    return 'Synchronisé ' + syncWhen(st.lastOkAt) + (tone === 'new' ? ', nouvelles données disponibles' : '');
  }

  function syncChip() {
    closeSyncPanel();
    var old = document.getElementById('sync-chip');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    return el('button', { type: 'button', class: 'sync-chip', id: 'sync-chip', 'aria-haspopup': 'dialog',
      'aria-expanded': 'false', onClick: function (e) { toggleSyncPanel(e.currentTarget); } },
      el('span', { class: 'sync-chip-mark', 'aria-hidden': 'true' }), el('span', { class: 'sync-chip-text' }));
  }

  // Below 900px the sidebar folds behind « Menu », so the chip moves to the top bar.
  var narrowQuery = window.matchMedia ? window.matchMedia('(max-width: 900px)') : null;
  function placeSyncChip() {
    var chip = document.getElementById('sync-chip');
    var footer = sidebar && sidebar.querySelector('.sidebar-footer');
    var toggle = document.getElementById('nav-toggle');
    if (!chip || !footer || !toggle) return;
    var inTopbar = !!(narrowQuery && narrowQuery.matches);
    var parent = inTopbar ? toggle.parentNode : footer;
    var before = inTopbar ? toggle : footer.firstChild;
    if (chip.parentNode === parent && (inTopbar ? chip.nextSibling === toggle : chip === footer.firstChild)) return;
    closeSyncPanel();
    parent.insertBefore(chip, before);
    updateSyncChip();
  }
  if (narrowQuery) {
    if (narrowQuery.addEventListener) narrowQuery.addEventListener('change', placeSyncChip);
    else if (narrowQuery.addListener) narrowQuery.addListener(placeSyncChip);
  }

  function updateSyncChip() {
    var chip = document.getElementById('sync-chip');
    if (chip) {
      var st = syncStatus();
      var tone = syncTone(st);
      chip.dataset.tone = tone;
      chip.setAttribute('aria-label', 'Synchronisation : ' + syncSentence(st, tone) + '. Afficher le détail.');
      // In the rail only the mark shows, so the sentence becomes its tooltip.
      UI.tooltip(chip, isCollapsed() && !chip.closest('.topbar') ? syncSentence(st, tone) : null, { placement: 'right' });
      chip.querySelector('.sync-chip-text').textContent = syncChipText(st, tone);
      var mark = chip.querySelector('.sync-chip-mark');
      UI.clear(mark);
      if (tone === 'busy') mark.appendChild(UI.spinner());
    }
    if (syncPop && syncPop.isOpen()) {
      // Re-render the open panel and keep focus on the same control.
      var focused = syncPop.node.contains(document.activeElement) ? document.activeElement.id : '';
      UI.clear(syncPop.node).appendChild(syncPanel());
      syncPop.reposition();
      var again = focused && document.getElementById(focused);
      if (again) again.focus();
    }
  }

  function syncPanel() {
    var s = State.get();
    var st = syncStatus();
    var tone = syncTone(st);
    var admin = State.canEdit();
    var markTone = { ko: 'ko', warn: 'warn', off: 'neutral', busy: 'info', new: 'todo' }[tone] || 'ok';
    var box = el('div', { class: 'sync-panel', id: 'sync-panel' },
      el('p', { class: 'sync-panel-status', id: 'sync-panel-status' }, UI.statusMark(syncSentence(st, tone), markTone)));
    if (tone === 'ko') {
      box.appendChild(el('p', { class: 'alert alert-error', id: 'sync-panel-error' }, st.lastError.message +
        (st.lastOkAt ? ' Les données affichées datent de la synchronisation ' + syncWhen(st.lastOkAt) + '.' : '')));
    }
    var month = st.month || s.currentMonth;
    box.appendChild(el('p', { class: 'muted small' },
      'Toutes les heures, ' + Fmt.monthLong(month) + ' (le mois en cours) est relu depuis le Google Sheet source',
      admin && s.sourceUrl ? [' ', UI.extLink(s.sourceUrl, s.sourceTitle || 'source')] : null,
      '. Les mois précédents restent tels qu’à leur dernière synchronisation.'));
    if (st.lastChangeAt) {
      box.appendChild(el('p', { class: 'small', id: 'sync-panel-change' }, 'Dernière modification ',
        el('span', { class: 'mono' }, Fmt.stamp(st.lastChangeAt)), ' · ', Fmt.syncChange(st.lastChange) || '—'));
    }
    if (st.warnings && st.warnings.length && tone !== 'ko') {
      box.appendChild(el('div', { class: 'alert alert-warning' },
        el('ul', { class: 'warning-list' }, st.warnings.map(function (w) { return el('li', null, w); }))));
    }
    var actions = el('div', { class: 'sync-panel-actions' });
    if (newData) {
      actions.appendChild(el('button', { type: 'button', class: 'btn btn-primary btn-sm', id: 'sync-reload',
        onClick: function () { closeSyncPanel(); reloadData(); } }, 'Actualiser'));
    }
    if (admin) {
      var enable = !st.enabled;
      var run = el('button', { type: 'button', class: 'btn btn-secondary btn-sm', id: enable ? 'sync-enable' : 'sync-now',
        onClick: function () { syncNow(run, { enable: enable }); } },
        enable ? 'Activer la synchronisation horaire' : 'Synchroniser maintenant');
      actions.appendChild(run);

      actions.appendChild(el('button', { type: 'button', class: 'btn btn-link btn-sm', id: 'sync-journal',
        onClick: function () {

    }
    if (actions.childNodes.length) box.appendChild(actions);

  }

  function toggleSyncPanel(chip) {
    if (syncPop && syncPop.isOpen()) { closeSyncPanel(); return; }
    refreshSyncStatus();
    chip.setAttribute('aria-expanded', 'true');
    syncPop = UI.popover({ anchor: chip, content: syncPanel(), className: 'sync-popover', id: 'sync-popover',
      role: 'dialog', ariaLabel: 'Synchronisation', align: chip.closest('.topbar') ? 'end' : 'start', matchWidth: false, maxHeight: 420, keepOnTab: true,
      onClose: function () { chip.setAttribute('aria-expanded', 'false'); syncPop = null; } });
  }

  function closeSyncPanel() {
    if (syncPop && syncPop.isOpen()) syncPop.close('api');
  }

  function refreshSyncStatus() {
    lastPoll = Date.now();
    return api.call('api_getSyncStatus', null).then(function (st) {
      if (seenChangeAt !== null && st.lastChangeAt && st.lastChangeAt !== seenChangeAt) newData = true;
      State.set({ sync: st });
      // The poll also brings editing switches another admin may have changed.
      State.setEditing(st.editing);
      updateSyncChip();
      return st;
    }, function (err) {
      console.warn('Statut de synchronisation indisponible : ' + UI.errorText(err));
      return null;
    });
  }

  function startSyncPolling() {
    seenChangeAt = syncStatus().lastChangeAt || '';
    setInterval(function () { if (State.get().configured && !document.hidden) refreshSyncStatus(); }, SYNC_POLL_MS);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && State.get().configured && Date.now() - lastPoll > 60 * 1000) refreshSyncStatus();
    });
  }

  // Reloads the bootstrap too, since a new month may exist.
  function reloadData() {
    newData = false;
    var before = State.get().month;
    State.invalidate();
    return State.refreshBootstrap().then(function (s) {
      seenChangeAt = (s.sync || {}).lastChangeAt || '';
      updateSyncChip();
      // Only a changed month re-mounts through onStateChange, so the same month is re-mounted here.
      if (s.month === before) refresh();
    });
  }

  // Also used by Paramètres and the empty dashboard. Resolves {status, result}, or null after an error toast.
  function syncNow(button, opts) {
    if (syncing) return Promise.resolve(null);
    syncing = true;
    updateSyncChip();
    var p = api.call(opts && opts.enable ? 'api_enableSync' : 'api_syncNow', null);
    if (button) UI.busy(button, p, 'Synchronisation…').then(null, function () {});
    return p.then(function (res) {
      syncing = false;
      var r = res.result || {};
      State.set({ sync: res.status });
      UI.toast(r.changed ? 'Synchronisé — ' + Fmt.syncChange(r.changes) + '.' : 'Synchronisé — aucune modification.', 'success');
      if (r.changed || newData) return reloadData().then(function () { return res; });
      seenChangeAt = res.status.lastChangeAt || '';
      updateSyncChip();
      return res;
    }, function (err) {
      syncing = false;
      UI.errorToast(err, 'Synchronisation impossible');
      return refreshSyncStatus().then(function () { return null; });
    });
  }

  function applySavedPeriod() {
    var s = State.get();
    var key = (s.prefs || {}).period;
    var r = key && key !== 'month' ? Core.presetPeriod(s.months, key) : null;
    if (r) State.setPeriod(r.from, r.to, key);
  }

  function stepPeriod(delta) {
    var months = State.get().months;
    var p = State.period();
    var to = months[months.indexOf(p.to) + delta];
    var from = months[months.indexOf(p.from) + delta];
    if (months.indexOf(p.to) >= 0 && to && from) State.setPeriod(from, to, '');
  }

  function syncPeriodButton() {
    var s = State.get();
    var p = State.period();
    if (periodButton) {
      periodButton.querySelector('.period-button-text').textContent = s.months.length ? Fmt.periodShort(p.from, p.to) : 'Aucune donnée';
      periodButton.dataset.from = p.from || '';
      periodButton.dataset.to = p.to || '';
      periodButton.disabled = !s.months.length;
    }
    var prev = document.getElementById('month-prev');
    var next = document.getElementById('month-next');
    if (prev) prev.disabled = s.months.indexOf(p.from) <= 0;
    if (next) next.disabled = s.months.indexOf(p.to) < 0 || s.months.indexOf(p.to) >= s.months.length - 1;
  }

  // Period panel
  // Shortcuts apply at once and are remembered per account. The month grid waits for « Appliquer ».
  var periodPop = null;
  var PRESET_LABELS = { month: 'Mois en cours', last3: '3 derniers mois', last6: '6 derniers mois', all: 'Tout l’historique' };

  function presetLabel(key, months) {
    return key === 'year' ? 'Année ' + months[months.length - 1].slice(0, 4) : PRESET_LABELS[key];
  }

  function closePeriodPanel() {
    if (periodPop && periodPop.isOpen()) periodPop.close('api');
  }

  function savePeriodPref(preset) {
    var prefs = State.get().prefs || {};
    if (prefs.period === preset) return;
    State.set({ prefs: Object.assign({}, prefs, { period: preset }) });
    savePrefs({ period: preset });
  }

  function applyPeriod(from, to, preset) {
    closePeriodPanel();
    var cur = State.period();
    if (from !== cur.from || to !== cur.to || (preset || '') !== State.get().preset) State.setPeriod(from, to, preset);
    if (preset) savePeriodPref(preset);
  }

  function togglePeriodPanel() {
    if (periodPop && periodPop.isOpen()) { closePeriodPanel(); return; }
    var months = State.get().months;
    if (!months.length || !periodButton) return;
    var p = State.period();
    var draft = { from: p.from, to: p.to, picking: false, year: Number(p.to.slice(0, 4)) };
    var minYear = Number(months[0].slice(0, 4));
    var maxYear = Number(months[months.length - 1].slice(0, 4));
    var box = el('div', { class: 'period-panel', id: 'period-panel' });

    function render() {
      var focused = box.contains(document.activeElement) ? document.activeElement.id : '';
      UI.clear(box);
      var current = State.get().preset;
      var matches = Core.PERIOD_PRESETS.filter(function (k) {
        var r = Core.presetPeriod(months, k);
        return r && r.from === draft.from && r.to === draft.to;
      });
      var on = matches.indexOf(current) >= 0 ? current : matches[0];
      box.appendChild(el('div', { class: 'period-presets', role: 'group', 'aria-label': 'Raccourcis' },
        Core.PERIOD_PRESETS.map(function (k) {

          return el('button', { type: 'button', class: 'period-preset', id: 'period-preset-' + k, dataset: { preset: k },
            'aria-pressed': k === on ? 'true' : 'false', onClick: function () { applyPeriod(r.from, r.to, k); } },
            presetLabel(k, months));

      for (var i = 1; i <= 12; i++) {

          var edge = m === draft.from || m === draft.to;
          var inside = m > draft.from && m < draft.to;
          grid.appendChild(el('button', { type: 'button', class: ['period-month', edge ? 'is-edge' : null, inside ? 'is-in' : null],
            id: 'period-month-' + m, dataset: { month: m }, disabled: !has, 'aria-pressed': edge ? 'true' : 'false',
            'aria-label': Fmt.monthLong(m) + (has ? '' : ', non synchronisé'),
            onClick: function () {

              else if (m < draft.from) { draft.to = draft.from; draft.from = m; draft.picking = false; }
              else { draft.to = m; draft.picking = false; }
              render();
            } }, Fmt.monthShort(m)));
        })(draft.year + '-' + (i < 10 ? '0' : '') + i);
      }
      var count = Core.monthsInRange(months, draft.from, draft.to).length;
      box.appendChild(el('div', { class: 'period-cal' },
        el('div', { class: 'period-year' },

            disabled: draft.year <= minYear, onClick: function () { draft.year--; render(); } }, '‹'),
          el('span', { class: 'period-year-label', id: 'period-year', 'aria-live': 'polite' }, String(draft.year)),
          el('button', { type: 'button', class: 'period-year-step', id: 'period-year-next', 'aria-label': 'Année suivante',
            disabled: draft.year >= maxYear, onClick: function () { draft.year++; render(); } }, '›')),
        grid,
        el('p', { class: 'period-hint' }, draft.picking ? 'Choisissez la fin de la période, ou appliquez pour ce seul mois.' :
          'Cliquez le début puis la fin. Un seul clic = un mois.')));
      box.appendChild(el('div', { class: 'period-foot' },
        el('span', { class: 'period-summary', id: 'period-summary', role: 'status' },
          Fmt.periodTitle(draft.from, draft.to) + ' · ' + count + ' mois'),
        el('button', { type: 'button', class: 'btn btn-quiet btn-sm', id: 'period-cancel', onClick: closePeriodPanel }, 'Annuler'),
        el('button', { type: 'button', class: 'btn btn-primary btn-sm', id: 'period-apply',
          onClick: function () { applyPeriod(draft.from, draft.to, ''); } }, 'Appliquer')));
      if (periodPop) periodPop.reposition();
      var again = focused && document.getElementById(focused);
      if (again && !again.disabled) again.focus();
    }

    render();
    periodButton.setAttribute('aria-expanded', 'true');
    var anchor = periodButton;
    periodPop = UI.popover({ anchor: anchor, content: box, className: 'period-popover', id: 'period-popover', role: 'dialog',
      ariaLabel: 'Choisir la période', matchWidth: false, maxHeight: 480, keepOnTab: true,
      onClose: function () { anchor.setAttribute('aria-expanded', 'false'); periodPop = null; } });
    var first = box.querySelector('.period-preset[aria-pressed="true"]') || box.querySelector('.period-preset');

  // The folded filters panel closes on an outside click and on Escape once no list is open.
  // Multiselect lists are portalled to <body>, so a click in a popover counts as inside.
  function setFiltersOpen(open) {
    document.body.classList.toggle('filters-open', !!open);
    var t = document.getElementById('filters-toggle');
    if (t) t.setAttribute('aria-expanded', open ? 'true' : 'false');
    document.removeEventListener('pointerdown', onFiltersPointerDown, true);
    document.removeEventListener('keydown', onFiltersKey);
    if (open) {
      document.addEventListener('pointerdown', onFiltersPointerDown, true);
      document.addEventListener('keydown', onFiltersKey);
    }
  }

  function onFiltersPointerDown(e) {
    var anchor = document.getElementById('filters-anchor');
    var t = e.target;
    if (!(t instanceof Node) || (anchor && anchor.contains(t))) return;
    if (t instanceof Element && t.closest('.popover')) return;
    setFiltersOpen(false);
  }

  function onFiltersKey(e) {
    if (e.key !== 'Escape' || e.defaultPrevented || UI.popover.current()) return;
    setFiltersOpen(false);
    var t = document.getElementById('filters-toggle');
    if (t && t.offsetParent !== null) t.focus();
  }

  function syncFilterBadges(f) {
    var n = f ? (f.equipes || []).length + (f.batiments || []).length : 0;
    var c = document.getElementById('filters-toggle-count');
    if (c) c.textContent = n ? String(n) : '';
    var summary = document.getElementById('filters-summary');
    if (summary) summary.textContent = n ? (f.equipes || []).concat(f.batiments || []).join(' · ') : '';
    var reset = document.getElementById('filters-reset');
    if (reset) reset.hidden = !n;
  }

  // Options come from the selected month's postes. Bâtiment is disabled on Suivi des actions,
  // because actions carry an équipe but no bâtiment.
  function renderFilters() {
    if (!filtersBox) return;
    var s = State.get();
    var md = s.month ? State.getMonthData(s.month) : null;
    if (s.month && !md) {
      var month = s.month;
      // Keep the current filters, dimmed, until the new month's options are in.
      if (filterOptionsMonth) filtersBox.classList.add('is-stale');
      else UI.clear(filtersBox).appendChild(el('p', { class: 'field-help', role: 'status' }, UI.spinner(), 'Chargement des filtres…'));
      State.loadMonth(month).then(function () {
        if (State.get().month === month) renderFilters();
      }, function () {
        if (State.get().month === month) {
          filtersBox.classList.remove('is-stale');
          UI.clear(filtersBox).appendChild(el('p', { class: 'field-help', role: 'status' }, 'Filtres indisponibles.'));
        }
      });
      return;
    }
    filterOptionsMonth = s.month;
    filtersPage = s.page;
    filtersBox.classList.remove('is-stale');
    updateNavCounts();
    var postes = md ? md.postes : [];
    var f = s.filters || { equipes: [], batiments: [] };
    UI.clear(filtersBox);
    filtersBox.appendChild(UI.multiSelect({
      label: 'Équipe',
      options: Core.uniqueSorted(postes, 'Équipe'),
      value: f.equipes || [],
      onChange: function (values) { setFilters({ equipes: values }); }
    }));
    filtersBox.lastChild.id = 'filter-equipe';
    filtersBox.appendChild(UI.multiSelect({
      label: 'Bâtiment / Labo',
      options: Core.uniqueSorted(postes, 'Bâtiment / Labo'),
      value: f.batiments || [],
      onChange: function (values) { setFilters({ batiments: values }); }
    }));
    filtersBox.lastChild.id = 'filter-batiment';
    if (s.page === 'actions') disableFilter(filtersBox.lastChild, 'filter-batiment-na');
    // Always present, so showing it never re-renders the multiselects while boxes are being ticked.
    filtersBox.appendChild(el('button', { type: 'button', class: 'btn btn-quiet btn-sm', id: 'filters-reset',
      hidden: !hasActiveFilters(f),
      onClick: function () { State.set({ filters: { equipes: [], batiments: [] } }); } },
      'Réinitialiser'));
    syncFilterBadges(f);
  }

  // Disables every control, not just the look, and gives the reason as description and tooltip.
  function disableFilter(node, noteId) {
    node.classList.add('is-disabled');
    node.setAttribute('aria-disabled', 'true');
    if (typeof node.setDisabled === 'function') node.setDisabled(true);
    Array.prototype.forEach.call(node.querySelectorAll('button, input, select, [tabindex]'), function (c) {
      if ('disabled' in c) c.disabled = true; else c.setAttribute('tabindex', '-1');
      c.setAttribute('aria-describedby', noteId);
    });
    var value = node.querySelector('.dd-value');
    if (value) value.textContent = 'Non applicable';
    var reason = 'Non applicable ici : les actions n’ont pas de bâtiment.';
    node.appendChild(el('p', { class: 'filter-na sr-only', id: noteId }, reason));
    UI.tooltip(node, reason);
  }

  function hasActiveFilters(f) {
    return !!f && ((f.equipes || []).length + (f.batiments || []).length) > 0;
  }

  function setFilters(patch) {
    var f = State.get().filters || { equipes: [], batiments: [] };
    var next = { equipes: (f.equipes || []).slice(), batiments: (f.batiments || []).slice() };
    Object.keys(patch).forEach(function (k) { next[k] = patch[k]; });
    syncFilterBadges(next);
    // The widgets already show the new values, and a re-render would close the open list.
    suppressFilterRender = true;
    State.set({ filters: next });
    suppressFilterRender = false;
    updateNavCounts();
  }

  // Configuration and access screens

  function sourceErrorText(err) {
    if (err && err.code === 'VALIDATION') return 'URL ou identifiant invalide. Collez l’URL complète du Google Sheet source.';
    return UI.errorText(err);
  }

  function tabsWarning(res) {
    var missing = [];
    var t = (res && res.tabsFound) || {};
    if (t.postes === false) missing.push('« ' + Core.SOURCE_TABS.postes + ' »');
    if (t.applications === false) missing.push('« ' + Core.SOURCE_TABS.applications + ' »');
    if (t.referentiel === false) missing.push('« ' + Core.SOURCE_TABS.referentiel + ' »');
    return missing.length ? 'Onglet(s) introuvable(s) : ' + missing.join(', ') : '';
  }

  // The server also creates the hourly trigger; the first sync runs right after.
  function applySource(source) {
    return api.call('api_setConfig', { source: source }).then(function (res) {
      UI.toast('Source configurée — ' + (res.sourceTitle || res.sourceId) + '.', 'success');
      var warn = tabsWarning(res);
      if (warn) UI.toast(warn + '.', 'error');
      if (res.sync && res.sync.authError) UI.toast(res.sync.authError, 'error');
      State.invalidate();
      return State.refreshBootstrap().then(function () { return syncNow(); }).then(function () { return res; });
    });
  }

  function bareShell() {

    sidebar.appendChild(el('div', { class: 'sidebar-inner' }, brand()));
    UI.clear(appbar);

  }

  // Only the owner may choose the source (ApiImpl_.setConfig), so anyone else waits here.

    main.appendChild(el('div', { class: 'page page-config', dataset: { page: 'unconfigured' } },
      UI.pageHeader({ kicker: BRAND + ' · configuration', title: 'Source de données' }),
      el('p', { class: 'page-lede' }, 'L’application n’est pas encore configurée. Son propriétaire (le compte qui ' +
        'l’a déployée) doit d’abord définir le classeur source ; les données arrivent ensuite toutes les heures.'),
      u.email ? el('p', { class: 'field-help' }, 'Connecté en tant que ', el('span', { class: 'mono' }, u.email),
        ' · ' + (ROLE_LABELS[u.role] || u.role) + '.') : null,
      el('div', { class: 'form-actions' },
        State.canEdit() ? el('button', { type: 'button', class: 'btn btn-secondary', id: 'waiting-open-settings',
          onClick: function () { go('settings'); } }, 'Paramètres') : null,
        el('button', { type: 'button', class: 'btn btn-secondary', onClick: reboot }, 'Actualiser'))));
  }

  // FORBIDDEN at boot. The server message names the account.

      UI.pageHeader({ kicker: BRAND + ' · accès', title: 'Accès refusé' }),
      el('p', { class: 'page-lede', id: 'denied-message' }, UI.errorText(err)),
      el('p', { class: 'field-help' }, 'Demandez l’accès à un administrateur de l’application, puis « Réessayer ».'),
      el('div', { class: 'form-actions' },

        el('p', { class: 'field-help config-settings-link' }, 'Les accès et le seuil de conformité se règlent dans ',
          el('button', { type: 'button', class: 'btn btn-link', id: 'config-open-settings',
            onClick: function () { go('settings'); } }, 'Paramètres'), '.'),
        UI.lede('Collez l’URL (ou l’identifiant) du Google Sheet source « ShadowIT_Industry ».', [
          'Il doit contenir les onglets « ' + Core.SOURCE_TABS.postes + ' », « ' + Core.SOURCE_TABS.applications +

  // State changes and boot

  function renderAll() {
    var s = State.get();
    if (!s.configured && !onSettings()) { renderConfigScreen(); return; }
    document.body.classList.remove('unconfigured');
    renderSidebar();
    renderAppbar();
    mountPage();
  }

  function onStateChange(s, changed) {
    if (!booted) return;
    if (has(changed, 'configured') || has(changed, 'user') || has(changed, 'readerView')) { renderAll(); return; }
    if (!s.configured) {
      // Before the first source only Paramètres and the configuration screen exist.
      if (has(changed, 'page')) renderAll();
      return;
    }
    if (has(changed, 'sync')) updateSyncChip();
    if (has(changed, 'months') || has(changed, 'dataUrl') || has(changed, 'sourceUrl') || has(changed, 'sourceTitle')) {
      renderSidebar();
      renderAppbar();
    } else if (has(changed, 'month')) {
      syncPeriodButton();
      renderFilters();
    } else if (has(changed, 'from')) {
      syncPeriodButton();
    } else if ((has(changed, 'filters') && !suppressFilterRender) ||
        (has(changed, 'page') && (s.page === 'actions') !== (filtersPage === 'actions'))) {
      renderFilters();
    }
    if (has(changed, 'page')) mountPage();
    else if (has(changed, 'month') || has(changed, 'from')) swapMonth(s.month);
    else if (has(changed, 'filters')) updatePage(changed);
    // Only Postes and Applications show editing controls. Paramètres follows the switches itself.
    if (has(changed, 'editing') && !has(changed, 'page') && !has(changed, 'month') && !has(changed, 'from') &&
        (s.page === 'postes' || s.page === 'apps')) updatePage(['editing']);
  }

  // A page whose update(changed) returns true re-rendered in place, keeping scroll and any open drawer.
  function updatePage(changed) {
    var handled = false;
    if (currentPage && typeof currentPage.update === 'function') {
      try { handled = currentPage.update(changed) === true; } catch (e) { console.error(e); }
    }
    if (!handled) mountPage();
  }

  // The current page stays, dimmed, while the new month loads, then re-mounts from the cache.
  function swapMonth(month) {
    if (!month || State.getMonthData(month)) { mountPage(); return; }
    var current = main.querySelector('.page');
    if (current) current.classList.add('is-stale');
    main.setAttribute('aria-busy', 'true');
    var ticket = ++monthSwap;
    function finish() {
      if (ticket !== monthSwap || State.get().month !== month) return;
      mountPage();
    }
    State.loadMonth(month).then(finish, finish);
  }

  // Checks NAV, not visibleNav, because the user may not be known yet. mountPage falls back if needed.
  function knownPage(p) {
    return p && NAV.some(function (n) { return n.id === p; }) ? p : null;
  }

  // ?page= as doGet inlined it (#boot-page), else getLocation, with a timeout for outside Apps Script.
  function initialPage() {
    var inline = State.takeInline('boot-page');
    if (inline !== undefined) return Promise.resolve(knownPage(inline));
    return new Promise(function (resolve) {
      var done = false;
      function finish(p) { if (!done) { done = true; resolve(p); } }
      var url = window.google && google.script && google.script.url;
      if (!url || typeof url.getLocation !== 'function') { finish(null); return; }
      setTimeout(function () { finish(null); }, 1500);
      try {
        url.getLocation(function (loc) {
          finish(knownPage(loc && loc.parameter && loc.parameter.page));
        });
      } catch (e) { finish(null); }
    });
  }

  // Marks boot start and first render, then logs one [boot] line. Never throws.
  var bootTiming = {
    start: function () {
      try { performance.mark('shadow:boot'); } catch (e) { /* no User Timing API */ }
    },
    ready: function () {
      try {
        performance.mark('shadow:ready');
        var boot = performance.getEntriesByName('shadow:boot');
        var paint = performance.getEntriesByName('first-contentful-paint');
        var ready = performance.now();
        var parts = [];
        if (boot.length) parts.push('boot ' + Math.round(ready - boot[boot.length - 1].startTime) + 'ms');
        if (paint.length) parts.push('first paint ' + Math.round(paint[0].startTime) + 'ms');
        console.debug('[boot] ready ' + Math.round(ready) + 'ms' + (parts.length ? ' (' + parts.join(', ') + ')' : ''));
      } catch (e) { /* no User Timing API */ }
    }
  };

  // #splash is static in index.html so it paints before any script runs.
  var SLOW_MS = 8000;
  var SLOW_NOTE = 'Le serveur Google démarre, cela peut prendre jusqu’à 30 secondes au premier accès de la journée.';
  var splash = (function () {
    var slowTimer = null;
    var hideTimer = null;
    function node(id) { return document.getElementById(id); }
    function stopSlow() { clearTimeout(slowTimer); slowTimer = null; }
    return {
      show: function () {
        var n = node('splash');
        if (!n) return;
        clearTimeout(hideTimer);
        n.hidden = false;
        n.classList.remove('is-done', 'is-failed');
        node('splash-note').hidden = true;
        node('splash-error').hidden = true;
        stopSlow();
        slowTimer = setTimeout(function () {
          var note = node('splash-note');
          note.textContent = SLOW_NOTE;
          note.hidden = false;
        }, SLOW_MS);
      },
      step: function (text) {
        var st = node('splash-status');
        if (st) st.textContent = text;
      },
      done: function () {
        var n = node('splash');
        stopSlow();
        if (!n || n.hidden) return;
        n.classList.add('is-done');
        hideTimer = setTimeout(function () { n.hidden = true; }, 220);
      },
      fail: function (err, retry) {
        var n = node('splash');
        stopSlow();
        if (!n) return;
        n.classList.add('is-failed');
        node('splash-error-text').textContent = 'Impossible de charger l’application : ' + UI.errorText(err);
        node('splash-error').hidden = false;
        var b = node('splash-retry');
        b.onclick = retry;
        b.focus();
      }
    };
  })();

  // Pages that compare the period's last month with its first, so they need both.
  var FROM_MONTH_PAGES = ['dashboard', 'postes', 'apps'];

  // Not awaited: the page reuses the pending requests through State and shows their errors itself.
  function prefetchLanding() {
    var info = navInfo(State.get().page) || visibleNav()[0];
    var per = State.period();
    function ignore() { return null; }
    if (!per.single && FROM_MONTH_PAGES.indexOf(info.id) >= 0) State.loadMonth(per.from).catch(ignore);
    // The dashboard draws its sparklines from the timeline.
    if ((info.id === 'dashboard' && !per.single) || info.id === 'timeline') State.loadTimeline().catch(ignore);
  }

  function boot() {
    // Start the Plotly download now; only charts wait for it.
    Charts.ready();
    sidebar = document.getElementById('sidebar');
    appbar = document.getElementById('appbar');
    main = document.getElementById('main');
    document.body.classList.toggle('nav-collapsed', readLocalSidebar() === 'collapsed');
    var toggle = document.getElementById('nav-toggle');
    if (toggle && !toggle.dataset.bound) {
      toggle.dataset.bound = '1';
      toggle.addEventListener('click', function () { setNavOpen(!document.body.classList.contains('nav-open')); });
    }
    var h = historyApi();
    if (h && typeof h.setChangeHandler === 'function') {
      try {
        h.setChangeHandler(function (e) {
          var p = e && e.state && e.state.page;
          if (p) go(p, { fromHistory: true });
        });
      } catch (e) { /* ignore */ }
    }
    bootTiming.start();
    splash.show();
    splash.step('Vérification de l’accès…');
    // The first boot uses the bootstrap doGet inlined into the page, saving a server call.
    Promise.all([State.refreshBootstrap({ useInline: true }), initialPage()]).then(function (res) {
      if (res[1]) State.set({ page: res[1] });
      applySavedPeriod();
      var s = State.get();
      if (!s.configured || !s.month) return null;
      // Load the month behind the splash so the first page mounts without a skeleton.
      splash.step('Chargement de ' + Fmt.monthLong(s.month) + '…');
      var first = State.loadMonth(s.month).catch(function () { return null; }); // the page shows its own error
      prefetchLanding();
      return first;
    }).then(function () {
      booted = true;
      syncSidebarPref();
      renderAll();
      if (!pollingStarted) { pollingStarted = true; startSyncPolling(); }
      splash.done();
      bootTiming.ready();
    }, function (err) {
      if (err && err.code === 'FORBIDDEN') { booted = true; splash.done(); renderDeniedScreen(err); return; }
      console.error(err);
      splash.fail(err, reboot);
    });
  }

  State.subscribe(onStateChange);

  window.App = {
    go: go,
    refresh: refresh,
    boot: boot,
    applySource: applySource,
    sourceErrorText: sourceErrorText,
    syncNow: syncNow,
    ROLE_LABELS: ROLE_LABELS
  };

  // The scripts close <body>, so the shell is already parsed. DOMContentLoaded is only a fallback.
  if (document.getElementById('main') || document.readyState !== 'loading') boot();
  else document.addEventListener('DOMContentLoaded', boot);
})();
</script>
