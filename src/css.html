<style>
/* ==================================================================================================
   Shadow IT — "audit ledger" stylesheet (docs/DESIGN.md). Ink on paper, hairlines instead of boxes,
   colour only for status. One file, CSS custom properties, no external CSS besides the Plex fonts.

   Page authors: use ...
   - Page header      .page-header > .page-kicker (small-caps month line, ABOVE the title) + h1.page-title
                      + optional .page-header-actions (right-aligned). UI.pageHeader({title, kicker, kickerId,
                      actions}) builds it. p.page-caption = plain ink-2 line under the title.
                      (Do not use .page-actions: it is the root class of the Suivi actions page.)
   - Sections         UI.section(title, ...) -> section.section > h2.section-title (small-caps label on a
                      hairline). .label = any small-caps label. .subsection-title = smaller label.
                      .card / .chart-card / .detail-card are NOT boxes any more: they are hairline-topped
                      blocks whose .card-title is a small-caps label.
   - Grids            .grid.grid-2 = two columns separated by a vertical hairline (one column < 1100px).
                      .grid.grid-3 = same with three columns.
   - KPI strip        UI.kpiStrip([{key, title, value, sub?, tone?}]) -> .kpi-strip of .kpi cells
                      (UI.card renders one cell: .kpi.metric-card > .metric-title/.metric-value/.metric-sub).
                      Any .grid that directly holds .metric-card cells is laid out as a strip as well.
   - Status marks     UI.statusMark(text, tone) -> span.mark.mark-<tone> ("■ Conforme");
                      tone: ok | ko | warn | info | neutral | risk-critique | risk-eleve | risk-moyen |
                      risk-faible. UI.badge/scoreBadge/riskBadge render the same marks (class .badge kept).
                      .badge-score / .mark-score = mono figure, no square. .mark-pill = dense-cell pill.
   - Figures          .num (right-aligned mono tabular), .mono (identifiers: postes, months, dates),
                      .tabular, .muted (ink-2), .faint (ink-3), .small (12px), .sr-only.
   - Lists            dl.kv (label / value rows), ul.checklist (criteria with marks), ul.rel-list
                      (related names), dl.leaders (label ……… value rows with dotted leader),
                      .stat-line (inline "label value · label value" summary).
   - Drawer content   .drawer-section > .section-head (label + action) ; .drawer-head ; .drawer-buttons.
   - Controls         .btn + .btn-primary | .btn-secondary | .btn-danger | .btn-link | .btn-small,
                      .icon-btn (× close only), .input, .field/.field-label, .toolbar (flex row).
   - Notes            .alert.alert-info|success|warning|error (left rule + text, no tinted panel),
                      .filter-note, .empty-state (UI.empty: one line of ink-2 text).
   ================================================================================================== */
:root {
  --ink: #16181b;
  --ink-2: #4a4f57;
  --ink-3: #6b7079;          /* DESIGN.md says #7c828b; darkened to reach 4.5:1 on --paper and --paper-2 */
  --rule: #e3e4e6;
  --rule-2: #c9cbcf;
  --paper: #ffffff;
  --paper-2: #f6f6f4;
  --accent: #0b63ce;
  --ok: #1f7a4d;
  --ok-bg: #e8f3ec;
  --ko: #b42318;
  --ko-bg: #fbeceb;
  --warn: #a15c07;
  --risk-critique: #b42318;
  --risk-eleve: #d4621b;
  --risk-moyen: #c99a06;
  --risk-faible: #1f7a4d;
  --radius: 3px;
  --radius-overlay: 6px;
  --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --shadow-overlay: 0 12px 32px rgba(0, 0, 0, .18);
  --backdrop: rgba(22, 24, 27, .35);
  --sidebar-w: 232px;
  --row-h: 32px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
}

/* ------------------------------------------------------------------ base */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); }
body {
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body.has-overlay { overflow: hidden; }
h1, h2, h3, h4 { margin: 0; font-weight: 500; line-height: 1.3; }
p { margin: 0; }
a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
[hidden] { display: none !important; }
::selection { background: #d6e4f7; }

.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 12px; }
.mono, code, kbd { font-family: var(--font-mono); font-size: .93em; }
.tabular { font-variant-numeric: tabular-nums; }
.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.spacer { flex: 1 1 auto; }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.label, .sidebar-heading, .section-title, .card-title, .metric-title, .page-kicker,
.subsection-title, .field-label.is-label, .table thead th, .kv dt {
  font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

/* ------------------------------------------------------------------ layout */
.app {
  display: flex; min-height: 100vh;
  /* The sidebar column is painted on the container too: its background reaches the bottom of any page. */
  background: linear-gradient(to right, var(--paper-2) 0, var(--paper-2) calc(var(--sidebar-w) - 1px),
    var(--rule) calc(var(--sidebar-w) - 1px), var(--rule) var(--sidebar-w), var(--paper) var(--sidebar-w));
}
.topbar { display: none; }
.sidebar {
  width: var(--sidebar-w); flex: 0 0 var(--sidebar-w);
  background: var(--paper-2);
  border-right: 1px solid var(--rule);
  position: sticky; top: 0; align-self: flex-start;
  height: 100vh; overflow-y: auto; overscroll-behavior: contain;
}
.sidebar-inner { display: flex; flex-direction: column; gap: var(--s5); padding: var(--s5) var(--s4) var(--s4) var(--s4); min-height: 100%; }
.main { flex: 1 1 auto; min-width: 0; padding: var(--s6) var(--s7) var(--s7); outline: none; background: var(--paper); }
.page { max-width: 1180px; display: flex; flex-direction: column; gap: var(--s6); }
.boot-loading { display: flex; align-items: center; gap: var(--s2); color: var(--ink-2); }

/* brand */
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 var(--s2); }
.brand-name { font-family: var(--font-mono); font-weight: 500; font-size: 16px; letter-spacing: -.01em; color: var(--ink); }
.brand-sub { font-size: 12px; color: var(--ink-3); }
.brand-logo { display: none; }

/* nav */
.nav-list { list-style: none; margin: 0 calc(-1 * var(--s4)); padding: 0; display: flex; flex-direction: column; }
.nav-link {
  width: 100%; min-height: 32px;
  display: flex; align-items: center; gap: var(--s3);
  padding: 5px var(--s4) 5px calc(var(--s4) + var(--s2));
  border: 0; border-radius: 0; background: transparent; color: var(--ink-2);
  font: inherit; font-size: 14px; text-align: left; cursor: pointer;
  box-shadow: inset 0 0 0 transparent;
}
.nav-link:hover { color: var(--ink); background: rgba(22, 24, 27, .04); }
.nav-link.active { color: var(--ink); font-weight: 500; box-shadow: inset 2px 0 0 var(--ink); }
.nav-label { flex: 1 1 auto; }
.nav-count { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); font-weight: 400; }
.nav-icon { display: none; }

.sidebar-section { display: flex; flex-direction: column; gap: var(--s2); padding: 0 var(--s2); }
.sidebar-heading { color: var(--ink-3); padding-bottom: var(--s1); border-bottom: 1px solid var(--rule); margin-bottom: var(--s1); }
.sidebar .field-label { font-size: 12px; color: var(--ink-2); font-weight: 400; }
.filters { display: flex; flex-direction: column; gap: var(--s3); }
.sidebar-footer {
  margin-top: auto; display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  padding: var(--s3) var(--s2) 0; border-top: 1px solid var(--rule); font-size: 13px;
}
.side-link { color: var(--ink-2); text-decoration: none; padding: 3px 0; }
.side-link:hover { color: var(--accent); text-decoration: underline; }
.side-link::after { content: ' ↗'; color: var(--ink-3); font-size: 11px; }
.sidebar-footer .btn-link { color: var(--ink-2); font-size: 13px; padding: 3px 0; min-height: 0; }
.sidebar-footer .btn-link:hover { color: var(--accent); }

body.unconfigured .sidebar { display: none !important; }
body.unconfigured .app { background: var(--paper); }
body.unconfigured .topbar-toggle { visibility: hidden; }

/* ------------------------------------------------------------------ page header */
.page-header {
  display: flex; flex-direction: column; gap: 6px;
  padding-bottom: var(--s3); border-bottom: 1px solid var(--ink);
  position: relative;
}
.page-kicker { order: -1; color: var(--ink-3); margin: 0; }
.page-kicker .mono { font-size: 12px; letter-spacing: .02em; }
.page-caption { color: var(--ink-2); font-size: 13px; margin: 0; }
.page-title { font-size: 20px; font-weight: 600; letter-spacing: -.005em; color: var(--ink); }
.page-header-row { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s4); flex-wrap: wrap; }
.page-header-actions { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.page-lede { color: var(--ink-2); max-width: 64ch; }

/* ------------------------------------------------------------------ sections, cards (= hairline blocks) */
.section { display: flex; flex-direction: column; gap: var(--s3); padding-top: var(--s2); border-top: 1px solid var(--rule); min-width: 0; }
.section-title { display: block; }
.section > .section-title:first-child { margin-top: 0; }
.subsection-title { font-size: 11px; color: var(--ink-3); margin-top: var(--s2); }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
.section-head h3 { font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }

.card, .chart-card, .detail-card {
  background: none; border: 0; border-radius: 0; box-shadow: none;
  border-top: 1px solid var(--rule); padding: var(--s2) 0 0; min-width: 0;
  display: flex; flex-direction: column; gap: var(--s2);
}
.card-title { display: block; }
.chart-box { width: 100%; min-height: 120px; }
.chart-caption { font-size: 12px; color: var(--ink-2); }
.chart-caption .num, .chart-caption .mono, .chart-caption .mark { font-size: 12px; }

.grid { display: grid; gap: var(--s5); }
.grid-2, .grid-3 { gap: 0; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-2 > *, .grid-3 > * { padding-right: var(--s5); min-width: 0; }
.grid-2 > :nth-child(2n), .grid-3 > :not(:nth-child(3n+1)) {
  padding-left: var(--s5); box-shadow: inset 1px 0 0 var(--rule);
}
.grid-2 > :nth-child(2n), .grid-3 > :nth-child(3n) { padding-right: 0; }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.dashboard-body { display: flex; flex-direction: column; gap: var(--s6); }
.block-stack { display: flex; flex-direction: column; gap: var(--s6); }

@media (max-width: 1100px) {
  .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); row-gap: var(--s5); }
  .grid-2 > *, .grid-3 > * { padding: 0 !important; box-shadow: none !important; }
}

/* ------------------------------------------------------------------ KPI strip */
.kpi-strip, .grid:has(> .metric-card) {
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 0;
  border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
}
.kpi, .metric-card {
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
  padding: var(--s3) var(--s5) var(--s4); border: 0; border-radius: 0; box-shadow: none; background: none;
}
.kpi + .kpi, .metric-card + .metric-card { box-shadow: inset 1px 0 0 var(--rule); }
.kpi-strip > :first-child, .grid > .metric-card:first-child { padding-left: 0; }
.metric-title { color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metric-value {
  font-family: var(--font-mono); font-size: 32px; font-weight: 400; line-height: 1.15; letter-spacing: -.02em;
  color: var(--ink); font-variant-numeric: tabular-nums; margin-top: var(--s1);
}
.metric-sub { font-family: var(--font-mono); font-size: 13px; color: var(--ink-2); }
.tone-ok .metric-sub { color: var(--ok); }
.tone-ko .metric-sub { color: var(--ko); }
.tone-warn .metric-sub { color: var(--warn); }
.tone-ko .metric-value.is-alert { color: var(--ko); }
@media (max-width: 700px) {
  .kpi-strip, .grid:has(> .metric-card) { grid-auto-flow: row; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi, .metric-card { padding: var(--s3) var(--s3) var(--s3) var(--s4); }
  .kpi:nth-child(odd), .metric-card:nth-child(odd) { padding-left: 0; box-shadow: none; }
  .kpi:nth-child(even), .metric-card:nth-child(even) { box-shadow: inset 1px 0 0 var(--rule); }
  .kpi:nth-child(n+3), .metric-card:nth-child(n+3) { border-top: 1px solid var(--rule); }
  .metric-value { font-size: 26px; }
  .metric-title { white-space: normal; }
}

/* ------------------------------------------------------------------ status marks (ex-badges) */
.badge, .mark {
  display: inline-flex; align-items: baseline; gap: 6px;
  padding: 0; border: 0; border-radius: 0; background: none;
  font-size: 13px; font-weight: 500; line-height: 20px; white-space: nowrap; color: var(--ink-2);
}
.badge::before, .mark::before {
  content: ''; flex: 0 0 auto; width: 6px; height: 6px; background: currentColor;
  transform: translateY(-1px); align-self: center;
}
.badge-ok, .mark-ok { color: var(--ok); }
.badge-ko, .mark-ko { color: var(--ko); }
.badge-warn, .mark-warn { color: var(--warn); }
.badge-info, .mark-info { color: var(--accent); }
.badge-neutral, .mark-neutral { color: var(--ink-2); font-weight: 400; }
.badge-neutral::before, .mark-neutral::before { background: none; box-shadow: inset 0 0 0 1px var(--ink-3); }
/* risk: square in the risk colour, text stays ink (yellow/orange text would fail contrast) */
.badge-risk, .mark-risk { color: var(--ink); font-weight: 400; }
.badge-risk::before, .mark-risk::before { background: var(--risk-color, var(--ink-3)); }
.risk-critique { --risk-color: var(--risk-critique); }
.risk-eleve { --risk-color: var(--risk-eleve); }
.risk-moyen { --risk-color: var(--risk-moyen); }
.risk-faible { --risk-color: var(--risk-faible); }
.badge-dot { display: none; }
/* scores: a mono figure coloured ok/ko, no square */
.badge-score, .mark-score { font-family: var(--font-mono); font-weight: 400; font-size: 13px; }
.badge-score::before, .mark-score::before { display: none; }
.badge-score.badge-neutral { color: var(--ink-3); }
/* pill: only for dense table cells when a mark would be lost */
.mark-pill { padding: 0 6px; border-radius: 2px; line-height: 18px; }
.mark-pill::before { display: none; }
.mark-pill.mark-ok { background: var(--ok-bg); }
.mark-pill.mark-ko { background: var(--ko-bg); }

/* ------------------------------------------------------------------ alerts, notes, empty */
.alert {
  padding: 2px 0 2px var(--s3); border: 0; border-left: 2px solid var(--ink-3); border-radius: 0;
  background: none; color: var(--ink); font-size: 14px;
}
.alert p { margin: 0; }
.alert strong { font-weight: 500; }
.alert-info { border-left-color: var(--accent); }
.alert-success { border-left-color: var(--ok); }
.alert-warning { border-left-color: var(--warn); }
.alert-warning > strong:first-child, .alert-warning .alert-lead { color: var(--warn); }
.alert-error { border-left-color: var(--ko); color: var(--ko); }
.warning-list { margin: var(--s1) 0 0; padding-left: var(--s4); color: var(--ink-2); font-size: 13px; }
.warning-list li::marker { color: var(--warn); }

.filter-note { font-size: 13px; color: var(--ink-2); padding: 0 0 0 var(--s3); border-left: 2px solid var(--accent); margin: 0; }

.empty-state { display: block; padding: var(--s2) 0; background: none; border: 0; color: var(--ink-2); font-size: 14px; }
.empty-state p { margin: 0; }
.empty-icon { display: none; }

/* ------------------------------------------------------------------ buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: 32px; padding: 0 var(--s3); border-radius: var(--radius); border: 1px solid transparent;
  font: inherit; font-size: 13px; font-weight: 500; line-height: 1; cursor: pointer; white-space: nowrap;
  background: none; color: var(--ink); text-decoration: none;
  transition: background-color .12s, border-color .12s, color .12s;
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn-primary:hover:not(:disabled) { background: #000; }
.btn-secondary { background: var(--paper); border-color: var(--rule-2); color: var(--ink); }
.btn-secondary:hover:not(:disabled) { border-color: var(--ink-2); }
.btn-danger { background: var(--paper); border-color: currentColor; color: var(--ko); }
.btn-danger:hover:not(:disabled) { background: var(--ko); border-color: var(--ko); color: #fff; }
.btn-link {
  background: none; border: 0; color: var(--accent); padding: 0; min-height: 32px; font-weight: 400;
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px;
}
.btn-link:hover:not(:disabled) { text-decoration-thickness: 2px; }
.btn-small { padding: 0 10px; font-size: 13px; }
.btn-link.btn-small { padding: 0; font-size: 12px; }
.btn-block { width: 100%; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; background: transparent; font: inherit; font-size: 20px; line-height: 1;
  width: 32px; height: 32px; border-radius: var(--radius); cursor: pointer; color: var(--ink-2);
}
.icon-btn:hover { background: var(--paper-2); color: var(--ink); }
.icon-btn.btn-edit, .icon-btn.btn-delete { font-size: 14px; width: auto; min-width: 32px; padding: 0 6px; }
.icon-btn.btn-delete:hover { color: var(--ko); }
.toolbar { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.toolbar .select-field, .etable-tools .select-field, .inline-form .select-field {
  flex-direction: row; align-items: center; gap: var(--s2); }
.toolbar .select-field .input, .etable-tools .select-field .input { width: auto; min-width: 120px; }

/* ------------------------------------------------------------------ inputs */
.input {
  width: 100%; min-height: 32px; padding: 0 var(--s2);
  border: 1px solid var(--rule-2); border-radius: var(--radius);
  background: var(--paper); color: var(--ink); font: inherit; font-size: 13px; line-height: 30px;
}
select.input { padding-right: 24px; appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
  background-position: calc(100% - 13px) 13px, calc(100% - 9px) 13px; background-size: 4px 4px; background-repeat: no-repeat; }
textarea.input { line-height: 1.5; padding: 6px var(--s2); resize: vertical; min-height: 72px; }
input[type="month"].input, input[type="date"].input { font-variant-numeric: tabular-nums; }
.input::placeholder { color: var(--ink-3); }
.input:hover:not(:disabled) { border-color: var(--ink-3); }
.input:focus, .input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--rule-2); }
.input:disabled { background: var(--paper-2); color: var(--ink-3); }
.input[aria-invalid="true"] { border-color: var(--ko); }
.field { display: flex; flex-direction: column; gap: var(--s1); }
.field-label { font-size: 12px; font-weight: 500; color: var(--ink-2); }
.field-error { margin: 2px 0 0; color: var(--ko); font-size: 12px; }
.field-help { font-size: 12px; color: var(--ink-3); }
.required { color: var(--ko); }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: var(--s4) var(--s5); }
.form-field { display: flex; flex-direction: column; gap: var(--s1); min-width: 0; }
.form-field-wide { grid-column: 1 / -1; }
.form-actions { display: flex; gap: var(--s2); justify-content: flex-start; margin-top: var(--s2); }
.inline-form { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
.inline-form .input { width: auto; min-width: 180px; }
.inline-form .field, .inline-form label.select-field { flex-direction: row; align-items: center; gap: var(--s2); }
.import-form { display: flex; flex-direction: column; gap: var(--s1); }
.import-card { display: flex; flex-direction: column; gap: var(--s3); }
.import-status:empty { display: none; }

/* multiselect (inline disclosure) */
.multiselect { display: flex; flex-direction: column; gap: var(--s1); }
.ms-toggle { display: flex; align-items: center; gap: var(--s2); text-align: left; cursor: pointer; }
.ms-summary { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.multiselect:not(.has-value) .ms-summary { color: var(--ink-2); }
.ms-count:not(:empty) { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.ms-caret { color: var(--ink-3); font-size: 11px; transition: transform .12s; }
.multiselect.open .ms-caret { transform: rotate(180deg); }
.ms-panel {
  border: 1px solid var(--rule-2); border-radius: var(--radius); padding: var(--s1) 0; background: var(--paper);
  max-height: 240px; overflow-y: auto; display: flex; flex-direction: column;
}
.ms-option { display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s2); min-height: 30px; cursor: pointer; font-size: 13px; }
