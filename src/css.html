<style>
/* Shadow IT Dashboard — single stylesheet. Light theme, Decathlon-blue accent, CSS custom properties. */
:root {
  --accent: #0082c3;
  --accent-strong: #006a9f;
  --accent-soft: #e6f3fa;
  --ok: #1e8449;
  --ok-bg: #e8f8ef;
  --ko: #c0392b;
  --ko-bg: #fdecea;
  --warn: #9a6700;
  --warn-bg: #fff6e0;
  --info: #0b6a99;
  --info-bg: #e6f3fa;
  --text: #1f2933;
  --text-muted: #5f6b7a;
  --border: #dde3ea;
  --border-strong: #c5cdd6;
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-alt: #f8fafc;
  --sidebar-bg: #ffffff;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, .18);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --sidebar-w: 264px;
  --focus: 0 0 0 3px rgba(0, 130, 195, .35);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
body.has-overlay { overflow: hidden; }
h1, h2, h3 { line-height: 1.25; margin: 0; }
a { color: var(--accent); }
a:hover { color: var(--accent-strong); }
:focus-visible { outline: none; box-shadow: var(--focus); }
[hidden] { display: none !important; }
.muted { color: var(--text-muted); }
.small { font-size: 12px; }
.num, .table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.spacer { flex: 1 1 auto; }

/* ------------------------------------------------------------------ layout */
.app { display: flex; min-height: 100vh; }
.topbar { display: none; }
.sidebar {
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.sidebar-inner { display: flex; flex-direction: column; gap: var(--space-5); padding: var(--space-5) var(--space-4); min-height: 100%; }
.main { flex: 1 1 auto; min-width: 0; padding: var(--space-6); outline: none; }
.page { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-5); }
.boot-loading { display: flex; align-items: center; gap: var(--space-2); color: var(--text-muted); padding: var(--space-6); }

.brand { display: flex; align-items: center; gap: var(--space-2); font-weight: 700; font-size: 18px; }
.brand-logo { font-size: 22px; }

.nav-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.nav-link {
  width: 100%;
  display: flex; align-items: center; gap: var(--space-3);
  padding: 9px var(--space-3);
  border: 0; border-radius: var(--radius-sm);
  background: transparent; color: var(--text);
  font: inherit; text-align: left; cursor: pointer;
}
.nav-link:hover { background: var(--surface-alt); }
.nav-link.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.nav-icon { width: 20px; text-align: center; }

.sidebar-section { display: flex; flex-direction: column; gap: var(--space-2); }
.sidebar-heading { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
.filters { display: flex; flex-direction: column; gap: var(--space-3); }
.sidebar-footer { margin-top: auto; display: flex; flex-direction: column; gap: var(--space-2); padding-top: var(--space-4); border-top: 1px solid var(--border); }
.side-link { text-decoration: none; padding: 4px 0; }
.side-link:hover { text-decoration: underline; }

body.unconfigured .sidebar { display: none; }
body.unconfigured .topbar-toggle { visibility: hidden; }

/* Responsive: below 900px the sidebar collapses behind a top bar. */
@media (max-width: 900px) {
  .app { flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: var(--space-3);
    position: sticky; top: 0; z-index: 30;
    padding: var(--space-2) var(--space-4);
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .topbar-brand { font-weight: 700; font-size: 16px; }
  .topbar-toggle {
    border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius-sm);
    width: 38px; height: 38px; font-size: 18px; cursor: pointer;
  }
  .sidebar {
    display: none;
    position: sticky; top: 55px; z-index: 25;
    width: 100%; flex-basis: auto; height: auto; max-height: calc(100vh - 55px);
    border-right: 0; border-bottom: 1px solid var(--border); box-shadow: var(--shadow);
  }
  body.nav-open .sidebar { display: block; }
  .sidebar-inner .brand { display: none; }
  .main { padding: var(--space-4); }
}

/* ------------------------------------------------------------------ page header / sections */
.page-header { display: flex; flex-direction: column; gap: var(--space-1); }
.page-title { font-size: 24px; font-weight: 700; }
.page-caption { margin: 0; color: var(--text-muted); }
.section { display: flex; flex-direction: column; gap: var(--space-3); }
.section-title { font-size: 18px; font-weight: 650; }
.subsection-title { font-size: 15px; font-weight: 600; margin-top: var(--space-2); }
.filter-note { margin: 0; padding: var(--space-2) var(--space-3); background: var(--accent-soft); color: var(--accent-strong); border-radius: var(--radius-sm); }

/* ------------------------------------------------------------------ grid + cards */
.grid { display: grid; gap: var(--space-4); }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.dashboard-body { display: flex; flex-direction: column; gap: var(--space-5); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: var(--space-4) var(--space-5); }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: var(--space-2); }
.metric-card { display: flex; flex-direction: column; gap: 2px; border-top: 3px solid var(--accent); }
.metric-card.tone-ok { border-top-color: var(--ok); }
.metric-card.tone-ko { border-top-color: var(--ko); }
.metric-card.tone-warn { border-top-color: #f39c12; }
.metric-title { font-size: 13px; color: var(--text-muted); font-weight: 500; }
.metric-value { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
.metric-sub { font-size: 13px; font-weight: 600; color: var(--text-muted); }
.tone-ok .metric-sub { color: var(--ok); }
.tone-ko .metric-sub { color: var(--ko); }

.chart-card { padding: var(--space-4); min-width: 0; }
.chart-box { width: 100%; min-height: 250px; }

.detail-card { display: flex; flex-direction: column; gap: var(--space-1); }
.detail-item { border-bottom: 1px solid var(--border); }
.detail-item:last-child { border-bottom: 0; }
.detail-summary { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-2) 0; cursor: pointer; list-style: none; }
.detail-summary::-webkit-details-marker { display: none; }
.detail-summary::before { content: '▸'; color: var(--text-muted); margin-right: var(--space-1); transition: transform .15s; }
.detail-item[open] > .detail-summary::before { transform: rotate(90deg); }
.detail-label { flex: 1 1 auto; }
.detail-value { display: inline-flex; align-items: center; gap: var(--space-2); }
.detail-list { margin: 0 0 var(--space-2); padding-left: var(--space-6); columns: 2 160px; font-size: 13px; }
.detail-none { margin: 0 0 var(--space-2) var(--space-5); }

/* ------------------------------------------------------------------ badges, alerts, empty */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; line-height: 18px; }
.badge-ok { background: var(--ok-bg); color: var(--ok); }
.badge-ko { background: var(--ko-bg); color: var(--ko); }
.badge-warn { background: var(--warn-bg); color: var(--warn); }
.badge-info { background: var(--info-bg); color: var(--info); }
.badge-neutral { background: #eef1f4; color: var(--text-muted); }
.badge-risk { background: color-mix(in srgb, var(--risk-color) 14%, white); color: #1f2933; border: 1px solid color-mix(in srgb, var(--risk-color) 45%, white); }
.badge-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--risk-color); }

.alert { padding: var(--space-3) var(--space-4); border-radius: var(--radius-sm); border: 1px solid transparent; }
.alert p { margin: 0; }
.alert-info { background: var(--info-bg); color: var(--info); border-color: #b9dcef; }
.alert-success { background: var(--ok-bg); color: var(--ok); border-color: #b7e4c7; }
.alert-warning { background: var(--warn-bg); color: var(--warn); border-color: #f3d8a0; }
.alert-error { background: var(--ko-bg); color: var(--ko); border-color: #f5c0b8; }
.warning-list { margin: var(--space-2) 0 0; padding-left: var(--space-5); }

.empty-state { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4) var(--space-5); background: var(--surface-alt); border: 1px dashed var(--border-strong); border-radius: var(--radius); color: var(--text-muted); }
.empty-state p { margin: 0; }

/* ------------------------------------------------------------------ forms + buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid transparent;
  font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: background-color .15s, border-color .15s;
}
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent-strong); }
.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn-secondary:hover:not(:disabled) { background: var(--surface-alt); }
.btn-danger { background: var(--ko); color: #fff; }
.btn-danger:hover:not(:disabled) { background: #a93226; }
.btn-link { background: none; border: 0; color: var(--accent); padding: 0; font-weight: 500; }
.btn-link:hover { text-decoration: underline; }
.btn-small { padding: 5px 10px; font-size: 13px; }
.btn-block { width: 100%; }
.icon-btn { border: 0; background: transparent; font-size: 22px; line-height: 1; width: 34px; height: 34px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-muted); }
.icon-btn:hover { background: var(--surface-alt); color: var(--text); }

.input {
  width: 100%; min-height: 36px; padding: 7px 10px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text); font: inherit;
}
.input:focus { border-color: var(--accent); box-shadow: var(--focus); outline: none; }
.input[aria-invalid="true"] { border-color: var(--ko); }
textarea.input { resize: vertical; }
.field { display: flex; flex-direction: column; gap: var(--space-1); }
.field-label { font-size: 13px; font-weight: 600; color: var(--text); }
.field-error { margin: 2px 0 0; color: var(--ko); font-size: 12px; }
.required { color: var(--ko); }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: var(--space-3) var(--space-4); }
.form-field { display: flex; flex-direction: column; gap: var(--space-1); }
.form-field-wide { grid-column: 1 / -1; }
.form-actions { display: flex; gap: var(--space-2); justify-content: flex-end; margin-top: var(--space-3); }
.inline-form { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }
.inline-form .input { width: auto; min-width: 180px; }
.import-form { display: flex; flex-direction: column; gap: var(--space-1); margin: var(--space-3) 0; }
.import-card { display: flex; flex-direction: column; gap: var(--space-2); }
.import-card > p { margin: 0; }
.import-status:empty { display: none; }

/* multiselect (inline disclosure) */
.multiselect { display: flex; flex-direction: column; gap: var(--space-1); }
.ms-toggle { display: flex; align-items: center; gap: var(--space-2); text-align: left; cursor: pointer; }
.ms-summary { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.multiselect:not(.has-value) .ms-summary { color: var(--text-muted); }
.ms-count:not(:empty) { background: var(--accent); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 7px; font-weight: 700; }
.ms-caret { color: var(--text-muted); transition: transform .15s; }
.multiselect.open .ms-caret { transform: rotate(180deg); }
.ms-panel { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-2); background: var(--surface-alt); max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.ms-option { display: flex; align-items: center; gap: var(--space-2); padding: 4px 6px; border-radius: 4px; cursor: pointer; }
.ms-option:hover { background: var(--accent-soft); }
.ms-option input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.ms-clear { align-self: flex-start; margin-top: var(--space-1); }

/* ------------------------------------------------------------------ tables */
.table-scroll { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th, .table td { padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; white-space: nowrap; max-width: 360px; overflow: hidden; text-overflow: ellipsis; }
.table th { background: var(--surface-alt); font-weight: 600; color: var(--text-muted); position: sticky; top: 0; z-index: 1; }
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr:hover td { background: #fafcfe; }
.table-compact th, .table-compact td { padding: 6px 10px; }
.th-sort { border: 0; background: none; font: inherit; font-weight: 600; color: inherit; cursor: pointer; padding: 0; display: inline-flex; align-items: center; gap: 2px; }
.th-sort:hover { color: var(--text); }
.th-editable { color: var(--accent-strong); }
.sort-ind { font-size: 10px; }

.etable { display: flex; flex-direction: column; gap: var(--space-3); }
.etable-toolbar { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; justify-content: space-between; }
.etable-tools { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.etable-right { display: flex; gap: var(--space-3); align-items: center; }
.etable-search { width: 240px; }
.etable-count { white-space: nowrap; font-size: 12px; }
.etable-dirtybar { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); background: var(--warn-bg); border: 1px solid #f3d8a0; border-radius: var(--radius-sm); color: var(--warn); font-weight: 600; position: sticky; top: 0; z-index: 3; }
.etable-pager { display: flex; gap: var(--space-3); align-items: center; justify-content: flex-end; }
.etable-empty td { text-align: center; color: var(--text-muted); padding: var(--space-5); }
.row-clickable { cursor: pointer; }
.row-clickable:focus-visible td { background: var(--accent-soft); }
.cell-editable { cursor: text; position: relative; }
.cell-editable:hover { background: var(--accent-soft) !important; box-shadow: inset 0 0 0 1px #b9dcef; }
.cell-dirty { background: #fff3cd !important; box-shadow: inset 3px 0 0 #f39c12; }
.cell-editing { padding: 2px 4px !important; overflow: visible !important; }
.cell-editor { min-height: 30px; padding: 4px 6px; min-width: 120px; }

/* ------------------------------------------------------------------ tabs */
.tabs { display: flex; flex-direction: column; gap: var(--space-4); }
.tablist { display: flex; gap: var(--space-1); border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab { border: 0; background: none; font: inherit; font-weight: 600; color: var(--text-muted); padding: 10px 14px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent-strong); border-bottom-color: var(--accent); }
.tabpanel { outline: none; display: flex; flex-direction: column; gap: var(--space-4); }

/* ------------------------------------------------------------------ overlays */
.modal-overlay, .drawer-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); z-index: 100; }
.modal-overlay { display: flex; align-items: flex-start; justify-content: center; padding: 8vh var(--space-4) var(--space-4); overflow-y: auto; }
.modal { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-lg); width: 100%; max-width: 520px; display: flex; flex-direction: column; max-height: 84vh; }
.modal-wide { max-width: 820px; }
.modal-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border); }
.modal-title { font-size: 17px; font-weight: 650; }
.modal-body { padding: var(--space-4) var(--space-5); overflow-y: auto; }
.modal-footer { display: flex; justify-content: flex-end; gap: var(--space-2); padding: var(--space-3) var(--space-5); border-top: 1px solid var(--border); background: var(--surface-alt); border-radius: 0 0 var(--radius) var(--radius); }
.confirm-message { margin: 0; }

.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .2s ease-out; }
.drawer.open { transform: none; }
.drawer-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border); }
.drawer-title { font-size: 17px; font-weight: 650; overflow-wrap: anywhere; }
.drawer-body { padding: var(--space-4) var(--space-5); overflow-y: auto; flex: 1 1 auto; display: flex; flex-direction: column; gap: var(--space-4); }

/* ------------------------------------------------------------------ toasts + spinner */
.toast-root { position: fixed; right: var(--space-4); bottom: var(--space-4); z-index: 200; display: flex; flex-direction: column; gap: var(--space-2); max-width: min(420px, calc(100vw - 32px)); }
.toast { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-radius: var(--radius-sm); background: #1f2933; color: #fff; box-shadow: var(--shadow-lg); animation: toast-in .2s ease-out; }
.toast-success { background: #176b3a; }
.toast-error { background: #a93226; }
.toast-info { background: #1f2933; }
.toast-msg { flex: 1 1 auto; overflow-wrap: anywhere; }
.toast-close { border: 0; background: transparent; color: inherit; font-size: 18px; line-height: 1; cursor: pointer; opacity: .8; }
.toast-close:hover { opacity: 1; }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ------------------------------------------------------------------ configuration screen */
.page-config { max-width: 640px; padding-top: 8vh; }
.config-card { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-6); }
.config-form { display: flex; flex-direction: column; gap: var(--space-2); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
