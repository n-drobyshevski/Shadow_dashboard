<style>
/* Shadow IT stylesheet: design tokens, layout, sections, tables, buttons, overlays and responsive rules.
   Design rules are in docs/DESIGN.md, component classes and UI.* builders in docs/API.md. */
:root {
  color-scheme: light;
  --ink: #16181b;
  --ink-2: #4a4f57;
  --ink-3: #6b7079;          /* darker than DESIGN.md #7c828b to reach 4.5:1 on both papers */
  --rule: #e3e4e6;
  --rule-2: #c9cbcf;
  --paper: #ffffff;
  --paper-2: #f6f6f4;
  --accent: #0b63ce;
  --ok: #1f7a4d;
  --ok-bg: #e8f3ec;
  --ko: #b42318;
  --ko-bg: #fbeceb;
  --warn: #a15c07;
  --risk-critique: #b42318;
  --risk-eleve: #d4621b;
  --risk-moyen: #c99a06;
  --risk-faible: #1f7a4d;
  /* Interaction tokens */
  --row-hover: var(--paper-2);
  --selection: #d6e4f7;
  --on-ink: #ffffff;
  --ink-hover: #000000;
  --radius: 3px;
  --radius-overlay: 6px;
  --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --shadow-overlay: 0 12px 32px rgba(0, 0, 0, .18);
  --backdrop: rgba(22, 24, 27, .35);
  --sidebar-w: 232px;
  --rail-w: 56px;
  --skel: #eeeeec;
  --skel-hi: #f8f8f6;
  --appbar-h: 48px;
  --sticky-top: var(--appbar-h);   /* the top bar is added under 900px */
  --row-h: 32px;
  --control-h: 32px;
  --control-h-sm: 28px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
}

/* Base */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); }
body {
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body.has-overlay { overflow: hidden; }
h1, h2, h3, h4 { margin: 0; font-weight: 500; line-height: 1.3; }
p { margin: 0; }
a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
/* External links get their arrow here; FE0E forces the text glyph, not the emoji. */
a[target="_blank"]::after { content: '\2009\2197\FE0E'; color: var(--ink-3); font-size: 12px; text-decoration: none; display: inline-block; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
[hidden] { display: none !important; }
::selection { background: var(--selection); color: var(--ink); }

* { scrollbar-width: thin; scrollbar-color: var(--rule-2) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--rule-2); border-radius: 0; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }

.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 12px; }
.mono, code, kbd { font-family: var(--font-mono); }
.tabular { font-variant-numeric: tabular-nums; }
.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.spacer { flex: 1 1 auto; }
.nnbsp { font-family: var(--font-sans); }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.label, .section-title, .subsection-title, .section-head > h3, .drawer-section > h3,
.metric-title, .page-kicker, .table thead th, .kv dt, .form-section-label {
  font-family: var(--font-sans); font-size: 12px; font-weight: 500; line-height: 1.3; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-2); font-variant-numeric: tabular-nums;
}

/* Layout */
.app {
  display: flex; min-height: 100vh;
  /* Painted on the container too, so the sidebar background reaches the bottom of any page. */
  background: linear-gradient(to right, var(--paper-2) 0, var(--paper-2) calc(var(--sidebar-w) - 1px),
    var(--rule) calc(var(--sidebar-w) - 1px), var(--rule) var(--sidebar-w), var(--paper) var(--sidebar-w));
}
.topbar { display: none; }
.sidebar {
  width: var(--sidebar-w); flex: 0 0 var(--sidebar-w);
  background: var(--paper-2);
  border-right: 1px solid var(--rule);
  position: sticky; top: 0; align-self: flex-start;
  height: 100vh; overflow-y: auto; overscroll-behavior: contain;
}
.sidebar-inner { display: flex; flex-direction: column; gap: var(--s5); padding: var(--s5) var(--s4) var(--s4) var(--s4); min-height: 100%; }
.workspace { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.main { flex: 1 1 auto; min-width: 0; padding: var(--s6) var(--s7) var(--s7); outline: none; background: var(--paper); }
html { scroll-padding-top: var(--sticky-top); }
.page { max-width: 1180px; display: flex; flex-direction: column; gap: var(--s6); }

/* Startup splash */
.splash {
  position: fixed; inset: 0; z-index: 300; background: var(--paper);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s5);
  padding: var(--s5) max(var(--s4), env(safe-area-inset-right, 0px)) var(--s7) max(var(--s4), env(safe-area-inset-left, 0px));
  transition: opacity .2s ease;
}
.splash.is-done { opacity: 0; pointer-events: none; }
.team-logo { display: flex; align-items: center; gap: 14px; color: var(--ink); }
.team-mark { flex: 0 0 auto; width: 52px; height: 52px; }
.team-mark .arc { fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; }
.team-mark .solid { fill: currentColor; }
.team-mark .halo { fill: var(--paper); }
.team-mark .cut { fill: none; stroke: var(--paper); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.team-logo-text { display: flex; flex-direction: column; margin: 0; font-family: "Inter", var(--font-sans); line-height: 1.12; color: var(--ink); }
.team-logo-text span { font-size: 16px; font-weight: 400; }
.team-logo-text b { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.splash-track { width: 168px; height: 2px; background: var(--rule); position: relative; overflow: hidden; }
.splash-track::after, .appbar-progress::after {
  content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; background: var(--ink);
  animation: indeterminate 1.4s cubic-bezier(.45, .05, .55, .95) infinite;
}
@keyframes indeterminate { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.splash-status { min-height: 20px; margin: calc(-1 * var(--s2)) 0 0; font-size: 13px; color: var(--ink-2); text-align: center; }
.splash-note { max-width: 40ch; margin: 0; font-size: 13px; color: var(--ink-2); text-align: center; text-wrap: balance; }
.splash-error { display: flex; flex-direction: column; align-items: center; gap: var(--s3); max-width: 48ch; text-align: left; }
.splash.is-failed .splash-track, .splash.is-failed .splash-status, .splash.is-failed .splash-note { display: none; }
.splash-foot {
  position: absolute; left: 0; right: 0; bottom: max(var(--s4), env(safe-area-inset-bottom, 0px)); margin: 0;
  display: flex; justify-content: center; align-items: center; gap: 6px;
  font-family: var(--font-mono); font-weight: 500; font-size: 12px; color: var(--ink-3); word-spacing: -.3em;
}
.splash-foot .brand-logo { width: 16px; height: 16px; color: var(--ink-3); stroke-width: 2; }

/* A mono space is a full cell wide, so the wordmark tightens it. */
.brand { display: flex; align-items: center; gap: 10px; padding: 0 var(--s2); }
.brand-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand-name { font-family: var(--font-mono); font-weight: 500; font-size: 16px; letter-spacing: -.01em; word-spacing: -.3em; color: var(--ink); }
.brand-sub { font-size: 12px; color: var(--ink-3); }
.brand-logo { display: block; flex: 0 0 auto; width: 28px; height: 28px; color: var(--ink); fill: none; stroke: currentColor;
  stroke-width: 1.75; stroke-linejoin: round; stroke-linecap: round; }
.brand-logo .icon-fill { fill: currentColor; stroke: none; }

/* Nav focus ring is inset because the sidebar clips overflow. */
.nav-list { list-style: none; margin: 0 calc(-1 * var(--s4)); padding: 0; display: flex; flex-direction: column; }
.nav-link {
  width: 100%; min-height: 32px;
  display: flex; align-items: center; gap: var(--s3);
  padding: 5px var(--s4) 5px calc(var(--s4) + var(--s2));
  border: 0; border-radius: 0; background: transparent; color: var(--ink-2);
  font: inherit; font-size: 14px; text-align: left; cursor: pointer;
  box-shadow: inset 0 0 0 transparent;
}
.nav-link:hover { color: var(--ink); background: var(--row-hover); }
.nav-link:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; color: var(--ink); }
.nav-link.active { color: var(--ink); font-weight: 500; box-shadow: inset 2px 0 0 var(--ink); }
.nav-label { flex: 1 1 auto; }
.nav-count { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); font-weight: 400; }
.icon { display: block; width: 16px; height: 16px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.5;
  stroke-linecap: square; stroke-linejoin: miter; }
.icon .icon-fill { fill: currentColor; stroke: none; }
.nav-glyph { display: inline-flex; flex: 0 0 auto; color: var(--ink-3); }
.nav-link:hover .nav-glyph, .nav-link.active .nav-glyph { color: var(--ink); }
.nav-collapse {
  display: flex; align-items: center; gap: var(--s3); width: calc(100% + 2 * var(--s4)); min-height: 32px;
  margin: calc(-1 * var(--s3)) calc(-1 * var(--s4)) 0; padding: 0 var(--s4) 0 calc(var(--s4) + var(--s2));
  border: 0; border-radius: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 13px; text-align: left; cursor: pointer;
}
.nav-collapse:hover { color: var(--ink); background: var(--row-hover); }
.nav-collapse:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.nav-collapse-glyph { display: inline-flex; }

.sidebar-footer {
  margin-top: auto; display: flex; flex-direction: column; align-items: flex-start; gap: 0;
  padding: var(--s2) var(--s2) 0; border-top: 1px solid var(--rule); font-size: 13px;
}
.side-link, .sidebar-footer .btn-link, .sidebar-footer .btn-quiet {
  display: inline-flex; align-items: center; min-height: 28px; padding: 0;
  color: var(--ink-2); font-size: 13px; font-weight: 400; text-decoration: none;
}
.side-link:hover, .sidebar-footer .btn-link:hover, .sidebar-footer .btn-quiet:hover { color: var(--accent); text-decoration: underline; }

.side-user { display: flex; flex-direction: column; gap: 2px; margin: var(--s2) 0 0; padding-top: var(--s2); border-top: 1px solid var(--rule); width: 100%; }
.side-user-email { font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
.side-user-role { font-size: 12px; color: var(--ink-3); }
/* An admin's role label doubles as the switch to the lecteur preview. */
.side-user-switch {
  align-self: flex-start; min-height: 24px; padding: 0; border: 0; background: none; font: inherit; font-size: 12px;
  text-align: left; cursor: pointer;
}
.side-user-switch:hover { color: var(--accent); text-decoration: underline; }
.side-user-switch.is-preview { color: var(--accent); font-weight: 600; }
.reader-view-exit { flex: 0 0 auto; }
.appbar-count[hidden] + .reader-view-exit { margin-left: auto; }

body.unconfigured .sidebar, body.unconfigured .appbar { display: none !important; }
body.unconfigured .app { background: var(--paper); }
body.unconfigured .topbar-toggle { visibility: hidden; }
body.unconfigured { --sticky-top: 0px; }

/* Collapsed rail: icons only, labels kept for screen readers. */
.sidebar { transition: width .15s ease, flex-basis .15s ease; }
@media (min-width: 901px) {
  body.nav-collapsed { --sidebar-w: var(--rail-w); }
  body.nav-collapsed .sidebar { overflow-x: hidden; }
  body.nav-collapsed .sidebar-inner { padding-left: var(--s2); padding-right: var(--s2); }
  body.nav-collapsed .brand { padding: 0; justify-content: center; }
  body.nav-collapsed .brand-text { display: none; }
  body.nav-collapsed .nav-list { margin: 0 calc(-1 * var(--s2)); }
  body.nav-collapsed .nav-link { justify-content: center; padding: 8px 0; }
  body.nav-collapsed .nav-label {
    position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  body.nav-collapsed .nav-count, body.nav-collapsed .sidebar-footer > * { display: none; }
  body.nav-collapsed .sidebar-footer { padding: 0; align-items: center; }
  body.nav-collapsed .sidebar-footer > .sync-chip { display: inline-flex; width: auto; margin: var(--s2) 0; }
  body.nav-collapsed .sidebar .sync-chip::before, body.nav-collapsed .sidebar .sync-chip-text { display: none; }
  body.nav-collapsed .nav-collapse { width: calc(100% + 2 * var(--s2)); margin-inline: calc(-1 * var(--s2)); padding: 0; justify-content: center; }
  body.nav-collapsed .nav-collapse-label { display: none; }
}

/* App bar */
.appbar-progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; pointer-events: none; display: none; }
.workspace:has(#main[aria-busy="true"], #main [aria-busy="true"]:not(button)) .appbar-progress { display: block; }
/* On a month change the previous month stays readable, dimmed, until the new one loads. */
.page.is-stale, .appbar-filters.is-stale { opacity: .45; pointer-events: none; transition: opacity .15s ease; }
.appbar {
  position: sticky; top: 0; z-index: 20; container: appbar / inline-size;
  display: flex; align-items: center; flex-wrap: nowrap; gap: var(--s2) var(--s4);
  min-height: var(--appbar-h); padding: var(--s2) var(--s7);
  background: var(--paper); border-bottom: 1px solid var(--rule);
}
.appbar:empty { display: none; }
.appbar-group { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
.appbar-label, .appbar .dd-label {
  margin: 0; white-space: nowrap; font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3);
}
.appbar-sep { width: 1px; height: 20px; background: var(--rule); }
.appbar .dd { flex-direction: row; align-items: center; gap: var(--s2); }
.appbar .dd-trigger { width: auto; min-width: 120px; max-width: 240px; }
.appbar-filters .dd { flex: 0 1 auto; min-width: 0; }
.appbar-filters .dd-trigger { min-width: 100px; }
.appbar-period { flex: 0 0 auto; }
.appbar .dd-multiple:not(.is-placeholder):not(.is-disabled) .dd-trigger { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.appbar .is-disabled .dd-trigger { border-style: dashed; cursor: not-allowed; }
.appbar-filters { display: flex; align-items: center; flex-wrap: nowrap; gap: var(--s2) var(--s4); min-width: 0; }
.appbar-filters #filters-reset { flex: 0 0 auto; }
.filters-anchor { display: contents; }
.filters-summary { display: none; flex: 0 1 auto; min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; font-size: 13px; color: var(--ink-2); }
.appbar-count { flex: 0 0 auto; margin: 0 0 0 auto; font-size: 13px; color: var(--ink-3); white-space: nowrap; }
/* Too narrow for the filters in the row: they fold into a panel under the Filtres button. */
@container appbar (max-width: 860px) {
  .appbar .filters-toggle { display: inline-flex !important; }
  .filters-anchor { display: block; position: relative; flex: 0 0 auto; }
  .appbar-filters {
    display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 30;
    width: min(320px, calc(100vw - 2 * var(--s4))); flex-direction: column; align-items: stretch; gap: var(--s3);
    padding: var(--s4); background: var(--paper); border: 1px solid var(--rule-2); border-radius: var(--radius-overlay);
    box-shadow: var(--shadow-overlay);
  }
  body.filters-open .appbar-filters { display: flex; }
  .appbar-filters .dd { flex-direction: column; align-items: stretch; gap: var(--s1); }
  .appbar-filters .dd-trigger { width: 100%; max-width: none; }
  .appbar-filters #filters-reset { align-self: flex-start; }
  .filters-summary:not(:empty) { display: block; }
}
.period-stepper { display: flex; align-items: stretch; }
.metric-delta { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.metric-delta.is-ok { color: var(--ok); }
.metric-delta.is-ko { color: var(--ko); }
.sparkline { display: block; width: 100%; max-width: 160px; height: 20px; margin-top: var(--s1); overflow: visible; }
.sparkline polyline { fill: none; stroke: var(--ink-2); stroke-width: 1.25; }
.sparkline circle { fill: var(--ink); }
.evo { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
.evo-up { color: var(--ok); }
.evo-down { color: var(--ko); }
.evo-new { font-family: var(--font-sans); font-weight: 500; color: var(--ink); }
.evo-removed { margin: var(--s2) 0 0; }
.period-button {
  display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; height: var(--control-h);
  padding: 0 var(--s2); border: 1px solid var(--rule-2); background: var(--paper); color: var(--ink);
  font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; white-space: nowrap; cursor: pointer;
}
.period-button:hover:not(:disabled) { border-color: var(--ink-3); }
.period-button[aria-expanded="true"] { border-color: var(--ink-2); }
.period-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.period-button:disabled { background: var(--paper-2); color: var(--ink-3); cursor: not-allowed; }
.period-popover { width: 400px; }
.period-panel { display: grid; grid-template-columns: 148px minmax(0, 1fr); font-size: 13px; }
.period-presets { display: flex; flex-direction: column; padding: var(--s2) 0; border-right: 1px solid var(--rule); }
.period-preset {
  text-align: left; padding: 6px var(--s3); border: 0; background: none; color: var(--ink-2); font: inherit; cursor: pointer;
}
.period-preset:hover { background: var(--row-hover); color: var(--ink); }
.period-preset[aria-pressed="true"] { color: var(--ink); font-weight: 500; box-shadow: inset 2px 0 0 var(--ink); background: var(--row-hover); }
.period-cal { display: flex; flex-direction: column; gap: var(--s2); padding: var(--s3); min-width: 0; }
.period-year { display: flex; align-items: center; justify-content: space-between; }
.period-year-label { font-family: var(--font-mono); color: var(--ink-2); }
.period-year-step { width: 28px; height: 28px; border: 0; background: none; color: var(--ink-2); font-family: var(--font-mono); font-size: 14px; cursor: pointer; }
.period-year-step:disabled { color: var(--rule-2); cursor: default; }
.period-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px 0; }
.period-month { height: 30px; border: 0; background: none; color: var(--ink); font: inherit; cursor: pointer; }
.period-month:hover:not(:disabled) { background: var(--row-hover); }
.period-month:disabled { color: var(--rule-2); cursor: default; }
.period-month.is-in { background: var(--row-hover); }
.period-month.is-edge, .period-month.is-edge:hover:not(:disabled) { background: var(--ink); color: var(--on-ink); font-weight: 500; }
.period-hint { margin: 0; font-size: 12px; color: var(--ink-3); }
.period-foot {
  grid-column: 1 / -1; display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s3);
  border-top: 1px solid var(--rule);
}
.period-summary { flex: 1 1 auto; min-width: 0; color: var(--ink-2); font-size: 12px; }
@media (max-width: 480px) {
  .period-popover { width: calc(100vw - 16px); }
  .period-panel { grid-template-columns: minmax(0, 1fr); }
  .period-presets { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--rule); padding: var(--s2); gap: var(--s1); }
  .period-preset { padding: 4px var(--s2); }
}
.period-step {
  width: 24px; height: var(--control-h); padding: 0; border: 1px solid var(--rule-2); background: var(--paper);
  color: var(--ink-2); font-family: var(--font-mono); font-size: 14px; cursor: pointer;
}
.period-step:first-child { border-radius: var(--radius) 0 0 var(--radius); border-right: 0; }
.period-step:last-child { border-radius: 0 var(--radius) var(--radius) 0; border-left: 0; }
.period-step:hover:not(:disabled) { color: var(--ink); background: var(--row-hover); }
.period-step:disabled { color: var(--rule-2); cursor: not-allowed; }
/* Sync status */
.sync-chip {
  display: inline-flex; align-items: center; gap: var(--s2); height: 28px; padding: 0 var(--s2);
  border: 1px solid var(--rule-2); border-radius: var(--radius); background: var(--paper); color: var(--ink-2);
  font-family: var(--font-mono); font-size: 12px; white-space: nowrap; cursor: pointer;
}
.sidebar .sync-chip { width: 100%; margin-bottom: var(--s2); }
.sidebar .sync-chip-mark { order: -1; }
.sidebar .sync-chip[data-tone="ok"]::before, .sidebar .sync-chip[data-tone="warn"]::before {
  content: 'Synchronisé'; font-family: var(--font-sans); }
.sidebar .sync-chip[data-tone="ok"] .sync-chip-text, .sidebar .sync-chip[data-tone="warn"] .sync-chip-text { margin-left: auto; }
.topbar .sync-chip { margin-left: auto; }
body.unconfigured .sync-chip { display: none; }
.sync-chip:hover, .sync-chip[aria-expanded="true"] { color: var(--ink); border-color: var(--ink-3); background: var(--row-hover); }
.sync-chip-mark { width: 7px; height: 7px; flex: 0 0 auto; background: var(--ok); display: inline-flex; align-items: center; justify-content: center; }
.sync-chip[data-tone="ko"] { color: var(--ko); border-color: var(--ko); }
.sync-chip[data-tone="ko"] .sync-chip-mark { background: var(--ko); }
.sync-chip[data-tone="warn"] .sync-chip-mark { background: var(--warn); }
.sync-chip[data-tone="new"] { color: var(--ink); border-color: var(--ink); font-family: var(--font-sans); font-weight: 500; }
.sync-chip[data-tone="new"] .sync-chip-mark { background: var(--ink); }
.sync-chip[data-tone="off"] { font-family: var(--font-sans); }
.sync-chip[data-tone="off"] .sync-chip-mark { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.sync-chip[data-tone="busy"] { font-family: var(--font-sans); }
.sync-chip[data-tone="busy"] .sync-chip-mark { width: 12px; height: 12px; background: transparent; }
.sync-popover { width: 340px; }
.sync-panel { display: flex; flex-direction: column; gap: var(--s3); padding: var(--s4); }
.sync-panel p { margin: 0; }
.sync-panel-status { font-weight: 500; color: var(--ink); }
.sync-panel .alert { font-size: 13px; }
.sync-panel-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); padding-top: var(--s1); }
.filters-toggle { display: none !important; }
.filters-toggle[aria-expanded="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.filters-toggle[aria-expanded="true"] .filters-toggle-count { background: var(--on-ink); color: var(--ink); }
.filters-toggle-count:not(:empty) {
  margin-left: var(--s1); padding: 0 5px; border-radius: 2px; background: var(--ink); color: var(--on-ink);
  font-family: var(--font-mono); font-size: 12px; line-height: 18px;
}

/* Page header */
.page-header {
  display: flex; flex-direction: column; gap: 6px;
  padding-bottom: var(--s3); border-bottom: 1px solid var(--ink);
  position: relative;
}
.page-kicker { order: -1; color: var(--ink-3); margin: 0; }
.page-kicker .mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: .02em; }
.page-title { font-size: 20px; font-weight: 600; letter-spacing: -.005em; color: var(--ink); }
.page-header-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s4); flex-wrap: wrap; min-height: 32px; }
.page-header-actions { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.page-lede { color: var(--ink-2); max-width: 64ch; }
.lede { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.lede > p { margin: 0; }
.more-summary {
  display: inline-flex; align-items: center; gap: var(--s1); min-height: 24px; cursor: pointer; list-style: none;
  font-size: 12px; color: var(--ink-3); user-select: none;
}
.more-summary::-webkit-details-marker { display: none; }
.more-summary::before { content: '+'; width: 10px; font-family: var(--font-mono); }
details.more[open] > .more-summary::before { content: '−'; }
.more-summary:hover { color: var(--ink); }
.more-summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.more-body { max-width: 64ch; padding: 2px 0 var(--s1) calc(10px + var(--s1)); font-size: 13px; color: var(--ink-2); }
.more-body > p { margin: 0; }
.more-body > p + p { margin-top: var(--s1); }
.lede-small .more-body { font-size: 12px; color: var(--ink-3); }

/* Sections */
.section, .card, .chart-card, .drawer-section, .diff-group, .diff-section {
  display: flex; flex-direction: column; gap: var(--s3); min-width: 0;
  background: none; border: 0; border-radius: 0; box-shadow: none;
  border-top: 1px solid var(--rule); padding: var(--s2) 0 0;
}
.card, .chart-card { gap: var(--s2); }
.section-title { display: block; margin: 0; padding: 0; border: 0; }
.subsection-title { display: block; color: var(--ink-3); margin: var(--s2) 0 0; padding: 0; border: 0; }
.section > .subsection-title:first-child { margin-top: 0; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: 20px; padding: 0; border: 0; }
.section-head > h3 { margin: 0; }
.section .card, .section .chart-card, .diff-group .diff-section { border-top: 0; padding-top: 0; }
.diff-group .diff-section > .section-title { color: var(--ink-3); }
.diff-group { gap: var(--s5); }
.drawer-section { gap: var(--s2); }

.chart-box { width: 100%; min-height: 120px; position: relative; }
.chart-box.chart-gauge { max-width: 272px; }
.gauge-ends { position: absolute; inset: 0; pointer-events: none; }
.gauge-end { position: absolute; transform: translateX(-50%); font-family: var(--font-mono); font-size: 10px;
  line-height: 12px; color: var(--ink-3); }
.gauge-end.gauge-tick { transform: none; color: var(--ink-2); }
.chart-caption { font-size: 12px; color: var(--ink-2); }
.chart-caption .num, .chart-caption .mono, .chart-caption .mark { font-size: 12px; }
.threshold-caption .mark { font-weight: 500; }
.threshold-caption .tc-item .mark { margin-left: 3px; }
.threshold-caption .tc-item { white-space: nowrap; }
.threshold-caption .series { color: var(--ink); font-weight: 500; }
.threshold-caption .num { color: var(--ink); }

.grid { display: grid; gap: var(--s5); }
.grid-2 { gap: 0; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-2 > * { padding-right: var(--s5); min-width: 0; }
.grid-2 > :nth-child(2n) {
  padding-left: var(--s5); box-shadow: inset 1px 0 0 var(--rule);
}
.grid-2 > :nth-child(2n) { padding-right: 0; }
.dashboard-body { display: flex; flex-direction: column; gap: var(--s6); }
.block-stack { display: flex; flex-direction: column; gap: var(--s6); }

@media (max-width: 1100px) {
  .grid-2 { grid-template-columns: minmax(0, 1fr); row-gap: var(--s5); }
  .grid-2 > * { padding: 0 !important; box-shadow: none !important; }
  .grid-2 > .card, .grid-2 > .chart-card { padding-top: var(--s2) !important; }
  .section .grid-2 > .card { padding-top: 0 !important; }
}

/* KPI strip */
.kpi-strip, .grid:has(> .metric-card) {
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 0;
  border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
}
.kpi, .metric-card {
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
  padding: var(--s3) var(--s5) var(--s4); border: 0; border-radius: 0; box-shadow: none; background: none;
}
.kpi + .kpi, .metric-card + .metric-card { box-shadow: inset 1px 0 0 var(--rule); }
/* The page header's ink rule already sits above the first block. */
.page-header + * > .kpi-strip:first-child, .page-header + .kpi-strip { border-top: 0; }
/* The strip's bottom rule doubles as the next block's top rule. */
.kpi-strip + .section, .kpi-strip + .card, .kpi-strip + .chart-card, .kpi-strip + .grid { margin-top: calc(-1 * var(--s6)); }
.kpi-strip + .section, .kpi-strip + .card, .kpi-strip + .chart-card,
.kpi-strip + .grid > :is(.card, .chart-card, .section):nth-child(-n+2) { border-top: 0; }
@media (max-width: 1100px) {
  .kpi-strip + .grid > :is(.card, .chart-card, .section):nth-child(2) { border-top: 1px solid var(--rule); }
}
.kpi-strip > :first-child, .grid > .metric-card:first-child { padding-left: 0; }
.metric-title { color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metric-value {
  font-family: var(--font-mono); font-size: 32px; font-weight: 400; line-height: 1.15; letter-spacing: -.02em;
  color: var(--ink); font-variant-numeric: tabular-nums; margin-top: var(--s1);
}
.metric-sub { font-family: var(--font-mono); font-size: 13px; color: var(--ink-2); }
.tone-ok .metric-sub { color: var(--ok); }
.tone-ko .metric-sub { color: var(--ko); }
.tone-warn .metric-sub { color: var(--warn); }
@media (max-width: 700px) {
  .kpi-strip, .grid:has(> .metric-card) { grid-auto-flow: row; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi, .metric-card { padding: var(--s3) var(--s3) var(--s3) var(--s4); }
  .kpi:nth-child(odd), .metric-card:nth-child(odd) { padding-left: 0; box-shadow: none; }
  .kpi:nth-child(even), .metric-card:nth-child(even) { box-shadow: inset 1px 0 0 var(--rule); }
  .kpi:nth-child(n+3), .metric-card:nth-child(n+3) { border-top: 1px solid var(--rule); }
  .metric-title { white-space: normal; }
}

/* Status marks */
.badge, .mark {
  display: inline-flex; align-items: baseline; gap: 6px;
  padding: 0; border: 0; border-radius: 0; background: none;
  font-size: 13px; font-weight: 500; line-height: 20px; white-space: nowrap; color: var(--ink-2);
}
.badge::before, .mark::before {
  content: ''; flex: 0 0 auto; width: 6px; height: 6px; background: currentColor;
  transform: translateY(-1px); align-self: center;
}
.badge-ok, .mark-ok { color: var(--ok); }
.badge-ko, .mark-ko { color: var(--ko); }
.badge-warn, .mark-warn { color: var(--warn); }
.badge-info, .mark-info { color: var(--ink-2); }
.badge-muted, .mark-muted { color: var(--ink-3); font-weight: 400; }
.badge-neutral, .mark-neutral { color: var(--ink-2); font-weight: 400; }
.badge-neutral::before, .mark-neutral::before { background: none; box-shadow: inset 0 0 0 1px var(--ink-3); }
.badge-todo, .mark-todo { color: var(--ink); font-weight: 400; }
.badge-todo::before, .mark-todo::before { background: none; box-shadow: inset 0 0 0 1px var(--ink); }
/* Risk text stays ink: yellow and orange text would fail contrast. */
.badge-risk, .mark-risk { color: var(--ink); font-weight: 400; }
.badge-risk::before, .mark-risk::before { background: var(--risk-color, var(--ink-3)); }
.risk-critique { --risk-color: var(--risk-critique); }
.risk-eleve { --risk-color: var(--risk-eleve); }
.risk-moyen { --risk-color: var(--risk-moyen); }
.risk-faible { --risk-color: var(--risk-faible); }
.badge-score { font-family: var(--font-mono); font-weight: 400; font-size: 13px; }
.badge-score::before { display: none; }
.badge-score.badge-neutral { color: var(--ink-3); }
.mark-priority { color: var(--ink); font-weight: 400; }
.priority-haute { color: var(--ink); font-weight: 500; }
.priority-haute::before { background: var(--ink); box-shadow: none; }
.priority-moyenne { color: var(--ink); font-weight: 400; }
.priority-moyenne::before {
  background: linear-gradient(to top, var(--ink-2) 50%, transparent 50%); box-shadow: inset 0 0 0 1px var(--ink-2); }
.priority-basse { color: var(--ink-2); font-weight: 400; }
.priority-basse::before { background: none; box-shadow: inset 0 0 0 1px var(--ink-3); }

/* Alerts, notes, empty states */
.alert {
  padding: 0; border: 0; border-radius: 0; background: none; color: var(--ink-2); font-size: 14px;
  --tone: var(--ink-3);
}
.alert p { margin: 0; }
.alert strong { font-weight: 500; color: var(--ink); }
.alert:not(:has(> p))::before, .alert > p:first-child::before, .filter-note::before {
  content: ''; display: inline-block; width: 6px; height: 6px; margin-right: var(--s2);
  background: var(--tone, var(--ink-3)); vertical-align: middle; transform: translateY(-1px);
}
.alert-info { --tone: var(--ink-3); }
.alert-success { --tone: var(--ok); }
.alert-warning { --tone: var(--warn); }
.alert-warning > strong:first-child { color: var(--warn); }
.alert-error { --tone: var(--ko); color: var(--ko); }
.warning-list { margin: var(--s1) 0 0; padding-left: var(--s4); color: var(--ink-2); font-size: 13px; }
.warning-list li::marker { color: var(--warn); }

.filter-note { font-size: 13px; color: var(--ink-2); padding: 0; border: 0; margin: 0; --tone: var(--ink); }

.empty-state { display: block; padding: var(--s2) 0; background: none; border: 0; color: var(--ink-2); font-size: 14px; }
.empty-state p { margin: 0; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: var(--control-h); padding: 0 var(--s3); border-radius: var(--radius); border: 1px solid transparent;
  font: inherit; font-size: 13px; font-weight: 500; line-height: 1; cursor: pointer; white-space: nowrap;
  background: none; color: var(--ink); text-decoration: none;
  transition: background-color .12s, border-color .12s, color .12s;
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.is-busy, .btn.is-busy:disabled { opacity: 1; cursor: progress; }
.btn-primary { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.btn-primary:hover:not(:disabled) { background: var(--ink-hover); border-color: var(--ink-hover); }
.btn-primary .spinner { border-color: color-mix(in srgb, var(--on-ink) 35%, transparent); border-top-color: var(--on-ink); }
.btn-secondary { background: var(--paper); border-color: var(--rule-2); color: var(--ink); }
.btn-secondary:hover:not(:disabled) { border-color: var(--ink-2); }
.btn-danger { background: var(--paper); border-color: currentColor; color: var(--ko); }
.btn-danger:hover:not(:disabled) { background: var(--ko); border-color: var(--ko); color: var(--on-ink); }
.btn-link, .btn-quiet {
  background: none; border: 0; padding: 0; min-height: var(--control-h); font-weight: 400;
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px;
}
.btn-link { color: var(--accent); }
.btn-quiet { color: var(--ink-2); text-decoration-color: var(--rule-2); }
.btn-link:hover:not(:disabled), .btn-quiet:hover:not(:disabled) { text-decoration-thickness: 2px; }
.btn-quiet:hover:not(:disabled) { color: var(--accent); text-decoration-color: currentColor; }
.btn-link.is-danger, .btn-quiet.is-danger, .btn-link.btn-delete, .btn-quiet.btn-delete { color: var(--ko); text-decoration-color: currentColor; }
.btn-link.is-danger:hover:not(:disabled), .btn-quiet.is-danger:hover:not(:disabled),
.btn-link.btn-delete:hover:not(:disabled), .btn-quiet.btn-delete:hover:not(:disabled) { color: var(--ko); }
.btn-sm, .btn-small { min-height: var(--control-h-sm); padding: 0 10px; font-size: 13px; }
.btn-link.btn-sm, .btn-link.btn-small, .btn-quiet.btn-sm, .btn-quiet.btn-small { padding: 0; font-size: 12px; }
.page-header-actions .btn { min-height: var(--control-h); font-size: 13px; }
.page-header-actions .btn:not(.btn-link):not(.btn-quiet) { padding: 0 var(--s3); }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; background: transparent; font: inherit; font-size: 20px; line-height: 1;
  width: 32px; height: 32px; border-radius: var(--radius); cursor: pointer; color: var(--ink-2);
}
.icon-btn:hover { background: var(--row-hover); color: var(--ink); }
.row-actions { display: inline-flex; flex-wrap: nowrap; align-items: center; gap: var(--s3); white-space: nowrap; }
.row-actions .btn-link, .row-actions .btn-quiet { min-height: var(--control-h); font-size: 13px; color: var(--ink-2);
  text-decoration-color: var(--rule-2); }
.row-actions .btn-link:hover:not(:disabled), .row-actions .btn-quiet:hover:not(:disabled) { color: var(--accent); text-decoration-color: currentColor; }
.row-actions .btn-delete, .row-actions .is-danger { color: var(--ko) !important; }
.table td:has(> .row-actions) { white-space: nowrap; overflow: visible; padding-top: 0; padding-bottom: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.toolbar .select-field, .etable-tools .select-field, .inline-form .select-field {
  flex-direction: row; align-items: center; gap: var(--s2); }
.toolbar .select-field .input, .etable-tools .select-field .input { width: auto; min-width: 120px; }

/* Inputs */
.input {
  width: 100%; min-height: var(--control-h); padding: 0 var(--s2);
  border: 1px solid var(--rule-2); border-radius: var(--radius);
  background-color: var(--paper); color: var(--ink); font: inherit; font-size: 13px; line-height: 30px;
}
textarea.input { line-height: 1.5; padding: 6px var(--s2); resize: vertical; min-height: 72px; }
.input.mono { font-family: var(--font-mono); }   /* .input's font: inherit would reset .mono */
.input::placeholder { color: var(--ink-3); }
.input:hover:not(:disabled) { border-color: var(--ink-3); }
.input:focus, .input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--rule-2); }
.input:disabled { background-color: var(--paper-2); color: var(--ink-3); cursor: not-allowed; }
/* On the --paper-2 sidebar a disabled control needs a lighter rule and ink-3 text to stand out. */
.appbar .dd-trigger:disabled { background-color: transparent; border-color: var(--rule-2); }
.is-disabled .dd-value, .multiselect.is-disabled .field-label, .dd.is-disabled .field-label {
  color: var(--ink-3) !important; }
.input[aria-invalid="true"] { border-color: var(--ko); }
.field { display: flex; flex-direction: column; gap: var(--s1); }
.field-label { font-size: 12px; font-weight: 500; color: var(--ink-2); }
.field-error { margin: 2px 0 0; color: var(--ko); font-size: 12px; }
.field-help { font-size: 12px; color: var(--ink-3); }
.required { color: var(--ko); }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: var(--s4) var(--s5); }
.form-field { display: flex; flex-direction: column; gap: var(--s1); min-width: 0; }
.form-field-wide { grid-column: 1 / -1; }
.form-actions { display: flex; gap: var(--s2); justify-content: flex-start; margin-top: var(--s2); }
.inline-form { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
.inline-form .input { width: auto; min-width: 180px; }
.inline-form .field, .inline-form label.select-field { flex-direction: row; align-items: center; gap: var(--s2); }

.multiselect { display: flex; flex-direction: column; gap: var(--s1); }

/* Tables */
.table-scroll { width: 100%; overflow-x: auto; border: 0; border-radius: 0; background: none; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th, .table td {
  height: var(--row-h); padding: 5px var(--s3); border-bottom: 1px solid var(--rule);
  text-align: left; vertical-align: middle; white-space: nowrap; max-width: 360px; overflow: hidden; text-overflow: ellipsis;
}
.table th:first-child, .table td:first-child { padding-left: var(--s2); }
.table thead th {
  background: var(--paper-2); color: var(--ink-2); border-bottom: 1px solid var(--rule-2);
  position: sticky; top: 0; z-index: 1;
}
.table thead th *, .table thead th.mono, .table thead th .mono {
  font-family: var(--font-sans); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.table thead th:has(> .th-sort) { padding-top: 0; padding-bottom: 0; }
.table tbody th { font-weight: 400; color: var(--ink); }
.table td.num, .table th.num { text-align: right; }
.table td.mono, .table td .mono { font-family: var(--font-mono); font-size: 12px; }
.table td.is-wrap, .table th.is-wrap { white-space: normal; line-height: 1.35; overflow-wrap: anywhere; }
/* A <colgroup> with widths switches UI.table to a fixed layout. */
.ui-table.is-fixed { table-layout: fixed; }
.ui-table.is-fixed th, .ui-table.is-fixed td { max-width: none; }
.ui-table td:has(> .btn:only-child) { padding-top: 0; padding-bottom: 0; }
.table tbody tr { --cell-bg: var(--paper); }
.table tbody tr.row-clickable:hover { --cell-bg: var(--row-hover); }
.table tbody tr.row-clickable:hover > td, .table tbody tr.row-clickable:hover > th { background: var(--cell-bg); }
/* Sticky key column for wide editable tables. The fade is an ::after in the clip margin because outer
   box-shadows are not painted on cells of a collapsed-border table. */
.etable .table th:first-child, .etable .table td:first-child {
  position: sticky; left: 0; z-index: 2; max-width: 220px; background: var(--cell-bg, var(--paper));
  box-shadow: inset -1px 0 0 var(--rule); overflow: clip; overflow-clip-margin: 32px;
}
.etable .table th:first-child::after, .etable .table td:first-child::after {
  content: ''; position: absolute; top: 0; bottom: 0; left: 100%; width: 32px; pointer-events: none;
  background: linear-gradient(to right, var(--cell-bg, var(--paper)) 10px, transparent);
}
/* At scrollLeft 0 nothing is under the key column, so no fade masks column 2. */
.etable .table-scroll:not(.has-more-left) .table th:first-child::after,
.etable .table-scroll:not(.has-more-left) .table td:first-child::after { content: none; }
.etable .table th:first-child > .th-sort { overflow: hidden; }
.etable .table td:first-child > .postes-key, .etable .table td:first-child > .apps-key {
  display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.etable .table thead th:first-child { --cell-bg: var(--paper-2); background: var(--paper-2); box-shadow: inset -1px 0 0 var(--rule-2); }
.etable .table tbody td:first-child { z-index: 4; }
.etable .table thead th:first-child { z-index: 5 !important; }
@media (max-width: 640px) {
  .etable .table th:first-child, .etable .table td:first-child { max-width: 38vw; }
}
.etable .table td.cell-dirty:first-child { box-shadow: inset 2px 0 0 var(--accent), inset -1px 0 0 var(--rule); }
.etable .table .etable-empty td { position: static; box-shadow: none; max-width: none; background: none; }
.etable .table .etable-empty td::after, .etable .table:has(.etable-empty) thead th:first-child::after { content: none; }
.etable .table:has(.etable-empty) thead th:first-child { box-shadow: none; }
/* Right-edge fade while columns are hidden: a JS class as fallback, then a CSS scroll timeline. */
.table-scroll.has-more-right {
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent);
  mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent);
}
@property --fade-r { syntax: '<length>'; inherits: false; initial-value: 0px; }
@keyframes scroll-fade-r { 0%, 88% { --fade-r: 40px; } 100% { --fade-r: 0px; } }
@supports (animation-timeline: scroll()) {
  .table-scroll, .table-scroll.has-more-right {
    animation: scroll-fade-r linear both; animation-timeline: scroll(self inline);
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - var(--fade-r)), transparent);
    mask-image: linear-gradient(to right, #000 calc(100% - var(--fade-r)), transparent);
  }
}
.th-sort {
  border: 0; background: none; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit;
  cursor: pointer; padding: 0; display: flex; align-items: center; gap: 4px; width: 100%; min-height: 32px;
  text-align: inherit;
}
.th-sort:hover { color: var(--ink); }
.th-sort:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.th-editable { color: var(--ink-2); }
.sort-ind { font-size: 12px; line-height: 1; color: var(--ink); }
th.num .th-sort { flex-direction: row-reverse; }

.etable { display: flex; flex-direction: column; gap: var(--s3); }
.etable-toolbar { display: flex; flex-wrap: wrap; gap: var(--s3); align-items: center; justify-content: space-between; }
.etable-tools { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.etable-tools:empty { display: none; }
.etable-right { display: flex; gap: var(--s3); align-items: center; margin-left: auto; }
.etable-search { width: 240px; }
.etable-count { white-space: nowrap; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.etable-dirtybar {
  display: flex; align-items: center; gap: var(--s2); padding: var(--s2) 0;
  background: var(--paper); border: 0; border-top: 1px solid var(--rule-2); border-radius: 0;
  color: var(--ink-2); font-size: 13px; font-weight: 400; position: sticky; top: var(--sticky-top); z-index: 6;
  box-shadow: 0 1px 0 var(--rule);
}
.etable-dirty-label { font-family: var(--font-sans); font-size: 13px; font-weight: 400; color: var(--ink-2); }
.etable-dirty-count { font-family: var(--font-mono); font-size: 12px; color: var(--ink); }
.etable-pager { display: flex; gap: var(--s3); align-items: center; justify-content: flex-end; font-size: 12px; }
.etable-pager .muted { font-variant-numeric: tabular-nums; }
.etable-empty td { text-align: left; color: var(--ink-2); padding: var(--s3) var(--s2); }
.row-clickable { cursor: pointer; }
.row-clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.cell-editable { cursor: text; position: relative; }
.cell-editable:hover { text-decoration: underline dotted var(--ink-3); text-underline-offset: 4px; }
.cell-editable:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.cell-dirty { box-shadow: inset 2px 0 0 var(--accent); color: var(--ink); }
.cell-dirty.cell-editable { text-decoration: none; }
.cell-editing { padding: 1px 2px !important; overflow: clip !important; }
.cell-editing .cell-editor:focus, .cell-editing .cell-editor:focus-visible { outline-offset: -2px; }
.cell-no { color: var(--ko); }
.cell-editor { min-height: var(--control-h-sm); line-height: 26px; padding: 0 6px; width: 100%; min-width: 0; }

/* Lists */
.kv { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; margin: 0; font-size: 13px; }
.kv dt, .kv dd { margin: 0; padding: 6px 0; border-bottom: 1px solid var(--rule); min-height: var(--row-h); }
.kv dt { color: var(--ink-3); padding-right: var(--s4); padding-top: 8px; }
.kv dd { color: var(--ink); overflow-wrap: anywhere; }
.checklist, .rel-list, .action-list { list-style: none; margin: 0; padding: 0; }
.checklist li, .rel-list li, .action-list > li {
  display: flex; align-items: center; gap: var(--s2); min-height: var(--row-h); padding: 4px 0;
  border-bottom: 1px solid var(--rule); font-size: 13px;
}
.rel-list li { font-family: var(--font-mono); font-size: 12px; }
.action-list > li { flex-direction: column; align-items: stretch; gap: 2px; padding: 6px 0; }
.action-meta { display: flex; flex-wrap: wrap; gap: 2px var(--s3); font-size: 12px; color: var(--ink-2); }
.action-meta .badge, .action-meta .mark { font-size: 12px; }
.detail-summary {
  display: flex; align-items: baseline; gap: var(--s2); min-height: var(--row-h); padding: 6px 0;
}
.leader { flex: 1 1 auto; min-width: var(--s4); border-bottom: 1px dotted var(--rule-2); transform: translateY(-4px); }
.stat-line, .postes-stats, .apps-stats {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s1) var(--s4); font-size: 13px; color: var(--ink-2);
}
.stat-line .num, .postes-stats .num, .apps-stats .num { color: var(--ink); }
.diff-old { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--ink-3); }
.diff-new { color: var(--ink); }
.diff-arrow { color: var(--ink-3); }
.diff-controls { align-items: flex-end; }
.diff-body, .diff-result { display: flex; flex-direction: column; gap: var(--s4); }
.postes-key, .apps-key {
  border: 0; background: none; padding: 0; font: inherit; font-family: var(--font-mono); font-size: 12px;
  color: var(--ink); cursor: pointer; text-align: left;
  text-decoration: underline; text-decoration-color: var(--rule-2); text-underline-offset: 3px;
}
/* Application names are product names, so sans; mono is for poste identifiers. */
.apps-key { font-family: var(--font-sans); font-size: 13px; }
.postes-key:hover, .apps-key:hover { color: var(--accent); text-decoration-color: currentColor; }

.detail-item { border-bottom: 1px solid var(--rule); }
.detail-summary { cursor: pointer; list-style: none; padding: 5px 0; }
.detail-summary::-webkit-details-marker { display: none; }
.detail-summary::before {
  content: '+'; width: 12px; flex: 0 0 12px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-3);
}
.detail-item[open] > .detail-summary::before { content: '−'; }
.detail-item.is-zero > .detail-summary { cursor: default; }
.detail-item.is-zero > .detail-summary::before { content: ''; }
.detail-summary:hover .detail-label { color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule-2); text-underline-offset: 3px; }
.detail-label { flex: 0 1 auto; color: var(--ink); font-size: 14px; }
.detail-value { display: inline-flex; align-items: baseline; gap: var(--s2); font-family: var(--font-mono); font-size: 13px; }
.detail-count { color: var(--ink); min-width: 2ch; text-align: right; }
.detail-count.is-ko { color: var(--ko); }
.detail-share { color: var(--ink-3); min-width: 8ch; text-align: right; }
.detail-list {
  list-style: none; margin: 0; padding: 0 0 var(--s2) 20px; display: flex; flex-wrap: wrap; gap: 2px 0;
  font-family: var(--font-mono); font-size: 12px; color: var(--ink-2);
}
.detail-list li:not(:last-child)::after { content: '·'; padding: 0 var(--s2); color: var(--ink-3); }
#detail-apps .detail-list { font-family: var(--font-sans); font-size: 13px; }

.detail-rows { display: flex; flex-direction: column; }

/* Tabs */
.tabs { display: flex; flex-direction: column; gap: var(--s5); }
/* The strip scrolls sideways on phones; the clipped side fades instead of showing a scrollbar. */
.tablist {
  display: flex; gap: var(--s5); border-bottom: 1px solid var(--rule); overflow-x: auto; scroll-padding-inline: var(--s5);
  scrollbar-width: none;
}
.tablist::-webkit-scrollbar { display: none; }
.tablist.has-more-right { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); }
.tablist.has-more-left { -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to left, #000 calc(100% - 32px), transparent); }
.tablist.has-more-left.has-more-right {
  -webkit-mask-image: linear-gradient(to right, transparent, #000 32px, #000 calc(100% - 32px), transparent);
  mask-image: linear-gradient(to right, transparent, #000 32px, #000 calc(100% - 32px), transparent);
}
.tab {
  border: 0; background: none; font: inherit; font-size: 14px; color: var(--ink-2); padding: 6px 0 8px; cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; min-height: 32px;
}
.tab:hover { color: var(--ink); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tab.active { color: var(--ink); font-weight: 500; border-bottom-color: var(--ink); }
.tabpanel { outline: none; display: flex; flex-direction: column; gap: var(--s5); }
.tabpanel:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

/* Overlays */
.modal-overlay, .drawer-overlay { position: fixed; inset: 0; background: var(--backdrop); z-index: 100; }
.modal-overlay { display: flex; align-items: flex-start; justify-content: center; padding: 10vh var(--s4) var(--s4); overflow-y: auto; }
.modal {
  background: var(--paper); border-radius: var(--radius-overlay); box-shadow: var(--shadow-overlay);
  width: 100%; max-width: 520px; display: flex; flex-direction: column; max-height: 82vh;
}
.modal-wide { max-width: 800px; }
.modal-header { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: var(--s4) var(--s5) var(--s3); border-bottom: 1px solid var(--rule); }
.modal-title { font-size: 16px; font-weight: 500; }
.modal-body { padding: var(--s4) var(--s5); overflow-y: auto; }
.modal-footer { display: flex; justify-content: flex-end; gap: var(--s2); padding: var(--s3) var(--s5) var(--s4); border-top: 1px solid var(--rule); }
.modal-close { margin-right: -8px; }
.confirm-message { margin: 0; max-width: 60ch; }

.drawer {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 100%);
  background: var(--paper); border-left: 1px solid var(--rule-2); border-radius: 0; box-shadow: var(--shadow-overlay);
  display: flex; flex-direction: column; transform: translateX(100%); transition: transform .18s ease-out;
}
.drawer.open { transform: none; }
.drawer-header { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s3); padding: var(--s5) var(--s5) var(--s3); border-bottom: 1px solid var(--ink); }
.drawer-title { font-size: 16px; font-weight: 500; font-family: var(--font-mono); letter-spacing: -.01em; overflow-wrap: anywhere; padding-top: 4px; }
.drawer-body { padding: var(--s4) var(--s5) var(--s6); overflow-y: auto; flex: 1 1 auto; display: flex; flex-direction: column; gap: var(--s5); }
.drawer-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s2) var(--s4); }
.drawer-buttons { display: flex; gap: var(--s2); flex-wrap: wrap; }
/* Entity drawers */
.entity-drawer { display: flex; flex-direction: column; gap: var(--s5); }
.entity-drawer .checklist .leader, .entity-drawer .rel-list .leader { align-self: center; transform: none; }
.entity-drawer .crit-label { flex: 0 1 auto; }
.entity-drawer .crit-value { color: var(--ink-2); font-size: 13px; }
.entity-drawer .checklist li { flex-wrap: wrap; }
.entity-drawer .crit-missing { flex-basis: 100%; margin: -6px 0 2px; font-size: 12px; color: var(--ink-2); }
.entity-drawer .rel-list .rel-name.is-product { font-family: var(--font-sans); font-size: 13px; }
.entity-drawer .rel-list .rel-note, .entity-drawer .rel-list .rel-team { font-family: var(--font-sans); font-size: 12px; }
.entity-drawer .rel-list .rel-note { color: var(--ink-3); }
.entity-drawer .rel-list .rel-team { color: var(--ink-2); }
.entity-drawer .action-title { font-weight: 500; font-size: 13px; }
.entity-drawer .action-comment { margin: 0; font-size: 12px; color: var(--ink-2); }
.entity-drawer .drawer-head-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s3); }
/* Drawer footer */
.drawer-footer {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: var(--s2) var(--s4);
  padding: var(--s3) var(--s5); border-top: 1px solid var(--rule); background: var(--paper); flex: 0 0 auto;
}
.drawer-footer-note { flex: 1 1 180px; min-width: 0; margin: 0; font-size: 12px; line-height: 1.4; color: var(--ink-3); }
.drawer-footer-buttons { display: flex; gap: var(--s2); margin-left: auto; }
/* Form panel */
.drawer.form-panel .drawer-title { font-family: var(--font-sans); letter-spacing: 0; }
.form-panel-body { display: flex; flex-direction: column; gap: var(--s4); }
.form-sections { display: flex; flex-direction: column; gap: var(--s3); }
.form-sections > .form { padding-bottom: var(--s1); }
details.form-section { border-top: 1px solid var(--rule); }
/* The panel header's ink rule already opens the form. */
.form-panel-body > .form-sections:first-child > .form-alert:first-child + details.form-section { border-top: 0; }
details.form-section > .form { grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: var(--s3) var(--s4);
  padding: var(--s1) 0 var(--s2); }
.form-section-title {
  display: flex; align-items: center; gap: var(--s2); min-height: var(--control-h); cursor: pointer; list-style: none;
  user-select: none;
}
.form-section-title::-webkit-details-marker { display: none; }
.form-section-title::before {
  content: '+'; width: 12px; flex: 0 0 12px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-3);
}
details.form-section[open] > .form-section-title::before { content: '−'; }
.form-section-title:hover .form-section-label { color: var(--ink); }
.form-section-title:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.form-section-hint {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 12px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--ink-3);
}
details.form-section[open] > .form-section-title > .form-section-hint { display: none; }
.form-section-tally { margin-left: auto; font-size: 12px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--ink-2); white-space: nowrap; }
.choice { display: inline-flex; align-self: flex-start; max-width: 100%; border: 1px solid var(--rule-2); border-radius: var(--radius); overflow: hidden; }
.choice-btn {
  min-width: 56px; min-height: var(--control-h); padding: 0 var(--s3); border: 0; border-right: 1px solid var(--rule-2);
  background: var(--paper); font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer;
}
.choice-btn:last-child { border-right: 0; }
.choice-btn:hover:not(:disabled) { color: var(--ink); background: var(--row-hover); }
.choice-btn[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); font-weight: 500; }
.choice-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.choice-btn:disabled { cursor: not-allowed; opacity: .6; }
.choice[aria-invalid="true"] { border-color: var(--ko); }
.yesno-btn.is-yes[aria-pressed="true"] { background: var(--ok-bg); color: var(--ok); font-weight: 500; box-shadow: inset 0 0 0 1px var(--ok); }
.yesno-btn.is-no[aria-pressed="true"] { background: var(--ko-bg); color: var(--ko); font-weight: 500; box-shadow: inset 0 0 0 1px var(--ko); }
.date-quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.date-quick-btn {
  min-height: 28px; padding: 0 10px; border: 1px solid var(--rule); border-radius: 14px; background: var(--paper);
  font: inherit; font-size: 12px; color: var(--ink-2); cursor: pointer;
}
.date-quick-btn:hover:not(:disabled) { color: var(--ink); border-color: var(--rule-2); }
.date-quick-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.drawer-heading { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.drawer-subtitle { margin: 0; font-size: 12px; color: var(--ink-3); }
.drawer-subtitle.is-warn { color: var(--warn); }
.form-panel-again { display: inline-flex; align-items: center; gap: var(--s2); min-height: var(--control-h); font-size: 13px; color: var(--ink-2); cursor: pointer; }
.form-panel-again input { accent-color: var(--ink); margin: 0; }
.form-panel-live { position: sticky; top: calc(-1 * var(--s4)); z-index: 2; margin: calc(-1 * var(--s4)) calc(-1 * var(--s5)) 0;
  padding: var(--s3) var(--s5); background: var(--paper-2); border-bottom: 1px solid var(--rule); }
.form-panel-live[hidden] { display: none; }
.form-panel-live:not([hidden]) + .form-sections > .form-alert:first-child + details.form-section { border-top: 0; }
.score-preview { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s5); }
.score-preview-main { display: flex; align-items: baseline; gap: var(--s3); }
.score-preview-value { font-family: var(--font-mono); font-size: 26px; line-height: 1; }
.score-preview-value.is-ok { color: var(--ok); }
.score-preview-value.is-ko { color: var(--ko); }
.score-preview-crit { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s3); margin: 0; padding: 0; list-style: none; font-size: 12px; }
.score-preview-missing { flex-basis: 100%; margin: 0; }

.form-section-note { margin: 0 0 var(--s2); font-size: 12px; color: var(--ink-3); }
.form-panel-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0 var(--s3); margin: 0; font-size: 12px; color: var(--ink-3); }
.form-panel-meta .btn-quiet { min-height: 28px; }
.skel-form-section { display: flex; flex-direction: column; gap: var(--s3); border-top: 1px solid var(--rule); padding-top: var(--s3); }
.skeleton-body > .skel-form-section:first-child { border-top: 0; padding-top: var(--s2); }
.skel.skel-input { height: var(--control-h); border-radius: var(--radius); }

/* Toasts and spinner */
.toast-root {
  position: fixed; left: calc(var(--sidebar-w) + var(--s4)); bottom: var(--s4); z-index: 200;
  display: flex; flex-direction: column; gap: var(--s2);
  max-width: min(440px, calc(100vw - 32px));
}
.toast {
  display: flex; align-items: flex-start; gap: var(--s3); padding: 10px var(--s2) 10px var(--s4);
  border-radius: var(--radius); background: var(--ink); color: var(--on-ink); box-shadow: var(--shadow-overlay);
  font-size: 13px; animation: toast-in .16s ease-out;
}
.toast-error { box-shadow: inset 3px 0 0 var(--ko), var(--shadow-overlay); }
.toast-msg { flex: 1 1 auto; overflow-wrap: anywhere; padding-top: 1px; }
.toast-close {
  flex: 0 0 32px; border: 0; background: transparent; color: inherit; font-size: 16px; line-height: 1; cursor: pointer; opacity: .7;
  width: 32px; height: 32px; margin: -7px 0 -7px 0; border-radius: var(--radius);
}
.toast-close:hover { opacity: 1; }
.toast-close:focus-visible { opacity: 1; outline: 2px solid var(--on-ink); outline-offset: -2px; }
body.unconfigured .toast-root { left: var(--s4); }
@keyframes toast-in { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }

.spinner {
  display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--rule-2); border-top-color: var(--ink);
  border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; margin-right: 4px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Configuration screen */
.page-config { max-width: 640px; }
.config-card { display: flex; flex-direction: column; gap: var(--s4); }
.config-form { display: flex; flex-direction: column; gap: var(--s2); max-width: 640px; }
.config-form .form-actions { margin-top: var(--s2); }

/* Responsive: top bar under 900px */
@media (max-width: 900px) {
  .app { flex-direction: column; background: var(--paper); }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
    position: sticky; top: 0; z-index: 30; height: 48px;
    padding: 0 var(--s4); background: var(--paper-2); border-bottom: 1px solid var(--rule);
  }
  .topbar-brand { display: inline-flex; align-items: center; gap: var(--s2); font-family: var(--font-mono); font-weight: 500; font-size: 16px; word-spacing: -.3em; }
  .topbar-brand .brand-logo { width: 22px; height: 22px; }
  /* Same look as .btn.btn-secondary */
  .topbar-toggle {
    min-height: var(--control-h); padding: 0 var(--s3); border: 1px solid var(--rule-2); background: var(--paper);
    border-radius: var(--radius); font: inherit; font-size: 13px; font-weight: 500; color: var(--ink); cursor: pointer;
  }
  .topbar-toggle:hover { border-color: var(--ink-2); }
  body.nav-open .topbar-toggle { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .sidebar {
    display: none;
    position: sticky; top: 48px; z-index: 25; align-self: stretch;
    width: 100%; flex-basis: auto; height: auto; max-height: calc(100vh - 48px);
    border-right: 0; border-bottom: 1px solid var(--rule-2); box-shadow: var(--shadow-overlay);
  }
  body.nav-open .sidebar { display: block; }
  .sidebar-inner .brand, .nav-collapse { display: none; }
  .sidebar { transition: none; }
  body { --sticky-top: calc(48px + var(--appbar-h)); }
  .appbar { top: 48px; padding: var(--s2) var(--s4); }
  .appbar-sep { display: none; }
  .appbar { flex-wrap: wrap; }
  .appbar-period { flex: 1 1 auto; }
  .period-stepper { flex: 1 1 auto; }
  .period-stepper .period-button { flex: 1 1 auto; min-width: 0; }
  .appbar-filters { left: auto; right: 0; }
  .filters-summary:not(:empty) { display: none; }
