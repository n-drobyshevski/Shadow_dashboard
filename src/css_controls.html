<style>
/* ==================================================================================================
   Controls (js_controls.html): popover, dropdown / combobox, date & month fields, checkbox, tooltip,
   search field, busy buttons, loading / error states, plus the global browser-chrome resets.
   Tokens only (css.html :root). Loaded right after css.html.
   ================================================================================================== */

/* ------------------------------------------------------------------ browser chrome */
:root { color-scheme: light; }
* { scrollbar-width: thin; scrollbar-color: var(--rule-2) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--rule-2); border-radius: 0; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }
::selection { background: color-mix(in srgb, var(--accent) 22%, var(--paper)); color: var(--ink); }
input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus,
textarea:-webkit-autofill, select:-webkit-autofill {
  -webkit-text-fill-color: var(--ink); caret-color: var(--ink);
  -webkit-box-shadow: 0 0 0 1000px var(--paper) inset; box-shadow: 0 0 0 1000px var(--paper) inset;
  transition: background-color 600000s 0s;
}
textarea.input { resize: vertical; }
input[type="search"] { -webkit-appearance: none; appearance: none; }
input[type="search"]::-webkit-search-decoration, input[type="search"]::-webkit-search-cancel-button,
input[type="search"]::-webkit-search-results-button, input[type="search"]::-webkit-search-results-decoration {
  -webkit-appearance: none; appearance: none; display: none;
}

/* Focus: keyboard only (never after a mouse click on a button), never clipped by a scrolling parent. */
.nav-link:focus-visible, .th-sort:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tabpanel:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.toast-close { width: 32px; height: 32px; margin: -7px -8px -7px 0; border-radius: var(--radius); }
.toast-close:focus-visible { outline: 2px solid var(--paper); outline-offset: -4px; }

/* ------------------------------------------------------------------ shared caret */
.dd-caret {
  display: inline-block; flex: 0 0 auto; width: 7px; height: 7px; margin: 0 1px;
  border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
  transform: translateY(-2px) rotate(45deg); color: var(--ink-2); transition: transform .12s ease-out;
}
.is-open .dd-caret, [aria-expanded="true"] > .dd-caret { transform: translateY(1px) rotate(-135deg); }
:disabled > .dd-caret, .is-disabled .dd-caret { color: var(--ink-3); }

/* ------------------------------------------------------------------ dropdown trigger */
.dd { display: flex; flex-direction: column; gap: var(--s1); min-width: 0; }
.dd-trigger {
  display: flex; align-items: center; gap: var(--s2); width: 100%; height: 32px; min-height: 32px;
  padding: 0 10px 0 var(--s2); border: 1px solid var(--rule-2); border-radius: var(--radius);
  background-color: var(--paper); color: var(--ink); font: inherit; font-size: 13px; line-height: 1.2;
  text-align: left; cursor: pointer;
}
.dd-trigger:hover:not(:disabled) { border-color: var(--ink-3); }
.dd-trigger:hover:not(:disabled) .dd-caret { color: var(--ink); }
.dd-trigger:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.dd-trigger[aria-expanded="true"] { border-color: var(--ink-2); }
.dd-trigger:disabled { background-color: var(--paper-2); color: var(--ink-3); cursor: not-allowed; }
.dd-trigger[aria-invalid="true"], .dd-field.is-invalid .input, .dd-combobox .input[aria-invalid="true"] { border-color: var(--ko); }
.input[aria-invalid="true"]:focus, .input[aria-invalid="true"]:focus-visible, .dd-trigger[aria-invalid="true"]:focus-visible { outline-color: var(--ko); }
.dd-value { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd.is-placeholder:not(.dd-multiple) .dd-value { color: var(--ink-3); }
.dd-multiple.is-placeholder .dd-value { color: var(--ink-2); }
.dd-mono .dd-value, .dd-mono .dd-input, .dd-input.mono { font-family: var(--font-mono); font-size: 12.5px; }
.dd-sm .dd-trigger, .dd-sm .dd-input { height: 28px; min-height: 28px; line-height: 26px; }
.dd-sm .dd-trigger { padding-left: 6px; }

/* toolbars: content-sized triggers */
.toolbar .dd-trigger, .etable-tools .dd-trigger, .inline-form .dd-trigger { width: auto; min-width: 120px; max-width: 280px; }
.toolbar .select-field, .etable-tools .select-field, .inline-form .select-field { flex-direction: row; align-items: center; gap: var(--s2); }
.inline-form .dd-field { width: auto; min-width: 160px; }

/* input + caret button (combobox, date, month) */
.dd-field { display: flex; flex-direction: column; min-width: 0; }
.dd-control { position: relative; display: flex; align-items: center; min-width: 0; width: 100%; }
.dd-control > .input { width: 100%; padding-right: 30px; }
.dd-caret-btn {
  position: absolute; top: 1px; right: 1px; bottom: 1px; width: 28px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border: 0; border-radius: 0 var(--radius) var(--radius) 0; background: transparent; color: var(--ink-2); cursor: pointer;
}
.dd-caret-btn:hover:not(:disabled) .dd-caret { color: var(--ink); }
.dd-caret-btn:disabled { cursor: not-allowed; }
.dd-sm .dd-caret-btn { width: 24px; }
.dd-sm .dd-control > .input { padding-right: 24px; padding-left: 6px; }
.datefield .input, .monthfield .input { font-variant-numeric: tabular-nums; letter-spacing: .01em; }

/* ------------------------------------------------------------------ popover (overlay surface) */
.popover {
  position: fixed; top: 0; left: 0; z-index: 150;
  background: var(--paper); color: var(--ink); border: 1px solid var(--rule-2);
  border-radius: var(--radius-overlay); box-shadow: var(--shadow-overlay);
  font-family: var(--font-sans); font-size: 13px; line-height: 1.4; overflow: auto;
}
.dd-popover { display: flex; flex-direction: column; overflow: hidden; }
.dd-panel { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
.dd-list { flex: 1 1 auto; min-height: 0; max-height: 280px; overflow-y: auto; padding: var(--s1) 0; outline: none; overscroll-behavior: contain; }
.dd-option {
  display: flex; align-items: center; gap: var(--s2); min-height: 32px; padding: 4px var(--s3) 4px var(--s2);
  color: var(--ink-2); cursor: pointer; user-select: none; -webkit-user-select: none;
}
.dd-option:hover { background: var(--paper-2); color: var(--ink); }
.dd-option.is-active { background: var(--paper-2); color: var(--ink); box-shadow: inset 2px 0 0 var(--ink); }
.dd-option[aria-selected="true"] { color: var(--ink); font-weight: 500; }
.dd-option[aria-disabled="true"] { color: var(--ink-3); cursor: not-allowed; }
.dd-check { flex: 0 0 12px; width: 12px; height: 12px; position: relative; }
.dd-option[aria-selected="true"] > .dd-check::after {
  content: ''; position: absolute; left: 3px; top: 0; width: 4px; height: 8px;
  border-right: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); transform: rotate(45deg);
}
.dd-option-label { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.dd-option-hint { flex: 0 0 auto; margin-left: var(--s3); color: var(--ink-3); font-size: 12px; font-weight: 400; }
.dd-option-empty .dd-option-label { color: var(--ink-3); }
.dd-option-custom { border-top: 1px solid var(--rule); color: var(--ink); }
.dd-popover.dd-mono .dd-option-label, .dd-option-label .mono { font-family: var(--font-mono); font-size: 12.5px; }
.dd-group {
  padding: var(--s2) var(--s3) 2px calc(var(--s2) + 20px);
  font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3);
}
.dd-empty { padding: 6px var(--s3); color: var(--ink-2); }
.dd-search-wrap { padding: var(--s1); border-bottom: 1px solid var(--rule); flex: 0 0 auto; }
.dd-search {
  width: 100%; height: 28px; padding: 0 var(--s2); border: 1px solid var(--rule-2); border-radius: var(--radius);
  background: var(--paper); color: var(--ink); font: inherit; font-size: 13px;
}
.dd-search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.dd-search::placeholder { color: var(--ink-3); }
.dd-footer { flex: 0 0 auto; display: flex; padding: 0 var(--s2); border-top: 1px solid var(--rule); }
.dd-footer .btn-link { min-height: 32px; font-size: 12px; }
.dd-popover-sm .dd-option { font-size: 13px; }
@media (max-width: 600px) {
  .dd-option { min-height: 36px; }
}

/* ------------------------------------------------------------------ checkbox */
.cb { display: inline-flex; align-items: center; gap: var(--s2); min-height: 32px; font-size: 13px; cursor: pointer; position: relative; }
.cb-input { position: absolute; left: 0; top: 50%; width: 14px; height: 14px; margin: -7px 0 0; opacity: 0; pointer-events: none; }
.cb-box {
  flex: 0 0 14px; width: 14px; height: 14px; position: relative;
  border: 1px solid var(--rule-2); border-radius: 2px; background: var(--paper);
}
.cb:hover .cb-box, .dd-option:hover > .cb-box, .dd-option.is-active > .cb-box { border-color: var(--ink-3); }
.cb-input:checked + .cb-box, .dd-option[aria-selected="true"] > .cb-box { background: var(--ink); border-color: var(--ink); }
.cb-input:checked + .cb-box::after, .dd-option[aria-selected="true"] > .cb-box::after {
  content: ''; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px;
  border-right: 2px solid var(--paper); border-bottom: 2px solid var(--paper); transform: rotate(45deg);
}
.cb-input:focus-visible + .cb-box { outline: 2px solid var(--accent); outline-offset: 1px; }
.cb.is-disabled { color: var(--ink-3); cursor: not-allowed; }
.cb.is-disabled .cb-box { background: var(--paper-2); border-color: var(--rule); }
.cb.is-disabled .cb-input:checked + .cb-box { background: var(--ink-3); border-color: var(--ink-3); }
.dd-multiple .dd-option[aria-selected="true"] { font-weight: 400; }

/* ------------------------------------------------------------------ calendar / month grid */
.cal { width: 268px; padding: var(--s2) var(--s2) var(--s1); }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); padding-bottom: var(--s1); }
.cal-title { font-size: 13px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.cal-nav {
  width: 32px; height: 32px; padding: 0; border: 0; border-radius: var(--radius); background: transparent;
  color: var(--ink-2); font: inherit; font-size: 18px; line-height: 1; cursor: pointer;
}
.cal-nav:hover { background: var(--paper-2); color: var(--ink); }
.cal-nav:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.cal-grid { width: 100%; border-collapse: collapse; table-layout: fixed; }
.cal-grid th { height: 24px; padding: 0; text-align: center; font-size: 11px; font-weight: 500; color: var(--ink-3); }
.cal-grid td { padding: 1px; text-align: center; }
.cal-day {
  position: relative; width: 100%; height: 32px; padding: 0; border: 0; border-radius: var(--radius);
  background: transparent; color: var(--ink); font-family: var(--font-mono); font-size: 12.5px; cursor: pointer;
}
.cal-day:hover:not(:disabled) { background: var(--paper-2); }
.cal-day.is-outside { color: var(--ink-3); }
.cal-day.is-today::after {
  content: ''; position: absolute; left: 50%; bottom: 4px; width: 12px; height: 2px; margin-left: -6px; background: var(--ink-2);
}
.cal-day.is-selected, .cal-day.is-selected:hover { background: var(--ink); color: var(--paper); }
.cal-day.is-selected.is-today::after { background: var(--paper); }
.cal-day:disabled { color: var(--rule-2); text-decoration: line-through; cursor: not-allowed; }
.cal-day:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.cal-foot { display: flex; justify-content: space-between; gap: var(--s2); margin-top: var(--s1); padding: 0 2px; border-top: 1px solid var(--rule); }
.cal-foot .btn-link { min-height: 32px; font-size: 12px; }
.mcal-grid .cal-day { height: 36px; font-family: var(--font-sans); font-size: 13px; }
.mcal-month.has-data::before, .mcal-dot {
  content: ''; display: inline-block; width: 5px; height: 5px; background: var(--ink-3); vertical-align: middle;
}
.mcal-month.has-data::before { margin: 0 5px 2px -10px; }
.mcal-month.has-data { font-weight: 500; }
.mcal-month.is-selected.has-data::before { background: var(--paper); }
.mcal-legend { display: flex; align-items: center; gap: 6px; margin: var(--s1) 2px 0; font-size: 12px; color: var(--ink-3); }

/* ------------------------------------------------------------------ tooltip */
.tooltip {
  position: fixed; top: 0; left: 0; z-index: 210; max-width: min(320px, calc(100vw - 16px));
  padding: 5px var(--s2); border-radius: var(--radius); background: var(--ink); color: var(--paper);
  font-family: var(--font-sans); font-size: 12px; font-weight: 400; line-height: 1.4; letter-spacing: 0;
  text-transform: none; white-space: pre-line; overflow-wrap: anywhere; pointer-events: none;
}

/* ------------------------------------------------------------------ search field */
.search-field { display: inline-flex; min-width: 0; }
.search-box { position: relative; display: flex; align-items: center; width: 100%; min-width: 0; }
.search-box > .input { width: 100%; padding-right: 30px; }
.search-clear {
  position: absolute; right: 4px; top: 50%; width: 24px; height: 24px; margin-top: -12px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border: 0; border-radius: var(--radius); background: transparent; color: var(--ink-3);
  font: inherit; font-size: 16px; line-height: 1; cursor: pointer;
}
.search-clear:hover { color: var(--ink); background: var(--paper-2); }
.search-clear:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.etable-search-field { width: 240px; }
.etable-search-field .etable-search { width: 100%; }
@media (max-width: 900px) {
  .etable-search-field { flex: 1 1 auto; width: auto; }
}

/* ------------------------------------------------------------------ busy buttons */
.btn.is-busy { cursor: progress; }
.btn.is-busy:disabled { opacity: 1; }
.btn-spinner { width: 12px; height: 12px; margin: 0; flex: 0 0 auto; }
.btn-primary .btn-spinner { border-color: color-mix(in srgb, var(--paper) 35%, transparent); border-top-color: var(--paper); }
.btn-danger .btn-spinner { border-color: color-mix(in srgb, var(--ko) 30%, transparent); border-top-color: var(--ko); }

/* ------------------------------------------------------------------ states: empty / loading / error */
.loading-state { display: flex; align-items: center; gap: var(--s2); padding: var(--s2) 0; color: var(--ink-2); font-size: 14px; }
.loading-state .spinner { margin: 0; }
.empty-state.is-small, .loading-state.is-small, .error-state.is-small { padding: var(--s1) 0; font-size: 12px; }
.error-state { padding: var(--s2) 0; }
.error-state .error-retry { min-height: 0; margin-left: var(--s2); font-size: inherit; }
.form-alert { grid-column: 1 / -1; }

/* ------------------------------------------------------------------ editable table: inline editor */
.etable .table td.cell-editing { padding: 5px var(--s3) !important; overflow: visible !important; color: transparent; text-decoration: none !important; }
.etable .table td.cell-editing > :not(.cell-editor-host) { visibility: hidden; }
.cell-editor-host { position: absolute; top: 2px; bottom: 2px; left: 2px; z-index: 5; display: flex; color: var(--ink); }
.cell-editor-host > .input.cell-editor { width: 100%; height: 100%; min-width: 0; min-height: 0; line-height: normal; padding: 0 6px; }
.cell-editor-host > .dd, .cell-editor-host > .dd-field { width: 100%; }
.cell-editor-host .dd-trigger, .cell-editor-host .dd-input { height: 100%; min-height: 0; }
.cell-editor-host .input:focus, .cell-editor-host .dd-trigger:focus-visible { outline-offset: -2px; }
.cell-editor-host .input[aria-invalid="true"] { border-color: var(--ko); box-shadow: inset 0 0 0 1px var(--ko); }
/* Empty-row cell (colspan): no sticky divider from the key column. */
.etable .table .etable-empty td { position: static; box-shadow: none; max-width: none; }

/* ------------------------------------------------------------------ tabs: overflow cue on phones */
.tablist { scroll-padding-inline: var(--s5); scrollbar-width: none; }
.tablist::-webkit-scrollbar { display: none; }
.tablist.has-more-right { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); }
.tablist.has-more-left { -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to left, #000 calc(100% - 32px), transparent); }
.tablist.has-more-left.has-more-right {
  -webkit-mask-image: linear-gradient(to right, transparent, #000 32px, #000 calc(100% - 32px), transparent);
  mask-image: linear-gradient(to right, transparent, #000 32px, #000 calc(100% - 32px), transparent);
}

@media (prefers-reduced-motion: reduce) {
  .dd-caret { transition: none; }
}
</style>
