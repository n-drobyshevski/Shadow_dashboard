<script>
// window.UI: DOM builder and shared UI components.
// Text only ever goes in through textContent (UI.el), never innerHTML, and URL attributes reject
// javascript:, data: and other unsafe schemes.
(function () {
  'use strict';

  // URL attributes keep relative URLs and these schemes only. Browsers ignore control characters and
  // spaces inside a scheme ('java\tscript:'), so they are removed before the scheme is read.
  var SAFE_SCHEMES = { http: 1, https: 1, mailto: 1, blob: 1 };
  var URL_ATTRS = { href: 1, src: 1, action: 1, formaction: 1, xlinkhref: 1, 'xlink:href': 1, poster: 1,
    data: 1, cite: 1, background: 1 };
  function safeUrl(v) {
    var m = /^([a-z][a-z0-9+.\-]*):/i.exec(String(v).replace(/[\u0000-\u0020\u007f-\u00a0]+/g, ''));
    return !m || SAFE_SCHEMES[m[1].toLowerCase()] === 1;
  }
  var uid = 0;
  function nextId(prefix) { uid++; return (prefix || 'ui') + '-' + uid; }

  function appendChildren(node, children) {
    children.forEach(function (c) {
      if (c === null || c === undefined || c === false || c === true) return;
      if (Array.isArray(c)) { appendChildren(node, c); return; }
      if (c instanceof Node) { node.appendChild(c); return; }
      node.appendChild(document.createTextNode(frSpacing(String(c))));
    });
  }

  // A narrow no-break space inside « » keeps a guillemet from ending a line on its own.
  var NNBSP = '\u202f';
  function frSpacing(s) {
    return s.indexOf('«') < 0 && s.indexOf('»') < 0 ? s : s.replace(/«[ \u00a0]/g, '«' + NNBSP).replace(/[ \u00a0]»/g, NNBSP + '»');
  }

  function quote(s) { return '«' + NNBSP + String(s === null || s === undefined ? '' : s) + NNBSP + '»'; }

  function el(tag, attrs) {
    var node = document.createElement(tag);
    var children = Array.prototype.slice.call(arguments, 2);
    var value;
    var hasValue = false;
    var tip = null;
    if (attrs && (attrs instanceof Node || Array.isArray(attrs) || typeof attrs !== 'object')) {
      children.unshift(attrs);
      attrs = null;
    }
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === undefined || v === null || v === false) return;
        if (k === 'class' || k === 'className') {
          node.className = Array.isArray(v) ? v.filter(Boolean).join(' ') : String(v);
        } else if (k === 'style') {
          if (typeof v === 'string') {
            node.style.cssText = v;
          } else {
            Object.keys(v).forEach(function (p) {

              if (p.indexOf('-') >= 0) node.style.setProperty(p, String(v[p]));
              else node.style[p] = v[p];
            });
          }
        } else if (k === 'dataset') {
          Object.keys(v).forEach(function (d) { if (v[d] !== null && v[d] !== undefined) node.dataset[d] = String(v[d]); });
        } else if (k === 'text') {
          node.textContent = String(v);
        } else if (k === 'value') {
          value = v;
          hasValue = true;
        } else if (k === 'tooltip') {
          tip = v;
        } else if (/^on[A-Za-z]/.test(k) && typeof v === 'function') {
          node.addEventListener(k.slice(2).toLowerCase(), v);
        } else if (k === 'innerHTML' || k === 'outerHTML') {
          throw new Error('UI.el: ' + k + ' is not allowed');
        } else if (/^on/i.test(k) || /^srcdoc$/i.test(k) || (URL_ATTRS[k.toLowerCase()] && !safeUrl(v))) {
          // Dropped on purpose: inline handler strings, srcdoc markup and unsafe URLs.
        } else {
          node.setAttribute(k, v === true ? '' : String(v));
        }

    }
    appendChildren(node, children);
    if (hasValue) node.value = value === null || value === undefined ? '' : value;
    if (tip !== null && window.UI && window.UI.tooltip) window.UI.tooltip(node, tip);
    return node;
  }

  function clear(node) {
    if (!node) return node;
    while (node.firstChild) node.removeChild(node.firstChild);
    return node;
  }

  function extLink(href, text, attrs) {
    return el('a', Object.assign({ href: href || '#', target: '_blank', rel: 'noopener noreferrer' }, attrs), text);
  }

  function isNum(n) { return n !== null && n !== undefined && n !== '' && isFinite(Number(n)); }

  function fmtPct(n, digits) {
    if (!isNum(n)) return '—';
    var d = digits === undefined || digits === null ? 1 : digits;
    return new Intl.NumberFormat('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: false })
      .format(Number(n)) + NNBSP + '%';
  }

  // Same text as fmtPct, with the NNBSP in its own span so it stays narrow inside mono figures.
  function fmtPctNode(n, digits) {
    var txt = fmtPct(n, digits);
    var i = txt.length - 2;
    if (txt.charAt(i + 1) !== '%' || !/\s/.test(txt.charAt(i))) return el('span', { class: 'pct' }, txt);
    return el('span', { class: 'pct' }, txt.slice(0, i), el('span', { class: 'nnbsp' }, txt.charAt(i)), '%');
  }

  function fmtNum(n) {
    if (!isNum(n)) return '—';
    return new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 }).format(Math.round(Number(n)))
      .replace(/[\u0020\u00a0\u2009]/g, NNBSP);
  }

  // The square is drawn by CSS, so textContent is exactly `text`.
  function badge(text, tone) {
    return el('span', { class: 'badge badge-' + (tone || 'neutral') }, text);
  }

  var RISK_CLASS = { 'Critique': 'risk-critique', 'Élevé': 'risk-eleve', 'Moyen': 'risk-moyen', 'Faible': 'risk-faible' };

  function scoreBadge(score) {
    var tone = !isNum(score) ? 'neutral' : (Number(score) >= Core.threshold() ? 'ok' : 'ko');
    var b = badge(null, tone);
    b.appendChild(fmtPctNode(score));
    b.classList.add('badge-score');
    return b;
  }

  function riskBadge(level) {
    var lvl = Core.str(level);
    if (!lvl) return badge('—', 'neutral');
    if (!Object.prototype.hasOwnProperty.call(RISK_CLASS, lvl)) return badge(lvl, 'neutral');
    return el('span', { class: 'badge badge-risk ' + RISK_CLASS[lvl], dataset: { risk: lvl } }, lvl);
  }

  // tone: 'ok' | 'ko' | 'warn' | 'info' | 'neutral' or a risk level.
  function statusMark(text, tone) {
    var t = Core.str(tone) || 'neutral';
    if (Object.prototype.hasOwnProperty.call(RISK_CLASS, t)) {
      return el('span', { class: 'mark mark-risk ' + RISK_CLASS[t] }, text === undefined || text === null ? t : text);
    }
    return el('span', { class: 'mark mark-' + t }, text);
  }

  // The value of each criterion that makes a record conform.
  var CRITERIA_OK = { 'IT Decathlon': 'Oui', 'EDR Decathlon': 'Oui', 'Chiffrement disque': 'Oui', 'Réseau Decathlon': 'Oui',
    'Type de compte': 'Nominatif', 'Contrat': 'Oui', 'SIP': 'Oui', 'Galink': 'Oui', 'IDP': 'Oui' };
  var STATUT_TONES = { 'conforme': 'ok', 'non conforme': 'ko', 'en cours': 'warn' };

  // The text content is exactly the value; null for other columns and blank values.
  function cellMark(column, value) {
    var v = Core.str(value);
    if (!v) return null;
    if (column === 'Niveau de risque') return Object.prototype.hasOwnProperty.call(RISK_CLASS, v) ? riskBadge(v) : null;
    if (column === 'Statut') return statusMark(v, STATUT_TONES[v.toLowerCase()] || 'neutral');
    if (Object.prototype.hasOwnProperty.call(CRITERIA_OK, column) && v !== CRITERIA_OK[column] &&
        (v === 'Non' || column === 'Type de compte')) {
      return el('span', { class: 'cell-no' }, v);
    }
    return null;
  }

  function card(o) {
    var opts = o || {};
    var node = el('div', { class: 'kpi metric-card' + (opts.tone ? ' tone-' + opts.tone : '') },
      el('div', { class: 'metric-title' }, opts.title),
      el('div', { class: 'metric-value' }, opts.value === null || opts.value === undefined ? '—' : opts.value),
      opts.sub !== undefined && opts.sub !== null && opts.sub !== '' ? el('div', { class: 'metric-sub' }, opts.sub) : null,
      opts.delta ? el('div', { class: 'metric-delta' + (opts.deltaTone ? ' is-' + opts.deltaTone : '') }, opts.delta) : null,
      opts.spark || null);
    if (opts.key) node.dataset.kpi = opts.key;
    return node;
  }

  function kpiStrip(items) {
    return el('div', { class: 'kpi-strip', role: 'group' }, (items || []).map(card));
  }

  // A native <details> for « En savoir plus », so keyboard and screen readers work as is.
  function lede(text, more, o) {
    var opts = o || {};
    return el('div', { class: ['lede', opts.small ? 'lede-small' : null] },
      el('p', { class: opts.small ? 'field-help' : 'page-lede', id: opts.id || null }, text),
      more ? el('details', { class: 'more' },
        el('summary', { class: 'more-summary' }, 'En savoir plus'),
        el('div', { class: 'more-body' }, [].concat(more).map(function (m) {
          return typeof m === 'string' ? el('p', null, m) : m;
        }))) : null);
  }

  function section(title) {
    var children = Array.prototype.slice.call(arguments, 1);
    return el('section', { class: 'section' }, title ? el('h2', { class: 'section-title' }, title) : null, children);
  }

  function pageHeader(o) {
    var opts = o || {};
    var hasKicker = opts.kicker !== undefined && opts.kicker !== null && opts.kicker !== '';
    return el('header', { class: 'page-header' },
      hasKicker ? el('p', { class: 'page-kicker', id: opts.kickerId || null }, opts.kicker) : null,
      el('div', { class: 'page-header-row' },
        el('h1', { class: 'page-title' }, opts.title || ''),
        opts.actions && opts.actions.length ? el('div', { class: 'page-header-actions' }, opts.actions) : null));
  }

  function empty(text, o) {
    var opts = o instanceof Node ? { action: o } : (o || {});
    return el('div', { class: ['empty-state', opts.small ? 'is-small' : null], role: 'note' },
      el('p', null, text || 'Aucune donnée.', opts.action ? [' ', opts.action] : null));
  }

  function noData(id) {
    var node;
    if (State.canEdit()) {
      var run = el('button', { type: 'button', class: 'btn btn-link', onClick: function () { App.syncNow(run); } },
        'Synchroniser maintenant');
      node = empty('Aucune donnée pour le moment.', run);
    } else {
      node = empty('Aucune donnée pour le moment. Les données arrivent à la prochaine synchronisation horaire.');
    }
    node.id = id;
    return node;
  }

  function filterNote(scope) {
    var text = State.filterSummary(scope);
    return text ? el('p', { class: 'filter-note', role: 'status' }, text) : null;
  }

  function plural(n, one, many) { return fmtNum(n) + ' ' + (n > 1 ? many : one); }

  function errorToast(err, context) { toast('Erreur : ' + (context ? context + '. ' : '') + errorText(err), 'error'); }

  function monthHeader(o) {
    var m = o.month;
    var range = m && o.from && o.from < m;
    var kicker = !m ? 'Aucun export importé' : range ?
      Fmt.periodTitle(o.from, m) + ' · ' + (o.endLabel || 'état') + ' fin ' + Fmt.MONTHS[Number(m.slice(5, 7)) - 1] :
      [Fmt.monthTitle(m) + ' · ', el('span', { class: 'mono' }, 'Export ' + m)];
    var h = pageHeader({ title: o.title, actions: o.actions, kickerId: m ? o.kickerId : null, kicker: kicker });
    var k = h.querySelector('.page-kicker');
    if (k && m) k.dataset.month = m;
    if (k && range) k.dataset.from = o.from;
    return h;
  }

  // Decorative (aria-hidden): the figure and its delta next to it say the same in words.
  function sparkline(values) {
    var pts = [];
    (values || []).forEach(function (v, i) { if (typeof v === 'number' && isFinite(v)) pts.push([i, v]); });
    if (pts.length < 2) return null;
    var n = Math.max(1, (values.length - 1));
    var lo = Math.min.apply(null, pts.map(function (p) { return p[1]; }));
    var hi = Math.max.apply(null, pts.map(function (p) { return p[1]; }));
    var span = hi - lo || 1;
    var W = 100;
    var H = 20;
    var xy = pts.map(function (p) { return [p[0] / n * (W - 4) + 2, H - 3 - (p[1] - lo) / span * (H - 6)]; });
    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('class', 'sparkline');
    svg.setAttribute('aria-hidden', 'true');
    var path = document.createElementNS(NS, 'polyline');
    path.setAttribute('points', xy.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '));
    path.setAttribute('vector-effect', 'non-scaling-stroke');
    svg.appendChild(path);
    var last = xy[xy.length - 1];
    var dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('cx', last[0].toFixed(1));
    dot.setAttribute('cy', last[1].toFixed(1));
    dot.setAttribute('r', '2');
    svg.appendChild(dot);
    return svg;
  }

  // Each call supersedes the previous one for the same box; a stale or detached result is dropped.
  function asyncBlock(box, o) {
    var seq = (box.__asyncSeq || 0) + 1;
    box.__asyncSeq = seq;
    function current() { return box.__asyncSeq === seq && box.isConnected && (!o.live || o.live()); }
    if (o.placeholder) clear(box).appendChild(typeof o.placeholder === 'function' ? o.placeholder() : o.placeholder);
    box.setAttribute('aria-busy', 'true');
    var p;
    try { p = Promise.resolve(o.load()); } catch (e) { p = Promise.reject(e); }
    return p.then(function (data) {
      if (!current()) return;
      clear(box);
      box.setAttribute('aria-busy', 'false');
      o.render(data, box);
    }, function (err) {
      if (!current()) return;
      clear(box);
      box.setAttribute('aria-busy', 'false');

      var node = errorState(err, { prefix: e.prefix, small: o.small,
        retry: e.retry || function () { asyncBlock(box, o); } });
      if (o.errorId) node.id = o.errorId;
      box.appendChild(node);
    });
  }

  function monthError(month) {
    return { prefix: 'Impossible de charger ' + Fmt.monthLong(month),
      retry: function () { State.invalidate(month); App.refresh(); } };
  }

  function loading(text, o) {
    var opts = o || {};
    return el('div', { class: ['loading-state', opts.small ? 'is-small' : null], role: 'status' },
      el('span', { class: 'spinner', 'aria-hidden': 'true' }), el('span', null, text || 'Chargement…'));
  }

  var SKEL_WIDTHS = [72, 54, 86, 40, 64, 78, 48, 60];
  function skeleton(kind, o) {
    var opts = o || {};
    function bar(cls, w) { return el('span', { class: ['skel', cls], style: w ? 'width:' + w + '%' : null }); }
    var root = el('div', { class: ['skeleton', 'skeleton-' + kind], role: 'status', 'aria-busy': 'true' },
      el('span', { class: 'sr-only' }, opts.label || 'Chargement…'));
    var shown = el('div', { 'aria-hidden': 'true', class: 'skeleton-body' });
    root.appendChild(shown);
    var rows = opts.rows || 6;
    if (kind === 'dashboard') {
      shown.appendChild(el('div', { class: 'kpi-strip' }, [0, 1, 2, 3].map(function (i) {
        return el('div', { class: 'kpi' }, bar('skel-label', 60 + (i % 2) * 15), bar('skel-figure', 30 + (i % 3) * 8));
      })));
      shown.appendChild(el('div', { class: 'grid grid-2' }, [0, 1].map(function (i) {
        return el('div', { class: 'section' }, bar('skel-label', 45), el('span', { class: 'skel-gauge' }), bar('skel-text', 55 + i * 10));
      })));
    } else if (kind === 'table') {
      var cols = Array.isArray(opts.columns) ? opts.columns : new Array(opts.columns || 5).fill('');
      var head = el('tr', null, cols.map(function (c, i) {
        return el('th', { scope: 'col' }, c ? c : bar('skel-label', 50 + (i % 3) * 15));
      }));
      var body = [];
      for (var r = 0; r < rows; r++) {
        body.push(el('tr', null, cols.map(function (c, i) {
          return el('td', null, bar('skel-text', SKEL_WIDTHS[(r + i * 3) % SKEL_WIDTHS.length]));
        })));
      }
      shown.appendChild(el('div', { class: 'table-scroll' },
        el('table', { class: 'table skeleton-table' }, el('thead', null, head), el('tbody', null, body))));
    } else if (kind === 'chart') {
      shown.appendChild(el('div', { class: 'section' }, bar('skel-label', 30), el('span', { class: 'skel-chart' })));
    } else if (kind === 'form') {
      [0, 1].forEach(function (s) {
        shown.appendChild(el('div', { class: 'skel-form-section' }, bar('skel-label', 24 + s * 10),
          el('div', { class: 'form' }, [0, 1, 2, 3].map(function (i) {
            return el('div', { class: 'form-field' }, bar('skel-label', 40 + ((i + s) % 3) * 15), el('span', { class: 'skel skel-input' }));
          }))));
      });
    } else {
      for (var j = 0; j < rows; j++) shown.appendChild(bar('skel-text', SKEL_WIDTHS[j % SKEL_WIDTHS.length]));
    }
    return root;
  }

  function errorText(err) {
    var m = err && typeof err === 'object' ? err.message : err;
    m = m === null || m === undefined ? '' : String(m).trim();
    return m || 'Erreur inconnue.';
  }

  function errorState(err, o) {
    var opts = o || {};
    var prefix = opts.prefix === undefined ? 'Erreur' : opts.prefix;
    var text = (prefix ? prefix + ' : ' : '') + errorText(err);
    return el('div', { class: ['alert', 'alert-error', 'error-state', opts.small ? 'is-small' : null], role: 'alert' },
      el('p', null, text, opts.retry ? el('button', { type: 'button', class: 'btn btn-link error-retry',
        onClick: function () { opts.retry(); } }, 'Réessayer') : null));
  }

  function spinner() {
    return el('span', { class: 'spinner', role: 'status', 'aria-label': 'Chargement' });
  }

  function toast(message, type) {
    var kind = type === 'success' || type === 'error' ? type : 'info';
    var root = document.getElementById('toast-root');
    if (!root) {
      root = el('div', { id: 'toast-root', class: 'toast-root', 'aria-live': 'polite' });
      document.body.appendChild(root);
    }
    var node;
    var leaving = false;
    function dismiss() {
      if (leaving || !node) return;
      leaving = true;
      node.classList.add('is-leaving');
      setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 110);
    }
    node = el('div', { class: 'toast toast-' + kind, role: kind === 'error' ? 'alert' : 'status' },
      el('span', { class: 'toast-msg' }, String(message === undefined ? '' : message)),
      el('button', { type: 'button', class: 'toast-close', 'aria-label': 'Fermer la notification', onClick: dismiss }, '×'));
    root.appendChild(node);
    setTimeout(dismiss, kind === 'error' ? 8000 : 4500);
    return { close: dismiss };
  }

  // Overlays: modal and drawer.

  var FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), ' +
    'textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

  function modalRoot() {
    var root = document.getElementById('modal-root');
    if (!root) {
      root = el('div', { id: 'modal-root' });
      document.body.appendChild(root);
    }
    return root;
  }

  function openPopover() { return window.UI && UI.popover && UI.popover.current ? UI.popover.current() : null; }

  // Escape closes, Tab stays inside `panel` and the focus goes back where it was on close. Returns close();
  // canClose() can veto the user's closes (Escape, backdrop) while a busy action runs.
  function openOverlay(overlay, panel, onClose, canClose) {
    var previous = document.activeElement;
    var closed = false;
    function userClose() { if (!canClose || canClose()) close(); }
    function onKey(e) {
      if (e.key === 'Escape') {
        // An open popover or a non-empty search field gets the Escape first.
        if (openPopover()) return;
        var t = e.target;
        if (t && t.matches && t.matches('input[type=search]') && t.value) return;
        // Only the top-most overlay reacts.
        if (modalRoot().lastElementChild === overlay) { e.stopPropagation(); userClose(); }
      } else if (e.key === 'Tab') {
        if (!panel.contains(document.activeElement)) return;
        var items = Array.prototype.filter.call(panel.querySelectorAll(FOCUSABLE), function (n) {
          return n.offsetParent !== null || n === document.activeElement;
        });
        if (!items.length) return;
        var first = items[0];
        var last = items[items.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
    function close() {
      if (closed) return;
      closed = true;
      var pop = openPopover();
      if (pop && pop.anchor && overlay.contains(pop.anchor)) pop.close('overlay', { restoreFocus: false });
      document.removeEventListener('keydown', onKey, true);
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      if (!modalRoot().firstElementChild) document.body.classList.remove('has-overlay');
      if (previous && typeof previous.focus === 'function' && previous.isConnected) {
        try { previous.focus(); } catch (e) { /* ignore */ }
      }
      if (onClose) onClose();
    }
    overlay.addEventListener('mousedown', function (e) { if (e.target === overlay) userClose(); });
    document.addEventListener('keydown', onKey, true);
    if (openPopover()) UI.popover.closeAll();
    modalRoot().appendChild(overlay);
    document.body.classList.add('has-overlay');
    return close;
  }

  var FIELD_FOCUS = 'input:not([type=hidden]):not([disabled]), select:not([disabled]), textarea:not([disabled]), ' +
    '.dd-trigger:not([disabled])';

  function focusFirst(container, fallback) {
    var target = (container && container.querySelector(FIELD_FOCUS)) || fallback;
    if (target) setTimeout(function () { try { target.focus(); } catch (e) { /* ignore */ } }, 0);
  }

  function modal(o) {
    var opts = o || {};
    var titleId = nextId('modal-title');
    var close;
    var buttons = [];
    var busyCount = 0;
    var actions = opts.actions && opts.actions.length ? opts.actions : [{ label: 'Fermer', primary: true }];
    var footer = el('div', { class: 'modal-footer' });
    function setBusy(on) {
      busyCount = Math.max(0, busyCount + (on ? 1 : -1));
      var b = busyCount > 0;
      buttons.forEach(function (btn) { if (!btn.classList.contains('is-busy')) btn.disabled = b; });
      closeBtn.disabled = b;
      dialog.setAttribute('aria-busy', b ? 'true' : 'false');
    }
    actions.forEach(function (a) {
      var btn = el('button', {
        type: 'button',
        class: 'btn' + (a.danger ? ' btn-danger' : a.primary ? ' btn-primary' : ' btn-secondary'),
        onClick: function () {
          if (busyCount) return;
          var r = a.onClick ? a.onClick(close) : close();
          if (r && typeof r.then === 'function') {
            var done = UI.busy(btn, r);
            setBusy(true);
            done.then(function () {}, function () {}).then(function () { setBusy(false); });
          }
