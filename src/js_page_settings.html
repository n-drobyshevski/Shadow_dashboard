<style>
/* Paramètres (admin only). Sections, dl.kv, ledger table, inline forms and buttons come from css.html;
   only the column widths of the forms and the access table are specific to this page. */
/* Three tabs (Général · Saisie · Accès), each a stack of cards. */
.page-settings .settings-body { display: flex; flex-direction: column; gap: var(--s5); max-width: 880px; }
.page-settings .settings-tabs { display: flex; flex-wrap: wrap; gap: 0 var(--s6); border-bottom: 1px solid var(--rule-2); }
.page-settings .settings-tab {
  min-height: 40px; margin-bottom: -1px; padding: 0 2px; border: 0; border-bottom: 2px solid transparent; background: none;
  font: inherit; font-size: 14px; color: var(--ink-2); cursor: pointer;
}
.page-settings .settings-tab:hover { color: var(--ink); }
.page-settings .settings-tab[aria-selected="true"] { border-bottom-color: var(--ink); color: var(--ink); font-weight: 500; }
.page-settings .settings-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.page-settings .settings-panel { display: flex; flex-direction: column; gap: var(--s4); }
.page-settings .settings-panel[hidden] { display: none; }
.page-settings .settings-card {
  display: flex; flex-direction: column; gap: var(--s4); padding: var(--s5); border: 1px solid var(--rule); border-radius: var(--radius-overlay);
}
.page-settings .card-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s4); min-height: var(--control-h); }
.page-settings .card-head .card-title {
  flex: 1 1 auto; font-size: 16px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--ink);
}
.page-settings .settings-card > .page-lede, .page-settings .settings-card > .field-help, .page-settings .settings-card > .lede { margin: 0; }
.page-settings .card-head + .lede { margin-top: calc(-1 * var(--s3)); }
/* Synchronisation: three figures, then the actions and the journal (opened on demand). */
.page-settings .sync-figures { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 2fr); gap: var(--s4); margin: 0; }
.page-settings .sync-figures > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.page-settings .sync-figures dt { margin: 0; }
.page-settings .sync-figures dd { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
.page-settings .sync-figures dd#settings-sync-change { font-size: 13px; padding-top: 3px; }
.page-settings .sync-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s4); }
.page-settings .sync-actions .form-actions { margin: 0; }
/* Seuil: the explanation on the left, the field on the right. */
.page-settings .threshold-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--s3) var(--s5); }
.page-settings .threshold-row > .lede { flex: 1 1 300px; align-self: center; }
@media (max-width: 700px) {
  .page-settings .settings-card { padding: var(--s4); }
  .page-settings .sync-figures { grid-template-columns: minmax(0, 1fr); gap: var(--s3); }
}
.page-settings .access-body { display: flex; flex-direction: column; gap: var(--s4); }
.page-settings .settings-form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--s2) var(--s3); }
.page-settings .settings-form .form-field { min-width: 0; }
.page-settings .settings-form .form-field-grow { flex: 1 1 320px; }
.page-settings .settings-form .form-actions { margin-top: 0; }
/* Threshold: a short figure with its unit, never a full-width field. */
.page-settings .threshold-input { display: inline-flex; align-items: center; gap: var(--s1); }
.page-settings .threshold-input .input { width: 72px; text-align: right; font-family: var(--font-mono); }
.page-settings .threshold-input .unit { color: var(--ink-2); }
/* « Saisie dans l’application »: one switch per row, rows split by a hairline. */
.page-settings .editing-list { display: flex; flex-direction: column; gap: var(--s3); }
.page-settings .editing-list > .toggle-row + .toggle-row { border-top: 1px solid var(--rule); padding-top: var(--s3); }
/* Accès: « Qui d’autre… » band, then one list of accounts and groups. */
.page-settings .access-domain {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3) var(--s5); padding: var(--s4) var(--s5);
  background: var(--paper-2); border-radius: var(--radius-overlay);
}
.page-settings .access-domain-text { flex: 1 1 280px; display: flex; flex-direction: column; gap: 2px; }
.page-settings .access-domain-title { margin: 0; font-size: 14px; font-weight: 500; }
.page-settings .segmented, .access-add .segmented { display: inline-flex; border: 1px solid var(--rule-2); border-radius: var(--radius); overflow: hidden; }
.page-settings .segmented-btn {
  min-height: var(--control-h); padding: 0 var(--s4); border: 0; border-right: 1px solid var(--rule-2); background: var(--paper);
  font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer;
}
.page-settings .segmented-btn:last-child { border-right: 0; }
.page-settings .segmented-btn:hover:not(:disabled) { color: var(--ink); }
.page-settings .segmented-btn[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); font-weight: 500; }
.page-settings .segmented-btn:disabled { cursor: progress; }
.page-settings .segmented-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.page-settings .access-tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); }
.page-settings .access-tools .search-field { flex: 0 1 280px; }
.page-settings .access-filters { display: flex; flex-wrap: wrap; gap: 6px; }
.page-settings .access-chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: var(--control-h-sm); padding: 0 10px;
  border: 1px solid var(--rule); border-radius: 14px; background: var(--paper); font: inherit; font-size: 13px;
  color: var(--ink-2); cursor: pointer;
}
.page-settings .access-chip:hover { color: var(--ink); border-color: var(--rule-2); }
.page-settings .access-chip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); color: var(--ink); font-weight: 500; }
.page-settings .access-chip-n { font-size: 12px; color: var(--ink-3); font-weight: 400; }
.page-settings .access-count { margin-left: auto; color: var(--ink-3); font-size: 12px; }
.page-settings .access-nomatch { margin: 0; color: var(--ink-2); }
.page-settings .access-table .access-role { width: 168px; }
.page-settings .access-table .access-role .select-field { max-width: 160px; }
.page-settings .access-table .access-actions { width: 88px; text-align: right; }
.page-settings .access-note { color: var(--ink-3); font-size: 12px; margin-left: var(--s1); }
.page-settings .access-name { display: flex; align-items: center; gap: 10px; min-width: 0; }
.page-settings .access-avatar {
  flex: 0 0 28px; width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0;
}
.page-settings .access-avatar.is-admin { background: var(--ink); color: var(--on-ink); }
.page-settings .access-avatar.is-lecteur { background: var(--rule); color: var(--ink); }
.page-settings .access-avatar.is-group { border: 1px dashed var(--ink-3); color: var(--ink-2); }
.page-settings .access-avatar svg { fill: none; stroke: currentColor; stroke-width: 1.4; }
.page-settings .access-id { display: flex; flex-direction: column; min-width: 0; }
.page-settings .access-email { overflow-wrap: anywhere; }
.page-settings .access-sub { font-size: 12px; color: var(--ink-3); }
.page-settings .access-tag {
  display: inline-block; margin-left: var(--s2); padding: 0 6px; border: 1px solid var(--rule); border-radius: var(--radius);
  font-family: var(--font-sans); font-size: 11px; line-height: 18px; color: var(--ink-2); vertical-align: 1px;
}
.page-settings .access-fixed-role { color: var(--ink-2); padding-left: 7px; }
/* Quiet role dropdown: reads as text, a border under the pointer or the focus. */
.page-settings .dd-quiet .dd-trigger { border-color: transparent; background: none; }
.page-settings .dd-quiet .dd-trigger:hover, .page-settings .dd-quiet .dd-trigger:focus-visible,
.page-settings .dd-quiet .dd-trigger[aria-expanded="true"] { border-color: var(--rule-2); background: var(--paper); }
/* « Retirer » stays quiet until the row is pointed at or focused (always visible on touch screens). */
@media (hover: hover) {
  .page-settings .access-table tbody tr .access-actions .btn { opacity: .55; }
  .page-settings .access-table tbody tr:hover .access-actions .btn,
  .page-settings .access-table tbody tr:focus-within .access-actions .btn { opacity: 1; }
}
/* Rows just added: a green wash until the next change. */
.page-settings .access-table tbody tr.is-new > * { background: var(--ok-bg); }
/* « Ajouter un accès » dialog: tabs, the field(s) of the tab, the role for all. */
.access-add { display: flex; flex-direction: column; gap: var(--s4); }
.access-add .settings-tabs { display: flex; flex-wrap: wrap; gap: 0 var(--s5); border-bottom: 1px solid var(--rule-2); }
.access-add .settings-tab {
  min-height: 40px; margin-bottom: -1px; padding: 0 2px; border: 0; border-bottom: 2px solid transparent; background: none;
  font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer;
}
.access-add .settings-tab[aria-selected="true"] { border-bottom-color: var(--ink); color: var(--ink); font-weight: 500; }
.access-add .settings-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.access-add-panel { display: flex; flex-direction: column; gap: var(--s2); }
.access-add-panel[hidden] { display: none; }
.access-add-panel > .lede, .access-add-panel > .field-help { margin: 0; }
.access-add .input.mono { font-family: var(--font-mono); }
.access-bulk-text { width: 100%; min-height: 150px; font-family: var(--font-mono); font-size: 13px; }
.access-bulk-preview { margin: 0; font-size: 13px; color: var(--ink-2); min-height: 20px; }
.access-bulk-preview .num { font-family: var(--font-mono); color: var(--ink); }
.access-bulk-invalid { color: var(--ko); overflow-wrap: anywhere; }
.role-cards { display: flex; flex-direction: column; gap: var(--s2); margin: 0; padding: 0; border: 0; min-width: 0; }
.role-cards > legend { padding: 0; margin-bottom: var(--s2); }
.role-card {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--radius);
  cursor: pointer;
}
.role-card:hover { border-color: var(--rule-2); }
.role-card:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.role-card input { margin: 3px 0 0; accent-color: var(--ink); }
.role-card-text { display: flex; flex-direction: column; }
.role-card-label { font-size: 13px; font-weight: 500; }
@media (max-width: 700px) {
  .page-settings .access-table .access-role { width: auto; }
  .page-settings .access-table .access-added, .page-settings .access-table thead th:nth-child(3) { display: none; }
  .page-settings .access-table .access-role .access-note { display: block; margin-left: 0; }
  /* Narrow: the address alone (no avatar, no group subtitle), the tag under it; « Retirer » always full strength. */
  .page-settings .access-avatar, .page-settings .access-sub { display: none; }
  .page-settings .access-tag { display: table; margin: 2px 0 0; }
  .page-settings .access-table .access-role { width: 1%; }
  .page-settings .access-table .access-actions { width: 1%; }
  .page-settings .access-count { margin-left: 0; }
  .page-settings .access-table th, .page-settings .access-table td { padding-left: 4px; padding-right: 4px; }
}
</style>
<script>
/**
 * Pages.settings — « Paramètres » (admin only; docs/API.md §3 settings endpoints).
 *
 * Three tabs (ARIA tabs: arrows / Home / End move between them; the last one stays selected while the app is
 * open): « Général » (source, synchronisation, seuil), « Saisie » and « Accès ». Each section is a card (h2 title,
 * an optional status or button on its right). Five sections, each saved on its own:
 *   - Source de données: current source spreadsheet, tabs found, data spreadsheet; change the source
 *     (App.applySource -> api_setConfig then a first synchronisation, the same path as the configuration screen).
 *   - Synchronisation: hourly trigger on / off (api_enableSync), last run, last change, error, « Synchroniser
 *     maintenant » (App.syncNow -> api_syncNow), and the journal of the runs that changed something
 *     (api_getImportLog {limit: 12}, newest first). Re-rendered when the status changes elsewhere (app bar).
 *   - Seuil de conformité: integer 1–100 (api_setThreshold). Every cache is dropped and the bootstrap is
 *     reloaded so that every page re-scores with the new value.
 *   - Saisie dans l’application: three switches (UI.toggle), saved on toggle (api_setEditing {edit | create |
 *     delete: bool}), for every admin and every month: modify, create and delete postes / applications
 *     (actions and remplacements are not concerned). The result goes to State.setEditing (the Postes /
 *     Applications pages follow at once); the switches follow State 'editing' changes made elsewhere.
 *   - Accès: « Qui d’autre peut ouvrir l’application ? » (domain role, two buttons -> api_setDomainRole), then
 *     one list of accounts and Google Groups (search, filter chips by role / groups, inline role dropdown,
 *     « Retirer »: api_saveUser / api_removeUser, api_saveGroup / api_removeGroup) and « Ajouter » (openAdd: one
 *     account, a pasted list with its live preview -> api_addUsers, or a group the server checks). Every member
 *     of a listed group gets its role. The deployer is always admin and the caller cannot edit their own access
 *     (server guards, shown here as plain text).
 * The page is also reachable before a source is configured, so that access can be set up first.
 */
(function () {
  'use strict';

  window.Pages = window.Pages || {};
  var el = UI.el;
  var page = null;        // root of the mounted page: late responses do not touch a page that was left
  var syncView = null;    // the « Synchronisation » section (re-rendered when State.sync changes)
  var editingView = null; // the « Saisie dans l’application » section (follows State.editing)
  var unsubscribe = null;
  var currentTab = 'general'; // selected tab, kept across visits
  var journalOpen = false;    // the sync journal is open (kept across visits: a sync that adds a month re-mounts)
  var journalWanted = false;  // Pages.settings.showJournal(): focus the journal toggle on the next render
  function alive() { return !!page && page.isConnected; }

  /** One card: h2 title, `aside` on its right (a status, a button; null for none), then the content. */
  function card(title, aside) {
    var children = Array.prototype.slice.call(arguments, 2);
    return el('section', { class: 'section settings-card' },
      el('div', { class: 'card-head' }, el('h2', { class: 'section-title card-title' }, title), aside || null),
      children);
  }

  function roleLabel(role) { return (App.ROLE_LABELS || {})[role] || role; }
  function pct(n) { return n + UI.NNBSP + '%'; }

  var ROLE_OPTIONS = [{ value: 'lecteur', label: 'Lecteur' }, { value: 'admin', label: 'Administrateur' }];
  var DOMAIN_OPTIONS = [{ value: 'none', label: 'Personne d’autre' }, { value: 'lecteur', label: 'Tous, en lecture' }];

  // ------------------------------------------------------------------------------ source

  function tabsLine(found) {
    if (!found) return el('span', { class: 'field-help' }, 'Classeur inaccessible.');
    var names = [['postes', Core.SOURCE_TABS.postes], ['applications', Core.SOURCE_TABS.applications],
      ['referentiel', Core.SOURCE_TABS.referentiel]];
    return el('span', { class: 'tabs-found' }, names.map(function (n, i) {
      return [i ? ' · ' : null, UI.statusMark(n[1] + (found[n[0]] ? '' : ' — introuvable'), found[n[0]] ? 'ok' : 'ko')];
    }));
  }

  function sourceSection(s, reload) {
    var src = s.source || {};
    var info = el('dl', { class: 'kv', id: 'settings-source-info' },
      el('dt', null, 'Classeur source'),
      el('dd', null, src.id ? [src.title ? UI.extLink(src.url, src.title, { id: 'settings-source-link' }) : null,
        el('div', { class: 'mono field-help' }, src.id)] : el('span', { class: 'field-help' }, 'Non configuré.')),
      src.id ? el('dt', null, 'Onglets') : null,
      src.id ? el('dd', null, tabsLine(src.tabsFound)) : null,
      el('dt', null, 'Classeur de données'),
      el('dd', null, s.dataUrl ? UI.extLink(s.dataUrl, 'ShadowIT_AppData', { id: 'settings-data-link' }) :
        el('span', { class: 'field-help' }, 'Créé au premier chargement.')));

    var input = el('input', { type: 'text', class: 'input', id: 'settings-source', autocomplete: 'off',
      placeholder: 'https://docs.google.com/spreadsheets/d/…', 'aria-describedby': 'settings-source-help' });
    var button = el('button', { type: 'submit', class: src.id ? 'btn btn-primary' : 'btn btn-secondary',
      id: 'settings-source-submit' }, src.id ? 'Enregistrer' : 'Enregistrer la source');
    var form = el('form', { class: 'settings-form', id: 'settings-source-form', novalidate: true, hidden: !!src.id,
      onSubmit: function (e) {
      e.preventDefault();
      var value = input.value.trim();
      UI.fieldError(input, '');
      if (!value) { UI.fieldError(input, 'Collez l’URL ou l’identifiant du Google Sheet source.'); input.focus(); return; }
      UI.busy(button, App.applySource(value)).then(function () {
        // A first source re-renders the whole shell (and re-mounts this page): nothing left to do then.
        if (!alive()) return;
        input.value = '';
        reload();
      }, function (err) {
        if (!alive()) return;
        UI.fieldError(input, App.sourceErrorText(err));
        input.focus();
      });
    } },
      el('div', { class: 'form-field form-field-grow' },
        el('label', { for: 'settings-source', class: 'field-label' }, 'Nouvelle source (URL ou ID)'),
        input),
      el('div', { class: 'form-actions' }, button));

    // The server refuses a source change from anyone but the owner (the deployer's rights open the file).
    var owner = !!(State.get().user || {}).isOwner;
    // With a source, the form waits behind « Changer de source » (it is rarely changed); without one, it shows.
    var toggle = owner && src.id ? el('button', { type: 'button', class: 'btn btn-secondary btn-sm', id: 'settings-source-toggle',
      'aria-expanded': 'false', 'aria-controls': 'settings-source-form',
      onClick: function () {
        var open = form.hidden;
        form.hidden = !open;
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) input.focus();
      } }, 'Changer de source') : null;
    return card('Source de données', toggle,
      UI.lede('Le classeur « ShadowIT_Industry », relu toutes les heures.',
        'Changer de source ne modifie pas les mois passés : seul le mois en cours suit la nouvelle source.',
        { id: 'settings-source-help' }),
      info,
      owner ? form : el('p', { class: 'field-help', id: 'settings-source-owner-only' },
        'Seul le propriétaire de l’application (le compte qui l’a déployée) peut changer de source.'));
  }

  // ------------------------------------------------------------------------------ synchronisation

  /** « 14:02 » / « 04/05 10:30 » in mono. */
  function stampNode(v) { return el('span', { class: 'mono' }, Fmt.stamp(v)); }

  /** « ■ Active · toutes les heures » / « Inactive », on the right of the card title. */
  function syncAutoMark(st) {
    return st.enabled ? UI.statusMark('Active · toutes les heures', 'ok') : UI.statusMark('Inactive', 'neutral');
  }

  function figure(label, value, id) {
    return el('div', null, el('dt', { class: 'label' }, label), el('dd', { id: id || null }, value));
  }

  function syncStatusBlock(st) {
    var failed = st.lastError && (!st.lastOkAt || st.lastError.at >= st.lastOkAt);
    return [
      el('dl', { class: 'sync-figures', id: 'settings-sync-info' },
        figure('Dernière réussite', st.lastOkAt ? stampNode(st.lastOkAt) : el('span', { class: 'field-help' }, 'Jamais.'),
          'settings-sync-last'),
        figure('Mois en cours', Fmt.monthTitle(st.month || State.get().currentMonth)),
        figure('Dernière modification', st.lastChangeAt ? [stampNode(st.lastChangeAt), ' · ',
          Fmt.syncChange(st.lastChange) || '—'] : el('span', { class: 'field-help' }, 'Aucune.'), 'settings-sync-change')),
      st.authError ? el('p', { class: 'field-error', id: 'settings-sync-auth' }, st.authError) : null,
      failed ? el('p', { class: 'alert alert-error', id: 'settings-sync-error' }, 'Échec ',
        stampNode(st.lastError.at), ' : ' + st.lastError.message) : null,
      st.warnings && st.warnings.length && !failed ? el('div', { class: 'alert alert-warning' },
        el('ul', { class: 'warning-list' }, st.warnings.map(function (w) { return el('li', null, w); }))) : null
    ];
  }

  /** Warnings of one run: a hidden row listing them, revealed by the count button of its row. */
  function logWarnings(e, i) {
    var w = e.warnings || [];
    if (!w.length) return { toggle: null, detail: null };
    var detailId = 'sync-log-warnings-' + i;
    var detail = el('tr', { class: 'import-warnings-row', id: detailId, hidden: true },
      el('td', { colspan: '6' }, el('ul', { class: 'warning-list' }, w.map(function (t) { return el('li', null, t); }))));
    var toggle = el('button', { type: 'button', class: 'btn btn-quiet btn-sm import-warn-toggle',
      'aria-expanded': 'false', 'aria-controls': detailId,
      'aria-label': UI.plural(w.length, 'alerte', 'alertes') + ' — afficher le détail',
      onClick: function () {
        var open = toggle.getAttribute('aria-expanded') !== 'true';
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        detail.hidden = !open;
      } }, String(w.length));
    return { toggle: toggle, detail: detail };
  }

  var SYNC_LOG_ROWS = 12; // latest entries shown (the server reads only those: api_getImportLog {limit})

  function loadSyncLog(box) {
    UI.asyncBlock(box, {
      load: function () { return api.call('api_getImportLog', { limit: SYNC_LOG_ROWS }); },
      placeholder: function () { return UI.loading('Chargement du journal…', { small: true }); },
      small: true,
      error: { prefix: 'Journal indisponible' },
      live: alive,
      render: function (log) {
        var entries = (log || []).slice(0, SYNC_LOG_ROWS);
        if (!entries.length) { box.appendChild(UI.empty('Aucune synchronisation pour le moment.', { small: true })); return; }
        var warn = entries.map(logWarnings);
        function count(key) { return function (e) { return UI.fmtNum((e.counts || {})[key]); }; }
        box.appendChild(UI.table({
          className: 'import-table sync-log-table',
          columns: [
            { label: 'Quand', mono: true, cell: function (e) { return Fmt.dateTime(e.imported_at); } },
            { label: 'Mois', cell: function (e) { return Fmt.monthLong(e.month); } },
            { label: 'Changements', cell: function (e) {
              return e.changes ? Fmt.syncChange(e.changes) : el('span', { class: 'faint' }, 'import manuel'); } },
            { label: 'Postes', num: true, cell: count('postes') },
            { label: 'Applis', num: true, cell: count('applications') },
            { label: 'Alertes', num: true, cell: function (e, i) { return warn[i].toggle || el('span', { class: 'faint' }, '—'); } }
          ],
          rows: entries,
          rowAttrs: function (e) { return { dataset: { month: e.month } }; },
          extraRows: function (e, i) { return warn[i].detail; }
        }));
      }
    });
  }

  function syncSection(initial) {
    var auto = el('span', { class: 'sync-auto', id: 'settings-sync-auto' });

  function thresholdSection(s) {
    var input = el('input', { type: 'text', inputmode: 'numeric', class: 'input', id: 'settings-threshold',

    var reset = el('button', { type: 'button', class: 'btn btn-quiet', id: 'settings-threshold-reset',
      hidden: s.threshold === s.defaultThreshold,
      onClick: function () { input.value = String(s.defaultThreshold); save(); } },
      'Rétablir ' + pct(s.defaultThreshold));

    function save() {
      var n = Core.validateThreshold(input.value.trim());
      UI.fieldError(input, '');
      if (n === null) { UI.fieldError(input, 'Entrez un nombre entier entre 1 et 100.'); input.focus(); return; }
      if (n === s.threshold) { UI.toast('Seuil inchangé — ' + pct(n) + '.'); return; }
      UI.busy(button, api.call('api_setThreshold', { threshold: n }).then(function (res) {
        // Every cached score depends on the threshold: drop them and reload the bootstrap.
        State.invalidate();
        return State.refreshBootstrap().then(function () { return res; });
      })).then(function (res) {
        if (!alive()) return;
        s.threshold = res.threshold;
        input.value = String(res.threshold);
        reset.hidden = res.threshold === s.defaultThreshold;
        UI.toast('Seuil enregistré — ' + pct(res.threshold) + '.', 'success');

        if (!alive()) return;
        UI.fieldError(input, UI.errorText(err));

    }

  /**
   * What a bulk add would do, computed client-side from the current list (the server decides; this is
   * only the preview): {add:[], change:[], same:[], skip:[{email, reason}], invalid:[]}.
   */
  function bulkPlan(text, role, view, me) {
    var parsed = Core.parseEmailList(text);
    var byEmail = {};
    view.users.forEach(function (u) { byEmail[u.email] = u; });
    var plan = { add: [], change: [], same: [], skip: [], invalid: parsed.invalid };
    parsed.emails.forEach(function (e) {
      if (e === view.owner) plan.skip.push({ email: e, reason: 'propriétaire' });
      else if (e === me) plan.skip.push({ email: e, reason: 'vous' });
      else if (!byEmail[e]) plan.add.push(e);
      else if (byEmail[e].role !== role) plan.change.push(e);
      else plan.same.push(e);
    });
    return plan;
  }

  var ADD_TABS = [

  /**
   * « Ajouter un accès »: a dialog with three tabs (one account → api_saveUser, a pasted list → api_addUsers with

  function openAdd(view, me, onDone) {

    var role = 'lecteur';
    var plan = null;
    var dlg = null;

    var one = el('input', { type: 'email', class: 'input mono', id: 'add-email', autocomplete: 'off', spellcheck: 'false',

    var group = el('input', { type: 'email', class: 'input mono', id: 'add-group', autocomplete: 'off', spellcheck: 'false',
      placeholder: 'equipe-labo@decathlon.com', 'aria-describedby': 'add-group-help' });
    var preview = el('p', { class: 'access-bulk-preview', id: 'bulk-preview', role: 'status', 'aria-live': 'polite' });
    var fields = { one: one, many: text, group: group };

    function submitOnEnter(e) { if (e.key === 'Enter') { e.preventDefault(); dlg.buttons[1].click(); } }
    one.addEventListener('keydown', submitOnEnter);
    group.addEventListener('keydown', submitOnEnter);

    var panels = {
      one: [el('div', { class: 'form-field' }, el('label', { for: 'add-email', class: 'field-label' }, 'Adresse e-mail'), one),
        el('p', { class: 'field-help', id: 'add-email-help' }, 'Un compte Google du domaine.')],
      many: [UI.lede('Une adresse par ligne, ou séparées par des virgules. 500 au plus.',
        'Une colonne de Google Sheet ou le champ « À » d’un e-mail (« Nom <adresse> ») se collent tels quels. ' +

    };
    var panelNodes = {};
    var strip = tabList({ prefix: 'add', tabs: ADD_TABS, label: 'Type d’accès', selected: tab, onSelect: function (id) {
      tab = id;

    } });

    var roleSet = el('fieldset', { class: 'role-cards', id: 'add-role' },

        return el('label', { class: 'role-card', for: 'add-role-' + r.value },

            onChange: function () { role = r.value; update(); } }),

            el('span', { class: 'field-help' }, r.help)));
      }));

    function update() {
      var btn = dlg && dlg.buttons[1];
      UI.fieldError(fields[tab], '');
      if (tab !== 'many') {
        if (btn) { btn.textContent = tab === 'group' ? 'Ajouter le groupe' : 'Ajouter'; btn.disabled = false; }
        return;
      }
      plan = bulkPlan(text.value, role, view, me);
      UI.clear(preview);
      var parts = [];
      if (plan.add.length) parts.push([el('span', { class: 'num' }, UI.fmtNum(plan.add.length)), plan.add.length > 1 ? ' nouveaux comptes' : ' nouveau compte']);
      if (plan.change.length) parts.push([el('span', { class: 'num' }, UI.fmtNum(plan.change.length)), plan.change.length > 1 ? ' rôles modifiés' : ' rôle modifié']);
      if (plan.same.length) parts.push([el('span', { class: 'num' }, UI.fmtNum(plan.same.length)), ' déjà ' + (role === 'admin' ? 'administrateur' : 'lecteur') + (plan.same.length > 1 ? 's' : '')]);
      if (plan.skip.length) parts.push([el('span', { class: 'num' }, UI.fmtNum(plan.skip.length)), ' ignoré' + (plan.skip.length > 1 ? 's' : '') + ' (' + plan.skip.map(function (x) { return x.reason; }).join(', ') + ')']);
      if (!parts.length && !plan.invalid.length) preview.appendChild(document.createTextNode(text.value.trim() ? 'Aucune adresse reconnue.' : ''));
      parts.forEach(function (p, i) { if (i) preview.appendChild(document.createTextNode(' · ')); preview.appendChild(el('span', null, p)); });
      if (plan.invalid.length) {
        if (parts.length) preview.appendChild(document.createTextNode(' · '));
        var shown = plan.invalid.slice(0, 5).join(', ') + (plan.invalid.length > 5 ? '…' : '');
        preview.appendChild(el('span', { class: 'access-bulk-invalid', id: 'bulk-invalid' },
          UI.plural(plan.invalid.length, 'adresse invalide', 'adresses invalides') + ' : ' + shown));
      }
      var n = plan.add.length + plan.change.length;
      if (btn) {
        btn.textContent = n ? (plan.add.length && !plan.change.length ? 'Ajouter ' + UI.plural(n, 'compte', 'comptes') :

    /** One address (account or group): apiName({email, role}); the error stays on the field. */
    function addOne(close, input, apiName, empty, done) {
      var value = input.value.trim();

      var r = role;
      return api.call(apiName, { email: value, role: r }).then(function (next) {
        close();
        UI.toast(done + ' — ' + value.toLowerCase() + ' (' + roleLabel(r) + ').', 'success');
        onDone(next, [value.toLowerCase()]);
      }, function (err) {
        UI.fieldError(input, UI.errorText(err));
        input.focus();

    function addMany(close) {
      update();
      var emails = plan.add.concat(plan.change);
      if (!emails.length) { UI.fieldError(text, 'Aucune adresse à ajouter.'); return null; }
      if (emails.length > 500) { UI.fieldError(text, 'Au plus 500 adresses par ajout (' + UI.fmtNum(emails.length) + ' collées).'); return null; }
      var r = role;
      return api.call('api_addUsers', { emails: emails, role: r }).then(function (res) {

        if (res.updated.length) bits.push(UI.plural(res.updated.length, 'rôle modifié', 'rôles modifiés'));
        if (res.skipped.length) bits.push(UI.plural(res.skipped.length, 'ignoré', 'ignorés'));
        UI.toast((bits.join(' · ') || 'Aucun changement') + ' — ' + roleLabel(r) + '.', 'success');
        onDone(res.access, emails);
      }, function (err) {
        UI.fieldError(text, UI.errorText(err));

    var body = el('div', { class: 'access-add' }, strip.node,

  /** « SA » for sam.admin@…, « LE » for lea@… (decorative: the address is read next to it). */
  function initials(email) {

    return (a.charAt(0) + (parts[1] ? parts[1].charAt(0) : a.charAt(1))).toUpperCase();
  }

  /** Two heads (a Google Group), drawn with SVG nodes. */
  function groupIcon() {
    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 16 16');
    svg.setAttribute('width', '16');
    svg.setAttribute('height', '16');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('focusable', 'false');
    [['circle', { cx: 6, cy: 6, r: 2.4 }], ['circle', { cx: 11.2, cy: 6.8, r: 1.9 }],
      ['path', { d: 'M1.8 13c.6-2.2 2.3-3.3 4.2-3.3s3.6 1.1 4.2 3.3M10 10.1c1.9-.3 3.5.7 4.1 2.9' }]].forEach(function (p) {
      var n = document.createElementNS(NS, p[0]);
      Object.keys(p[1]).forEach(function (k) { n.setAttribute(k, String(p[1][k])); });
      svg.appendChild(n);

  /**
   * Accès: « Qui d’autre peut ouvrir l’application ? » (domain role, two buttons), then one list of accounts AND
   * groups (#access-table: user rows data-email, group rows data-group) with a search, filters by role / groups
   * and « Ajouter » (openAdd). Roles change in place (quiet dropdown), « Retirer » asks first. Rows just added
   * are highlighted until the next change.
   */
  function accessSection(s) {
    var domainBox = el('section', { class: 'access-domain', id: 'settings-domain', 'aria-labelledby': 'settings-domain-title' });
    var wrap = el('div', { class: 'access-body' });
    var view = s.access;
    var query = '';
    var filterId = 'all';
    var fresh = {};

    function apply(next, added) {
      view = next;
      s.access = next;
      fresh = {};
      (added || []).forEach(function (e) { fresh[e] = true; });
      render();
    }

    /**
     * Dropdown saved on change: disabled while saving, reverted with an error toast on failure.
     * o: {options, value, save(value) -> Promise<AccessView>, done(value), + UI.select options (label, id, ariaLabel, size)}
     */
    function savingSelect(o) {
      var dd = UI.select(Object.assign({}, o, { onChange: function (value) {
        if (value === o.value) return;
        dd.setDisabled(true);
        o.save(value).then(function (next) {
          if (!alive()) return;
          o.done(value);
          apply(next);
        }, function (err) {
          if (!alive()) return;
          dd.setDisabled(false);
          dd.setValue(o.value);
          UI.errorToast(err);
        });
      } }));
      return dd;
    }

    /** Inline role dropdown of a user or group row (quiet: a border only under the pointer or the focus). */
    function entryRole(entry, apiName, aria) {
      var dd = savingSelect({ ariaLabel: aria, options: ROLE_OPTIONS, value: entry.role, size: 'sm',
        save: function (role) { return api.call(apiName, { email: entry.email, role: role }); },
        done: function (role) { UI.toast('Rôle modifié — ' + entry.email + ' : ' + roleLabel(role) + '.', 'success'); } });
      dd.classList.add('dd-quiet');
      return dd;
    }

    /** « Retirer » of a user or group row: confirmation, then apiName({email}). */
    function removeEntry(o) {
      return el('button', { type: 'button', class: 'btn btn-quiet is-danger btn-sm', dataset: o.dataset || null,
        'aria-label': o.aria,
        onClick: function () {
          UI.confirm(o.message, { title: o.title, okLabel: 'Retirer', danger: true,
            onConfirm: function () {
              return api.call(o.apiName, { email: o.email }).then(function (next) {
                if (!alive()) return;
                UI.toast(o.done, 'success');
                apply(next);
              });
            } });
        } }, 'Retirer');
    }

    function renderDomain() {
      var buttons = {};
      function setDomain(role) {
        if (role === view.domainRole) return;
        DOMAIN_OPTIONS.forEach(function (o) { buttons[o.value].disabled = true; });
        api.call('api_setDomainRole', { role: role }).then(function (next) {
          if (!alive()) return;
          UI.toast(role === 'lecteur' ? 'Tout compte du domaine peut désormais consulter l’application.' :
            'Seuls les comptes listés peuvent ouvrir l’application.', 'success');
          apply(next);
        }, function (err) {
          if (!alive()) return;
          DOMAIN_OPTIONS.forEach(function (o) { buttons[o.value].disabled = false; });
          UI.errorToast(err);
        });
      }
      UI.clear(domainBox).appendChild(el('div', { class: 'access-domain-text' },
        el('h3', { class: 'access-domain-title', id: 'settings-domain-title' }, 'Qui d’autre peut ouvrir l’application ?'),
        el('p', { class: 'field-help' }, 'Les comptes du domaine Workspace qui ne sont pas dans la liste.')));
      domainBox.appendChild(el('div', { class: 'segmented', role: 'group', id: 'settings-domain-role',
        'aria-labelledby': 'settings-domain-title' },
        DOMAIN_OPTIONS.map(function (o) {
          buttons[o.value] = el('button', { type: 'button', class: 'segmented-btn', id: 'settings-domain-' + o.value,
            'aria-pressed': view.domainRole === o.value ? 'true' : 'false',
            onClick: function () { setDomain(o.value); } }, o.label);
          return buttons[o.value];
        })));
    }

    function render() {
      renderDomain();
      UI.clear(wrap);
      var me = s.me;
      var rows = [{ email: view.owner, role: 'admin', owner: true }]
        .concat(view.users.map(function (u) { return Object.assign({}, u); }))
        .concat((view.groups || []).map(function (g) { return Object.assign({ group: true }, g); }));
      var counts = { all: rows.length, admin: 0, lecteur: 0, group: 0 };
      rows.forEach(function (r) { counts[r.group ? 'group' : r.role] += 1; });

      var tbl = UI.table({
        id: 'access-table',
        className: 'access-table',
        caption: 'Comptes et groupes autorisés',
        rows: rows,
        columns: [
          { label: 'Nom', rowHeader: true, className: 'access-who is-wrap' },
          { label: 'Rôle', className: 'access-role' },
          { label: 'Ajouté le', mono: true, className: 'access-added' },
          { label: '', className: 'access-actions' }
        ],
        rowAttrs: function (r) {
          var data = r.group ? { group: r.email, role: r.role, kind: 'group' } : { email: r.email, role: r.role, kind: 'user' };
          return { dataset: data, class: fresh[r.email] ? 'is-new' : null };
        },
        cells: function (r) {
          var fixed = r.owner || r.email === me;
          var tag = r.owner ? 'Propriétaire' : (r.email === me ? 'Vous' : '');
          var name = el('span', { class: 'access-name' },
            el('span', { class: ['access-avatar', r.group ? 'is-group' : 'is-' + r.role], 'aria-hidden': 'true' },
              r.group ? groupIcon() : initials(r.email)),
            el('span', { class: 'access-id' },
              el('span', { class: 'access-email mono' }, r.email, tag ? el('span', { class: 'access-tag' }, tag) : null),
              r.group ? el('span', { class: 'access-sub' }, 'Groupe Google · ses membres reçoivent ce rôle') : null));
          var removeMsg = r.group ? 'Les membres de ' + r.email + ' perdront le rôle donné par ce groupe.' :
            r.email + ' ne pourra plus ouvrir l’application' +
              (view.domainRole === 'lecteur' ? ', sauf en lecture comme tout compte du domaine' : '') + '.';
          return [
            name,
            fixed ? el('span', { class: 'access-fixed-role' }, roleLabel(r.role)) :
              entryRole(r, r.group ? 'api_saveGroup' : 'api_saveUser', (r.group ? 'Rôle du groupe ' : 'Rôle de ') + r.email),
            r.owner ? '—' : addedCell(r),
            fixed ? null : removeEntry(r.group ?
              { email: r.email, apiName: 'api_removeGroup', aria: 'Retirer le groupe ' + r.email, title: 'Retirer le groupe',
                done: 'Groupe retiré — ' + r.email + '.', message: removeMsg } :
              { email: r.email, apiName: 'api_removeUser', dataset: { email: r.email }, aria: 'Retirer l’accès de ' + r.email,
                title: 'Retirer l’accès', done: 'Accès retiré — ' + r.email + '.', message: removeMsg })
          ];
        }
      });

      var count = el('span', { class: 'access-count', id: 'access-count', role: 'status' });
      var nomatch = el('p', { class: 'access-nomatch', id: 'access-nomatch', hidden: true }, 'Aucun compte ne correspond.');
      var search = UI.searchField({ id: 'access-search', value: query, placeholder: 'Rechercher un compte ou un groupe…',
        ariaLabel: 'Rechercher un compte ou un groupe', onInput: function (v) { query = v; filter(); } });
      var chips = {};
      var chipBox = el('div', { class: 'access-filters', role: 'group', 'aria-label': 'Filtrer la liste' },
        ACCESS_FILTERS.map(function (f) {
          chips[f.id] = el('button', { type: 'button', class: 'access-chip', id: 'access-filter-' + f.id,
            'aria-pressed': f.id === filterId ? 'true' : 'false',
            onClick: function () {
              filterId = f.id;
              ACCESS_FILTERS.forEach(function (x) { chips[x.id].setAttribute('aria-pressed', x.id === filterId ? 'true' : 'false'); });
              filter();
            } }, f.label, ' ', el('span', { class: 'access-chip-n num' }, UI.fmtNum(counts[f.id])));
          return chips[f.id];
        }));

      // Hides the rows that do not match (no re-render: the search keeps focus while typing).
      function filter() {
        var q = query.trim().toLowerCase();
        var shown = 0;
        Array.prototype.forEach.call(tbl.querySelectorAll('tbody tr'), function (tr) {
          var key = tr.dataset.group || tr.dataset.email;
          var r = rows.filter(function (x) { return x.email === key; })[0];
          var hay = r ? (r.email + ' ' + roleLabel(r.role) + ' ' + (r.added_by || '') + (r.group ? ' groupe' : '')).toLowerCase() : '';
          var kindOk = filterId === 'all' || (filterId === 'group' ? !!tr.dataset.group : !tr.dataset.group && tr.dataset.role === filterId);
          var ok = kindOk && (!q || hay.indexOf(q) >= 0);
          tr.hidden = !ok;
          if (ok) shown++;
        });
        var accounts = rows.length - counts.group;
        var whole = UI.plural(accounts, 'compte', 'comptes') + (counts.group ? ' · ' + UI.plural(counts.group, 'groupe', 'groupes') : '');
        count.textContent = shown === rows.length ? whole : UI.fmtNum(shown) + ' sur ' + UI.fmtNum(rows.length);
        nomatch.hidden = shown > 0;
      }

      wrap.appendChild(el('div', { class: 'access-tools' }, search, chipBox, count));
      wrap.appendChild(tbl);
      wrap.appendChild(nomatch);
      filter();
    }

    function addedCell(entry) {
      return [Fmt.date(entry.added_at), entry.added_by ? el('span', { class: 'access-note' }, 'par ' + entry.added_by) : null];
    }

    render();
    var addBtn = el('button', { type: 'button', class: 'btn btn-primary btn-sm', id: 'access-add-open',
      onClick: function () { openAdd(view, s.me, apply); } }, 'Ajouter');
    var list = card('Personnes et groupes', addBtn,
      UI.lede('Les administrateurs modifient données et paramètres ; les lecteurs consultent.', [
        'Le propriétaire du déploiement (' + view.owner + ') est toujours administrateur, et personne ne peut ' +
          'modifier son propre accès.',
        'Un membre d’un groupe reçoit le rôle du groupe ; s’il en a plusieurs, le plus élevé l’emporte.',
        'Seuls les comptes Google du domaine Workspace peuvent ouvrir l’application : Google ne transmet pas ' +
          'l’adresse des autres.'], { id: 'access-help' }),
      wrap);
    list.id = 'settings-access';
    return [domainBox, list];
  }

  // ------------------------------------------------------------------------------ page

  function load(body) {
    UI.asyncBlock(body, {
      load: function () { return api.call('api_getSettings', null); },
      placeholder: function () { return UI.skeleton('lines', { label: 'Chargement des paramètres…', rows: 8 }); },
      render: function (s) {
        syncView = syncSection(s.sync);
        State.setEditing(s.editing);
        editingView = editingSection(s);
        tabbed(body, {
          general: [sourceSection(s, function () { load(body); }), syncView, thresholdSection(s)],
          saisie: [editingView],
          acces: [accessSection(s)]
        });
      }
    });
  }

  var TABS = [
    { id: 'general', label: 'Général' },
    { id: 'saisie', label: 'Saisie' },
    { id: 'acces', label: 'Accès' }
  ];

  /**
   * ARIA tab strip: tabs [{id, label}] -> buttons #<prefix>-tab-<id> controlling #<prefix>-panel-<id>; roving
   * tabindex, arrows / Home / End move and select (wrapping). onSelect(id) shows the panel. -> {node, select(id, focus)}
   */
  function tabList(o) {
    var buttons = {};
    var current = o.selected;
    function select(id, focus) {
      current = id;
      o.tabs.forEach(function (t) {
        buttons[t.id].setAttribute('aria-selected', t.id === id ? 'true' : 'false');
        buttons[t.id].tabIndex = t.id === id ? 0 : -1;
      });
      if (focus) buttons[id].focus();
      o.onSelect(id);
    }
    var node = el('div', { class: 'settings-tabs', role: 'tablist', 'aria-label': o.label,
      onKeydown: function (e) {
        var ids = o.tabs.map(function (t) { return t.id; });
        var i = ids.indexOf(current);
        var next = e.key === 'ArrowRight' ? i + 1 : e.key === 'ArrowLeft' ? i - 1 : e.key === 'Home' ? 0 :
          e.key === 'End' ? ids.length - 1 : null;
        if (next === null) return;
        e.preventDefault();
        select(ids[(next + ids.length) % ids.length], true);
      } },
      o.tabs.map(function (t) {
        buttons[t.id] = el('button', { type: 'button', class: 'settings-tab', role: 'tab', id: o.prefix + '-tab-' + t.id,
          'aria-controls': o.prefix + '-panel-' + t.id, 'aria-selected': t.id === current ? 'true' : 'false',
          tabindex: t.id === current ? '0' : '-1', onClick: function () { select(t.id); } }, t.label);
        return buttons[t.id];
      }));
    return { node: node, select: select };
  }

  /** The page's tabs + one panel per tab (every panel stays in the DOM: switches and the sync status keep following State while hidden). */
  function tabbed(body, panels) {
    var nodes = {};
    var first = TABS.some(function (t) { return t.id === currentTab; }) ? currentTab : 'general';
    var strip = tabList({ prefix: 'settings', tabs: TABS, label: 'Sections des paramètres', selected: first,
      onSelect: function (id) {
        currentTab = id;
        TABS.forEach(function (t) { if (nodes[t.id]) nodes[t.id].hidden = t.id !== id; });
      } });
    body.appendChild(strip.node);
    TABS.forEach(function (t) {
      nodes[t.id] = el('div', { class: 'settings-panel', role: 'tabpanel', id: 'settings-panel-' + t.id,
        'aria-labelledby': 'settings-tab-' + t.id, hidden: t.id !== first }, panels[t.id]);
      body.appendChild(nodes[t.id]);
    });
  }

  /** The app bar's « Journal » link: next mount opens « Général » with the journal shown and focused. */
  function showJournal() {
    currentTab = 'general';
    journalOpen = true;
    journalWanted = true;
  }

  function mount(root) {
    page = root;
    syncView = null;
    editingView = null;
    unsubscribe = State.subscribe(function (st, changed) {
      if (changed.indexOf('sync') >= 0 && syncView && syncView.isConnected && st.sync) syncView.__sync(st.sync);
      if (changed.indexOf('editing') >= 0 && editingView && editingView.isConnected) editingView.__editing(st.editing);
    });
    var body = el('div', { class: 'settings-body', id: 'settings-body' });
    root.appendChild(UI.pageHeader({ title: 'Paramètres', kicker: 'Shadow IT · administration' }));
    root.appendChild(body);
    load(body);
  }

  function unmount() {
    page = null;
    syncView = null;
    editingView = null;
    if (unsubscribe) unsubscribe();
    unsubscribe = null;
  }

  window.Pages.settings = { id: 'settings', title: 'Paramètres', mount: mount, unmount: unmount, showJournal: showJournal };
})();
</script>
