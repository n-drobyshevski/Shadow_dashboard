<style>
/* Paramètres (admin only). Sections, dl.kv, ledger table, inline forms and buttons come from css.html;
   only the column widths of the forms and the access table are specific to this page. */
.page-settings .settings-body { display: flex; flex-direction: column; gap: var(--s6); max-width: 880px; }
.page-settings .section > .page-lede, .page-settings .section > .field-help { margin: 0; }
.page-settings .access-body { display: flex; flex-direction: column; gap: var(--s4); }
.page-settings .settings-form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--s2) var(--s3); }
.page-settings .settings-form .form-field { min-width: 0; }
.page-settings .settings-form .form-field-grow { flex: 1 1 320px; }
.page-settings .settings-form .form-actions { margin-top: 0; }
/* Threshold: a short figure with its unit, never a full-width field. */
.page-settings .threshold-input { display: inline-flex; align-items: center; gap: var(--s1); }
.page-settings .threshold-input .input { width: 72px; text-align: right; font-family: var(--font-mono); }
.page-settings .threshold-input .unit { color: var(--ink-2); }
/* « Saisie dans l’application »: one switch per row, rows split by a hairline. */
.page-settings .editing-list { display: flex; flex-direction: column; gap: var(--s3); }
.page-settings .editing-list > .toggle-row + .toggle-row { border-top: 1px solid var(--rule); padding-top: var(--s3); }
/* Access table: account in mono, role as a small dropdown, the row action right-aligned. */
.page-settings .access-table .access-role { width: 168px; }
.page-settings .access-table .access-role .select-field { max-width: 160px; }
.page-settings .access-table .access-actions { width: 96px; text-align: right; }
.page-settings .access-note { color: var(--ink-3); font-size: 12px; margin-left: var(--s1); }
.page-settings .settings-form .select-field { min-width: 160px; }
/* Above the access table: search + count on the left, bulk add on the right. */
.page-settings .access-tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); }
.page-settings .access-tools .search-field { flex: 0 1 280px; }
.page-settings .access-count { color: var(--ink-3); font-size: 12px; }
.page-settings .access-tools .access-bulk-open { margin-left: auto; }
.page-settings .access-nomatch { margin: 0; color: var(--ink-2); }
.page-settings .access-body > .subsection-title { margin: var(--s3) 0 0; }
.page-settings .access-groups { display: flex; flex-direction: column; gap: var(--s3); }
.page-settings .access-groups > .field-help { margin: 0; max-width: 72ch; }
/* Bulk add dialog */
.access-bulk .access-bulk-text { width: 100%; min-height: 168px; font-family: var(--font-mono); font-size: 13px; }
.access-bulk .access-bulk-role { max-width: 200px; }
.access-bulk .access-bulk-preview { margin: 0; font-size: 13px; color: var(--ink-2); min-height: 20px; }
.access-bulk .access-bulk-preview .num { font-family: var(--font-mono); color: var(--ink); }
.access-bulk .access-bulk-invalid { color: var(--ko); overflow-wrap: anywhere; }
.access-bulk { display: flex; flex-direction: column; gap: var(--s3); }
@media (max-width: 700px) {
  .page-settings .access-table .access-role { width: auto; }
  .page-settings .access-table .access-added { display: none; }
  .page-settings .access-table .access-role .access-note { display: block; margin-left: 0; }
}
</style>
<script>
/**
 * Pages.settings — « Paramètres » (admin only; docs/API.md §3 settings endpoints).
 *
 * Five sections, each saved on its own:
 *   - Source de données: current source spreadsheet, tabs found, data spreadsheet; change the source
 *     (App.applySource -> api_setConfig then a first synchronisation, the same path as the configuration screen).
 *   - Synchronisation: hourly trigger on / off (api_enableSync), last run, last change, error, « Synchroniser
 *     maintenant » (App.syncNow -> api_syncNow), and the journal of the runs that changed something
 *     (api_getImportLog {limit: 12}, newest first). Re-rendered when the status changes elsewhere (app bar).
 *   - Seuil de conformité: integer 1–100 (api_setThreshold). Every cache is dropped and the bootstrap is
 *     reloaded so that every page re-scores with the new value.
 *   - Saisie dans l’application: three switches (UI.toggle), saved on toggle (api_setEditing {edit | create |
 *     delete: bool}), for every admin and every month: modify, create and delete postes / applications
 *     (actions and remplacements are not concerned). The result goes to State.setEditing (the Postes /
 *     Applications pages follow at once); the switches follow State 'editing' changes made elsewhere.
 *   - Accès: role of the other accounts of the domain (api_setDomainRole), the access list with an inline
 *     role dropdown and « Retirer » (api_saveUser / api_removeUser), a search over the list, an add form,
 *     and « Ajouter plusieurs comptes… »: paste any list of addresses (Core.parseEmailList), live
 *     preview of new / changed / already present / invalid, one api_addUsers call. Below, « Groupes Google »:
 *     every member of a listed group gets its role (api_saveGroup / api_removeGroup; the server checks the
 *     group exists and its members are visible to the owner). The deployer is
 *     always admin and the caller cannot edit their own access (server guards, shown here as plain text).
 * The page is also reachable before a source is configured, so that access can be set up first.
 */
(function () {
  'use strict';

  window.Pages = window.Pages || {};
  var el = UI.el;
  var page = null;        // root of the mounted page: late responses do not touch a page that was left
  var syncView = null;    // the « Synchronisation » section (re-rendered when State.sync changes)
  var editingView = null; // the « Saisie dans l’application » section (follows State.editing)
  var unsubscribe = null;
  function alive() { return !!page && page.isConnected; }

  function roleLabel(role) { return (App.ROLE_LABELS || {})[role] || role; }
  function pct(n) { return n + UI.NNBSP + '%'; }

  var ROLE_OPTIONS = [{ value: 'lecteur', label: 'Lecteur' }, { value: 'admin', label: 'Administrateur' }];
  var DOMAIN_OPTIONS = [{ value: 'none', label: 'Aucun accès' }, { value: 'lecteur', label: 'Lecteur' }];

  // ------------------------------------------------------------------------------ source

  function tabsLine(found) {
    if (!found) return el('span', { class: 'field-help' }, 'Classeur inaccessible.');
    var names = [['postes', Core.SOURCE_TABS.postes], ['applications', Core.SOURCE_TABS.applications],
      ['referentiel', Core.SOURCE_TABS.referentiel]];
    return el('span', { class: 'tabs-found' }, names.map(function (n, i) {
      return [i ? ' · ' : null, UI.statusMark(n[1] + (found[n[0]] ? '' : ' — introuvable'), found[n[0]] ? 'ok' : 'ko')];
    }));
  }

  function sourceSection(s, reload) {
    var src = s.source || {};
    var info = el('dl', { class: 'kv', id: 'settings-source-info' },
      el('dt', null, 'Classeur source'),
      el('dd', null, src.id ? [src.title ? UI.extLink(src.url, src.title, { id: 'settings-source-link' }) : null,
        el('div', { class: 'mono field-help' }, src.id)] : el('span', { class: 'field-help' }, 'Non configuré.')),
      src.id ? el('dt', null, 'Onglets') : null,
      src.id ? el('dd', null, tabsLine(src.tabsFound)) : null,
      el('dt', null, 'Classeur de données'),
      el('dd', null, s.dataUrl ? UI.extLink(s.dataUrl, 'ShadowIT_AppData', { id: 'settings-data-link' }) :
        el('span', { class: 'field-help' }, 'Créé au premier chargement.')));

    var input = el('input', { type: 'text', class: 'input', id: 'settings-source', autocomplete: 'off',
      placeholder: 'https://docs.google.com/spreadsheets/d/…', 'aria-describedby': 'settings-source-help' });
    var button = el('button', { type: 'submit', class: 'btn btn-secondary', id: 'settings-source-submit' },
      src.id ? 'Changer de source' : 'Enregistrer la source');
    var form = el('form', { class: 'settings-form', novalidate: true, onSubmit: function (e) {
      e.preventDefault();
      var value = input.value.trim();
      UI.fieldError(input, '');
      if (!value) { UI.fieldError(input, 'Collez l’URL ou l’identifiant du Google Sheet source.'); input.focus(); return; }
      UI.busy(button, App.applySource(value)).then(function () {
        // A first source re-renders the whole shell (and re-mounts this page): nothing left to do then.
        if (!alive()) return;
        input.value = '';
        reload();
      }, function (err) {
        if (!alive()) return;
        UI.fieldError(input, App.sourceErrorText(err));
        input.focus();
      });
    } },
      el('div', { class: 'form-field form-field-grow' },
        el('label', { for: 'settings-source', class: 'field-label' }, 'Nouvelle source (URL ou ID)'),
        input),
      el('div', { class: 'form-actions' }, button));

    return UI.section('Source de données',
      el('p', { class: 'page-lede', id: 'settings-source-help' }, 'Le classeur « ShadowIT_Industry », relu toutes ' +
        'les heures. Changer de source ne modifie pas les mois passés : le mois en cours suit la nouvelle source.'),
      info, form);
  }

  // ------------------------------------------------------------------------------ synchronisation

  /** « 14:02 » / « 04/05 10:30 » in mono. */
  function stampNode(v) { return el('span', { class: 'mono' }, Fmt.stamp(v)); }

  function syncStatusBlock(st) {
    var failed = st.lastError && (!st.lastOkAt || st.lastError.at >= st.lastOkAt);
    var rows = [
      el('dt', null, 'Automatique'),
      el('dd', { id: 'settings-sync-auto' }, st.enabled ? UI.statusMark('Active · toutes les heures', 'ok') :
        UI.statusMark('Inactive', 'neutral'), st.authError ? el('div', { class: 'field-error' }, st.authError) : null),
      el('dt', null, 'Mois en cours'),
      el('dd', null, Fmt.monthTitle(st.month || State.get().currentMonth)),
      el('dt', null, 'Dernière réussite'),
      el('dd', { id: 'settings-sync-last' }, st.lastOkAt ? stampNode(st.lastOkAt) : el('span', { class: 'field-help' }, 'Jamais.')),
      el('dt', null, 'Dernière modification'),
      el('dd', { id: 'settings-sync-change' }, st.lastChangeAt ? [stampNode(st.lastChangeAt), ' · ',
        Fmt.syncChange(st.lastChange) || '—'] : el('span', { class: 'field-help' }, 'Aucune.'))
    ];
    return [
      el('dl', { class: 'kv', id: 'settings-sync-info' }, rows),
      failed ? el('p', { class: 'alert alert-error', id: 'settings-sync-error' }, 'Échec ',
        stampNode(st.lastError.at), ' : ' + st.lastError.message) : null,
      st.warnings && st.warnings.length && !failed ? el('div', { class: 'alert alert-warning' },
        el('ul', { class: 'warning-list' }, st.warnings.map(function (w) { return el('li', null, w); }))) : null
    ];
  }

  /** Warnings of one run: a hidden row listing them, revealed by the count button of its row. */
  function logWarnings(e, i) {
    var w = e.warnings || [];
    if (!w.length) return { toggle: null, detail: null };
    var detailId = 'sync-log-warnings-' + i;
    var detail = el('tr', { class: 'import-warnings-row', id: detailId, hidden: true },
      el('td', { colspan: '6' }, el('ul', { class: 'warning-list' }, w.map(function (t) { return el('li', null, t); }))));
    var toggle = el('button', { type: 'button', class: 'btn btn-quiet btn-sm import-warn-toggle',
      'aria-expanded': 'false', 'aria-controls': detailId,
      'aria-label': UI.plural(w.length, 'alerte', 'alertes') + ' — afficher le détail',
      onClick: function () {
        var open = toggle.getAttribute('aria-expanded') !== 'true';
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        detail.hidden = !open;
      } }, String(w.length));
    return { toggle: toggle, detail: detail };
  }

  var SYNC_LOG_ROWS = 12; // latest entries shown (the server reads only those: api_getImportLog {limit})

  function loadSyncLog(box) {
    UI.asyncBlock(box, {
      load: function () { return api.call('api_getImportLog', { limit: SYNC_LOG_ROWS }); },
      placeholder: function () { return UI.loading('Chargement du journal…', { small: true }); },
      small: true,
      error: { prefix: 'Journal indisponible' },
      live: alive,
      render: function (log) {
        var entries = (log || []).slice(0, SYNC_LOG_ROWS);
        if (!entries.length) { box.appendChild(UI.empty('Aucune synchronisation pour le moment.', { small: true })); return; }
        var warn = entries.map(logWarnings);
        function count(key) { return function (e) { return UI.fmtNum((e.counts || {})[key]); }; }
        box.appendChild(UI.table({
          className: 'import-table sync-log-table',
          columns: [
            { label: 'Quand', mono: true, cell: function (e) { return Fmt.dateTime(e.imported_at); } },
            { label: 'Mois', cell: function (e) { return Fmt.monthLong(e.month); } },
            { label: 'Changements', cell: function (e) {
              return e.changes ? Fmt.syncChange(e.changes) : el('span', { class: 'faint' }, 'import manuel'); } },
            { label: 'Postes', num: true, cell: count('postes') },
            { label: 'Applis', num: true, cell: count('applications') },
            { label: 'Alertes', num: true, cell: function (e, i) { return warn[i].toggle || el('span', { class: 'faint' }, '—'); } }
          ],
          rows: entries,
          rowAttrs: function (e) { return { dataset: { month: e.month } }; },
          extraRows: function (e, i) { return warn[i].detail; }
        }));
      }
    });
  }

  function syncSection(initial) {
    var statusBox = el('div', { class: 'settings-sync-status', id: 'settings-sync-status' });
    var actions = el('div', { class: 'form-actions' });
    var logBox = el('div', { class: 'import-log', id: 'import-log' });
    var st = initial || {};

    function render(next) {
      st = next || {};
      UI.clear(statusBox);
      syncStatusBlock(st).forEach(function (n) { if (n) statusBox.appendChild(n); });
      UI.clear(actions);
      var enable = !st.enabled;
      var run = el('button', { type: 'button', class: enable ? 'btn btn-primary' : 'btn btn-secondary',
        id: enable ? 'settings-sync-enable' : 'settings-sync-now',
        onClick: function () {
          App.syncNow(run, { enable: enable }).then(function (res) { if (res && alive()) loadSyncLog(logBox); });
        } }, enable ? 'Activer la synchronisation horaire' : 'Synchroniser maintenant');
      actions.appendChild(run);
    }
    render(st);
    loadSyncLog(logBox);

    var section = UI.section('Synchronisation',
      el('p', { class: 'page-lede' }, 'Toutes les heures, le mois en cours est relu depuis la source ; le 1er du mois, ' +
        'le mois précédent est figé tel qu’à sa dernière synchronisation. Les modifications du mois en cours faites ' +
        'dans l’application sont écrites dans la source ; celles d’un mois passé ne changent que son historique.'),
      statusBox, actions,
      el('h3', { class: 'subsection-title' }, 'Journal des synchronisations'),
      logBox);
    section.id = 'settings-sync';
    // The app bar (or another tab action) changed the status: show it, keeping what only Paramètres knows.
    section.__sync = function (next) {
      var merged = {};
      Object.keys(next || {}).forEach(function (k) { merged[k] = next[k]; });
      if (st.authError && !merged.enabled) merged.authError = st.authError;
      render(merged);
    };
    return section;
  }

  // ------------------------------------------------------------------------------ threshold

  function thresholdSection(s) {
    var input = el('input', { type: 'text', inputmode: 'numeric', class: 'input', id: 'settings-threshold',
      value: String(s.threshold), maxlength: 3, autocomplete: 'off', 'aria-describedby': 'settings-threshold-help' });
    var button = el('button', { type: 'submit', class: 'btn btn-primary', id: 'settings-threshold-submit' }, 'Enregistrer');
    var reset = el('button', { type: 'button', class: 'btn btn-quiet', id: 'settings-threshold-reset',
      hidden: s.threshold === s.defaultThreshold,
      onClick: function () { input.value = String(s.defaultThreshold); save(); } },
      'Rétablir ' + pct(s.defaultThreshold));

    function save() {
      var n = Core.validateThreshold(input.value.trim());
      UI.fieldError(input, '');
      if (n === null) { UI.fieldError(input, 'Entrez un nombre entier entre 1 et 100.'); input.focus(); return; }
      if (n === s.threshold) { UI.toast('Seuil inchangé — ' + pct(n) + '.'); return; }
      UI.busy(button, api.call('api_setThreshold', { threshold: n }).then(function (res) {
        // Every cached score depends on the threshold: drop them and reload the bootstrap.
        State.invalidate();
        return State.refreshBootstrap().then(function () { return res; });
      })).then(function (res) {
        if (!alive()) return;
        s.threshold = res.threshold;
        input.value = String(res.threshold);
        reset.hidden = res.threshold === s.defaultThreshold;
        UI.toast('Seuil enregistré — ' + pct(res.threshold) + '.', 'success');
      }, function (err) {
        if (!alive()) return;
        UI.fieldError(input, UI.errorText(err));
      });
    }

    var form = el('form', { class: 'settings-form', novalidate: true,
      onSubmit: function (e) { e.preventDefault(); save(); } },
      el('div', { class: 'form-field' },
        el('label', { for: 'settings-threshold', class: 'field-label' }, 'Seuil'),
        el('span', { class: 'threshold-input' }, input, el('span', { class: 'unit', 'aria-hidden': 'true' }, '%'))),
      el('div', { class: 'form-actions' }, button, reset));

    return UI.section('Seuil de conformité',
      el('p', { class: 'page-lede', id: 'settings-threshold-help' }, 'Un poste ou une application est conforme ' +
        'quand son score atteint le seuil. Il s’applique à tous les mois : indicateurs, jauges, histogrammes et ' +
        'suivi temporel. Valeur par défaut : ' + pct(s.defaultThreshold) + '.'),
      form);
  }

  // ------------------------------------------------------------------------------ editing switches

  /** The three switches of « Saisie dans l’application »: State / api_setEditing key, copy, toasts. */
  var EDITING_SWITCHES = [
    { key: 'edit', label: 'Modifier les entrées',
      description: 'Modification des cellules des tableaux Postes et Applications (Galink et IDP compris) et ' +
        '« Renommer » une application.',
      on: 'Modification des entrées activée.', off: 'Modification des entrées désactivée.' },
    { key: 'create', label: 'Créer des entrées',
      description: '« Nouveau poste », « Poste générique » et « Nouvelle application ».',
      on: 'Création d’entrées activée.', off: 'Création d’entrées désactivée.' },
    { key: 'delete', label: 'Supprimer des entrées',
      description: '« Supprimer » une application. Les postes ne se suppriment pas depuis l’application.',
      on: 'Suppression d’entrées activée.', off: 'Suppression d’entrées désactivée.' }
  ];

  function editingSection(s) {
    var current = s.editing || State.get().editing || {};
    var toggles = {};
    var list = el('div', { class: 'editing-list', id: 'settings-editing-list' }, EDITING_SWITCHES.map(function (sw) {
      toggles[sw.key] = UI.toggle({ id: 'settings-editing-' + sw.key, label: sw.label, description: sw.description,
        checked: current[sw.key] !== false,
        onChange: function (checked) {
          var patch = {};
          patch[sw.key] = checked;
          return api.call('api_setEditing', patch).then(function (res) {
            State.setEditing(res && res.editing);
            UI.toast(checked ? sw.on : sw.off, 'success');
          }, function (err) {
            UI.errorToast(err);
            throw err;
          });
        } });
      return toggles[sw.key];
    }));
    var section = UI.section('Saisie dans l’application',
      el('p', { class: 'page-lede', id: 'settings-editing-help' }, 'Ces réglages s’appliquent à tous les ' +
        'administrateurs et à tous les mois, en cours comme passés, pour les postes et les applications. Le suivi ' +
        'des actions et les remplacements ne sont pas concernés.'),
      list);
    section.id = 'settings-editing';
    // Switches changed elsewhere (another tab's poll, a refused write's bootstrap reload): show them.
    section.__editing = function (e) {
      EDITING_SWITCHES.forEach(function (sw) { toggles[sw.key].setValue(!e || e[sw.key] !== false); });
    };
    return section;
  }

  // ------------------------------------------------------------------------------ access

  /**
   * What a bulk add would do, computed client-side from the current list (the server decides; this is
   * only the preview): {add:[], change:[], same:[], skip:[{email, reason}], invalid:[]}.
   */
  function bulkPlan(text, role, view, me) {
    var parsed = Core.parseEmailList(text);
    var byEmail = {};
    view.users.forEach(function (u) { byEmail[u.email] = u; });
    var plan = { add: [], change: [], same: [], skip: [], invalid: parsed.invalid };
    parsed.emails.forEach(function (e) {
      if (e === view.owner) plan.skip.push({ email: e, reason: 'propriétaire' });
      else if (e === me) plan.skip.push({ email: e, reason: 'vous' });
      else if (!byEmail[e]) plan.add.push(e);
      else if (byEmail[e].role !== role) plan.change.push(e);
      else plan.same.push(e);
    });
    return plan;
  }

  function openBulkAdd(view, me, onDone) {
    var text = el('textarea', { class: 'input access-bulk-text', id: 'bulk-emails', rows: 8, spellcheck: 'false',
      autocomplete: 'off', 'aria-describedby': 'bulk-help bulk-preview',
      placeholder: 'lea.martin@decathlon.com\nsam.durand@decathlon.com\nNina Petit <nina.petit@decathlon.com>' });
    var role = UI.select({ label: 'Rôle pour tous', id: 'bulk-role', options: ROLE_OPTIONS, value: 'lecteur',
      onChange: update });
    role.classList.add('access-bulk-role');
    var preview = el('p', { class: 'access-bulk-preview', id: 'bulk-preview', role: 'status', 'aria-live': 'polite' });
    var plan = null;
    var dlg = null;

    function update() {
      plan = bulkPlan(text.value, role.getValue(), view, me);
      UI.clear(preview);
      var parts = [];
      if (plan.add.length) parts.push([el('span', { class: 'num' }, UI.fmtNum(plan.add.length)), plan.add.length > 1 ? ' nouveaux comptes' : ' nouveau compte']);
      if (plan.change.length) parts.push([el('span', { class: 'num' }, UI.fmtNum(plan.change.length)), plan.change.length > 1 ? ' rôles modifiés' : ' rôle modifié']);
      if (plan.same.length) parts.push([el('span', { class: 'num' }, UI.fmtNum(plan.same.length)), ' déjà ' + (role.getValue() === 'admin' ? 'administrateur' : 'lecteur') + (plan.same.length > 1 ? 's' : '')]);
      if (plan.skip.length) parts.push([el('span', { class: 'num' }, UI.fmtNum(plan.skip.length)), ' ignoré' + (plan.skip.length > 1 ? 's' : '') + ' (' + plan.skip.map(function (x) { return x.reason; }).join(', ') + ')']);
      if (!parts.length && !plan.invalid.length) preview.appendChild(document.createTextNode(text.value.trim() ? 'Aucune adresse reconnue.' : ''));
      parts.forEach(function (p, i) { if (i) preview.appendChild(document.createTextNode(' · ')); preview.appendChild(el('span', null, p)); });
      if (plan.invalid.length) {
        if (parts.length) preview.appendChild(document.createTextNode(' · '));
        var shown = plan.invalid.slice(0, 5).join(', ') + (plan.invalid.length > 5 ? '…' : '');
        preview.appendChild(el('span', { class: 'access-bulk-invalid', id: 'bulk-invalid' },
          UI.plural(plan.invalid.length, 'adresse invalide', 'adresses invalides') + ' : ' + shown));
      }
      var n = plan.add.length + plan.change.length;
      if (dlg) {
        var btn = dlg.buttons[1];
        btn.textContent = n ? (plan.add.length && !plan.change.length ? 'Ajouter ' + UI.plural(n, 'compte', 'comptes') :
          'Enregistrer ' + UI.plural(n, 'compte', 'comptes')) : 'Ajouter';
        btn.disabled = !n;
      }
      UI.fieldError(text, '');
    }
    text.addEventListener('input', update);

    dlg = UI.modal({
      title: 'Ajouter plusieurs comptes',
      wide: true,
      body: el('div', { class: 'access-bulk' },
        el('p', { class: 'field-help', id: 'bulk-help' }, 'Collez les adresses : une par ligne (colonne d’un ' +
          'Google Sheet), séparées par des virgules ou des points-virgules, ou copiées depuis le champ « À » d’un ' +
          'e-mail (« Nom <adresse> »). Les doublons et les mots sans « @ » sont ignorés. ' +
          '500 adresses au plus par ajout.'),
        el('div', { class: 'form-field' }, el('label', { for: 'bulk-emails', class: 'field-label' }, 'Adresses'), text),
        role, preview),
      actions: [
        { label: 'Annuler' },
        { label: 'Ajouter', primary: true, onClick: function (close) {
          update();
          var emails = plan.add.concat(plan.change);
          if (!emails.length) { UI.fieldError(text, 'Aucune adresse à ajouter.'); return null; }
          if (emails.length > 500) { UI.fieldError(text, 'Au plus 500 adresses par ajout (' + UI.fmtNum(emails.length) + ' collées).'); return null; }
          var r = role.getValue();
          return api.call('api_addUsers', { emails: emails, role: r }).then(function (res) {
            close();
            var bits = [];
            if (res.added.length) bits.push(UI.plural(res.added.length, 'compte ajouté', 'comptes ajoutés'));
            if (res.updated.length) bits.push(UI.plural(res.updated.length, 'rôle modifié', 'rôles modifiés'));
            if (res.skipped.length) bits.push(UI.plural(res.skipped.length, 'ignoré', 'ignorés'));
            UI.toast((bits.join(' · ') || 'Aucun changement') + ' — ' + roleLabel(r) + '.', 'success');
            onDone(res.access);
          }, function (err) {
            UI.fieldError(text, UI.errorText(err));
          });
        } }
      ]
    });
    update();
  }

  function accessSection(s) {
    var wrap = el('div', { class: 'access-body' });
    var view = s.access;
    var query = '';

    function apply(next) {
      view = next;
      s.access = next;
      render();
    }

    /**
     * Dropdown saved on change: disabled while saving, reverted with an error toast on failure.
     * o: {options, value, save(value) -> Promise<AccessView>, done(value), + UI.select options (label, id, ariaLabel, size)}
     */
    function savingSelect(o) {
      var dd = UI.select(Object.assign({}, o, { onChange: function (value) {
        if (value === o.value) return;
        dd.setDisabled(true);
        o.save(value).then(function (next) {
          if (!alive()) return;
          o.done(value);
          apply(next);
        }, function (err) {
          if (!alive()) return;
          dd.setDisabled(false);
          dd.setValue(o.value);
          UI.errorToast(err);
        });
      } }));
      return dd;
    }

    /** Inline role dropdown of a user or group row. */
    function entryRole(entry, apiName, aria) {
      return savingSelect({ ariaLabel: aria, options: ROLE_OPTIONS, value: entry.role, size: 'sm',
        save: function (role) { return api.call(apiName, { email: entry.email, role: role }); },
        done: function (role) { UI.toast('Rôle modifié — ' + entry.email + ' : ' + roleLabel(role) + '.', 'success'); } });
    }

    /** « Retirer » of a user or group row: confirmation, then apiName({email}). */
    function removeEntry(o) {
      return el('button', { type: 'button', class: 'btn btn-quiet is-danger btn-sm', dataset: o.dataset || null,
        'aria-label': o.aria,
        onClick: function () {
          UI.confirm(o.message, { title: o.title, okLabel: 'Retirer', danger: true,
            onConfirm: function () {
              return api.call(o.apiName, { email: o.email }).then(function (next) {
                if (!alive()) return;
                UI.toast(o.done, 'success');
                apply(next);
              });
            } });
        } }, 'Retirer');
    }

    /**
     * « Ajouter un compte » / « Ajouter un groupe » form: e-mail + role + submit (ids `${id}-email`,
     * `${id}-role`, `${id}-add`, `${id}-form`), apiName({email, role}), error under the field.
     */
    function addEntryForm(o) {
      var email = el('input', { type: 'email', class: 'input', id: o.id + '-email', autocomplete: 'off',
        placeholder: o.placeholder, spellcheck: 'false' });
      var role = UI.select({ label: 'Rôle', id: o.id + '-role', options: ROLE_OPTIONS, value: 'lecteur' });
      var add = el('button', { type: 'submit', class: 'btn btn-secondary', id: o.id + '-add' }, o.button);
      return el('form', { class: 'settings-form', id: o.id + '-form', novalidate: true, onSubmit: function (e) {
        e.preventDefault();
        var value = email.value.trim();
        UI.fieldError(email, '');
        if (!value) { UI.fieldError(email, o.emptyMessage); email.focus(); return; }
        var r = role.getValue();
        UI.busy(add, api.call(o.apiName, { email: value, role: r }), o.busyLabel).then(function (next) {
          if (!alive()) return;
          UI.toast(o.added + ' — ' + value.toLowerCase() + ' (' + roleLabel(r) + ').', 'success');
          apply(next);
          var again = document.getElementById(o.id + '-email');
          if (again) again.focus();
        }, function (err) {
          if (!alive()) return;
          UI.fieldError(email, UI.errorText(err));
          email.focus();
        });
      } },
        el('div', { class: 'form-field form-field-grow' },
          el('label', { for: o.id + '-email', class: 'field-label' }, o.label), email),
        role,
        el('div', { class: 'form-actions' }, add));
    }

    function render() {
      UI.clear(wrap);
      var me = s.me;
      var rows = [{ email: view.owner, role: 'admin', owner: true }].concat(view.users);
      var tbl = UI.table({
        id: 'access-table',
        className: 'access-table',
        caption: 'Comptes autorisés',
        rows: rows,
        columns: [
          { label: 'Compte', mono: true, rowHeader: true },
          { label: 'Rôle', className: 'access-role' },
          { label: 'Ajouté le', mono: true, className: 'access-added' },
          { label: '', className: 'access-actions' }
        ],
        rowAttrs: function (u) { return { dataset: { email: u.email } }; },
        cells: function (u) {
          var fixed = u.owner || u.email === me;
          var note = u.owner ? 'propriétaire' : (u.email === me ? 'vous' : '');
          return [
            u.email,
            fixed ? [roleLabel(u.role), note ? el('span', { class: 'access-note' }, note) : null] :
              entryRole(u, 'api_saveUser', 'Rôle de ' + u.email),
            u.owner ? '—' : addedCell(u),
            fixed ? null : removeEntry({ email: u.email, apiName: 'api_removeUser', dataset: { email: u.email },
              aria: 'Retirer l’accès de ' + u.email, title: 'Retirer l’accès', done: 'Accès retiré — ' + u.email + '.',
              message: u.email + ' ne pourra plus ouvrir l’application' +
                (view.domainRole === 'lecteur' ? ', sauf en lecture comme tout compte du domaine' : '') + '.' })
          ];
        }
      });

      var domain = savingSelect({ label: 'Autres comptes du domaine', id: 'settings-domain-role', options: DOMAIN_OPTIONS,
        value: view.domainRole,
        save: function (role) { return api.call('api_setDomainRole', { role: role }); },
        done: function (role) {
          UI.toast(role === 'lecteur' ? 'Tout compte du domaine peut désormais consulter l’application.' :
            'Seuls les comptes listés peuvent ouvrir l’application.', 'success');
        } });

      var form = addEntryForm({ id: 'access', label: 'Ajouter un compte', placeholder: 'prenom.nom@decathlon.com',
        button: 'Ajouter', apiName: 'api_saveUser', emptyMessage: 'Saisissez une adresse e-mail.', added: 'Accès ajouté' });

      var count = el('span', { class: 'access-count', id: 'access-count', role: 'status' });
      var nomatch = el('p', { class: 'access-nomatch', id: 'access-nomatch', hidden: true }, 'Aucun compte ne correspond.');
      var search = UI.searchField({ id: 'access-search', value: query, placeholder: 'Rechercher un compte…',
        ariaLabel: 'Rechercher un compte', onInput: function (v) { query = v; filter(); } });
      var bulk = el('button', { type: 'button', class: 'btn btn-secondary access-bulk-open', id: 'access-bulk-open',
        onClick: function () { openBulkAdd(view, me, apply); } }, 'Ajouter plusieurs comptes…');

      // Hides the rows that do not match (no re-render: the search keeps focus while typing).
      function filter() {
        var q = query.trim().toLowerCase();
        var shown = 0;
        Array.prototype.forEach.call(tbl.querySelectorAll('tbody tr'), function (tr) {
          var u = rows.filter(function (r) { return r.email === tr.dataset.email; })[0];
          var hay = u ? (u.email + ' ' + roleLabel(u.role) + ' ' + (u.added_by || '')).toLowerCase() : '';
          var ok = !q || hay.indexOf(q) >= 0;
          tr.hidden = !ok;
          if (ok) shown++;
        });
        var total = rows.length;
        count.textContent = q ? UI.fmtNum(shown) + ' sur ' + UI.plural(total, 'compte', 'comptes') : UI.plural(total, 'compte', 'comptes');
        nomatch.hidden = shown > 0;
      }

      wrap.appendChild(el('div', { class: 'settings-form' }, domain));
      wrap.appendChild(el('h3', { class: 'subsection-title' }, 'Comptes'));
      wrap.appendChild(el('div', { class: 'access-tools' }, search, count, bulk));
      wrap.appendChild(tbl);
      wrap.appendChild(nomatch);
      wrap.appendChild(form);
      wrap.appendChild(el('h3', { class: 'subsection-title', id: 'groups-title' }, 'Groupes Google'));
      wrap.appendChild(groupsBlock());
      filter();
    }

    /** Google Groups: table (role dropdown, « Retirer ») + add form. */
    function groupsBlock() {
      var groups = view.groups || [];
      var block = el('div', { class: 'access-groups' });
      block.appendChild(el('p', { class: 'field-help', id: 'groups-help' }, 'Chaque membre d’un groupe reçoit son ' +
        'rôle, sous-groupes compris ; si un compte a plusieurs rôles, le plus élevé l’emporte. Le propriétaire du ' +
        'déploiement doit pouvoir voir les membres du groupe. Un changement de membres dans Google est pris en ' +
        'compte sous 10 minutes.'));
      if (groups.length) {
        block.appendChild(UI.table({
          id: 'groups-table',
          className: 'access-table',
          caption: 'Groupes Google autorisés',
          rows: groups,
          columns: [
            { label: 'Groupe', mono: true, rowHeader: true },
            { label: 'Rôle', className: 'access-role' },
            { label: 'Ajouté le', mono: true, className: 'access-added' },
            { label: '', className: 'access-actions' }
          ],
          rowAttrs: function (g) { return { dataset: { group: g.email } }; },
          cells: function (g) {
            return [
              g.email,
              entryRole(g, 'api_saveGroup', 'Rôle du groupe ' + g.email),
              addedCell(g),
              removeEntry({ email: g.email, apiName: 'api_removeGroup', aria: 'Retirer le groupe ' + g.email,
                title: 'Retirer le groupe', done: 'Groupe retiré — ' + g.email + '.',
                message: 'Les membres de ' + g.email + ' perdront le rôle donné par ce groupe.' })
            ];
          }
        }));
      } else {
        block.appendChild(UI.empty('Aucun groupe.', { small: true }));
      }

      block.appendChild(addEntryForm({ id: 'group', label: 'Ajouter un groupe', placeholder: 'equipe-labo@decathlon.com',
        button: 'Ajouter le groupe', busyLabel: 'Vérification…', apiName: 'api_saveGroup',
        emptyMessage: 'Saisissez l’adresse du groupe.', added: 'Groupe ajouté' }));
      return block;
    }

    function addedCell(entry) {
      return [Fmt.date(entry.added_at), entry.added_by ? el('span', { class: 'access-note' }, 'par ' + entry.added_by) : null];
    }

    render();
    return UI.section('Accès',
      el('p', { class: 'page-lede' }, 'L’application s’ouvre avec un compte Google du domaine. Les administrateurs ' +
        'modifient les données et ces paramètres ; les lecteurs consultent uniquement.'),
      wrap,
      el('p', { class: 'field-help', id: 'access-help' }, 'Le propriétaire du déploiement (' + view.owner + ') est ' +
        'toujours administrateur, et personne ne peut modifier son propre accès. Google ne transmet l’adresse que ' +
        'pour les comptes du même domaine Workspace : les autres comptes ne peuvent pas ouvrir l’application.'));
  }

  // ------------------------------------------------------------------------------ page

  function load(body) {
    UI.asyncBlock(body, {
      load: function () { return api.call('api_getSettings', null); },
      placeholder: function () { return UI.skeleton('lines', { label: 'Chargement des paramètres…', rows: 8 }); },
      render: function (s) {
        body.appendChild(sourceSection(s, function () { load(body); }));
        syncView = syncSection(s.sync);
        body.appendChild(syncView);
        body.appendChild(thresholdSection(s));
        State.setEditing(s.editing);
        editingView = editingSection(s);
        body.appendChild(editingView);
        body.appendChild(accessSection(s));
      }
    });
  }

  function mount(root) {
    page = root;
    syncView = null;
    editingView = null;
    unsubscribe = State.subscribe(function (st, changed) {
      if (changed.indexOf('sync') >= 0 && syncView && syncView.isConnected && st.sync) syncView.__sync(st.sync);
      if (changed.indexOf('editing') >= 0 && editingView && editingView.isConnected) editingView.__editing(st.editing);
    });
    var body = el('div', { class: 'settings-body', id: 'settings-body' });
    root.appendChild(UI.pageHeader({ title: 'Paramètres', kicker: 'Shadow IT · administration' }));
    root.appendChild(body);
    load(body);
  }

  function unmount() {
    page = null;
    syncView = null;
    editingView = null;
    if (unsubscribe) unsubscribe();
    unsubscribe = null;
  }

  window.Pages.settings = { id: 'settings', title: 'Paramètres', mount: mount, unmount: unmount };
})();
</script>
