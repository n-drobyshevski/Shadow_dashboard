<script>
/**
 * window.api — Promise wrapper around google.script.run (docs/API.md §5).
 *
 * Every server function takes one JSON string and returns one JSON envelope string
 * {ok:true, data} | {ok:false, error:{code, message, field?}}.
 *   api.call('api_getMonthData', {month: '2026-05'}).then(function (data) { ... })
 * Rejections are Error objects with a `.code`: one of Core.ERROR_CODES, or 'TRANSPORT' when the
 * call itself failed (network, authorization, server crash outside apiWrap_, malformed reply), and a
 * `.field` when the server named the form field a VALIDATION error is about.
 * Every call logs `[rpc] <name> <ms>ms` (plus the error code on failure) with console.debug: the
 * round trip as the browser sees it, to compare with the server's {api, ms} line (docs/API.md §4).
 */
(function () {
  'use strict';

  function makeErr(code, message, field) {
    var err = new Error(message || 'Erreur inconnue.');
    err.code = code;
    if (typeof field === 'string' && field !== '') err.field = field;
    return err;
  }

  function now() {
    return window.performance && typeof window.performance.now === 'function' ? window.performance.now() : Date.now();
  }

  /** Development timing line; never throws. */
  function logRpc(name, t0, code) {
    try {
      console.debug('[rpc] ' + name + ' ' + Math.round(now() - t0) + 'ms' + (code ? ' ' + code : ''));
    } catch (e) { /* no console */ }
  }

  function call(name, args) {
    var t0 = now();
    return new Promise(function (resolve, reject) {
      var run = window.google && window.google.script && window.google.script.run;
      if (!run) {
        reject(makeErr('TRANSPORT', 'Service Apps Script indisponible (google.script.run).'));
        return;
      }
      var runner = run
        .withSuccessHandler(function (reply) {
          var env;
          try {
            env = typeof reply === 'string' ? JSON.parse(reply) : reply;
          } catch (e) {
            logRpc(name, t0, 'TRANSPORT');
            reject(makeErr('TRANSPORT', 'Réponse du serveur illisible.'));
            return;
          }
          if (env && env.ok === true) {
            logRpc(name, t0);
            resolve(env.data);
          } else if (env && env.ok === false && env.error) {
            logRpc(name, t0, env.error.code || 'INTERNAL');
            reject(makeErr(env.error.code || 'INTERNAL', env.error.message, env.error.field));
          } else {
            logRpc(name, t0, 'TRANSPORT');
            reject(makeErr('TRANSPORT', 'Réponse du serveur inattendue.'));
          }
        })
        .withFailureHandler(function (e) {
          var msg = (e && e.message) ? e.message : String(e || 'Erreur de communication avec le serveur.');
          logRpc(name, t0, 'TRANSPORT');
          reject(makeErr('TRANSPORT', msg));
        });
      if (typeof runner[name] !== 'function') {
        reject(makeErr('TRANSPORT', 'Fonction serveur inconnue : ' + name));
        return;
      }
      runner[name](JSON.stringify(args === undefined ? null : args));
    });
  }

  window.api = { call: call };
})();
</script>
