<script>
/**
 * window.Charts — Plotly wrappers with one shared "audit ledger" theme (docs/API.md §5, docs/DESIGN.md).
 *
 * Every function draws into `el` with Plotly.react (idempotent: redraws reuse the same element),
 * config {responsive:true, displayModeBar:false}, and falls back to UI.empty('Graphique indisponible')
 * when Plotly could not be loaded (CDN blocked, offline...).
 *
 * Theme: IBM Plex Sans (figures in Plex Mono), transparent backgrounds, ink/neutral axes, no
 * gridlines unless they carry reading value, tight margins, French separators, no titles inside
 * plots (the page puts a small-caps label above each chart). Colours come from the CSS tokens
 * (css.html :root) through Charts.tokens(); colour is used for status only.
 *
 * Page authors: series without `color` get the ledger defaults (ink solid, ink-3 dashed, accent, ...);
 * series accept `dash` ('solid'|'dash'|'dot'). Charts.tokens() returns the palette.
 */
(function () {
  'use strict';

  var CONFIG = { responsive: true, displayModeBar: false };
  var FALLBACK = {
    ink: '#16181b', ink2: '#4a4f57', ink3: '#6b7079', rule: '#e3e4e6', rule2: '#c9cbcf',
    paper: '#ffffff', paper2: '#f6f6f4', accent: '#0b63ce', ok: '#1f7a4d', ko: '#b42318', warn: '#a15c07',
    riskCritique: '#b42318', riskEleve: '#d4621b', riskMoyen: '#c99a06', riskFaible: '#1f7a4d',
    sans: '"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif',
    mono: '"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace'
  };
  var VARS = {
    ink: '--ink', ink2: '--ink-2', ink3: '--ink-3', rule: '--rule', rule2: '--rule-2', paper: '--paper',
    paper2: '--paper-2', accent: '--accent', ok: '--ok', ko: '--ko', warn: '--warn',
    riskCritique: '--risk-critique', riskEleve: '--risk-eleve', riskMoyen: '--risk-moyen',
    riskFaible: '--risk-faible', sans: '--font-sans', mono: '--font-mono'
  };
  var NBSP = ' '; // narrow no-break space (fr-FR before %)

  /** Design tokens read from the stylesheet (fallbacks when the CSS variables are missing). */
  function tokens() {
    var out = {};
    var cs = null;
    try { cs = window.getComputedStyle(document.documentElement); } catch (e) { cs = null; }
    Object.keys(VARS).forEach(function (k) {
      var v = cs ? String(cs.getPropertyValue(VARS[k]) || '').trim() : '';
      out[k] = v || FALLBACK[k];
    });
    out.risk = { 'Critique': out.riskCritique, 'Élevé': out.riskEleve, 'Moyen': out.riskMoyen, 'Faible': out.riskFaible };
    return out;
  }

  function rgba(hex, alpha) {
    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(String(hex || ''));
    if (!m) return hex;
    return 'rgba(' + parseInt(m[1], 16) + ',' + parseInt(m[2], 16) + ',' + parseInt(m[3], 16) + ',' + alpha + ')';
  }

  function axis(t, extra) {
    return Object.assign({
      showgrid: false,
      zeroline: false,
      showline: false,
      linecolor: t.rule2,
      linewidth: 1,
      ticks: '',
      tickcolor: t.rule2,
      ticklen: 4,
      tickfont: { family: t.mono, size: 11, color: t.ink3 },
      title: { text: '' },
      fixedrange: true,
      automargin: true
    }, extra || {});
  }

  function baseLayout(t, extra) {
    var layout = {
      font: { family: t.sans, size: 12, color: t.ink2 },
      paper_bgcolor: 'rgba(0,0,0,0)',
      plot_bgcolor: 'rgba(0,0,0,0)',
      margin: { l: 8, r: 8, t: 8, b: 8, pad: 0 },
      separators: ', ',            // French: decimal comma, space as thousands separator
      showlegend: false,
      hovermode: 'closest',
      hoverlabel: { bgcolor: t.ink, bordercolor: t.ink, font: { family: t.mono, size: 12, color: '#ffffff' }, align: 'left' },
      dragmode: false
    };
    return Object.assign(layout, extra || {});
  }

  function unavailable(el) {
    UI.clear(el);
    el.appendChild(UI.empty('Graphique indisponible'));
    return null;
  }

  function draw(el, data, layout) {
    if (!el) return null;
    if (!window.Plotly || typeof window.Plotly.react !== 'function') return unavailable(el);
    el.classList.add('chart');
    try {
      var p = window.Plotly.react(el, data, layout, CONFIG);
      if (p && typeof p.catch === 'function') {
        p.catch(function (e) { console.error('Plotly', e); unavailable(el); });
      }
      return p;
    } catch (e) {
      console.error('Plotly', e);
      return unavailable(el);
    }
  }

  function thresholdLabel(value) { return 'seuil ' + value + NBSP + '%'; }

  /**
   * Compliance gauge 0–100 % (kept from the Streamlit original), restyled: thin flat arc on a neutral
   * track, bar --ok when >= threshold else --ko, 1–2px ink tick at the threshold that just overshoots the
   * arc, value as a mono figure. Plotly centres the arc in its ring (inner radius 0.75), so its own 0 / 100
   * tick labels float away from the arc ends: they are replaced by two small mono labels placed right
   * under the arc ends (measured from the drawn arc after every redraw); "80" stays a Plotly tick label.
   */
  function gauge(el, value, opts) {
    var o = opts || {};
    var t = tokens();
    var v = value === null || value === undefined || !isFinite(Number(value)) ? 0 : Number(value);
    var ok = v >= Core.THRESHOLD;
    var band = 0.2;      // thickness of the arc, as a fraction of the gauge ring
    var p = draw(el, [{
      type: 'indicator',
      mode: 'gauge+number',
      value: v,
      // The narrow space before % is set in the sans face: in Plex Mono it would take a full cell.
      number: { suffix: '<span style="font-family:' + t.sans.replace(/"/g, "'") + '">' + NBSP + '</span>%',
        valueformat: '.1f', font: { family: t.mono, size: 30, color: t.ink } },
      gauge: {
        shape: 'angular',
        axis: {
          range: [0, 100], tickmode: 'array', tickvals: [0, Core.THRESHOLD, 100],
          ticktext: ['', String(Core.THRESHOLD), ''], ticks: '', ticklen: 0, tickwidth: 0,
          tickcolor: t.rule2, tickfont: { family: t.mono, size: 10, color: t.ink3 }, showticklabels: true
        },
        bar: { color: ok ? t.ok : t.ko, thickness: band, line: { width: 0 } },
        bgcolor: 'rgba(0,0,0,0)',
        borderwidth: 0,
        steps: [{ range: [0, 100], color: t.rule, thickness: band, line: { width: 0 } }],
        threshold: { line: { color: t.ink, width: 2 }, thickness: band + 0.12, value: Core.THRESHOLD }
      },
      domain: { x: [0, 1], y: [0, 1] }
    }], baseLayout(t, { height: o.height || 176, margin: { l: 24, r: 24, t: 14, b: 18 } }));
    if (p && typeof p.then === 'function') {
      p.then(function () {
        gaugeEnds(el);
        if (typeof el.on === 'function' && !el.__gaugeEnds) {
          el.__gaugeEnds = true;
          el.on('plotly_afterplot', function () { gaugeEnds(el); });
        }
      }, function () {});
    }
    return p;
  }

  /** "0" and "100" under the two ends of the gauge arc (HTML labels, positioned from the drawn ring). */
  function gaugeEnds(el) {
    if (!el || !el.isConnected) return;
    var ring = el.querySelectorAll('g.angular path');
    var box = el.getBoundingClientRect();
    var l = Infinity, r = -Infinity, b = -Infinity;
    Array.prototype.forEach.call(ring, function (pth) {
      var rc = pth.getBoundingClientRect();
      if (!rc.width) return;
      l = Math.min(l, rc.left); r = Math.max(r, rc.right); b = Math.max(b, rc.bottom);
    });
    var wrap = el.querySelector('.gauge-ends');
    if (!isFinite(l) || !isFinite(r)) { if (wrap) wrap.hidden = true; return; }
    if (!wrap) {
      wrap = UI.el('div', { class: 'gauge-ends', 'aria-hidden': 'true' },
        UI.el('span', { class: 'gauge-end gauge-end-min' }, '0'), UI.el('span', { class: 'gauge-end gauge-end-max' }, '100'));
      el.appendChild(wrap);
    }
    wrap.hidden = false;
    var radius = (r - l) / 2;
    var mid = radius * (0.75 + 0.25 / 2);         // radius of the centre line of the arc
    var cx = l - box.left + radius;
    var spans = wrap.children;
    spans[0].style.left = (cx - mid) + 'px';
    spans[1].style.left = (cx + mid) + 'px';
    spans[0].style.top = spans[1].style.top = (b - box.top + 2) + 'px';
  }

  /** One horizontal bar per risk level (Core.RISK_ORDER, top to bottom), risk colours, count at the bar end. */
  function riskBars(el, counts) {
    var c = counts || {};
    var t = tokens();
    var levels = Core.RISK_ORDER.slice();
    var values = levels.map(function (k) { return Number(c[k]) || 0; });
    var max = Math.max(1, Math.max.apply(null, values));
    return draw(el, [{
      type: 'bar',
      orientation: 'h',
      y: levels,
      x: values,
      text: values.map(String),
      textposition: 'outside',
      textfont: { family: t.mono, size: 12, color: t.ink },
      cliponaxis: false,
      width: 0.5,
      marker: { color: levels.map(function (k) { return t.risk[k]; }), line: { width: 0 } },
      hovertemplate: '%{y} : %{x}<extra></extra>'
    }], baseLayout(t, {
      height: levels.length * 32 + 12,
      margin: { l: 4, r: 28, t: 4, b: 4 },
      bargap: 0.5,
      xaxis: axis(t, { visible: false, range: [0, max * 1.12] }),
      yaxis: axis(t, { autorange: 'reversed', type: 'category', ticksuffix: '  ',
        tickfont: { family: t.sans, size: 13, color: t.ink } })
    }));
  }

  /**
   * 10 equal bins on 0–100 (Core.histogramBins). Bins below the threshold in --ko at 70 % opacity,
   * at/above in --ok; dashed ink line at 80 labelled "seuil 80 %"; counts printed above non-empty bins.
   */
  function histogram(el, scores) {
    var t = tokens();
    var bins = Core.histogramBins((scores || []).filter(function (s) { return s !== null && s !== undefined; }), 10);
    var counts = bins.map(function (b) { return b.count; });
    var max = Math.max(1, Math.max.apply(null, counts));
    return draw(el, [{
      type: 'bar',
      x: bins.map(function (b) { return (b.x0 + b.x1) / 2; }),
      y: counts,
      width: bins.map(function (b) { return (b.x1 - b.x0) * 0.72; }),
      customdata: bins.map(function (b) { return b.x0 + '–' + b.x1 + NBSP + '%'; }),
      text: counts.map(function (n) { return n ? String(n) : ''; }),
      textposition: 'outside',
      textfont: { family: t.mono, size: 11, color: t.ink2 },
      cliponaxis: false,
      marker: {
        color: bins.map(function (b) { return b.x0 >= Core.THRESHOLD ? t.ok : rgba(t.ko, 0.7); }),
        line: { width: 0 }
      },
      hovertemplate: 'Score %{customdata} : %{y}<extra></extra>'
    }], baseLayout(t, {
      height: 200,
      margin: { l: 4, r: 4, t: 30, b: 4 },
      bargap: 0,
      xaxis: axis(t, { range: [0, 100], tickmode: 'array', tickvals: [0, 20, 40, 60, 80, 100],
        ticktext: ['0', '20', '40', '60', '80', '100' + NBSP + '%'], showline: true, ticks: 'outside' }),
      yaxis: axis(t, { visible: false, rangemode: 'tozero', range: [0, max * 1.18] }),
      shapes: [{ type: 'line', xref: 'x', yref: 'paper', x0: Core.THRESHOLD, x1: Core.THRESHOLD, y0: 0, y1: 1.08,
        line: { color: t.ink, width: 1, dash: 'dash' } }],
      annotations: [{ x: Core.THRESHOLD, xref: 'x', y: 1.08, yref: 'paper', text: thresholdLabel(Core.THRESHOLD),
        showarrow: false, xanchor: 'right', yanchor: 'bottom', xshift: -4,
        font: { family: t.sans, size: 11, color: t.ink2 } }]
    }));
  }

  function defaultSeriesStyle(t, i) {
    var styles = [
      { color: t.ink, dash: 'solid' },
      { color: t.ink3, dash: 'dash' },
      { color: t.accent, dash: 'solid' },
      { color: t.rule2, dash: 'dot' }
    ];
    return styles[i % styles.length];
  }

  function lastIndex(ys) {
    for (var i = (ys || []).length - 1; i >= 0; i--) {
      if (ys[i] !== null && ys[i] !== undefined && isFinite(Number(ys[i]))) return i;
    }
    return -1;
  }

  /**
   * Line chart: {x, series:[{name, y, color?, dash?}], threshold?, yTitle?, yRange?}.
   * Series are labelled directly at their last point (no legend); the threshold is a dotted rule
   * labelled at the right edge.
   */
  function line(el, opts) {
    var o = opts || {};
    var t = tokens();
    var x = o.x || [];
    var series = o.series || [];
    var annotations = [];
    var data = series.map(function (s, i) {
      var st = defaultSeriesStyle(t, i);
      var color = s.color || st.color;
      var li = lastIndex(s.y);
      if (li >= 0) {
        annotations.push({ x: x[li], y: s.y[li], xref: 'x', yref: 'y', text: String(s.name || ''), showarrow: false,
          xanchor: 'left', yanchor: 'middle', xshift: 8, font: { family: t.sans, size: 12, color: t.ink } });
      }
      return {
        type: 'scatter',
        mode: x.length > 1 ? 'lines+markers' : 'markers',
        name: s.name,
        x: x,
        y: s.y || [],
        connectgaps: false,
        line: { color: color, width: 2, dash: s.dash || (s.color ? 'solid' : st.dash) },
        marker: { size: 6, color: color, line: { width: 0 } },
        hovertemplate: '%{x} — ' + String(s.name || '').replace(/[<>%{}]/g, '') + ' : %{y}<extra></extra>'
      };
    });
    // Nudge direct labels apart when two series end on (almost) the same value.
    if (annotations.length === 2 && Math.abs(Number(annotations[0].y) - Number(annotations[1].y)) < 6) {
      var up = Number(annotations[0].y) >= Number(annotations[1].y) ? 0 : 1;
      annotations[up].yshift = 8;
      annotations[1 - up].yshift = -8;
    }
    var hasThreshold = o.threshold !== undefined && o.threshold !== null;
    if (hasThreshold) {
      annotations.push({ x: 1, xref: 'paper', y: o.threshold, yref: 'y', text: thresholdLabel(o.threshold),
        showarrow: false, xanchor: 'right', yanchor: 'bottom', font: { family: t.sans, size: 11, color: t.ink2 } });
    }
    var labelRoom = series.reduce(function (m, s) { return Math.max(m, String(s.name || '').length); }, 0) * 7 + 16;
    return draw(el, data, baseLayout(t, {
      height: o.height || 280,
      margin: { l: 4, r: Math.min(140, labelRoom), t: 12, b: 4 },
      hovermode: 'x',
      xaxis: axis(t, { type: 'category', showline: true, ticks: 'outside' }),
      // yTitle is accepted for compatibility but not drawn: the label above the chart names the measure.
      yaxis: axis(t, { range: o.yRange || undefined, rangemode: 'tozero', showgrid: true, gridcolor: t.rule,
        gridwidth: 1, nticks: 5 }),
      shapes: hasThreshold ? [{ type: 'line', xref: 'paper', yref: 'y', x0: 0, x1: 1, y0: o.threshold, y1: o.threshold,
        line: { color: t.ink, width: 1, dash: 'dot' } }] : [],
      annotations: annotations
    }));
  }

  /**
   * Bar chart: {x, y, colors?, yTitle?, horizontal?}. Extension: {x, series:[{name, y, color?, outline?:bool|fill}]}
   * draws grouped bars with a legend placed above the plot area (never over the bars).
   * Options: labels:true prints each count above its bar (mono 11px ink-2) and drops the value axis;
   * legend:false hides the legend (the page then puts a key in the caption). outline:true draws a series
   * as a 1px outline in its colour on paper instead of a solid bar.
   */
  function bars(el, opts) {
    var o = opts || {};
    var t = tokens();
    var horizontal = !!o.horizontal;
    var palette = [t.rule2, t.ink, t.ink3, t.accent];
    var labels = !!o.labels;
    function trace(name, y, color, i, outline) {
      var c = color || palette[i % palette.length];
      // outline: true -> paper fill; a colour string -> that fill (e.g. --paper-2 to tell two outlines apart).
      var tr = {
        type: 'bar',
        name: name,
        orientation: horizontal ? 'h' : 'v',
        marker: outline ? { color: typeof outline === 'string' ? outline : t.paper, line: { width: 1, color: c } } :
          { color: c, line: { width: 0 } },
        hovertemplate: (horizontal ? '%{y} : %{x}' : '%{x} : %{y}') + (name ? ' — ' + String(name).replace(/[<>%{}]/g, '') : '') +
          '<extra></extra>'
      };
      if (horizontal) { tr.x = y; tr.y = o.x || []; } else { tr.x = o.x || []; tr.y = y; }
      if (labels) {
        tr.texttemplate = horizontal ? '%{x}' : '%{y}';
        tr.textposition = 'outside';
        tr.textfont = { family: t.mono, size: 11, color: t.ink2 };
        tr.cliponaxis = false;
      }
      return tr;
    }
    var multi = !!(o.series && o.series.length > 1);
    var data = o.series && o.series.length ?
      o.series.map(function (s, i) { return trace(s.name, s.y || [], s.color, i, s.outline || false); }) :
      [trace('', o.y || [], o.colors || t.ink, 0, false)];
    var maxValue = 1;
    data.forEach(function (d) {
      (horizontal ? d.x : d.y).forEach(function (v) { if (isFinite(Number(v))) maxValue = Math.max(maxValue, Number(v)); });
    });
    // With printed counts the value axis is redundant: no ticks, no gridlines, headroom for the labels.
    var valueAxis = labels ? axis(t, { visible: false, rangemode: 'tozero', range: [0, maxValue * 1.15] }) :
      axis(t, { rangemode: 'tozero', showgrid: true, gridcolor: t.rule, nticks: 5 });
    var showLegend = multi && o.legend !== false;
    var catAxis = axis(t, { type: 'category', showline: true, ticks: 'outside',
      tickfont: { family: horizontal ? t.sans : t.mono, size: horizontal ? 12 : 11, color: horizontal ? t.ink : t.ink3 } });
    if (horizontal) catAxis.autorange = 'reversed';
    return draw(el, data, baseLayout(t, {
      height: o.height || (horizontal ? Math.max(160, 30 * (o.x || []).length + 40) : 280),
      margin: { l: 4, r: 8, t: labels ? 16 : 8, b: 4 },
      barmode: 'group',
      bargap: 0.35,
      bargroupgap: 0.08,
      showlegend: showLegend,
      legend: { orientation: 'h', x: 0, xanchor: 'left', y: 1.02, yanchor: 'bottom', traceorder: 'normal',
        font: { family: t.sans, size: 12, color: t.ink2 }, itemwidth: 30, itemclick: false, itemdoubleclick: false },
      xaxis: horizontal ? valueAxis : catAxis,
      yaxis: horizontal ? catAxis : valueAxis
    }));
  }

  /**
   * Heatmap: {x, y, z:[[number|null]], zmin=0, zmax=100, title?}: sequential single hue (paper -> --ok),
   * % printed in each cell in mono, no colour bar. `title` is ignored inside the plot (label it above).
   */
  function heatmap(el, opts) {
    var o = opts || {};
    var t = tokens();
    var zmin = o.zmin === undefined ? 0 : o.zmin;
    var zmax = o.zmax === undefined ? 100 : o.zmax;
    var z = o.z || [];
    var text = z.map(function (row) {
      return (row || []).map(function (v) { return v === null || v === undefined ? '' : UI.fmtPct(v, 0).replace(' %', NBSP + '%'); });
    });
    var yLabels = o.y || [];
    return draw(el, [{
      type: 'heatmap',
      x: o.x || [],
      y: yLabels,
      z: z,
      zmin: zmin,
      zmax: zmax,
      text: text,
      texttemplate: '%{text}',
      textfont: { family: t.mono, size: 12 },
      hovertemplate: '%{y} — %{x} : %{text}<extra></extra>',
      xgap: 2,
      ygap: 2,
      showscale: false,
      colorscale: [[0, t.paper2], [0.5, rgba(t.ok, 0.35)], [1, t.ok]]
    }], baseLayout(t, {
      height: Math.max(140, 34 * yLabels.length + 40),
      margin: { l: 4, r: 4, t: 4, b: 4 },
      xaxis: axis(t, { type: 'category', side: 'top' }),
      yaxis: axis(t, { type: 'category', autorange: 'reversed', ticksuffix: '  ',
        tickfont: { family: t.sans, size: 12, color: t.ink } })
    }));
  }

  function purge(el) {
    if (el && window.Plotly && typeof window.Plotly.purge === 'function') {
      try { window.Plotly.purge(el); } catch (e) { /* ignore */ }
    }
  }

  window.Charts = {
    gauge: gauge,
    riskBars: riskBars,
    histogram: histogram,
    line: line,
    bars: bars,
    heatmap: heatmap,
    purge: purge,
    tokens: tokens
  };
})();
</script>
