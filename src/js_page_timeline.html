<style>
/* Suivi temporel: only the KPI table layout is page-specific, the rest comes from css.html. */
.page-timeline .timeline-body { display: flex; flex-direction: column; gap: var(--s6); }
/* The label column stays visible while the months scroll sideways. */
.page-timeline .tl-kpi-table .tl-label-col {
  position: sticky; left: 0; z-index: 2; background: var(--paper); min-width: 240px; width: 32%;
  padding-right: var(--s5); box-shadow: inset -1px 0 0 var(--rule);
}
.page-timeline .tl-kpi-table thead .tl-label-col { background: var(--paper-2); z-index: 3; box-shadow: inset -1px 0 0 var(--rule-2); }
.page-timeline .tl-kpi-table td { min-width: 148px; }
/* The applications block starts under a stronger rule. */
.page-timeline .tl-kpi-table tr:has(+ tr.tl-group-start) > * { border-bottom-color: var(--rule-2); }
.page-timeline .tl-kpi-table th.tl-current { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
.page-timeline .tl-kpi-table .tl-value { color: var(--ink-2); }
.page-timeline .tl-kpi-table td.tl-current .tl-value { color: var(--ink); font-weight: 500; }
.page-timeline .tl-delta {
  display: inline-block; min-width: 8ch; margin-left: var(--s2); text-align: right;
  font-family: var(--font-mono); font-size: 12px; color: var(--ink-3);
}
.page-timeline .tl-delta.is-ok { color: var(--ok); }
.page-timeline .tl-delta.is-ko { color: var(--ko); }
.page-timeline .tl-legend .tl-delta { min-width: 0; margin-left: 0; }
/* On phones the delta goes under the value so that two months fit in 358px. */
@media (max-width: 700px) {
  .page-timeline .tl-kpi-table .tl-label-col { min-width: 128px; max-width: 150px; width: auto; white-space: normal; padding-right: var(--s2); }
  .page-timeline .tl-kpi-table td { min-width: 0; }
  .page-timeline .tl-kpi-table td .tl-delta { display: block; min-width: 0; margin-left: 0; line-height: 1.2; }
}
</style>
<script>
// Suivi temporel page: month-by-month KPIs computed in the browser from the cached timeline.
// The sidebar filters apply to every month, the same way as on the dashboard.
(function () {
  'use strict';

  var el = UI.el;
  var NO_TEAM = 'Sans équipe';

  var board = null;
  var view = null;

  // `better` is the direction of a favourable change; null for inventory sizes.
  var KPI_ROWS = [
    { key: 'total_postes', label: 'Postes inventoriés', kind: 'count', better: null },
    { key: 'postes_conformes', label: 'Postes conformes', kind: 'count', better: 'up' },
    { key: 'postes_non_conformes', label: 'Postes non conformes', kind: 'count', better: 'down' },
    { key: 'taux_postes', label: 'Taux de conformité — Postes', kind: 'pct', better: 'up' },
    { key: 'postes_sans_edr', label: 'Postes sans EDR', kind: 'count', better: 'down' },
    { key: 'postes_non_it', label: 'Postes non IT Decathlon', kind: 'count', better: 'down' },
    { key: 'postes_hors_reseau', label: 'Postes hors réseau Decathlon', kind: 'count', better: 'down' },
    { key: 'total_apps', label: 'Applications inventoriées', kind: 'count', better: null },
    { key: 'apps_conformes', label: 'Applications conformes', kind: 'count', better: 'up' },
    { key: 'apps_non_conformes', label: 'Applications non conformes', kind: 'count', better: 'down' },
    { key: 'taux_apps', label: 'Taux de conformité — Applications', kind: 'pct', better: 'up' },
    { key: 'apps_sans_sip', label: 'Applications sans SIP', kind: 'count', better: 'down' },
    { key: 'apps_sans_contrat', label: 'Applications sans contrat', kind: 'count', better: 'down' },
    { key: 'apps_sans_galink', label: 'Applications sans Galink', kind: 'count', better: 'down' },
    { key: 'apps_sans_idp', label: 'Applications sans IDP', kind: 'count', better: 'down' }
  ];

  function computeSeries(timeline, filters) {
    return timeline.map(function (m) {
      var f = Core.filterData({ postes: m.postes || [], applications: m.applications || [] }, filters);
      return { month: m.month, postes: f.postes, applications: f.applications,
        kpis: Core.computeKpis(f.postes, f.applications) };
    });
  }

  // Null rather than 0 when there is nothing to measure, so the chart shows a gap.
  function rate(total, ok) { return total ? (ok / total) * 100 : null; }

  function teamMatrix(series) {
    var teams = [];
    series.forEach(function (m) {
      m.postes.forEach(function (p) {
        var t = Core.str(p['Équipe']) || NO_TEAM;
        if (teams.indexOf(t) < 0) teams.push(t);
      });
    });
    teams.sort(function (a, b) {
      if (a === NO_TEAM || b === NO_TEAM) return a === b ? 0 : (a === NO_TEAM ? 1 : -1);
      return a.localeCompare(b, 'fr');
    });
    var z = teams.map(function (t) {
      return series.map(function (m) {
        var list = m.postes.filter(function (p) { return (Core.str(p['Équipe']) || NO_TEAM) === t; });
        return rate(list.length, list.filter(function (p) { return p._conforme === true; }).length);
      });
    });
    return { teams: teams, z: z };
  }

  function kickerText(series) {
    if (!series.length) return 'Aucun export importé';
    return Fmt.monthRange(series[0].month, series[series.length - 1].month) + ' · ' + series.length +
      ' export' + (series.length > 1 ? 's' : '');
  }

  function rateCaption(last) {
    var k = last.kpis;
    return Charts.thresholdCaption({
      prefix: Fmt.monthTitle(last.month) + ' — ',
      items: [
        { label: 'Postes', rate: rate(k.total_postes, k.postes_conformes) },
        { label: 'Applications', rate: rate(k.total_apps, k.apps_conformes) }
      ]
    });
  }

  function plural(n, word) { return word + (n > 1 ? 's' : ''); }

  function countsCaption(last) {
    var k = last.kpis;
    function part(ok, total, noun) {
      return [el('span', { class: 'num' }, UI.fmtNum(ok)), ' ' + plural(ok, noun) + ' ' + plural(ok, 'conforme') + ' sur ',
        el('span', { class: 'num' }, UI.fmtNum(total))];
    }
    return el('p', { class: 'chart-caption' }, Fmt.monthTitle(last.month) + ' — ',
      part(k.postes_conformes, k.total_postes, 'poste'), ' · ', part(k.apps_conformes, k.total_apps, 'application'),
      el('br'), el('span', { class: 'faint' }, 'Barre en contour : inventoriés · partie pleine : conformes.'));
  }

  function fmtValue(row, v) {
    return row.kind === 'pct' ? UI.fmtPctNode(v) : UI.fmtNum(v);
  }

  function fmtDelta(row, d) {
    // A change below display precision reads as unchanged.
    var eps = row.kind === 'pct' ? 0.05 : 0.5;
    if (Math.abs(d) < eps) return '=';
    var sign = d > 0 ? '+' : '−';
    var abs = Math.abs(d);
    if (row.kind === 'pct') {
      return sign + new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 })
        .format(abs) + UI.NNBSP + 'pt';
    }
    return sign + UI.fmtNum(abs);
  }

  function deltaTone(row, d) {
    var eps = row.kind === 'pct' ? 0.05 : 0.5;
    if (!row.better || Math.abs(d) < eps) return 'neutral';
    return (d > 0) === (row.better === 'up') ? 'ok' : 'ko';
  }

  var TONE_WORDS = { ok: 'amélioration', ko: 'dégradation', neutral: 'stable ou sans objet' };

  function kpiTable(series, selectedMonth) {
    var head = el('tr', null,
      el('th', { scope: 'col', class: 'tl-label-col' }, 'Indicateur'),
      series.map(function (m) {
        var current = m.month === selectedMonth;
        return el('th', { scope: 'col', class: 'num' + (current ? ' tl-current' : ''), dataset: { month: m.month } },
          Fmt.monthLong(m.month), current ? el('span', { class: 'sr-only' }, ' (mois sélectionné)') : null);
      }));
    var body = KPI_ROWS.map(function (row) {
      return el('tr', { dataset: { kpi: row.key }, class: row.key === 'total_apps' ? 'tl-group-start' : null },
        el('th', { scope: 'row', class: 'tl-label-col' }, row.label),
        series.map(function (m, i) {
          var v = m.kpis[row.key];
          var delta = null;
          if (i > 0) {
            var d = v - series[i - 1].kpis[row.key];
            var tone = deltaTone(row, d);
            // The colour is explained in words in the tooltip and in the legend under the table.
            delta = el('span', { class: 'tl-delta is-' + tone, dataset: { tone: tone },
              tooltip: 'Par rapport à ' + Fmt.monthLong(series[i - 1].month) + ' : ' + TONE_WORDS[tone] },
            fmtDelta(row, d));
          }
          return el('td', { class: 'num' + (m.month === selectedMonth ? ' tl-current' : ''), dataset: { month: m.month } },
            el('span', { class: 'tl-value' }, fmtValue(row, v)), delta);
        }));
    });
    return el('div', { class: 'table-scroll' },
      el('table', { class: 'table tl-kpi-table' + (series.length > 1 ? ' has-deltas' : ''), id: 'timeline-kpi-table' },
        el('caption', { class: 'sr-only' }, 'Indicateurs par mois avec évolution par rapport au mois précédent'),
        el('thead', null, head), el('tbody', null, body)));
  }

  function deltaLegend() {
    return el('p', { class: 'chart-caption tl-legend' }, 'Écart par rapport au mois précédent : ',
      el('span', { class: 'tl-delta is-ok' }, '+1'), ' amélioration · ',
      el('span', { class: 'tl-delta is-ko' }, '−1'), ' dégradation · ',
      el('span', { class: 'tl-delta is-neutral' }, '='), ' stable ou sans objet (taille des inventaires).');
  }

  function renderTimeline(body, s, timeline, kicker) {
    board = Charts.board({ sectionClass: 'chart-card' });
    // A period limits the history to its months; a single month shows the whole history.
    var per = State.period();
    var all = timeline || [];
    var shown = per.single ? all : all.filter(function (m) { return m.month >= per.from && m.month <= per.to; });
    var series = computeSeries(shown, s.filters || { equipes: [], batiments: [] });
    if (kicker) {
      kicker.textContent = kickerText(series) + (shown.length < all.length ? ' sur ' + all.length : '');
      if (per.single) delete kicker.dataset.from; else kicker.dataset.from = per.from;
    }

    var note = UI.filterNote('all');
    if (note) body.appendChild(note);

    if (!series.length) {
      body.appendChild(UI.noData('timeline-empty'));
      return;
    }
    if (series.length < 2) {
      body.appendChild(el('div', { class: 'alert alert-info', role: 'status', id: 'timeline-info' },
        'Au moins deux exports mensuels sont nécessaires pour visualiser une évolution.'));
    }

    var x = series.map(function (m) { return Fmt.monthLong(m.month); });
    var k = series.map(function (m) { return m.kpis; });
    var last = series[series.length - 1];
    var t = Charts.tokens();

    body.appendChild(el('div', { class: 'grid grid-2' },
      board.section('Taux de conformité', 'chart-timeline-taux', function (box) {
        Charts.line(box, {
          x: x,
          series: [
            { name: 'Postes', y: k.map(function (v) { return rate(v.total_postes, v.postes_conformes); }) },
            { name: 'Applications', y: k.map(function (v) { return rate(v.total_apps, v.apps_conformes); }) }
          ],
          threshold: Core.threshold(),
          unit: '%',
          yRange: [0, 105]
        });
      }, rateCaption(last)),
      // Bars are labelled directly, so there is no legend.
      board.section('Inventaire et conformité (nombre)', 'chart-timeline-counts', function (box) {
        Charts.partBars(box, {
          x: x,
          groups: [
            { label: 'Postes', color: t.ink,
              total: { name: 'Postes inventoriés', y: k.map(function (v) { return v.total_postes; }) },
              part: { name: 'Postes conformes', y: k.map(function (v) { return v.postes_conformes; }) } },
            { label: 'Applis', color: t.ink3,
              total: { name: 'Applications inventoriées', y: k.map(function (v) { return v.total_apps; }) },
              part: { name: 'Applications conformes', y: k.map(function (v) { return v.apps_conformes; }) } }
          ]
        });
      }, countsCaption(last))));

    var matrix = teamMatrix(series);
    body.appendChild(matrix.teams.length ?
      board.section('Conformité des postes par équipe', 'chart-timeline-heatmap', function (box) {
        Charts.heatmap(box, { x: x, y: matrix.teams, z: matrix.z, zmin: 0, zmax: 100, maxCellWidth: 112 });
      }, el('p', { class: 'chart-caption' }, 'Part des postes conformes par équipe et par mois. Case vide : aucun poste ce mois-là.')) :
      UI.section('Conformité des postes par équipe', UI.empty('Aucun poste ne correspond aux filtres sélectionnés.')));

    body.appendChild(UI.section('Indicateurs par mois', kpiTable(series, s.month),
      series.length > 1 ? deltaLegend() : null));

    board.draw();
  }

  function load(v, force) {
    if (board) board.purge();
    return UI.asyncBlock(v.body, {
      load: function () { return State.loadTimeline({ force: !!force }); },
      placeholder: function () { return UI.skeleton('chart', { label: 'Chargement de l’historique…' }); },
      error: { prefix: 'Impossible de charger l’historique', retry: function () { load(v, true); } },
      errorId: 'timeline-error',
      render: function (tl) { v.timeline = tl; renderTimeline(v.body, State.get(), tl, v.kicker); }
    });
  }

  function mount(root) {
    var refreshBtn = el('button', { type: 'button', class: 'btn btn-secondary', id: 'timeline-refresh',
      tooltip: 'Recharger l’historique depuis le classeur de données' }, 'Actualiser');
    var header = UI.pageHeader({ title: 'Suivi temporel', kicker: 'Historique des exports', kickerId: 'timeline-kicker',
      actions: [refreshBtn] });
    var v = view = { body: el('div', { class: 'timeline-body', id: 'timeline-body' }),
      kicker: header.querySelector('.page-kicker'), timeline: null };
    refreshBtn.addEventListener('click', function () { UI.busy(refreshBtn, load(v, true)); });
    root.appendChild(header);
    root.appendChild(v.body);
    load(v, false);
  }

  // A filter change recomputes from the loaded history without reloading it.
  function update(changed) {
    if (!view || !view.timeline || changed.length !== 1 || changed[0] !== 'filters') return false;
    if (board) board.purge();
    UI.clear(view.body);
    renderTimeline(view.body, State.get(), view.timeline, view.kicker);
    return true;
  }

  function unmount() {
    view = null;
    if (board) board.purge();
  }

  window.Pages = window.Pages || {};
  window.Pages.timeline = { id: 'timeline', title: 'Suivi temporel', mount: mount, unmount: unmount, update: update };
})();
</script>
