<script>
/**
 * Pages.timeline — "Suivi temporel" (docs/API.md §6).
 *
 * Month-by-month evolution of the conformity KPIs, computed client-side from the slim records of
 * api_getTimeline (State.loadTimeline, cached). The global sidebar filters (Équipe / Bâtiment) are
 * applied to every month with Core.filterData before Core.computeKpis, exactly like the dashboard.
 *
 * Sections: conformity rate line chart (Postes / Applications, threshold 80), inventoried vs
 * conformant counts, équipe × month heatmap of the postes conformity rate, KPI table with the delta
 * vs the previous month.
 */
(function () {
  'use strict';

  var el = UI.el;
  var NO_TEAM = 'Sans équipe';

  var token = 0;        // bumped on every mount/unmount: stale async renders are dropped
  var chartEls = [];

  /**
   * KPI table rows. `kind`: 'pct' (percentage, delta in points) or 'count'.
   * `better`: direction of a favourable change ('up' / 'down'), null when neutral (inventory sizes).
   */
  var KPI_ROWS = [
    { key: 'total_postes', label: 'Postes inventoriés', kind: 'count', better: null },
    { key: 'postes_conformes', label: 'Postes conformes', kind: 'count', better: 'up' },
    { key: 'postes_non_conformes', label: 'Postes non conformes', kind: 'count', better: 'down' },
    { key: 'taux_postes', label: 'Taux de conformité — Postes', kind: 'pct', better: 'up' },
    { key: 'postes_sans_edr', label: 'Postes sans EDR', kind: 'count', better: 'down' },
    { key: 'postes_non_it', label: 'Postes non IT Decathlon', kind: 'count', better: 'down' },
    { key: 'postes_hors_reseau', label: 'Postes hors réseau Decathlon', kind: 'count', better: 'down' },
    { key: 'total_apps', label: 'Applications inventoriées', kind: 'count', better: null },
    { key: 'apps_conformes', label: 'Applications conformes', kind: 'count', better: 'up' },
    { key: 'apps_non_conformes', label: 'Applications non conformes', kind: 'count', better: 'down' },
    { key: 'taux_apps', label: 'Taux de conformité — Applications', kind: 'pct', better: 'up' },
    { key: 'apps_sans_sip', label: 'Applications sans SIP', kind: 'count', better: 'down' },
    { key: 'apps_sans_contrat', label: 'Applications sans contrat', kind: 'count', better: 'down' },
    { key: 'apps_sans_galink', label: 'Applications sans Galink', kind: 'count', better: 'down' },
    { key: 'apps_sans_idp', label: 'Applications sans IDP', kind: 'count', better: 'down' }
  ];

  // ------------------------------------------------------------------------------ computations

  /** [{month, postes, applications, kpis}] with the global filters applied to each month. */
  function computeSeries(timeline, filters) {
    return (timeline || []).map(function (m) {
      var f = Core.filterData({ postes: m.postes || [], applications: m.applications || [] }, filters);
      return { month: m.month, postes: f.postes, applications: f.applications,
        kpis: Core.computeKpis(f.postes, f.applications) };
    });
  }

  /** Conformity rate, or null when there is nothing to measure (avoids plotting a misleading 0 %). */
  function rate(total, ok) { return total ? (ok / total) * 100 : null; }

  /** Équipe × month matrix of the postes conformity rate (null when the équipe has no poste that month). */
  function teamMatrix(series) {
    var teams = [];
    series.forEach(function (m) {
      m.postes.forEach(function (p) {
        var t = Core.str(p['Équipe']) || NO_TEAM;
        if (teams.indexOf(t) < 0) teams.push(t);
      });
    });
    teams.sort(function (a, b) {
      if (a === NO_TEAM || b === NO_TEAM) return a === b ? 0 : (a === NO_TEAM ? 1 : -1);
      return a.localeCompare(b, 'fr');
    });
    var z = teams.map(function (t) {
      return series.map(function (m) {
        var list = m.postes.filter(function (p) { return (Core.str(p['Équipe']) || NO_TEAM) === t; });
        return rate(list.length, list.filter(function (p) { return p._conforme === true; }).length);
      });
    });
    return { teams: teams, z: z };
  }

  // ------------------------------------------------------------------------------ rendering helpers

  var NBSP = '\u202f';    // narrow no-break space (fr-FR, before %)

  function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  /** Small-caps line above the title: "Avril 2026 – mai 2026 · 2 exports". */
  function kickerText(series) {
    if (!series.length) return 'Aucun export importé';
    var first = series[0].month;
    var last = series[series.length - 1].month;
    var range = first === last ? capitalize(UI.fmtMonth(first)) :
      capitalize(UI.fmtMonth(first)) + ' – ' + UI.fmtMonth(last);
    return range + ' · ' + series.length + ' export' + (series.length > 1 ? 's' : '');
  }

  function filterNote(s) {
    var f = s.filters || {};
    var parts = [];
    if ((f.equipes || []).length) parts.push('Équipe : ' + f.equipes.join(', '));
    if ((f.batiments || []).length) parts.push('Bâtiment / Labo : ' + f.batiments.join(', ') + ' (postes uniquement)');
    if (!parts.length) return null;
    return el('p', { class: 'filter-note', role: 'status' }, 'Filtres actifs — ' + parts.join(' · '));
  }

  /** Hairline block with a small-caps label and a chart box; the draw runs once the box is in the DOM. */
  function chartCard(title, id, draws, drawFn, caption) {
    var box = el('div', { class: 'chart-box', id: id, role: 'img', 'aria-label': title });
    chartEls.push(box);
    draws.push(function () { drawFn(box); });
    return el('div', { class: 'card chart-card' }, el('h3', { class: 'card-title' }, title), box,
      caption ? el('p', { class: 'chart-caption' }, caption) : null);
  }

  function pct(v) { return UI.fmtPct(v).replace(' %', NBSP + '%'); }

  /** "Mai 2026 — ■ Postes 71,4 % · ■ Applications 60,0 % · seuil 80 %" (status never colour-only). */
  function rateCaption(last) {
    var k = last.kpis;
    function part(label, total, ok) {
      var r = rate(total, ok);
      if (r === null) return el('span', { class: 'faint' }, label + ' —');
      var above = r >= Core.THRESHOLD;
      var m = UI.statusMark(label + ' ' + pct(r), above ? 'ok' : 'ko');
      m.title = above ? 'Seuil atteint' : 'Sous le seuil';
      return m;
    }
    return [capitalize(UI.fmtMonth(last.month)) + ' — ', part('Postes', k.total_postes, k.postes_conformes), ' · ',
      part('Applications', k.total_apps, k.apps_conformes), ' · seuil ',
      el('span', { class: 'num' }, Core.THRESHOLD + NBSP + '%')];
  }

  /** "Mai 2026 — 5 postes conformes sur 7 · 3 applications conformes sur 5". */
  function countsCaption(last) {
    var k = last.kpis;
    return [capitalize(UI.fmtMonth(last.month)) + ' — ',
      el('span', { class: 'num' }, UI.fmtNum(k.postes_conformes)), ' poste' + (k.postes_conformes > 1 ? 's' : '') +
        ' conforme' + (k.postes_conformes > 1 ? 's' : '') + ' sur ', el('span', { class: 'num' }, UI.fmtNum(k.total_postes)),
      ' · ', el('span', { class: 'num' }, UI.fmtNum(k.apps_conformes)), ' application' + (k.apps_conformes > 1 ? 's' : '') +
        ' conforme' + (k.apps_conformes > 1 ? 's' : '') + ' sur ', el('span', { class: 'num' }, UI.fmtNum(k.total_apps))];
  }

  /** How to read the counts chart, in words (the bars carry their own labels: no legend to decode). */
  function countsHowTo() {
    return el('span', { class: 'faint' }, 'Barre en contour : inventoriés · partie pleine : conformes.');
  }

  function fmtValue(row, v) {
    return row.kind === 'pct' ? UI.fmtPctNode(v) : UI.fmtNum(v);
  }

  /** Signed delta text: '+2', '−1', '=' for counts; '+5,0 pt', '−2,5 pt' for percentages. */
  function fmtDelta(row, d) {
    var eps = row.kind === 'pct' ? 0.05 : 0.5;   // below display precision -> unchanged
    if (Math.abs(d) < eps) return '=';
    var sign = d > 0 ? '+' : '−';
    var abs = Math.abs(d);
    if (row.kind === 'pct') {
      return sign + new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 })
        .format(abs) + ' pt';
    }
    return sign + UI.fmtNum(abs);
  }

  function deltaTone(row, d) {
    var eps = row.kind === 'pct' ? 0.05 : 0.5;
    if (!row.better || Math.abs(d) < eps) return 'neutral';
    return (d > 0) === (row.better === 'up') ? 'ok' : 'ko';
  }

  var TONE_WORDS = { ok: 'amélioration', ko: 'dégradation', neutral: 'stable ou sans objet' };

  function kpiTable(series, selectedMonth) {
    var head = el('tr', null,
      el('th', { scope: 'col', class: 'tl-label-col' }, 'Indicateur'),
      series.map(function (m) {
        return el('th', { scope: 'col', class: 'num' + (m.month === selectedMonth ? ' tl-current' : ''),
          dataset: { month: m.month }, title: m.month === selectedMonth ? 'Mois sélectionné' : null }, UI.fmtMonth(m.month));
      }));
    var body = KPI_ROWS.map(function (row) {
      return el('tr', { dataset: { kpi: row.key }, class: row.key === 'total_apps' ? 'tl-group-start' : null },
        el('th', { scope: 'row', class: 'tl-label-col' }, row.label),
        series.map(function (m, i) {
          var v = m.kpis[row.key];
          var delta = null;
          if (i > 0) {
            var d = v - series[i - 1].kpis[row.key];
            var tone = deltaTone(row, d);
            delta = el('span', { class: 'badge badge-' + tone + ' tl-delta',
              title: 'Évolution par rapport à ' + UI.fmtMonth(series[i - 1].month) + ' : ' + TONE_WORDS[tone] }, fmtDelta(row, d));
          }
          return el('td', { class: 'num' + (m.month === selectedMonth ? ' tl-current' : ''), dataset: { month: m.month } },
            el('span', { class: 'tl-value' }, fmtValue(row, v)), delta);
        }));
    });
    return el('div', { class: 'table-scroll' },
      el('table', { class: 'table tl-kpi-table' + (series.length > 1 ? ' has-deltas' : ''), id: 'timeline-kpi-table' },
        el('caption', { class: 'sr-only' }, 'Indicateurs par mois avec évolution par rapport au mois précédent'),
        el('thead', null, head), el('tbody', null, body)));
  }

  // ------------------------------------------------------------------------------ page body

  function renderTimeline(body, s, timeline, kicker) {
    var draws = [];
    var series = computeSeries(timeline, s.filters || { equipes: [], batiments: [] });
    if (kicker) kicker.textContent = kickerText(series);

    var note = filterNote(s);
    if (note) body.appendChild(note);

    if (!series.length) {
      var empty = UI.empty('Aucune donnée importée.', el('button', { type: 'button', class: 'btn btn-link',
        onClick: function () { App.go('dashboard'); } }, 'Importer un export depuis le tableau de bord'));
      empty.id = 'timeline-empty';
      body.appendChild(empty);
      return;
    }
    if (series.length < 2) {
      body.appendChild(el('div', { class: 'alert alert-info', role: 'status', id: 'timeline-info' },
        'Au moins deux exports mensuels sont nécessaires pour visualiser une évolution.'));
    }

    var x = series.map(function (m) { return UI.fmtMonth(m.month); });
    var k = series.map(function (m) { return m.kpis; });
    var last = series[series.length - 1];
    var t = Charts.tokens();

    body.appendChild(el('div', { class: 'grid grid-2' },
      // Ledger line styles (Charts defaults): postes in ink, applications in ink-3 dashed.
      chartCard('Taux de conformité (%)', 'chart-timeline-taux', draws, function (box) {
        Charts.line(box, {
          x: x,
          series: [
            { name: 'Postes', y: k.map(function (v) { return rate(v.total_postes, v.postes_conformes); }) },
            { name: 'Applications', y: k.map(function (v) { return rate(v.total_apps, v.apps_conformes); }) }
          ],
          threshold: Core.THRESHOLD,
          yTitle: 'Taux de conformité (%)',
          yRange: [0, 105]
        });
      }, rateCaption(last)),
      // Part-of-whole bars, labelled directly: per month, one outline bar per inventory (inventoriés) with
      // the conformant part solid inside it, "5 sur 7" above, "Postes" / "Applis" under it. No legend.
      chartCard('Inventaire et conformité (nombre)', 'chart-timeline-counts', draws, function (box) {
        Charts.partBars(box, {
          x: x,
          groups: [
            { label: 'Postes', color: t.ink,
              total: { name: 'Postes inventoriés', y: k.map(function (v) { return v.total_postes; }) },
              part: { name: 'Postes conformes', y: k.map(function (v) { return v.postes_conformes; }) } },
            { label: 'Applis', color: t.ink3,
              total: { name: 'Applications inventoriées', y: k.map(function (v) { return v.total_apps; }) },
              part: { name: 'Applications conformes', y: k.map(function (v) { return v.apps_conformes; }) } }
          ]
        });
      }, [countsCaption(last), el('br'), countsHowTo()])));

    var matrix = teamMatrix(series);
    body.appendChild(matrix.teams.length ?
      chartCard('Conformité des postes par équipe', 'chart-timeline-heatmap', draws, function (box) {
        Charts.heatmap(box, { x: x, y: matrix.teams, z: matrix.z, zmin: 0, zmax: 100, maxCellWidth: 112 });
      }, 'Part des postes conformes par équipe et par mois. Case vide : aucun poste ce mois-là.') :
      UI.section('Conformité des postes par équipe', UI.empty('Aucun poste ne correspond aux filtres sélectionnés.')));

    body.appendChild(UI.section('Indicateurs par mois', kpiTable(series, s.month),
      series.length > 1 ? el('p', { class: 'chart-caption' }, 'Écart par rapport au mois précédent : ',
        UI.statusMark('amélioration', 'ok'), ' · ', UI.statusMark('dégradation', 'ko'), ' · ',
        el('span', { class: 'faint' }, 'gris : stable ou sans objet'), '.') : null));

    draws.forEach(function (d) {
      try { d(); } catch (e) { console.error(e); }
    });
  }

  // ------------------------------------------------------------------------------ page

  function load(root, body, kicker, force) {
    var myToken = ++token;
    chartEls.forEach(function (n) { Charts.purge(n); });
    chartEls = [];
    UI.clear(body).appendChild(el('p', { class: 'muted' }, UI.spinner(), 'Chargement de l’historique…'));
    body.setAttribute('aria-busy', 'true');
    State.loadTimeline({ force: !!force }).then(function (tl) {
      if (myToken !== token) return;
      UI.clear(body);
      body.setAttribute('aria-busy', 'false');
      renderTimeline(body, State.get(), tl, kicker);
    }, function (err) {
      if (myToken !== token) return;
      UI.clear(body);
      body.setAttribute('aria-busy', 'false');
      body.appendChild(el('div', { class: 'alert alert-error', role: 'alert' },
        'Impossible de charger l’historique : ' + ((err && err.message) || 'erreur inconnue')));
    });
  }

  function mount(root) {
    var body = el('div', { class: 'timeline-body', id: 'timeline-body', 'aria-busy': 'true' });
    var refreshBtn = el('button', { type: 'button', class: 'btn btn-secondary btn-small', id: 'timeline-refresh',
      title: 'Recharger l’historique depuis le classeur de données' }, 'Actualiser');
    var header = UI.pageHeader({ title: 'Suivi temporel', kicker: 'Historique des exports', kickerId: 'timeline-kicker',
      actions: [refreshBtn] });
    var kicker = header.querySelector('.page-kicker');
    refreshBtn.addEventListener('click', function () { load(root, body, kicker, true); });
    root.appendChild(el('style', null, CSS));
    root.appendChild(header);
    root.appendChild(body);
    load(root, body, kicker, false);
  }

  function unmount() {
    token++;
    chartEls.forEach(function (n) { Charts.purge(n); });
    chartEls = [];
  }

  // Page-specific styles only (scoped to .page-timeline); everything else comes from css.html.
  var CSS = [
    '.page-timeline .timeline-body { display: flex; flex-direction: column; gap: var(--s6); }',
    // Month column headers: same face and case as the chart axes ("avril 2026", mono), not small caps.
    '.page-timeline .tl-kpi-table thead th[data-month] { text-transform: none; letter-spacing: 0;' +
      ' font-family: var(--font-mono); font-size: 12px; font-weight: 400; }',
    '.page-timeline .tl-kpi-table thead th.tl-current { font-weight: 500; }',
    // KPI ledger: label column stays visible when many months scroll horizontally.
    '.page-timeline .tl-kpi-table { width: auto; min-width: min(100%, 720px); }',
    '.page-timeline .tl-kpi-table .tl-label-col { position: sticky; left: 0; z-index: 2; background: var(--paper);' +
      ' min-width: 240px; padding-right: var(--s5); }',
    '.page-timeline .tl-kpi-table thead .tl-label-col { background: var(--paper-2); }',
    '.page-timeline .tl-kpi-table td { min-width: 132px; }',
    '.page-timeline .tl-kpi-table tbody tr:hover .tl-label-col { background: #fbfbfa; }',
    '.page-timeline .tl-kpi-table tr:has(+ tr.tl-group-start) > * { border-bottom-color: var(--rule-2); }',
    '.page-timeline .tl-kpi-table th.tl-current { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }',
    '.page-timeline .tl-kpi-table td.tl-current .tl-value { color: var(--ink); font-weight: 500; }',
    '.page-timeline .tl-kpi-table .tl-value { color: var(--ink-2); }',
    // Delta: a signed mono figure coloured ok/ko (ink-3 when neutral), fixed width so values align.
    '.page-timeline .tl-delta { display: inline-block; min-width: 8ch; margin-left: var(--s2); text-align: right;' +
      ' font-family: var(--font-mono); font-size: 12px; font-weight: 400; }',
    '.page-timeline .tl-delta::before { display: none; }',
    '.page-timeline .tl-delta.badge-neutral { color: var(--ink-3); }',
    // Phones: label column narrower, the delta goes under the value so that two months fit 358px.
    '@media (max-width: 700px) { .page-timeline .tl-kpi-table .tl-label-col { min-width: 128px; max-width: 150px;' +
      ' white-space: normal; padding-right: var(--s2); } .page-timeline .tl-kpi-table td { min-width: 0; }' +
      ' .page-timeline .tl-delta { display: block; min-width: 0; margin-left: 0; line-height: 1.2; } }'
  ].join('\n');

  window.Pages = window.Pages || {};
  window.Pages.timeline = { id: 'timeline', title: 'Suivi temporel', icon: '', mount: mount, unmount: unmount };
})();
</script>
