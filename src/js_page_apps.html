<style>
/* Applications page (docs/API.md §6 "Applications", docs/DESIGN.md). Everything else comes from css.html
   (page header, stat line, sections, ledger tables, status marks, .entity-drawer blocks). Page-specific:
   the « Critères » cell, five short status marks in one row — met = ■ in --ok with an ink-2 label,
   missing = ■ and label in --ko (same encoding as the drawer checklist: a filled square coloured by
   status, the state also told by the colour of the word). */
.page-apps .apps-criteria { display: inline-flex; gap: var(--s3); flex-wrap: nowrap; }
.page-apps .apps-criteria .mark { font-size: 12px; font-weight: 400; gap: 5px; }
.page-apps .apps-criteria .mark-ok { color: var(--ink-2); }
.page-apps .apps-criteria .mark-ok::before { background: var(--ok); }
.page-apps .apps-criteria .mark-ko { font-weight: 500; }
/* The drawer title is an application name: sans, like the table key column. */
.drawer.is-app .drawer-title { font-family: var(--font-sans); letter-spacing: 0; }
</style>
<script>
/**
 * Pages.apps — application inventory (docs/API.md §6 "Applications"), typeset per docs/DESIGN.md. Built by
 * InventoryPage (js_page_inventory.html): header (« Exporter CSV » / « Nouvelle application »), stat line,
 * editable ledger, conformity filter. Specific here: the Galink / IDP migration ledger, the computed
 * « Score » / « Critères » columns (they follow unsaved edits), the « Nouvelle application » form (EntityForm:
 * fields read from the source sheet, in sections) and the drawer (5-criteria checklist, postes, linked actions,
 * rename / delete).
 *
 * Read-only mode (lecteur, !State.canEdit()): no « Nouvelle application », no inline editing (Galink / IDP
 * included: plain cells, a row click opens the drawer), no « Renommer » / « Supprimer » / « Nouvelle action »
 * in the drawer; CSV export, the migration ledger and the drawer details stay. Admins follow the switches of
 * Paramètres (State.can): « Nouvelle application » on 'create', the inline editors and « Renommer » on 'edit',
 * « Supprimer » on 'delete'.
 */
(function () {
  'use strict';

  var el = UI.el;
  var KEY = Core.KEY_APP;
  var KEY_POSTE = Core.KEY_POSTE;
  var SCORE_CSV = 'Score calculé (%)';

  /** Criteria of Core.scoreApplication, in display order. */
  var CRITERIA = [
    { key: 'contrat', short: 'Contrat', label: 'Contrat' },
    { key: 'sip', short: 'SIP', label: 'SIP' },
    { key: 'idp', short: 'IDP', label: 'IDP' },
    { key: 'galink', short: 'Galink', label: 'Galink' },
    { key: 'champs', short: 'Champs', label: 'Champs obligatoires renseignés' }
  ];

  /**
   * A VALIDATION error of a form is shown under `field` (the modal stays open). A FORBIDDEN one (the switch
   * was turned off meanwhile) is shown too, and the bootstrap is reloaded (State.afterWriteError).
   */
  function onField(field) {
    return function (err) {
      if (err && err.code === 'VALIDATION' && !err.field) err.field = field;
      State.afterWriteError(err);
      throw err;
    };
  }

  // ------------------------------------------------------------------------------ drawer

  function openDrawer(id, ctx) {
    var md = ctx.md();
    var rec = md.applications.filter(function (r) { return r._id === id; })[0];
    if (!rec) return;
    var name = Core.str(rec[KEY]);
    var crit = rec._criteria || Core.scoreApplication(rec).criteria;
    var missing = Core.APP_REQUIRED_FIELDS.filter(function (f) { return Core.isBlank(rec[f]); });
    var postes = Core.buildPosteAppsRelation([rec]).byApp[name] || [];
    var posteIndex = {};
    md.postes.forEach(function (p) { posteIndex[Core.normKey(p[KEY_POSTE])] = p; });
    var closed = false;

    // Rename / delete are admin writes, each behind its switch of Paramètres (State.can): lecteurs, and
    // admins while a switch is off, get no button (hidden, not disabled).
    var canRename = State.can('edit');
    var canDelete = State.can('delete');
    var buttons = !canRename && !canDelete ? null : el('div', { class: 'drawer-buttons' },
      canRename ? el('button', { type: 'button', class: 'btn btn-secondary btn-sm', id: 'app-rename',
        onClick: function () { rename(rec, ctx); } }, 'Renommer') : null,
      canDelete ? el('button', { type: 'button', class: 'btn btn-danger btn-sm', id: 'app-delete',
        onClick: function () { remove(rec, ctx); } }, 'Supprimer') : null);

    var body = el('div', { class: 'entity-drawer apps-drawer', id: 'app-drawer', dataset: { id: rec._id } },
      el('div', { class: 'drawer-head-row' }, EntityDrawer.head(rec), buttons),
      EntityDrawer.kv([['Éditeur', rec['Éditeur']], ['Type', rec['Type']], ['Équipe', rec['Équipe']],
        ['Données sensibles exposées', rec['Données sensibles exposées']], ['Statut', rec['Statut']],
        ['Action corrective', rec['Action corrective']]]),
      el('section', { class: 'drawer-section', id: 'app-drawer-criteria' },
        el('h3', { class: 'section-title' }, 'Critères de conformité · 20 points chacun'),
        el('ul', { class: 'checklist' }, CRITERIA.map(function (c) {
          var ok = !!crit[c.key];
          return el('li', { dataset: { criterion: c.key, ok: ok ? '1' : '0' } },
            el('span', { class: 'crit-label' }, c.label),
            el('span', { class: 'leader', 'aria-hidden': 'true' }),
            UI.statusMark(ok ? 'Rempli' : 'Non rempli', ok ? 'ok' : 'ko'),
            c.key === 'champs' && missing.length ? el('span', { class: 'crit-missing' }, 'Manquant : ' + missing.join(', ')) : null);
        }))),
      el('section', { class: 'drawer-section', id: 'app-drawer-postes' },
        el('h3', { class: 'section-title' }, 'Installée sur · ', el('span', { class: 'mono' }, String(postes.length))),
        postes.length ? el('ul', { class: 'rel-list' }, postes.map(function (p) {
          var poste = posteIndex[Core.normKey(p)];
          return el('li', { dataset: { poste: p } },
            el('span', { class: 'rel-name' }, p),
            poste && Core.str(poste['Équipe']) ? el('span', { class: 'rel-team' }, Core.str(poste['Équipe'])) : null,
            !poste ? el('span', { class: 'rel-note' }, 'poste absent de l’inventaire') : null,
            el('span', { class: 'spacer' }),
            poste ? UI.scoreBadge(poste._score) : null);
        })) : UI.empty('Aucun poste renseigné (' + UI.quote('Installé sur poste') + ').', { small: true })),
      EntityDrawer.actionsBlock({ target_type: 'application', target_name: name, equipe: Core.str(rec['Équipe']),
        month: ctx.month, isOpen: function () { return !closed; }, emptyText: 'Aucune action liée à cette application.',
        values: { action: Core.str(rec['Action corrective']), responsable: Core.str(rec['Responsable action']) } }));

    var handle = ctx.drawer({ title: name || '(sans nom)', body: body, onClose: function () { closed = true; } });
    if (handle.node) handle.node.classList.add('is-app');
  }

  function rename(rec, ctx) {
    var oldName = Core.str(rec[KEY]);
    var res = null;
    UI.formModal({
      title: 'Renommer l’application',
      submitLabel: 'Renommer',
      fields: [{ name: 'newName', label: 'Nouveau nom', type: 'text', required: true, value: oldName }],
      onSubmit: function (values) {
        if (values.newName === oldName) return null;
        return api.call('api_renameApplication', { month: ctx.month, id: rec._id, newName: values.newName })
          .then(function (r) { res = r; }, onField('newName'));
      }
    }).then(function (values) {
      if (!values || !res) return null;
      State.patchRecords(ctx.month, 'applications', [res.record]);
      var n = res.actionsUpdated || 0;
      UI.toast('Application renommée en ' + UI.quote(values.newName) +
        (n ? ' — ' + UI.plural(n, 'action mise à jour', 'actions mises à jour') : '') + '.', 'success');
      // Action targets changed server side: reload them before the drawer re-renders.
      return State.loadActions({ force: true }).catch(function () { return null; }).then(function () {
        ctx.refreshPage();
        if (ctx.drawerOpen()) openDrawer(rec._id, ctx);
      });
    });
  }

  function remove(rec, ctx) {
    var name = Core.str(rec[KEY]);
    var live = ctx.month === State.get().currentMonth;
    UI.confirm('Supprimer l’application ' + UI.quote(name) + (live ?
      ' ? Sa ligne est supprimée de l’onglet ' + UI.quote(Core.SOURCE_TABS.applications) + ' du Google Sheet source.' :
      ' de l’historique de ' + Fmt.monthLong(ctx.month) + ' ? Le Google Sheet source n’est pas modifié.') +
      ' Cette opération est irréversible (les actions liées sont conservées).',
      { title: 'Supprimer l’application', okLabel: 'Supprimer', danger: true,
        onConfirm: function () {
          return api.call('api_deleteApplication', { month: ctx.month, id: rec._id }).then(null, function (err) {
            State.afterWriteError(err);
            throw err;
          });
        } })
      .then(function (ok) {
        if (!ok) return;
        State.removeRecord(ctx.month, 'applications', rec._id);
        ctx.closeDrawer();
        ctx.refreshPage();
        UI.toast('Application ' + UI.quote(name) + ' supprimée.', 'success');
      });
  }

  // ------------------------------------------------------------------------------ add application

  /** Sections of the « Nouvelle application » form (EntityForm): source columns by name, then « Autres colonnes ». */
  var APP_SECTIONS = [
    { id: 'identification', title: 'Identification', open: true, columns: [KEY, 'Éditeur', 'Type', 'Équipe', 'Date'] },
    { id: 'usage', title: 'Usage', open: true, columns: ['Installé sur poste', 'Données sensibles exposées'] },
    { id: 'conformite', title: 'Conformité', open: true, columns: ['Contrat', 'SIP', 'Galink', 'IDP', 'Niveau de risque'] },
    { id: 'suivi', title: 'Suivi', open: false,
      columns: ['Action corrective', 'Responsable action', 'Statut', 'Score conformité', 'Commentaires'] }
  ];

  var APP_PRESENTATION = {
    'Action corrective': { type: 'textarea' },
    'Commentaires': { type: 'textarea' },
    'Installé sur poste': function (md) {
      return { tokens: true, mono: true, options: Core.uniqueSorted(md.postes, KEY_POSTE), placeholder: 'POSTE-01, POSTE-02',
        hint: 'Plusieurs postes : séparés par des virgules.' };
    }
  };

  function addApplication(ctx, button) {
    return EntityForm.open(ctx, {
      entity: 'applications',
      keyField: KEY,
      title: 'Nouvelle application — ' + Fmt.monthLong(ctx.month),
      submitLabel: 'Ajouter l’application',
      api: 'api_addApplication',
      sections: APP_SECTIONS,
      presentation: APP_PRESENTATION,
      fieldFallback: KEY,
      button: button,
      toast: function (name, o) {
        return 'Application ' + UI.quote(name) + ' ajoutée' + (o.hidden ? ' (masquée par les filtres actifs).' : '.');
      }
    }).catch(function (err) { UI.errorToast(err); });
  }

  // ------------------------------------------------------------------------------ page body

  /** Migration readiness ledger: Galink / IDP Oui / Non / Non renseigné counts + share migrated. */
  function migrationSummary(box, apps) {
    UI.clear(box);
    var rows = Core.APP_CUSTOM_FIELDS.map(function (f) {
      var r = { field: f, oui: 0, non: 0, vide: 0 };
      apps.forEach(function (a) {
        var v = Core.str(a[f]);
        if (v === 'Oui') r.oui++; else if (v === 'Non') r.non++; else r.vide++;
      });
      r.share = apps.length ? r.oui / apps.length * 100 : null;
      return r;
    });
    function countCell(kind, missing) {
      return function (r) {
        var n = r[kind];
        return el('span', { class: n === 0 ? 'faint' : (missing ? 'cell-no' : null), dataset: { count: kind } }, UI.fmtNum(n));
      };
    }
    box.appendChild(UI.table({
      className: 'migration-table',
      columns: [
        { label: 'Champ', rowHeader: true, cell: function (r) { return r.field; } },
        { label: 'Oui', num: true, cell: countCell('oui') },
        { label: 'Non', num: true, cell: countCell('non', true) },
        { label: 'Non renseigné', num: true, cell: countCell('vide') },
        { label: 'Migrées', num: true, cell: function (r) {
          return el('span', { dataset: { count: 'share' } }, r.share === null ? '—' : UI.fmtPctNode(r.share)); } }
      ],
      rows: rows,
      rowAttrs: function (r) { return { dataset: { field: r.field } }; }
    }));
    box.appendChild(el('p', { class: 'field-help' }, 'Migrées : part des applications à ' + UI.quote('Oui') + '.'));
  }

  function criteriaMarks(row) {
    var crit = Core.scoreApplication(row).criteria;
    var met = CRITERIA.filter(function (c) { return !!crit[c.key]; }).length;
    return el('span', { class: 'apps-criteria', role: 'img',
      'aria-label': met + ' critères remplis sur 5 — ' + CRITERIA.map(function (c) {
        return c.label + (crit[c.key] ? ' : rempli' : ' : non rempli');
      }).join(', ') }, CRITERIA.map(function (c) {
      var mark = UI.statusMark(c.short, crit[c.key] ? 'ok' : 'ko');
      mark.dataset.criterion = c.key;
      return mark;
    }));
  }

  window.Pages = window.Pages || {};
  window.Pages.apps = InventoryPage.create({
    id: 'apps',
    title: 'Applications',
    entity: 'applications',
    keyField: KEY,
    filterScope: 'all',
    // Only Équipe applies to applications (they carry no bâtiment).
    filtered: function (s) { return ((s.filters || {}).equipes || []).length > 0; },
    nouns: { one: 'application', many: 'applications', loading: 'Chargement des applications…',
      inExport: 'Aucune application dans cet export.', noMatch: 'Aucune application ne correspond aux filtres.',
      none: 'Aucune application.' },
    extraColumns: Core.APP_CUSTOM_FIELDS,
    monoColumns: { 'Date': 1, 'Installé sur poste': 1 },
    computedColumns: function () {
      return [{
        key: '_score', label: 'Score', editable: false, numeric: true,
        render: function (row) { return UI.scoreBadge(Core.scoreApplication(row).score); },
        sortValue: function (row) { return Core.scoreApplication(row).score; }
      }, { key: '_criteria', label: 'Critères', editable: false, sortable: false, render: criteriaMarks }];
    },
    sections: function (ctx) {
      ctx.migration = el('div', { class: 'apps-migration', id: 'apps-migration', role: 'region',
        'aria-label': 'Migration Galink / IDP' });
      var section = UI.section('Migration Galink / IDP', ctx.migration);
      section.id = 'apps-migration-section';
      return [section];
    },
    onStats: function (all, ctx) { migrationSummary(ctx.migration, all); },
    csvTooltip: 'Exporte les lignes affichées (filtres compris), avec le score calculé.',
    csv: function (ctx) {
      return { file: 'applications_' + ctx.month + '.csv', columns: ctx.columns.concat([SCORE_CSV]),
        rows: ctx.visible().map(function (r) { var o = Object.assign({}, r); o[SCORE_CSV] = r._score; return o; }) };
    },
    saveApi: 'api_saveApplications',
    primary: { id: 'apps-add', label: 'Nouvelle application', run: addApplication,
      prefetch: function (ctx) { State.loadFormSchema('applications', ctx.month).catch(function () { return null; }); } },
    openDrawer: openDrawer
  });
})();
</script>
