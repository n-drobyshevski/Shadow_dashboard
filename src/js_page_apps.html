<style>
/* Applications page (docs/API.md §6 "Applications", docs/DESIGN.md). Everything else comes from css.html:
   page header, stat line, sections, ledger tables, status marks, drawer sections and lists. */
.page-apps .apps-body { display: flex; flex-direction: column; gap: var(--s4); }
.page-apps .apps-body > .section { margin-top: var(--s4); }
/* Criteria cell: five short marks. A filled square = criterion met (label ink-2), a hollow square in
   --ko = criterion missing, so the state is carried by shape and colour, not colour alone. */
.page-apps .apps-criteria { display: inline-flex; gap: var(--s3); flex-wrap: nowrap; }
.page-apps .apps-criteria .badge { font-size: 12px; font-weight: 400; gap: 5px; }
.page-apps .apps-criteria .badge-ok { color: var(--ink-2); }
.page-apps .apps-criteria .badge-ok::before { background: var(--ok); }
.page-apps .apps-criteria .badge-ko { color: var(--ko); font-weight: 500; }
.page-apps .apps-criteria .badge-ko::before { background: none; box-shadow: inset 0 0 0 1.5px currentColor; width: 7px; height: 7px; }
/* Galink / IDP migration ledger: a compact table, not full width. */
.page-apps .apps-migration .table { width: auto; min-width: min(100%, 560px); }
.page-apps .apps-migration .table th:not(:first-child), .page-apps .apps-migration .table td:not(:first-child) { min-width: 96px; }
.page-apps .apps-migration .count-ko { color: var(--ko); }
@media (max-width: 700px) {
  .page-apps .apps-migration .table { min-width: 0; width: 100%; }
  .page-apps .apps-migration .table th:not(:first-child), .page-apps .apps-migration .table td:not(:first-child) { min-width: 0; }
  .page-apps .apps-migration .table thead th { white-space: normal; vertical-align: bottom; line-height: 1.25; }
  .page-apps .apps-migration .table th, .page-apps .apps-migration .table td { padding-left: var(--s2); padding-right: var(--s2); }
}
.page-apps .apps-migration .count-zero { color: var(--ink-3); }
.apps-drawer .checklist .leader { align-self: center; transform: none; }
.apps-drawer .crit-label { flex: 0 1 auto; }
.apps-drawer .crit-missing { flex-basis: 100%; margin: -6px 0 2px; font-size: 12px; color: var(--ink-2); }
.apps-drawer .checklist li { flex-wrap: wrap; }
.apps-drawer .rel-list .rel-note, .apps-drawer .rel-list .rel-team { font-family: var(--font-sans); font-size: 12px; }
.apps-drawer .rel-list .rel-note { color: var(--ink-3); }
.apps-drawer .rel-list .rel-team { color: var(--ink-2); }
.apps-drawer .action-title { font-weight: 500; font-size: 13px; }
.apps-drawer .action-comment { margin: 0; font-size: 12px; color: var(--ink-2); }
.apps-drawer .drawer-head-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s3); }
.apps-drawer { display: flex; flex-direction: column; gap: var(--s5); }
</style>
<script>
/**
 * Pages.apps — application inventory (docs/API.md §6 "Applications"), typeset per docs/DESIGN.md.
 *
 * Page header (month kicker + "Nouvelle application" / "Exporter CSV"), a one-line stat summary, the
 * Galink / IDP migration ledger, then the editable table over the filtered applications of the
 * selected month (column order = monthData.columns.applications, key column first and read-only,
 * Galink/IDP editable Oui/Non, computed Score + criteria marks that follow unsaved edits), conformity
 * filter, and a detail drawer (5-criteria checklist, postes, linked actions + "Nouvelle action",
 * rename / delete).
 */
(function () {
  'use strict';

  var el = UI.el;
  var KEY = Core.KEY_APP;
  var KEY_POSTE = Core.KEY_POSTE;

  var token = 0;              // bumped on every mount/unmount: stale async renders are dropped
  var conformity = 'all';     // 'all' | 'ok' | 'ko' — kept across re-mounts
  var drawerHandle = null;    // currently open drawer {close}
  var pageCtx = null;         // {token, month, refresh()} of the mounted table (used by the drawer)

  var CONFORMITY_OPTIONS = [
    { value: 'all', label: 'Toutes' },
    { value: 'ok', label: 'Conformes' },
    { value: 'ko', label: 'Non conformes' }
  ];

  /** Criteria of Core.scoreApplication, in display order. */
  var CRITERIA = [
    { key: 'contrat', short: 'Contrat', label: 'Contrat' },
    { key: 'sip', short: 'SIP', label: 'SIP' },
    { key: 'idp', short: 'IDP', label: 'IDP' },
    { key: 'galink', short: 'Galink', label: 'Galink' },
    { key: 'champs', short: 'Champs', label: 'Champs obligatoires renseignés' }
  ];

  /** Source columns shown as identifiers / dates (mono). */
  var MONO_COLUMNS = { 'Date': 1, 'Installé sur poste': 1 };

  // ------------------------------------------------------------------------------ helpers

  function plural(n, one, many) { return UI.fmtNum(n) + ' ' + (n > 1 ? many : one); }
  function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function errorToast(err) { UI.toast('Erreur : ' + ((err && err.message) || 'erreur inconnue.'), 'error'); }

  /**
   * Keeps the computed (non-editable) columns in sync with unsaved edits.
   * After every edit interaction we re-render the computed cells of the visible rows from
   * (record + dirty updates), so they never show a stale saved value.
   */
  function liveComputedColumns(table, computed, recordById) {
    function sync() {
      var dirty = {};
      table.getDirty().forEach(function (d) { dirty[String(d.id)] = d.updates; });
      Array.prototype.forEach.call(table.node.querySelectorAll('tbody tr[data-id]'), function (tr) {
        var rec = recordById(tr.dataset.id);
        if (!rec) return;
        var view = dirty[tr.dataset.id] ? Object.assign({}, rec, dirty[tr.dataset.id]) : rec;
        computed.forEach(function (col) {
          var td = tr.querySelector('td[data-col="' + col.key + '"]');
          if (!td) return;
          var out = col.render(view);
          UI.clear(td).appendChild(out instanceof Node ? out : document.createTextNode(String(out)));
        });
      });
    }
    ['change', 'focusout', 'keyup'].forEach(function (type) {
      table.node.addEventListener(type, function () { setTimeout(sync, 0); });
    });
  }

  function header(s, actions) {
    var kicker = s.month ? [capitalize(UI.fmtMonth(s.month)) + ' · ', el('span', { class: 'mono' }, 'Export ' + s.month)] :
      'Aucun export importé';
    var h = UI.pageHeader({ title: 'Applications', kicker: kicker, kickerId: s.month ? 'apps-caption' : null, actions: actions });
    var k = h.querySelector('.page-kicker');
    if (k && s.month) k.dataset.month = s.month;
    return h;
  }

  function filterNote(s) {
    var f = s.filters || {};
    var parts = [];
    if ((f.equipes || []).length) parts.push('Équipe : ' + f.equipes.join(', '));
    if ((f.batiments || []).length) parts.push('Bâtiment / Labo : ' + f.batiments.join(', ') + ' (postes uniquement)');
    if (!parts.length) return null;
    return el('p', { class: 'filter-note', role: 'status' }, 'Filtres actifs — ' + parts.join(' · '));
  }

  function hasEquipeFilter(s) { return ((s.filters || {}).equipes || []).length > 0; }

  /** Column order from the month's headers, key column first; Galink / IDP always present. */
  function sourceColumns(md) {
    var cols = (md.columns && md.columns.applications && md.columns.applications.length) ? md.columns.applications.slice() :
      Object.keys(md.applications[0] || {}).filter(function (k) { return k.charAt(0) !== '_'; });
    Core.APP_CUSTOM_FIELDS.forEach(function (c) { if (cols.indexOf(c) < 0) cols.push(c); });
    return [KEY].concat(cols.filter(function (c) { return c !== KEY; }));
  }

  function findRecord(month, id) {
    var md = State.getMonthData(month);
    return md ? md.applications.filter(function (r) { return r._id === id; })[0] || null : null;
  }

  /** The page's table refresh, when the page that opened the drawer is still mounted. */
  function refreshPage() {
    if (pageCtx && pageCtx.token === token) pageCtx.refresh();
  }

  function yesNoOptions(col, ref) { return Core.optionsForColumn(col, ref) || ['Oui', 'Non']; }

  function todayIso() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() < 9 ? '0' : '') + (d.getMonth() + 1) + '-' + (d.getDate() < 10 ? '0' : '') + d.getDate();
  }

  var STATUS_TONES = { 'À faire': 'neutral', 'En cours': 'warn', 'Terminé': 'ok', 'Abandonné': 'muted' };

  function actionItem(a) {
    var open = a.status !== 'Terminé' && a.status !== 'Abandonné';
    var due = Core.frToIso(a.deadline);
    var overdue = open && due && due < todayIso();
    return el('li', { dataset: { actionId: a.id } },
      el('strong', { class: 'action-title' }, a.action || '(sans libellé)'),
      el('div', { class: 'action-meta' },
        UI.statusMark(a.status || '—', STATUS_TONES[a.status] || 'neutral'),
        a.priorite ? el('span', null, 'Priorité ' + a.priorite.toLowerCase()) : null,
        a.deadline ? el('span', null, 'Échéance ', el('span', { class: 'mono' }, a.deadline)) : null,
        overdue ? UI.statusMark('En retard', 'ko') : null,
        a.responsable ? el('span', null, a.responsable) : null,
        a.source_month ? el('span', { class: 'faint' }, 'Export ', el('span', { class: 'mono' }, a.source_month)) : null),
      a.comment ? el('p', { class: 'action-comment' }, a.comment) : null);
  }

  /** "Actions liées" block for an application; reloads itself after "Nouvelle action". */
  function actionsBlock(targetName, rec, month, isOpen) {
    var list = el('div', { class: 'drawer-actions-list', id: 'drawer-actions', 'aria-live': 'polite' });
    var addBtn = el('button', { type: 'button', class: 'btn btn-secondary btn-small', id: 'drawer-add-action',
      onClick: function () { addAction(); } }, 'Nouvelle action');

    function render(opts) {
      UI.clear(list).appendChild(el('p', { class: 'muted small' }, UI.spinner(), 'Chargement des actions…'));
      State.loadActions(opts).then(function (res) {
        if (!isOpen()) return;
        var mine = (res.actions || []).filter(function (a) {
          return a.target_type === 'application' && a.target_name === targetName;
        });
        UI.clear(list);
        if (!mine.length) { list.appendChild(UI.empty('Aucune action liée à cette application.')); return; }
        list.appendChild(el('ul', { class: 'action-list' }, mine.map(actionItem)));
      }, function (err) {
        if (!isOpen()) return;
        UI.clear(list).appendChild(UI.empty('Actions indisponibles : ' + err.message));
      });
    }

    function addAction() {
      UI.formModal({
        title: 'Nouvelle action — ' + targetName,
        submitLabel: 'Ajouter',
        fields: [
          { name: 'action', label: 'Action', type: 'text', required: true, value: Core.str(rec['Action corrective']) },
          { name: 'responsable', label: 'Responsable', type: 'text', value: Core.str(rec['Responsable action']) },
          { name: 'deadline', label: 'Échéance', type: 'date' },
          { name: 'priorite', label: 'Priorité', type: 'select', options: Core.ACTION_PRIORITIES, value: 'Moyenne' },
          { name: 'status', label: 'Statut', type: 'select', options: Core.ACTION_STATUSES, value: 'À faire', required: true },
          { name: 'comment', label: 'Commentaire', type: 'textarea' }
        ]
      }).then(function (values) {
        if (!values) return null;
        addBtn.disabled = true;
        return api.call('api_addAction', {
          target_type: 'application', target_name: targetName, equipe: Core.str(rec['Équipe']),
          action: values.action, responsable: values.responsable, deadline: values.deadline,
          priorite: values.priorite, status: values.status, comment: values.comment, source_month: month
        }).then(function () {
          UI.toast('Action ajoutée pour ' + targetName + '.', 'success');
          render({ force: true });
        }, errorToast).then(function () { addBtn.disabled = false; });
      });
    }

    render();
    return el('section', { class: 'drawer-section' },
      el('div', { class: 'section-head' }, el('h3', null, 'Actions liées'), addBtn), list);
  }

  // ------------------------------------------------------------------------------ drawer

  function openDrawer(id, month) {
    var md = State.getMonthData(month);
    var rec = findRecord(month, id);
    if (!md || !rec) return;
    var name = Core.str(rec[KEY]);
    var crit = rec._criteria || Core.scoreApplication(rec).criteria;
    var missing = Core.APP_REQUIRED_FIELDS.filter(function (f) { return Core.isBlank(rec[f]); });
    var postes = Core.buildPosteAppsRelation([rec]).byApp[name] || [];
    var posteIndex = {};
    md.postes.forEach(function (p) { posteIndex[Core.normKey(p[KEY_POSTE])] = p; });
    var closed = false;
    function isOpen() { return !closed; }

    var kvRows = [['Éditeur', rec['Éditeur']], ['Type', rec['Type']], ['Équipe', rec['Équipe']],
      ['Données sensibles exposées', rec['Données sensibles exposées']], ['Statut', rec['Statut']],
      ['Action corrective', rec['Action corrective']]];

    var renameBtn = el('button', { type: 'button', class: 'btn btn-secondary btn-small', id: 'app-rename',
      onClick: function () { rename(rec, month); } }, 'Renommer');
    var deleteBtn = el('button', { type: 'button', class: 'btn btn-danger btn-small', id: 'app-delete',
      onClick: function () { remove(rec, month); } }, 'Supprimer');

    var body = el('div', { class: 'apps-drawer', id: 'app-drawer', dataset: { id: rec._id } },
      el('div', { class: 'drawer-head-row' },
        el('div', { class: 'drawer-head' },
          el('span', { class: 'stat-line' }, el('span', { class: 'faint small' }, 'Score'), UI.scoreBadge(rec._score)),
          UI.statusMark(rec._conforme ? 'Conforme' : 'Non conforme', rec._conforme ? 'ok' : 'ko'),
          Core.str(rec['Niveau de risque']) ?
            el('span', { class: 'stat-line' }, el('span', { class: 'faint small' }, 'Risque'), UI.riskBadge(rec['Niveau de risque'])) : null),
        el('div', { class: 'drawer-buttons' }, renameBtn, deleteBtn)),
      el('dl', { class: 'kv' }, kvRows.filter(function (kv) { return Core.str(kv[1]); }).map(function (kv) {
        return [el('dt', null, kv[0]), el('dd', null, Core.str(kv[1]))];
      })),
      el('section', { class: 'drawer-section', id: 'app-drawer-criteria' },
        el('h3', null, 'Critères de conformité · 20 points chacun'),
        el('ul', { class: 'checklist' }, CRITERIA.map(function (c) {
          var ok = !!crit[c.key];
          return el('li', { dataset: { criterion: c.key, ok: ok ? '1' : '0' } },
            el('span', { class: 'crit-label' }, c.label),
            el('span', { class: 'leader', 'aria-hidden': 'true' }),
            UI.statusMark(ok ? 'Rempli' : 'Non rempli', ok ? 'ok' : 'ko'),
            c.key === 'champs' && missing.length ? el('span', { class: 'crit-missing' }, 'Manquant : ' + missing.join(', ')) : null);
        }))),
      el('section', { class: 'drawer-section', id: 'app-drawer-postes' },
        el('h3', null, 'Installée sur · ', el('span', { class: 'mono' }, String(postes.length))),
        postes.length ? el('ul', { class: 'rel-list' }, postes.map(function (p) {
          var poste = posteIndex[Core.normKey(p)];
          return el('li', { dataset: { poste: p } },
            el('span', null, p),
            poste && Core.str(poste['Équipe']) ? el('span', { class: 'rel-team' }, Core.str(poste['Équipe'])) : null,
            !poste ? el('span', { class: 'rel-note' }, 'poste absent de l’inventaire') : null,
            el('span', { class: 'spacer' }),
            poste ? UI.scoreBadge(poste._score) : null);
        })) : UI.empty('Aucun poste renseigné (« Installé sur poste »).')),
      actionsBlock(name, rec, month, isOpen));

    drawerHandle = UI.drawer({ title: name || '(sans nom)', body: body,
      onClose: function () { closed = true; drawerHandle = null; } });
  }

  function rename(rec, month) {
    var oldName = Core.str(rec[KEY]);
    UI.formModal({
      title: 'Renommer l’application',
      submitLabel: 'Renommer',
      fields: [{ name: 'newName', label: 'Nouveau nom', type: 'text', required: true, value: oldName }]
    }).then(function (values) {
      if (!values || values.newName === oldName) return null;
      return api.call('api_renameApplication', { month: month, id: rec._id, newName: values.newName }).then(function (res) {
        State.patchRecords(month, 'applications', [res.record]);
        var n = res.actionsUpdated || 0;
        UI.toast('Application renommée en « ' + values.newName + ' »' +
          (n ? ' — ' + plural(n, 'action mise à jour', 'actions mises à jour') : '') + '.', 'success');
        // Action targets changed server side: reload them before the drawer re-renders.
        return State.loadActions({ force: true }).catch(function () { return null; }).then(function () {
          refreshPage();
          if (drawerHandle) openDrawer(rec._id, month);
        });
      }, errorToast);
    });
  }

  function remove(rec, month) {
    var name = Core.str(rec[KEY]);
    UI.confirm('Supprimer l’application « ' + name + ' » de l’export ' + month + ' ? Cette opération est irréversible ' +
      '(les actions liées sont conservées).', { title: 'Supprimer l’application', okLabel: 'Supprimer', danger: true })
      .then(function (ok) {
        if (!ok) return null;
        return api.call('api_deleteApplication', { month: month, id: rec._id }).then(function () {
          State.removeRecord(month, 'applications', rec._id);
          if (drawerHandle) drawerHandle.close();
          refreshPage();
          UI.toast('Application « ' + name + ' » supprimée.', 'success');
        }, errorToast);
      });
  }

  // ------------------------------------------------------------------------------ add application

  function addApplication(md, month, onAdded) {
    var s = State.get();
    var ref = md.referentiel;
    var equipes = Core.optionsForColumn('Équipe', ref) ||
      Core.uniqueSorted(md.postes.concat(md.applications), 'Équipe');
    var defaultEquipe = (s.filters.equipes || []).length === 1 ? s.filters.equipes[0] : '';
    return UI.formModal({
      title: 'Nouvelle application — ' + month,
      submitLabel: 'Ajouter',
      fields: [
        { name: KEY, label: 'Nom du logiciel / service', type: 'text', required: true },
        { name: 'Éditeur', label: 'Éditeur', type: 'text' },
        { name: 'Type', label: 'Type', type: 'select', allowCustom: true, options: Core.optionsForColumn('Type', ref) || [] },
        { name: 'Équipe', label: 'Équipe', type: 'select', allowCustom: true, options: equipes, value: defaultEquipe },
        { name: 'Installé sur poste', label: 'Installé sur poste', type: 'select', allowCustom: true,
          options: Core.uniqueSorted(md.postes, KEY_POSTE), placeholder: 'POSTE-01, POSTE-02' },
        { name: 'Contrat', label: 'Contrat', type: 'select', options: yesNoOptions('Contrat', ref) },
        { name: 'SIP', label: 'SIP', type: 'select', options: yesNoOptions('SIP', ref) },
        { name: 'Données sensibles exposées', label: 'Données sensibles exposées', type: 'select',
          options: yesNoOptions('Données sensibles exposées', ref) },
        { name: 'Niveau de risque', label: 'Niveau de risque', type: 'select',
          options: Core.optionsForColumn('Niveau de risque', ref) || Core.RISK_ORDER },
        { name: 'Galink', label: 'Galink', type: 'select', options: yesNoOptions('Galink', ref) },
        { name: 'IDP', label: 'IDP', type: 'select', options: yesNoOptions('IDP', ref) }
      ]
    }).then(function (values) {
      if (!values) return null;
      var record = {};
      Object.keys(values).forEach(function (k) { record[k] = values[k] === '' ? null : values[k]; });
      return api.call('api_addApplication', { month: month, record: record }).then(function (rec) {
        State.addRecord(month, 'applications', rec);
        var hidden = hasEquipeFilter(State.get()) && (State.get().filters.equipes || []).indexOf(Core.str(rec['Équipe'])) < 0;
        UI.toast('Application « ' + Core.str(rec[KEY]) + ' » ajoutée' + (hidden ? ' (masquée par les filtres actifs).' : '.'),
          'success');
        onAdded(rec);
      }, errorToast);
    });
  }

  // ------------------------------------------------------------------------------ page body

  /** Migration readiness ledger: Galink / IDP Oui / Non / Non renseigné counts + share migrated. */
  function migrationSummary(box, apps) {
    UI.clear(box);
    function count(n, tone) {
      return el('td', { class: 'num' + (n === 0 ? ' count-zero' : (tone ? ' count-' + tone : '')) }, UI.fmtNum(n));
    }
    var rows = Core.APP_CUSTOM_FIELDS.map(function (f) {
      var oui = 0;
      var non = 0;
      var vide = 0;
      apps.forEach(function (a) {
        var v = Core.str(a[f]);
        if (v === 'Oui') oui++; else if (v === 'Non') non++; else vide++;
      });
      var share = apps.length ? oui / apps.length * 100 : null;
      var cOui = count(oui);
      cOui.dataset.count = 'oui';
      var cNon = count(non, 'ko');
      cNon.dataset.count = 'non';
      var cVide = count(vide);
      cVide.dataset.count = 'vide';
      return el('tr', { dataset: { field: f } },
        el('th', { scope: 'row' }, f), cOui, cNon, cVide,
        el('td', { class: 'num', dataset: { count: 'share' } }, share === null ? '—' : UI.fmtPctNode(share)));
    });
    box.appendChild(el('div', { class: 'table-scroll' }, el('table', { class: 'table table-compact' },
      el('thead', null, el('tr', null,
        el('th', { scope: 'col' }, 'Champ'), el('th', { scope: 'col', class: 'num' }, 'Oui'),
        el('th', { scope: 'col', class: 'num' }, 'Non'), el('th', { scope: 'col', class: 'num' }, 'Non renseigné'),
        el('th', { scope: 'col', class: 'num', title: 'Part des applications à « Oui »' }, 'Migrées'))),
      el('tbody', null, rows))));
  }

  function criteriaBadges(row) {
    var crit = Core.scoreApplication(row).criteria;
    var met = CRITERIA.filter(function (c) { return !!crit[c.key]; }).length;
    return el('span', { class: 'apps-criteria', role: 'img',
      'aria-label': met + ' critères remplis sur 5 — ' + CRITERIA.map(function (c) {
        return c.label + (crit[c.key] ? ' : rempli' : ' : non rempli');
      }).join(', ') }, CRITERIA.map(function (c) {
      var ok = !!crit[c.key];
      return el('span', { class: 'badge ' + (ok ? 'badge-ok' : 'badge-ko'), title: c.label + (ok ? ' : rempli' : ' : non rempli'),
        dataset: { criterion: c.key } }, c.short);
    }));
  }

  function renderBody(body, s, md, myToken, actions) {
    var month = s.month;
    var cols = sourceColumns(md);

    function current() { return State.getMonthData(month) || md; }
    function filteredApps() { return State.filtered(current()).applications; }
    function visible() {
      var list = filteredApps();
      if (conformity === 'ok') return list.filter(function (r) { return r._conforme; });
      if (conformity === 'ko') return list.filter(function (r) { return !r._conforme; });
      return list;
    }

    var stats = el('p', { class: 'stat-line apps-stats', id: 'apps-stats', role: 'status' });
    var migration = el('div', { class: 'apps-migration', id: 'apps-migration', role: 'region',
      'aria-label': 'Migration Galink / IDP' });
    function renderStats() {
      var all = filteredApps();
      var ok = all.filter(function (r) { return r._conforme; }).length;
      var ko = all.length - ok;
      UI.clear(stats).appendChild(el('span', { class: 'stat' }, plural(all.length, 'application', 'applications')));
      stats.appendChild(el('span', { class: 'stat' }, UI.statusMark(plural(ok, 'conforme', 'conformes'), 'ok'),
        all.length ? el('span', { class: 'mono' }, ' ', UI.fmtPctNode(ok / all.length * 100)) : null));
      stats.appendChild(el('span', { class: 'stat' }, UI.statusMark(plural(ko, 'non conforme', 'non conformes'), ko ? 'ko' : 'neutral')));
      migrationSummary(migration, all);
    }

    var columns = cols.map(function (c, i) {
      if (i === 0) {
        return { key: c, label: c, editable: false, width: 150, render: function (row) {
          return el('button', { type: 'button', class: 'apps-key', title: 'Voir le détail de l’application',
            onClick: function () { openDrawer(row._id, month); } }, Core.str(row[c]) || '(sans nom)');
        } };
      }
      // Read view: Statut / Niveau de risque as status marks, « Non » criteria in --ko (the editor is unchanged).
      return { key: c, label: c, editable: true, mono: !!MONO_COLUMNS[c], options: Core.optionsForColumn(c, md.referentiel),
        render: function (row) { return UI.cellMark(c, row[c]) || Core.str(row[c]); } };
    });
    // Computed columns right after the key column; computed from the displayed row so that they
    // follow unsaved edits (e.g. Galink Non -> Oui shows +20 immediately).
    columns.splice(1, 0, {
      key: '_score', label: 'Score', editable: false, numeric: true,
      render: function (row) { return UI.scoreBadge(Core.scoreApplication(row).score); },
      sortValue: function (row) { return Core.scoreApplication(row).score; }
    }, {
      key: '_criteria', label: 'Critères', editable: false, sortable: false,
      render: criteriaBadges
    });

    var conformitySelect = UI.select({ label: 'Conformité', options: CONFORMITY_OPTIONS, value: conformity,
      onChange: function (v) { conformity = v; table.setRows(visible()); } });
    conformitySelect.querySelector('select').id = 'apps-conformity';

    var addBtn = actions.add;
    addBtn.addEventListener('click', function () {
      addBtn.disabled = true;
      addApplication(current(), month, function () { refreshPage(); })
        .then(function () { addBtn.disabled = false; }, function () { addBtn.disabled = false; });
    });
    actions.csv.addEventListener('click', function () {
      var rows = visible().map(function (r) { var o = Object.assign({}, r); o['Score calculé (%)'] = r._score; return o; });
      UI.downloadCsv('applications_' + month + '.csv', cols.concat(['Score calculé (%)']), rows);
    });

    var table = UI.editableTable({
      columns: columns,
      rows: visible(),
      toolbar: [conformitySelect],
      emptyText: !md.applications.length ? 'Aucune application dans cet export.' :
        (hasEquipeFilter(s) || conformity !== 'all' ? 'Aucune application ne correspond aux filtres.' : 'Aucune application.'),
      onRowClick: function (row) { openDrawer(row._id, month); },
      onSave: function (changes) {
        return api.call('api_saveApplications', { month: month, changes: changes }).then(function (res) {
          State.patchRecords(month, 'applications', (res && res.updated) || []);
          if (myToken !== token) return;
          refresh();
          var n = changes.reduce(function (sum, c) { return sum + Object.keys(c.updates || {}).length; }, 0);
          UI.toast(plural(n, 'modification enregistrée', 'modifications enregistrées') + '.', 'success');
        });
      }
    });
    table.node.id = 'apps-table';
    liveComputedColumns(table, columns.slice(1, 3), function (id) {
      return (State.getMonthData(month) || md).applications.filter(function (r) { return String(r._id) === id; })[0];
    });

    function refresh() {
      table.setRows(visible());
      renderStats();
    }
    pageCtx = { token: myToken, month: month, refresh: refresh };

    var note = filterNote(s);
    if (note) body.appendChild(note);
    renderStats();
    body.appendChild(stats);
    var migrationSection = UI.section('Migration Galink / IDP', migration);
    migrationSection.id = 'apps-migration-section';
    body.appendChild(migrationSection);
    var tableSection = UI.section('Inventaire', table.node);
    tableSection.id = 'apps-inventory';
    body.appendChild(tableSection);
    addBtn.disabled = false;
    actions.csv.disabled = false;
  }

  // ------------------------------------------------------------------------------ page

  function mount(root) {
    var myToken = ++token;
    pageCtx = null;
    var s = State.get();

    if (!s.months.length || !s.month) {
      root.appendChild(header(s));
      var empty = UI.empty('Aucune donnée importée.', el('button', { type: 'button', class: 'btn btn-link',
        onClick: function () { App.go('dashboard'); } }, 'Importer un export depuis le tableau de bord'));
      empty.id = 'apps-empty';
      root.appendChild(empty);
      return;
    }

    // Page-level actions live in the header; they are wired once the month is loaded.
    var actions = {
      add: el('button', { type: 'button', class: 'btn btn-primary', id: 'apps-add', disabled: true }, 'Nouvelle application'),
      csv: el('button', { type: 'button', class: 'btn btn-secondary', id: 'apps-export-csv', disabled: true,
        title: 'Exporte les lignes affichées (filtres compris), avec le score calculé' }, 'Exporter CSV')
    };
    root.appendChild(header(s, [actions.csv, actions.add]));

    var body = el('div', { class: 'apps-body', id: 'apps-body', 'aria-busy': 'true' },
      el('p', { class: 'muted' }, UI.spinner(), 'Chargement des applications…'));
    root.appendChild(body);

    State.loadMonth(s.month).then(function (md) {
      if (myToken !== token) return;
      UI.clear(body);
      body.setAttribute('aria-busy', 'false');
      renderBody(body, State.get(), md, myToken, actions);
    }, function (err) {
      if (myToken !== token) return;
      UI.clear(body);
      body.setAttribute('aria-busy', 'false');
      body.appendChild(el('div', { class: 'alert alert-error', role: 'alert' },
        'Impossible de charger le mois ' + s.month + ' : ' + err.message));
    });
  }

  function unmount() {
    token++;
    pageCtx = null;
    if (drawerHandle) drawerHandle.close();
    drawerHandle = null;
  }

  window.Pages = window.Pages || {};
  window.Pages.apps = { id: 'apps', title: 'Applications', icon: '', mount: mount, unmount: unmount };
})();
</script>
