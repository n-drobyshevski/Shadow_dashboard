<style>
/* Postes page (docs/API.md §6 "Postes"). Selectors are prefixed with the page / drawer class. */
.page-postes .postes-stats { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; margin: 0 0 var(--space-3); }
.page-postes .postes-inline-select { flex-direction: row; align-items: center; gap: var(--space-2); }
.page-postes .postes-inline-select .input { width: auto; }
.page-postes .postes-key { padding: 0; border: 0; background: none; font: inherit; font-weight: 600; color: var(--accent-strong);
  cursor: pointer; text-align: left; overflow-wrap: anywhere; }
.page-postes .postes-key:hover { text-decoration: underline; }
.page-postes .postes-key:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 3px; }
.postes-drawer .drawer-section h3 { font-size: 14px; font-weight: 650; margin: 0 0 var(--space-2); }
.postes-drawer .drawer-head { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.postes-drawer .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px var(--space-3); margin: 0; }
.postes-drawer .kv dt { color: var(--text-muted); font-size: 13px; }
.postes-drawer .kv dd { margin: 0; overflow-wrap: anywhere; }
.postes-drawer .checklist, .postes-drawer .rel-list, .postes-drawer .action-list { list-style: none; margin: 0; padding: 0;
  display: flex; flex-direction: column; gap: 6px; }
.postes-drawer .checklist li, .postes-drawer .rel-list li { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
.postes-drawer .action-list li { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3);
  display: flex; flex-direction: column; gap: 4px; }
.postes-drawer .action-meta { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; font-size: 12px; }
.postes-drawer .section-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
</style>
<script>
/**
 * Pages.postes — workstation inventory (docs/API.md §6 "Postes").
 *
 * Editable table over the filtered postes of the selected month (column order = monthData.columns.postes,
 * key column first and read-only, computed Score + linked applications count), conformity filter,
 * generic poste creation, CSV export, and a detail drawer (criteria, installed applications, linked
 * remediation actions + "➕ Action").
 */
(function () {
  'use strict';

  var el = UI.el;
  var KEY = Core.KEY_POSTE;
  var KEY_APP = Core.KEY_APP;

  var token = 0;              // bumped on every mount/unmount: stale async renders are dropped
  var conformity = 'all';     // 'all' | 'ok' | 'ko' — kept across re-mounts (month / filter changes)
  var drawerHandle = null;    // currently open drawer {close}

  var CONFORMITY_OPTIONS = [
    { value: 'all', label: 'Toutes' },
    { value: 'ok', label: 'Conformes' },
    { value: 'ko', label: 'Non conformes' }
  ];

  // ------------------------------------------------------------------------------ helpers

  function plural(n, one, many) { return UI.fmtNum(n) + ' ' + (n > 1 ? many : one); }

  function filterNote(s) {
    var f = s.filters || {};
    var parts = [];
    if ((f.equipes || []).length) parts.push('Équipe : ' + f.equipes.join(', '));
    if ((f.batiments || []).length) parts.push('Bâtiment / Labo : ' + f.batiments.join(', '));
    if (!parts.length) return null;
    return el('p', { class: 'filter-note', role: 'status' }, el('span', { 'aria-hidden': 'true' }, '🔎 '),
      'Filtres actifs — ' + parts.join(' · '));
  }

  function hasFilters(s) {
    var f = s.filters || {};
    return ((f.equipes || []).length + (f.batiments || []).length) > 0;
  }

  /** Column order from the month's headers, key column first (falls back to the record keys). */
  function sourceColumns(md) {
    var cols = (md.columns && md.columns.postes && md.columns.postes.length) ? md.columns.postes.slice() :
      Object.keys(md.postes[0] || {}).filter(function (k) { return k.charAt(0) !== '_'; });
    return [KEY].concat(cols.filter(function (c) { return c !== KEY; }));
  }

  function splitList(v) {
    return Core.str(v).split(',').map(function (x) { return x.trim(); }).filter(Boolean);
  }

  /**
   * Applications of a poste: relations from the applications' « Installé sur poste » plus the names
   * declared in the poste's own « Application » column (deduplicated with Core.normKey).
   * -> [{application, equipe, score|null, linked:bool, declared:bool}]
   */
  function installedApps(rec, relation) {
    var name = Core.str(rec[KEY]);
    var out = [];
    var index = {};
    (relation.byPoste[name] || []).forEach(function (r) {
      var k = Core.normKey(r.application);
      if (Object.prototype.hasOwnProperty.call(index, k)) return;
      index[k] = out.length;
      out.push({ application: r.application, equipe: r.equipe, score: r.score, linked: true, declared: false });
    });
    splitList(rec['Application']).forEach(function (a) {
      var k = Core.normKey(a);
      if (Object.prototype.hasOwnProperty.call(index, k)) { out[index[k]].declared = true; return; }
      index[k] = out.length;
      out.push({ application: a, equipe: '', score: null, linked: false, declared: true });
    });
    return out;
  }

  function todayIso() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() < 9 ? '0' : '') + (d.getMonth() + 1) + '-' + (d.getDate() < 10 ? '0' : '') + d.getDate();
  }

  var STATUS_TONES = { 'À faire': 'warn', 'En cours': 'info', 'Terminé': 'ok', 'Abandonné': 'neutral' };

  function actionItem(a) {
    var open = a.status !== 'Terminé' && a.status !== 'Abandonné';
    var due = Core.frToIso(a.deadline);
    var overdue = open && due && due < todayIso();
    return el('li', { dataset: { actionId: a.id } },
      el('strong', null, a.action || '(sans libellé)'),
      el('div', { class: 'action-meta' },
        UI.badge(a.status || '—', STATUS_TONES[a.status] || 'neutral'),
        a.priorite ? UI.badge('Priorité : ' + a.priorite, a.priorite === 'Haute' ? 'ko' : 'neutral') : null,
        a.deadline ? UI.badge('Échéance : ' + a.deadline + (overdue ? ' (en retard)' : ''), overdue ? 'ko' : 'neutral') : null,
        a.responsable ? el('span', { class: 'muted' }, '👤 ' + a.responsable) : null,
        a.source_month ? el('span', { class: 'muted' }, 'Export ' + a.source_month) : null),
      a.comment ? el('p', { class: 'muted small', style: 'margin:0' }, a.comment) : null);
  }

  /**
   * "Actions liées" block for a target; reloads itself after "➕ Action".
   * isOpen() tells whether the drawer is still displayed (async guard).
   */
  function actionsBlock(targetName, rec, month, isOpen) {
    var list = el('div', { class: 'drawer-actions-list', id: 'drawer-actions', 'aria-live': 'polite' });
    var addBtn = el('button', { type: 'button', class: 'btn btn-secondary btn-small', id: 'drawer-add-action',
      onClick: function () { addAction(); } }, '➕ Action');

    function render(opts) {
      UI.clear(list).appendChild(el('p', { class: 'muted small' }, UI.spinner(), ' Chargement des actions…'));
      State.loadActions(opts).then(function (res) {
        if (!isOpen()) return;
        var mine = (res.actions || []).filter(function (a) {
          return a.target_type === 'poste' && a.target_name === targetName;
        });
        UI.clear(list);
        if (!mine.length) { list.appendChild(el('p', { class: 'muted small' }, 'Aucune action liée à ce poste.')); return; }
        list.appendChild(el('ul', { class: 'action-list' }, mine.map(actionItem)));
      }, function (err) {
        if (!isOpen()) return;
        UI.clear(list).appendChild(el('p', { class: 'muted small' }, 'Actions indisponibles : ' + err.message));
      });
    }

    function addAction() {
      UI.formModal({
        title: 'Nouvelle action — ' + targetName,
        submitLabel: 'Ajouter',
        fields: [
          { name: 'action', label: 'Action', type: 'text', required: true, value: Core.str(rec['Action corrective']) },
          { name: 'responsable', label: 'Responsable', type: 'text', value: Core.str(rec['Responsable action']) },
          { name: 'deadline', label: 'Échéance', type: 'date', value: Core.frToIso(rec['Deadline']) ? Core.str(rec['Deadline']) : '' },
          { name: 'priorite', label: 'Priorité', type: 'select', options: Core.ACTION_PRIORITIES, value: 'Moyenne' },
          { name: 'status', label: 'Statut', type: 'select', options: Core.ACTION_STATUSES, value: 'À faire', required: true },
          { name: 'comment', label: 'Commentaire', type: 'textarea' }
        ]
      }).then(function (values) {
        if (!values) return null;
        addBtn.disabled = true;
        return api.call('api_addAction', {
          target_type: 'poste', target_name: targetName, equipe: Core.str(rec['Équipe']),
          action: values.action, responsable: values.responsable, deadline: values.deadline,
          priorite: values.priorite, status: values.status, comment: values.comment, source_month: month
        }).then(function () {
          UI.toast('✅ Action ajoutée pour ' + targetName, 'success');
          render({ force: true });
        }, function (err) {
          UI.toast('❌ Impossible d’ajouter l’action : ' + err.message, 'error');
        }).then(function () { addBtn.disabled = false; });
      });
    }

    render();
    return el('section', { class: 'drawer-section' },
      el('div', { class: 'section-head' }, el('h3', null, '📋 Actions liées'), addBtn), list);
  }

  // ------------------------------------------------------------------------------ drawer

  /** Yes/No criterion: ✅ for the compliant value, ❌ otherwise, ➖ when not filled in. */
  function criterion(label, value, okValue) {
    var v = Core.str(value);
    var icon = !v ? '➖' : (v === okValue ? '✅' : '❌');
    var tone = !v ? 'neutral' : (v === okValue ? 'ok' : 'ko');
    return el('li', { dataset: { criterion: label } },
      el('span', { 'aria-hidden': 'true' }, icon),
      el('span', null, label),
      UI.badge(v || 'Non renseigné', tone));
  }

  function openDrawer(id, month) {
    var md = State.getMonthData(month);
    var rec = md && md.postes.filter(function (r) { return r._id === id; })[0];
    if (!rec) return;
    var name = Core.str(rec[KEY]);
    var relation = Core.buildPosteAppsRelation(md.applications);
    var apps = installedApps(rec, relation);
    var closed = false;
    function isOpen() { return !closed; }

    var kvRows = [['Équipe', rec['Équipe']], ['Bâtiment / Labo', rec['Bâtiment / Labo']], ['Responsable', rec['Responsable']],
      ['OS', [Core.str(rec['OS']), Core.str(rec['Version OS'])].filter(Boolean).join(' ')], ['Statut', rec['Statut']],
      ['Date visite', rec['Date visite']], ['Action corrective', rec['Action corrective']]];

    var body = el('div', { class: 'postes-drawer', id: 'poste-drawer', dataset: { id: rec._id } },
      el('div', { class: 'drawer-head' },
        UI.scoreBadge(rec._score),
        UI.badge(rec._conforme ? 'Conforme' : 'Non conforme', rec._conforme ? 'ok' : 'ko'),
        UI.riskBadge(rec['Niveau de risque'])),
      el('dl', { class: 'kv' }, kvRows.filter(function (kv) { return Core.str(kv[1]); }).map(function (kv) {
        return [el('dt', null, kv[0]), el('dd', null, Core.str(kv[1]))];
      })),
      el('section', { class: 'drawer-section', id: 'poste-drawer-criteria' },
        el('h3', null, '🛡️ Critères de conformité'),
        el('ul', { class: 'checklist' },
          criterion('IT Decathlon', rec['IT Decathlon'], 'Oui'),
          criterion('EDR Decathlon', rec['EDR Decathlon'], 'Oui'),
          criterion('Chiffrement disque', rec['Chiffrement disque'], 'Oui'),
          criterion('Type de compte', rec['Type de compte'], 'Nominatif'),
          criterion('Réseau Decathlon', rec['Réseau Decathlon'], 'Oui'))),
      el('section', { class: 'drawer-section', id: 'poste-drawer-apps' },
        el('h3', null, '📦 Applications installées (' + apps.length + ')'),
        apps.length ? el('ul', { class: 'rel-list' }, apps.map(function (a) {
          return el('li', { dataset: { app: a.application } },
            el('span', null, a.application),
            a.linked ? UI.scoreBadge(a.score) : null,
            a.equipe ? el('span', { class: 'muted small' }, a.equipe) : null,
            !a.linked ? el('span', { class: 'muted small' }, '(déclarée sur le poste, absente de l’inventaire des applications)') : null);
        })) : el('p', { class: 'muted small' }, 'Aucune application liée à ce poste.')),
      actionsBlock(name, rec, month, isOpen));

    drawerHandle = UI.drawer({ title: '💻 ' + (name || '(sans nom)'), body: body,
      onClose: function () { closed = true; drawerHandle = null; } });
  }

  // ------------------------------------------------------------------------------ page body

  function renderBody(body, s, md, myToken) {
    var month = s.month;
    var cols = sourceColumns(md);
    var relation = Core.buildPosteAppsRelation(md.applications);

    function visible() {
      var list = State.filtered(State.getMonthData(month) || md).postes;
      if (conformity === 'ok') return list.filter(function (r) { return r._conforme; });
      if (conformity === 'ko') return list.filter(function (r) { return !r._conforme; });
      return list;
    }

    // Header counts (global-filtered postes, before the conformity filter).
    var stats = el('div', { class: 'postes-stats', id: 'postes-stats', role: 'status' });
    function renderStats() {
      var all = State.filtered(State.getMonthData(month) || md).postes;
      var ok = all.filter(function (r) { return r._conforme; }).length;
      var unknown = all.filter(function (r) { return r._score === null || r._score === undefined; }).length;
      UI.clear(stats).appendChild(el('span', { class: 'muted' }, plural(all.length, 'poste', 'postes')));
      stats.appendChild(UI.badge(plural(ok, 'conforme', 'conformes') + (all.length ? ' (' + UI.fmtPct(ok / all.length * 100) + ')' : ''), 'ok'));
      stats.appendChild(UI.badge(plural(all.length - ok, 'non conforme', 'non conformes'), all.length - ok ? 'ko' : 'neutral'));
      if (unknown) stats.appendChild(UI.badge(plural(unknown, 'sans score', 'sans score'), 'neutral'));
    }

    var columns = cols.map(function (c, i) {
      if (i === 0) {
        return { key: c, label: c, editable: false, width: 170, render: function (row) {
          return el('button', { type: 'button', class: 'postes-key', title: 'Voir le détail du poste',
            onClick: function () { openDrawer(row._id, month); } }, Core.str(row[c]) || '(sans nom)');
        } };
      }
      return { key: c, label: c, editable: true, options: Core.optionsForColumn(c, md.referentiel) };
    });
    // Computed columns right after the key column (they are what the user scans first).
    columns.splice(1, 0, {
      key: '_score', label: 'Score', editable: false,
      // Live: reflects an unsaved edit of « Score conformité ».
      render: function (row) { return UI.scoreBadge(Core.parseScore(row['Score conformité'])); },
      sortValue: function (row) { return Core.parseScore(row['Score conformité']); }
    }, {
      key: '_apps', label: 'Applis', editable: false,
      render: function (row) { var n = installedApps(row, relation).length; return n ? UI.badge(String(n), 'info') : UI.badge('0', 'neutral'); },
      sortValue: function (row) { return installedApps(row, relation).length; }
    });

    var conformitySelect = UI.select({ label: 'Conformité', options: CONFORMITY_OPTIONS, value: conformity,
      onChange: function (v) { conformity = v; table.setRows(visible()); } });
    conformitySelect.classList.add('postes-inline-select');
    conformitySelect.querySelector('select').id = 'postes-conformity';

    var genericBtn = el('button', { type: 'button', class: 'btn btn-secondary btn-small', id: 'postes-add-generic',
      title: 'Ajoute « ' + Core.GENERIC_POSTE_NAME + ' » pour rattacher les applications non liées à un poste suivi',
      onClick: addGeneric }, '➕ Poste générique');
    var csvBtn = el('button', { type: 'button', class: 'btn btn-secondary btn-small', id: 'postes-export-csv',
      onClick: function () {
        UI.downloadCsv('postes_' + month + '.csv', cols, visible());
      } }, '⬇️ CSV');

    var table = UI.editableTable({
      columns: columns,
      rows: visible(),
      toolbar: [conformitySelect, genericBtn, csvBtn],
      emptyText: !md.postes.length ? 'Aucun poste dans cet export.' :
        (hasFilters(s) || conformity !== 'all' ? 'Aucun poste ne correspond aux filtres.' : 'Aucun poste.'),
      onRowClick: function (row) { openDrawer(row._id, month); },
      onSave: function (changes) {
        return api.call('api_savePostes', { month: month, changes: changes }).then(function (res) {
          State.patchRecords(month, 'postes', (res && res.updated) || []);
          if (myToken !== token) return;
          table.setRows(visible());
          renderStats();
          UI.toast('✅ ' + plural(changes.length, 'poste enregistré', 'postes enregistrés'), 'success');
        });
      }
    });
    table.node.id = 'postes-table';

    function addGeneric() {
      genericBtn.disabled = true;
      api.call('api_addGenericPoste', { month: month }).then(function (res) {
        if (res.created) {
          State.addRecord(month, 'postes', res.record);
          var hidden = hasFilters(State.get()) || conformity === 'ok';
          UI.toast('✅ « ' + Core.GENERIC_POSTE_NAME + ' » ajouté' +
            (hidden ? ' (masqué par les filtres actifs)' : ''), 'success');
        } else {
          UI.toast('ℹ️ « ' + Core.GENERIC_POSTE_NAME + ' » existe déjà pour ' + month + '.', 'info');
        }
        if (myToken !== token) return;
        table.setRows(visible());
        renderStats();
      }, function (err) {
        UI.toast('❌ Impossible d’ajouter le poste générique : ' + err.message, 'error');
      }).then(function () { genericBtn.disabled = false; });
    }

    var note = filterNote(s);
    if (note) body.appendChild(note);
    renderStats();
    body.appendChild(stats);
    body.appendChild(table.node);
  }

  // ------------------------------------------------------------------------------ page

  function mount(root) {
    var myToken = ++token;
    var s = State.get();
    root.appendChild(el('header', { class: 'page-header' },
      el('h1', { class: 'page-title' }, '💻 Postes'),
      s.month ? el('p', { class: 'page-caption', id: 'postes-caption' }, 'Export : ' + s.month) : null));

    if (!s.months.length || !s.month) {
      root.appendChild(el('div', { class: 'alert alert-warning', role: 'status', id: 'postes-empty' },
        '⚠️ Aucune donnée importée. Importez un export mensuel depuis le Tableau de bord.'));
      return;
    }

    var body = el('div', { class: 'postes-body', id: 'postes-body', 'aria-busy': 'true' },
      el('p', { class: 'muted' }, UI.spinner(), ' Chargement des postes…'));
    root.appendChild(body);

    State.loadMonth(s.month).then(function (md) {
      if (myToken !== token) return;
      UI.clear(body);
      body.setAttribute('aria-busy', 'false');
      renderBody(body, State.get(), md, myToken);
    }, function (err) {
      if (myToken !== token) return;
      UI.clear(body);
      body.setAttribute('aria-busy', 'false');
      body.appendChild(el('div', { class: 'alert alert-error', role: 'alert' },
        'Impossible de charger le mois ' + s.month + ' : ' + err.message));
    });
  }

  function unmount() {
    token++;
    if (drawerHandle) drawerHandle.close();
    drawerHandle = null;
  }

  window.Pages = window.Pages || {};
  window.Pages.postes = { id: 'postes', title: 'Postes', icon: '💻', mount: mount, unmount: unmount };
})();
</script>
