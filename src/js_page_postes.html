<script>
/**
 * Pages.postes — workstation inventory (docs/API.md §6 "Postes"), typeset per docs/DESIGN.md. Built by
 * InventoryPage (js_page_inventory.html): header (« Exporter CSV » / « Poste générique » / « Nouveau poste »),
 * stat line, editable ledger, conformity filter. Specific here: the computed « Score » / « Applis » columns, the
 * « Nouveau poste » form (EntityForm: fields read from the source sheet, in sections), the generic poste and the
 * drawer (criteria, installed applications, linked remediation actions).
 *
 * Read-only mode (lecteur, !State.canEdit()): no « Nouveau poste » / « Poste générique », no inline editing
 * (plain cells, a click anywhere on a row opens the drawer), no « Nouvelle action »; CSV export and the drawer
 * stay. Admins lose the create buttons when Paramètres turns creation off (State.can('create')), the inline
 * editors when it turns modification off (State.can('edit')); « Nouvelle action » stays.
 */
(function () {
  'use strict';

  var el = UI.el;
  var KEY = Core.KEY_POSTE;

  function splitList(v) {
    return Core.str(v).split(',').map(function (x) { return x.trim(); }).filter(Boolean);
  }

  /**
   * Applications of a poste: relations from the applications' « Installé sur poste » plus the names
   * declared in the poste's own « Application » column (deduplicated with Core.normKey).
   * -> [{application, equipe, score|null, linked:bool, declared:bool}]
   */
  function installedApps(rec, relation) {
    var name = Core.str(rec[KEY]);
    var out = [];
    var index = {};
    (relation.byPoste[name] || []).forEach(function (r) {
      var k = Core.normKey(r.application);
      if (Object.prototype.hasOwnProperty.call(index, k)) return;
      index[k] = out.length;
      out.push({ application: r.application, equipe: r.equipe, score: r.score, linked: true, declared: false });
    });
    splitList(rec['Application']).forEach(function (a) {
      var k = Core.normKey(a);
      if (Object.prototype.hasOwnProperty.call(index, k)) { out[index[k]].declared = true; return; }
      index[k] = out.length;
      out.push({ application: a, equipe: '', score: null, linked: false, declared: true });
    });
    return out;
  }

  // ------------------------------------------------------------------------------ drawer

  /** Yes/No criterion row: label ……… value ■ Conforme | ■ Non conforme | □ Non renseigné. */
  function criterion(label, value, okValue) {
    var v = Core.str(value);
    var state = !v ? 'empty' : (v === okValue ? 'ok' : 'ko');
    return el('li', { dataset: { criterion: label, state: state } },
      el('span', { class: 'crit-label' }, label),
      el('span', { class: 'leader', 'aria-hidden': 'true' }),
      v ? el('span', { class: 'crit-value' }, v) : null,
      UI.statusMark(state === 'empty' ? 'Non renseigné' : (state === 'ok' ? 'Conforme' : 'Non conforme'),
        state === 'empty' ? 'neutral' : state));
  }

  function openDrawer(id, ctx) {
    var md = ctx.md();
    var rec = md.postes.filter(function (r) { return r._id === id; })[0];
    if (!rec) return;
    var name = Core.str(rec[KEY]);
    var apps = installedApps(rec, Core.buildPosteAppsRelation(md.applications));
    var closed = false;

    var body = el('div', { class: 'entity-drawer postes-drawer', id: 'poste-drawer', dataset: { id: rec._id } },
      EntityDrawer.head(rec),
      EntityDrawer.kv([['Équipe', rec['Équipe']], ['Bâtiment / Labo', rec['Bâtiment / Labo']], ['Responsable', rec['Responsable']],
        ['OS', [Core.str(rec['OS']), Core.str(rec['Version OS'])].filter(Boolean).join(' ')], ['Statut', rec['Statut']],
        ['Date visite', rec['Date visite']], ['Action corrective', rec['Action corrective']]], { 'Date visite': 1 }),
      el('section', { class: 'drawer-section', id: 'poste-drawer-criteria' },
        el('h3', { class: 'section-title' }, 'Critères de conformité'),
        el('ul', { class: 'checklist' },
          criterion('IT Decathlon', rec['IT Decathlon'], 'Oui'),
          criterion('EDR Decathlon', rec['EDR Decathlon'], 'Oui'),
          criterion('Chiffrement disque', rec['Chiffrement disque'], 'Oui'),
          criterion('Type de compte', rec['Type de compte'], 'Nominatif'),
          criterion('Réseau Decathlon', rec['Réseau Decathlon'], 'Oui'))),
      el('section', { class: 'drawer-section', id: 'poste-drawer-apps' },
        el('h3', { class: 'section-title' }, 'Applications installées · ', el('span', { class: 'mono' }, String(apps.length))),
        apps.length ? el('ul', { class: 'rel-list' }, apps.map(function (a) {
          return el('li', { dataset: { app: a.application } },
            el('span', { class: 'rel-name is-product' }, a.application),
            a.equipe ? el('span', { class: 'rel-team' }, a.equipe) : null,
            !a.linked ? el('span', { class: 'rel-note' }, 'déclarée sur le poste, absente de l’inventaire des applications') : null,
            el('span', { class: 'spacer' }),
            a.linked ? UI.scoreBadge(a.score) : null);
        })) : UI.empty('Aucune application liée à ce poste.', { small: true })),
      EntityDrawer.actionsBlock({ target_type: 'poste', target_name: name, equipe: Core.str(rec['Équipe']), month: ctx.month,
        isOpen: function () { return !closed; }, emptyText: 'Aucune action liée à ce poste.',
        values: { action: Core.str(rec['Action corrective']), responsable: Core.str(rec['Responsable action']),
          deadline: Core.frToIso(rec['Deadline']) ? Core.str(rec['Deadline']) : '' } }));

    ctx.drawer({ title: name || '(sans nom)', body: body, onClose: function () { closed = true; } });
  }

  // ------------------------------------------------------------------------------ page

  function addGeneric(ctx, button) {
    var p = api.call('api_addGenericPoste', { month: ctx.month }).then(function (res) {
      var label = UI.quote(Core.GENERIC_POSTE_NAME);
      if (res.created) {
        State.addRecord(ctx.month, 'postes', res.record);
        var hidden = State.hasFilters() || ctx.conformity() === 'ok';
        UI.toast(label + ' ajouté' + (hidden ? ' (masqué par les filtres actifs).' : '.'), 'success');
      } else {
        UI.toast(label + ' existe déjà pour ' + Fmt.monthLong(ctx.month) + '.', 'info');
      }
      ctx.refresh();
    }, function (err) {
      UI.errorToast(err);
      // Creation turned off meanwhile (FORBIDDEN): the bootstrap reload removes the create buttons.
      State.afterWriteError(err);
    });
    UI.busy(button, p);
  }

  /** Sections of the « Nouveau poste » form (EntityForm): source columns by name, unknown ones go to « Autres colonnes ». */
  var POSTE_SECTIONS = [
    { id: 'identification', title: 'Identification', open: true, columns: [KEY, 'Équipe', 'Bâtiment / Labo', 'Responsable'] },
    { id: 'equipement', title: 'Équipement', open: true, columns: ["Date d'achat", 'Criticité équipement', 'OS', 'Version OS'] },
    { id: 'conformite', title: 'Conformité', open: true,
      columns: ['IT Decathlon', 'EDR Decathlon', 'Chiffrement disque', 'Réseau Decathlon', 'Type de compte', 'Enrolée'] },
    { id: 'visite', title: 'Visite', open: false, columns: ['N° Visite', 'Date visite', 'Prochaine revue'] },
    { id: 'suivi', title: 'Suivi', open: false, columns: ['Action corrective', 'Responsable action', 'Deadline', 'Statut',
      'Niveau de risque', 'Score conformité', 'Application', 'Commentaires'] }
  ];

  var POSTE_PRESENTATION = {
    'Nom du poste': { mono: true },
    'N° Visite': { mono: true },
    'Version OS': { mono: true },
    'Action corrective': { type: 'textarea' },
    'Commentaires': { type: 'textarea' },
    'Application': function (md) {
      return { tokens: true, options: Core.uniqueSorted(md.applications, Core.KEY_APP),
        hint: 'Plusieurs applications : séparées par des virgules.' };
    }
  };

  function posteForm(ctx) { return State.loadFormSchema('postes', ctx.month); }

  function newPoste(ctx, button) {
    return EntityForm.open(ctx, {
      entity: 'postes',
      keyField: KEY,
      title: 'Nouveau poste — ' + Fmt.monthLong(ctx.month),
      submitLabel: 'Créer le poste',
      api: 'api_addPoste',
      sections: POSTE_SECTIONS,
      presentation: POSTE_PRESENTATION,
      button: button,
      toast: function (name, o) {
        return 'Poste ' + UI.quote(name) + (o.live ? ' créé dans le Google Sheet source' :
          ' ajouté à l’historique de ' + Fmt.monthLong(o.month)) + (o.hidden ? ' (masqué par les filtres actifs).' : '.');
      }
    }).catch(function (err) { UI.errorToast(err); });
  }

  window.Pages = window.Pages || {};
  window.Pages.postes = InventoryPage.create({
    id: 'postes',
    title: 'Postes',
    entity: 'postes',
    keyField: KEY,
    filterScope: 'postes',
    filtered: function () { return State.hasFilters(); },
    nouns: { one: 'poste', many: 'postes', loading: 'Chargement des postes…', inExport: 'Aucun poste dans cet export.',
      noMatch: 'Aucun poste ne correspond aux filtres.', none: 'Aucun poste.' },
    /** Source columns shown as identifiers / dates (mono), and as figures. */
    monoColumns: { 'N° Visite': 1, 'Date visite': 1, 'Prochaine revue': 1, "Date d'achat": 1, 'Deadline': 1, 'Version OS': 1 },
    numericColumns: { 'Score conformité': 1 },
    computedColumns: function (ctx) {
      var relation = Core.buildPosteAppsRelation(ctx.md().applications);
      function appCount(row) { return installedApps(row, relation).length; }
      return [{
        key: '_score', label: 'Score', editable: false, numeric: true,
        render: function (row) { return UI.scoreBadge(Core.parseScore(row['Score conformité'])); },
        sortValue: function (row) { return Core.parseScore(row['Score conformité']); }
      }, {
        key: '_apps', label: 'Applis', editable: false, numeric: true,
        render: function (row) { var n = appCount(row); return el('span', { class: n ? null : 'faint' }, String(n)); },
        sortValue: appCount
      }];
    },
    statsExtra: function (all) {
      var unknown = all.filter(function (r) { return r._score === null || r._score === undefined; }).length;
      return [unknown ? el('span', { class: 'faint' }, EntityDrawer.count(unknown, 'sans score', 'sans score')) : null];
    },
    csvTooltip: 'Exporte les lignes affichées (filtres compris).',
    csv: function (ctx) { return { file: 'postes_' + ctx.month + '.csv', columns: ctx.columns, rows: ctx.visible() }; },
    saveApi: 'api_savePostes',
    primary: { id: 'postes-add', label: 'Nouveau poste', run: newPoste,
      prefetch: function (ctx) { posteForm(ctx).catch(function () { return null; }); } },
    secondary: { id: 'postes-add-generic', label: 'Poste générique', run: addGeneric,
      tooltip: 'Ajoute ' + UI.quote(Core.GENERIC_POSTE_NAME) + ' pour rattacher les applications non liées à un poste suivi.' },
    openDrawer: openDrawer
  });
})();
</script>
