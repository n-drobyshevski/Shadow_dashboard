<style>
/* Postes page (docs/API.md §6 "Postes", docs/DESIGN.md). Everything else comes from css.html:
   page header, stat line, ledger table, status marks, drawer sections, kv / checklist / rel-list / action-list. */
.page-postes .postes-body { display: flex; flex-direction: column; gap: var(--s4); }
.postes-drawer .checklist .leader, .postes-drawer .rel-list .leader { align-self: center; transform: none; }
.postes-drawer .crit-value { color: var(--ink-2); font-size: 13px; }
.postes-drawer .crit-label { flex: 0 1 auto; }
.postes-drawer .rel-list .rel-note { font-family: var(--font-sans); font-size: 12px; color: var(--ink-3); }
.postes-drawer .rel-list .rel-team { font-family: var(--font-sans); font-size: 12px; color: var(--ink-2); }
.postes-drawer .action-title { font-weight: 500; font-size: 13px; }
.postes-drawer .action-comment { margin: 0; font-size: 12px; color: var(--ink-2); }
.postes-drawer { display: flex; flex-direction: column; gap: var(--s5); }
</style>
<script>
/**
 * Pages.postes — workstation inventory (docs/API.md §6 "Postes"), typeset per docs/DESIGN.md.
 *
 * Page header (month kicker + "Ajouter un poste générique" / "Exporter CSV"), a one-line stat summary,
 * the editable ledger table over the filtered postes of the selected month (column order =
 * monthData.columns.postes, key column first and read-only, computed Score + linked applications count),
 * conformity filter, and a detail drawer (criteria, installed applications, linked remediation actions
 * + "Nouvelle action").
 */
(function () {
  'use strict';

  var el = UI.el;
  var KEY = Core.KEY_POSTE;

  var token = 0;              // bumped on every mount/unmount: stale async renders are dropped
  var conformity = 'all';     // 'all' | 'ok' | 'ko' — kept across re-mounts (month / filter changes)
  var drawerHandle = null;    // currently open drawer {close}

  var CONFORMITY_OPTIONS = [
    { value: 'all', label: 'Toutes' },
    { value: 'ok', label: 'Conformes' },
    { value: 'ko', label: 'Non conformes' }
  ];

  /** Source columns shown as identifiers / dates (mono). */
  var MONO_COLUMNS = { 'N° Visite': 1, 'Date visite': 1, 'Prochaine revue': 1, "Date d'achat": 1, 'Deadline': 1,
    'Version OS': 1 };

  // ------------------------------------------------------------------------------ helpers

  function plural(n, one, many) { return UI.fmtNum(n) + ' ' + (n > 1 ? many : one); }
  function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function errorToast(err) { UI.toast('Erreur : ' + ((err && err.message) || 'erreur inconnue.'), 'error'); }

  /**
   * Keeps the computed (non-editable) columns in sync with unsaved edits.
   * After every edit interaction we re-render the computed cells of the visible rows from
   * (record + dirty updates), so they never show a stale saved value.
   */
  function liveComputedColumns(table, computed, recordById) {
    function sync() {
      var dirty = {};
      table.getDirty().forEach(function (d) { dirty[String(d.id)] = d.updates; });
      Array.prototype.forEach.call(table.node.querySelectorAll('tbody tr[data-id]'), function (tr) {
        var rec = recordById(tr.dataset.id);
        if (!rec) return;
        var view = dirty[tr.dataset.id] ? Object.assign({}, rec, dirty[tr.dataset.id]) : rec;
        computed.forEach(function (col) {
          var td = tr.querySelector('td[data-col="' + col.key + '"]');
          if (!td) return;
          var out = col.render(view);
          UI.clear(td).appendChild(out instanceof Node ? out : document.createTextNode(String(out)));
        });
      });
    }
    ['change', 'focusout', 'keyup'].forEach(function (type) {
      table.node.addEventListener(type, function () { setTimeout(sync, 0); });
    });
  }

  function header(s, actions) {
    var kicker = s.month ? [capitalize(UI.fmtMonth(s.month)) + ' · ', el('span', { class: 'mono' }, 'Export ' + s.month)] :
      'Aucun export importé';
    var h = UI.pageHeader({ title: 'Postes', kicker: kicker, kickerId: s.month ? 'postes-caption' : null, actions: actions });
    var k = h.querySelector('.page-kicker');
    if (k && s.month) k.dataset.month = s.month;
    return h;
  }

  function filterNote(s) {
    var f = s.filters || {};
    var parts = [];
    if ((f.equipes || []).length) parts.push('Équipe : ' + f.equipes.join(', '));
    if ((f.batiments || []).length) parts.push('Bâtiment / Labo : ' + f.batiments.join(', '));
    if (!parts.length) return null;
    return el('p', { class: 'filter-note', role: 'status' }, 'Filtres actifs — ' + parts.join(' · '));
  }

  function hasFilters(s) {
    var f = s.filters || {};
    return ((f.equipes || []).length + (f.batiments || []).length) > 0;
  }

  /** Column order from the month's headers, key column first (falls back to the record keys). */
  function sourceColumns(md) {
    var cols = (md.columns && md.columns.postes && md.columns.postes.length) ? md.columns.postes.slice() :
      Object.keys(md.postes[0] || {}).filter(function (k) { return k.charAt(0) !== '_'; });
    return [KEY].concat(cols.filter(function (c) { return c !== KEY; }));
  }

  function splitList(v) {
    return Core.str(v).split(',').map(function (x) { return x.trim(); }).filter(Boolean);
  }

  /**
   * Applications of a poste: relations from the applications' « Installé sur poste » plus the names
   * declared in the poste's own « Application » column (deduplicated with Core.normKey).
   * -> [{application, equipe, score|null, linked:bool, declared:bool}]
   */
  function installedApps(rec, relation) {
    var name = Core.str(rec[KEY]);
    var out = [];
    var index = {};
    (relation.byPoste[name] || []).forEach(function (r) {
      var k = Core.normKey(r.application);
      if (Object.prototype.hasOwnProperty.call(index, k)) return;
      index[k] = out.length;
      out.push({ application: r.application, equipe: r.equipe, score: r.score, linked: true, declared: false });
    });
    splitList(rec['Application']).forEach(function (a) {
      var k = Core.normKey(a);
      if (Object.prototype.hasOwnProperty.call(index, k)) { out[index[k]].declared = true; return; }
      index[k] = out.length;
      out.push({ application: a, equipe: '', score: null, linked: false, declared: true });
    });
    return out;
  }

  function todayIso() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() < 9 ? '0' : '') + (d.getMonth() + 1) + '-' + (d.getDate() < 10 ? '0' : '') + d.getDate();
  }

  var STATUS_TONES = { 'À faire': 'neutral', 'En cours': 'warn', 'Terminé': 'ok', 'Abandonné': 'muted' };

  function actionItem(a) {
    var open = a.status !== 'Terminé' && a.status !== 'Abandonné';
    var due = Core.frToIso(a.deadline);
    var overdue = open && due && due < todayIso();
    return el('li', { dataset: { actionId: a.id } },
      el('strong', { class: 'action-title' }, a.action || '(sans libellé)'),
      el('div', { class: 'action-meta' },
        UI.statusMark(a.status || '—', STATUS_TONES[a.status] || 'neutral'),
        a.priorite ? el('span', null, 'Priorité ' + a.priorite.toLowerCase()) : null,
        a.deadline ? el('span', null, 'Échéance ', el('span', { class: 'mono' }, a.deadline)) : null,
        overdue ? UI.statusMark('En retard', 'ko') : null,
        a.responsable ? el('span', null, a.responsable) : null,
        a.source_month ? el('span', { class: 'faint' }, 'Export ', el('span', { class: 'mono' }, a.source_month)) : null),
      a.comment ? el('p', { class: 'action-comment' }, a.comment) : null);
  }

  /**
   * "Actions liées" block for a target; reloads itself after "Nouvelle action".
   * isOpen() tells whether the drawer is still displayed (async guard).
   */
  function actionsBlock(targetName, rec, month, isOpen) {
    var list = el('div', { class: 'drawer-actions-list', id: 'drawer-actions', 'aria-live': 'polite' });
    var addBtn = el('button', { type: 'button', class: 'btn btn-secondary btn-small', id: 'drawer-add-action',
      onClick: function () { addAction(); } }, 'Nouvelle action');

    function render(opts) {
      UI.clear(list).appendChild(el('p', { class: 'muted small' }, UI.spinner(), 'Chargement des actions…'));
      State.loadActions(opts).then(function (res) {
        if (!isOpen()) return;
        var mine = (res.actions || []).filter(function (a) {
          return a.target_type === 'poste' && a.target_name === targetName;
        });
        UI.clear(list);
        if (!mine.length) { list.appendChild(UI.empty('Aucune action liée à ce poste.')); return; }
        list.appendChild(el('ul', { class: 'action-list' }, mine.map(actionItem)));
      }, function (err) {
        if (!isOpen()) return;
        UI.clear(list).appendChild(UI.empty('Actions indisponibles : ' + err.message));
      });
    }

    function addAction() {
      UI.formModal({
        title: 'Nouvelle action — ' + targetName,
        submitLabel: 'Ajouter',
        fields: [
          { name: 'action', label: 'Action', type: 'text', required: true, value: Core.str(rec['Action corrective']) },
          { name: 'responsable', label: 'Responsable', type: 'text', value: Core.str(rec['Responsable action']) },
          { name: 'deadline', label: 'Échéance', type: 'date', value: Core.frToIso(rec['Deadline']) ? Core.str(rec['Deadline']) : '' },
          { name: 'priorite', label: 'Priorité', type: 'select', options: Core.ACTION_PRIORITIES, value: 'Moyenne' },
          { name: 'status', label: 'Statut', type: 'select', options: Core.ACTION_STATUSES, value: 'À faire', required: true },
          { name: 'comment', label: 'Commentaire', type: 'textarea' }
        ]
      }).then(function (values) {
        if (!values) return null;
        addBtn.disabled = true;
        return api.call('api_addAction', {
          target_type: 'poste', target_name: targetName, equipe: Core.str(rec['Équipe']),
          action: values.action, responsable: values.responsable, deadline: values.deadline,
          priorite: values.priorite, status: values.status, comment: values.comment, source_month: month
        }).then(function () {
          UI.toast('Action ajoutée pour ' + targetName + '.', 'success');
          render({ force: true });
        }, errorToast).then(function () { addBtn.disabled = false; });
      });
    }

    render();
    return el('section', { class: 'drawer-section' },
      el('div', { class: 'section-head' }, el('h3', null, 'Actions liées'), addBtn), list);
  }

  // ------------------------------------------------------------------------------ drawer

  /** Yes/No criterion row: label ……… value ■ Conforme | ■ Non conforme | Non renseigné. */
  function criterion(label, value, okValue) {
    var v = Core.str(value);
    var state = !v ? 'empty' : (v === okValue ? 'ok' : 'ko');
    return el('li', { dataset: { criterion: label, state: state } },
      el('span', { class: 'crit-label' }, label),
      el('span', { class: 'leader', 'aria-hidden': 'true' }),
      v ? el('span', { class: 'crit-value' }, v) : null,
      UI.statusMark(state === 'empty' ? 'Non renseigné' : (state === 'ok' ? 'Conforme' : 'Non conforme'),
        state === 'empty' ? 'neutral' : state));
  }

  function openDrawer(id, month) {
    var md = State.getMonthData(month);
    var rec = md && md.postes.filter(function (r) { return r._id === id; })[0];
    if (!rec) return;
    var name = Core.str(rec[KEY]);
    var relation = Core.buildPosteAppsRelation(md.applications);
    var apps = installedApps(rec, relation);
    var closed = false;
    function isOpen() { return !closed; }

    var kvRows = [['Équipe', rec['Équipe']], ['Bâtiment / Labo', rec['Bâtiment / Labo']], ['Responsable', rec['Responsable']],
      ['OS', [Core.str(rec['OS']), Core.str(rec['Version OS'])].filter(Boolean).join(' ')], ['Statut', rec['Statut']],
      ['Date visite', rec['Date visite']], ['Action corrective', rec['Action corrective']]];

    var body = el('div', { class: 'postes-drawer', id: 'poste-drawer', dataset: { id: rec._id } },
      el('div', { class: 'drawer-head' },
        el('span', { class: 'stat-line' }, el('span', { class: 'faint small' }, 'Score'), UI.scoreBadge(rec._score)),
        UI.statusMark(rec._conforme ? 'Conforme' : 'Non conforme', rec._conforme ? 'ok' : 'ko'),
        Core.str(rec['Niveau de risque']) ?
          el('span', { class: 'stat-line' }, el('span', { class: 'faint small' }, 'Risque'), UI.riskBadge(rec['Niveau de risque'])) : null),
      el('dl', { class: 'kv' }, kvRows.filter(function (kv) { return Core.str(kv[1]); }).map(function (kv) {
        return [el('dt', null, kv[0]), el('dd', { class: kv[0] === 'Date visite' ? 'mono' : null }, Core.str(kv[1]))];
      })),
      el('section', { class: 'drawer-section', id: 'poste-drawer-criteria' },
        el('h3', null, 'Critères de conformité'),
        el('ul', { class: 'checklist' },
          criterion('IT Decathlon', rec['IT Decathlon'], 'Oui'),
          criterion('EDR Decathlon', rec['EDR Decathlon'], 'Oui'),
          criterion('Chiffrement disque', rec['Chiffrement disque'], 'Oui'),
          criterion('Type de compte', rec['Type de compte'], 'Nominatif'),
          criterion('Réseau Decathlon', rec['Réseau Decathlon'], 'Oui'))),
      el('section', { class: 'drawer-section', id: 'poste-drawer-apps' },
        el('h3', null, 'Applications installées · ', el('span', { class: 'mono' }, String(apps.length))),
        apps.length ? el('ul', { class: 'rel-list' }, apps.map(function (a) {
          return el('li', { dataset: { app: a.application } },
            el('span', null, a.application),
            a.equipe ? el('span', { class: 'rel-team' }, a.equipe) : null,
            !a.linked ? el('span', { class: 'rel-note' }, 'déclarée sur le poste, absente de l’inventaire des applications') : null,
            el('span', { class: 'spacer' }),
            a.linked ? UI.scoreBadge(a.score) : null);
        })) : UI.empty('Aucune application liée à ce poste.')),
      actionsBlock(name, rec, month, isOpen));

    drawerHandle = UI.drawer({ title: name || '(sans nom)', body: body,
      onClose: function () { closed = true; drawerHandle = null; } });
  }

  // ------------------------------------------------------------------------------ page body

  function renderBody(body, s, md, myToken, actions) {
    var month = s.month;
    var cols = sourceColumns(md);
    var relation = Core.buildPosteAppsRelation(md.applications);

    function visible() {
      var list = State.filtered(State.getMonthData(month) || md).postes;
      if (conformity === 'ok') return list.filter(function (r) { return r._conforme; });
      if (conformity === 'ko') return list.filter(function (r) { return !r._conforme; });
      return list;
    }

    // Summary line (global-filtered postes, before the conformity filter):
    // "7 postes · ■ 5 conformes 71,4 % · ■ 2 non conformes · 1 sans score".
    var stats = el('p', { class: 'stat-line postes-stats', id: 'postes-stats', role: 'status' });
    function renderStats() {
      var all = State.filtered(State.getMonthData(month) || md).postes;
      var ok = all.filter(function (r) { return r._conforme; }).length;
      var ko = all.length - ok;
      var unknown = all.filter(function (r) { return r._score === null || r._score === undefined; }).length;
      UI.clear(stats).appendChild(el('span', { class: 'stat' }, plural(all.length, 'poste', 'postes')));
      stats.appendChild(el('span', { class: 'stat' }, UI.statusMark(plural(ok, 'conforme', 'conformes'), 'ok'),
        all.length ? el('span', { class: 'mono' }, ' ', UI.fmtPctNode(ok / all.length * 100)) : null));
      stats.appendChild(el('span', { class: 'stat' }, UI.statusMark(plural(ko, 'non conforme', 'non conformes'), ko ? 'ko' : 'neutral')));
      if (unknown) stats.appendChild(el('span', { class: 'stat faint' }, plural(unknown, 'sans score', 'sans score')));
    }

    var columns = cols.map(function (c, i) {
      if (i === 0) {
        return { key: c, label: c, editable: false, width: 150, render: function (row) {
          return el('button', { type: 'button', class: 'postes-key', title: 'Voir le détail du poste',
            onClick: function () { openDrawer(row._id, month); } }, Core.str(row[c]) || '(sans nom)');
        } };
      }
      // Read view: Statut / Niveau de risque as status marks, « Non » criteria in --ko (the editor is unchanged).
      return { key: c, label: c, editable: true, mono: !!MONO_COLUMNS[c], options: Core.optionsForColumn(c, md.referentiel),
        render: function (row) { return UI.cellMark(c, row[c]) || Core.str(row[c]); } };
    });
    // Computed columns right after the key column (they are what the user scans first).
    columns.splice(1, 0, {
      key: '_score', label: 'Score', editable: false, numeric: true,
      // Live: reflects an unsaved edit of « Score conformité ».
      render: function (row) { return UI.scoreBadge(Core.parseScore(row['Score conformité'])); },
      sortValue: function (row) { return Core.parseScore(row['Score conformité']); }
    }, {
      key: '_apps', label: 'Applis', editable: false, numeric: true,
      render: function (row) {
        var n = installedApps(row, relation).length;
        return el('span', { class: n ? null : 'faint' }, String(n));
      },
      sortValue: function (row) { return installedApps(row, relation).length; }
    });

    var conformitySelect = UI.select({ label: 'Conformité', options: CONFORMITY_OPTIONS, value: conformity,
      onChange: function (v) { conformity = v; table.setRows(visible()); } });
    conformitySelect.querySelector('select').id = 'postes-conformity';

    var genericBtn = actions.generic;
    genericBtn.addEventListener('click', addGeneric);
    actions.csv.addEventListener('click', function () {
      UI.downloadCsv('postes_' + month + '.csv', cols, visible());
    });

    var table = UI.editableTable({
      columns: columns,
      rows: visible(),
      toolbar: [conformitySelect],
      emptyText: !md.postes.length ? 'Aucun poste dans cet export.' :
        (hasFilters(s) || conformity !== 'all' ? 'Aucun poste ne correspond aux filtres.' : 'Aucun poste.'),
      onRowClick: function (row) { openDrawer(row._id, month); },
      onSave: function (changes) {
        return api.call('api_savePostes', { month: month, changes: changes }).then(function (res) {
          State.patchRecords(month, 'postes', (res && res.updated) || []);
          if (myToken !== token) return;
          table.setRows(visible());
          renderStats();
          var n = changes.reduce(function (sum, c) { return sum + Object.keys(c.updates || {}).length; }, 0);
          UI.toast(plural(n, 'modification enregistrée', 'modifications enregistrées') + '.', 'success');
        });
      }
    });
    table.node.id = 'postes-table';
    liveComputedColumns(table, columns.slice(1, 3), function (id) {
      return (State.getMonthData(month) || md).postes.filter(function (r) { return String(r._id) === id; })[0];
    });

    function addGeneric() {
      genericBtn.disabled = true;
      api.call('api_addGenericPoste', { month: month }).then(function (res) {
        if (res.created) {
          State.addRecord(month, 'postes', res.record);
          var hidden = hasFilters(State.get()) || conformity === 'ok';
          UI.toast('« ' + Core.GENERIC_POSTE_NAME + ' » ajouté' +
            (hidden ? ' (masqué par les filtres actifs).' : '.'), 'success');
        } else {
          UI.toast('« ' + Core.GENERIC_POSTE_NAME + ' » existe déjà pour ' + month + '.', 'info');
        }
        if (myToken !== token) return;
        table.setRows(visible());
        renderStats();
      }, errorToast).then(function () { genericBtn.disabled = false; });
    }

    var note = filterNote(s);
    if (note) body.appendChild(note);
    renderStats();
    body.appendChild(stats);
    var tableSection = UI.section('Inventaire', table.node);
    tableSection.id = 'postes-inventory';
    body.appendChild(tableSection);
    genericBtn.disabled = false;
    actions.csv.disabled = false;
  }

  // ------------------------------------------------------------------------------ page

  function mount(root) {
    var myToken = ++token;
    var s = State.get();

    if (!s.months.length || !s.month) {
      root.appendChild(header(s));
      var empty = UI.empty('Aucune donnée importée.', el('button', { type: 'button', class: 'btn btn-link',
        onClick: function () { App.go('dashboard'); } }, 'Importer un export depuis le tableau de bord'));
      empty.id = 'postes-empty';
      root.appendChild(empty);
      return;
    }

    // Page-level actions live in the header; they are wired once the month is loaded.
    var actions = {
      generic: el('button', { type: 'button', class: 'btn btn-secondary', id: 'postes-add-generic', disabled: true,
        title: 'Ajoute « ' + Core.GENERIC_POSTE_NAME + ' » pour rattacher les applications non liées à un poste suivi' },
        'Ajouter un poste générique'),
      csv: el('button', { type: 'button', class: 'btn btn-secondary', id: 'postes-export-csv', disabled: true,
        title: 'Exporte les lignes affichées (filtres compris)' }, 'Exporter CSV')
    };
    root.appendChild(header(s, [actions.generic, actions.csv]));

    var body = el('div', { class: 'postes-body', id: 'postes-body', 'aria-busy': 'true' },
      el('p', { class: 'muted' }, UI.spinner(), 'Chargement des postes…'));
    root.appendChild(body);

    State.loadMonth(s.month).then(function (md) {
      if (myToken !== token) return;
      UI.clear(body);
      body.setAttribute('aria-busy', 'false');
      renderBody(body, State.get(), md, myToken, actions);
    }, function (err) {
      if (myToken !== token) return;
      UI.clear(body);
      body.setAttribute('aria-busy', 'false');
      body.appendChild(el('div', { class: 'alert alert-error', role: 'alert' },
        'Impossible de charger le mois ' + s.month + ' : ' + err.message));
    });
  }

  function unmount() {
    token++;
    if (drawerHandle) drawerHandle.close();
    drawerHandle = null;
  }

  window.Pages = window.Pages || {};
  window.Pages.postes = { id: 'postes', title: 'Postes', icon: '', mount: mount, unmount: unmount };
})();
</script>
