<script>
/**
 * Shared machinery of the two inventory pages (Postes, Applications), loaded before them.
 *
 * window.EntityDrawer — blocks of the poste / application drawers:
 *     EntityDrawer.head(rec, extra?) -> div.drawer-head « Score 86 % · ■ Conforme · Risque ■ Élevé » (+ extra)
 *     EntityDrawer.kv(rows:[[label, value]], monoLabels?:{label:1}) -> dl.kv of the non-empty rows
 *     EntityDrawer.actionsBlock({target_type, target_name, equipe, month, values?, isOpen, emptyText})
 *         -> section « Actions liées » + « Nouvelle action ». The form is window.ActionForm.open (defined by
 *         js_page_actions.html: one form, copy and toast for the drawers and Suivi des actions) with the
 *         target prefilled and locked; the list re-renders from the refreshed actions cache. Lecteurs
 *         (!State.canEdit()) get the list alone, without « Nouvelle action ».
 *     EntityDrawer.statLine(items:[Node|string]) -> p.stat-line ; EntityDrawer.count(n, one, many) -> [num, ' noun'].
 *
 * window.InventoryPage.create(spec) -> {id, title, mount, unmount, update}: header (month kicker,
 * « Exporter CSV » + the page's create button), filter note, one-line stat summary, optional sections,
 * then the « Inventaire » editable table over the filtered records of the month (key column first and
 * read-only, opening the drawer; computed columns right after it), the « Conformité » filter, inline
 * saves. update(['filters']) re-renders the body from the cache without re-mounting the page.
 *   spec: {id ('postes'|'apps': element ids and classes), title, entity ('postes'|'applications'),
 *     keyField, filterScope (State.filterSummary scope), filtered(s) (the global filters apply here),
 *     nouns: {one, many, loading, inExport, noMatch, none}, monoColumns, numericColumns?, extraColumns?:[name],
 *     computedColumns(ctx) -> [column], statsExtra?(all) -> [stat item], sections?(ctx) -> [section],
 *     onStats?(all, ctx), csv(ctx) -> {file, columns, rows}, csvTooltip, saveApi,
 *     primary?: {id, label, tooltip?, run(ctx, button), prefetch?(ctx)} (admins; prefetch runs when the pointer
 *       or the focus reaches the button), secondary?: {id, label, tooltip?, run(ctx, button)} (admins, an outline
 *       button before the primary one), openDrawer(id, ctx)}
 *   ctx: {month, columns, md() (current cached month), all() (globally filtered), visible() (+ conformity),
 *     refresh(), refreshPage(), rerenderPage() (body rebuilt from the cache: new columns), isShown(id) (the record
 *     is in the table as filtered now), rowNode(id), live(), table, openDrawer(id), drawer(UI.drawer opts),
 *     drawerOpen(), closeDrawer()}
 *
 * window.EntityForm.open(ctx, {entity, keyField, title, submitLabel, api, sections, presentation?, toast,
 *     fieldFallback?, button?}) -> Promise<record|null> — the creation form of a poste / an application in a side
 *   panel (UI.formPanel through ctx.drawer). Its fields come from api_getFormSchema (State.loadFormSchema):
 *   strict lists -> dropdown, other lists -> combobox (suggestions; a list without options suggests the month's
 *   values), date -> UI.dateField, checkbox -> Oui / Non (or its options), text. Computed columns are not fields:
 *   one note names them (end of « Conformité »). sections: [{id, title, open, columns:[name]}] (matched with
 *   Core.normKey, in that order; unknown columns go to « Autres colonnes », open); a section holding a required
 *   field or a prefilled value opens. presentation: {column: extras | (md) -> extras} for text / non-strict
 *   columns (type:'textarea', tokens + options + hint, mono). Équipe / Bâtiment / Labo default to the single
 *   active filter value. Footer note: where the record goes (source, or the frozen month's history). Only
 *   non-blank values are sent to `api`; on success the record is added to the cache, the table refreshed, the
 *   row scrolled into view, toast(name, {live, hidden, month}) shown, focus back on `button`. fieldFallback: the
 *   field a VALIDATION error without a field is shown under.
 */
(function () {
  'use strict';

  var el = UI.el;

  // ============================================================================== EntityDrawer

  function AF() { return window.ActionForm; }

  /** [figure in mono, ' noun'] for a stat line. */
  function count(n, one, many) { return [el('span', { class: 'num' }, UI.fmtNum(n)), ' ' + (n > 1 ? many : one)]; }
  function statLine(items, attrs) {
    return el('p', Object.assign({ class: 'stat-line' }, attrs || {}),
      items.filter(Boolean).map(function (it) { return el('span', { class: 'stat' }, it); }));
  }

  function head(rec, extra) {
    return el('div', { class: 'drawer-head' },
      el('span', { class: 'stat-line' }, el('span', { class: 'faint small' }, 'Score'), UI.scoreBadge(rec._score)),
      UI.statusMark(rec._conforme ? 'Conforme' : 'Non conforme', rec._conforme ? 'ok' : 'ko'),
      Core.str(rec['Niveau de risque']) ?
        el('span', { class: 'stat-line' }, el('span', { class: 'faint small' }, 'Risque'), UI.riskBadge(rec['Niveau de risque'])) : null,
      extra || null);
  }

  function kv(rows, monoLabels) {
    return el('dl', { class: 'kv' }, rows.filter(function (r) { return Core.str(r[1]); }).map(function (r) {
      return [el('dt', null, r[0]), el('dd', { class: monoLabels && monoLabels[r[0]] ? 'mono' : null }, Core.str(r[1]))];
    }));
  }

  function actionItem(a) {
    return el('li', { dataset: { actionId: a.id } },
      el('span', { class: 'action-title' }, a.action || '(sans libellé)'),
      el('div', { class: 'action-meta' },
        AF().statusMark(a.status),
        AF().priorityMark(a.priorite, { long: true }) || null,
        a.deadline ? el('span', null, 'Échéance ', el('span', { class: 'mono' }, a.deadline)) : null,
        AF().isOverdue(a) ? UI.statusMark('En retard', 'ko') : null,
        a.responsable ? el('span', null, a.responsable) : null,
        a.source_month ? el('span', { class: 'faint' }, 'Export de ' + Fmt.monthLong(a.source_month)) : null),
      a.comment ? el('p', { class: 'action-comment' }, a.comment) : null);
  }

  /**
   * « Actions liées » block of a drawer; reloads itself after « Nouvelle action ».
   * o: {target_type, target_name, equipe, month, values?, isOpen(), emptyText}
   */
  function actionsBlock(o) {
    var list = el('div', { class: 'drawer-actions-list', id: 'drawer-actions', 'aria-live': 'polite' });
    // Lecteurs read the linked actions; creating one is an admin write (api_addAction).
    var addBtn = !State.canEdit() ? null : el('button', { type: 'button', class: 'btn btn-secondary btn-sm', id: 'drawer-add-action',
      onClick: function () {
        AF().open({ target: { type: o.target_type, name: o.target_name, equipe: o.equipe }, defaults: o.values || {},
          trigger: addBtn, onSaved: function () { if (o.isOpen()) render(); } });
      } }, 'Nouvelle action');

    function render(opts) {
      UI.asyncBlock(list, {
        load: function () { return State.loadActions(opts); },
        live: o.isOpen,
        placeholder: function () { return UI.loading('Chargement des actions…', { small: true }); },
        small: true,
        error: { prefix: 'Actions indisponibles', retry: function () { render({ force: true }); } },
        render: function (res) {
          var mine = (res.actions || []).filter(function (a) {
            return a.target_type === o.target_type && a.target_name === o.target_name;
          });
          list.appendChild(mine.length ? el('ul', { class: 'action-list' }, mine.map(actionItem)) :
            UI.empty(o.emptyText, { small: true }));
        }
      });
    }

    render();
    return el('section', { class: 'drawer-section', id: 'drawer-actions-section' },
      el('div', { class: 'section-head' }, el('h3', { class: 'section-title' }, 'Actions liées'), addBtn), list);
  }

  window.EntityDrawer = { head: head, kv: kv, actionsBlock: actionsBlock, statLine: statLine, count: count };

  // ============================================================================== InventoryPage

  var CONFORMITY_OPTIONS = [
    { value: 'all', label: 'Toutes' },
    { value: 'ok', label: 'Conformes' },
    { value: 'ko', label: 'Non conformes' }
  ];

  function create(spec) {
    var p = spec.id;
    var conformity = 'all';   // kept across re-mounts (month / filter changes)
    var changedOnly = false;  // period: « Seulement ce qui a changé » (kept across re-mounts)
    var view = null;          // {root, body, month, buttons, ctx}
    var drawerHandle = null;

    /** Column order from the month's headers, key column first (falls back to the record keys). */
    function sourceColumns(md) {
      var declared = md.columns && md.columns[spec.entity];
      var cols = declared && declared.length ? declared.slice() :
        Object.keys(md[spec.entity][0] || {}).filter(function (k) { return k.charAt(0) !== '_'; });
      (spec.extraColumns || []).forEach(function (c) { if (cols.indexOf(c) < 0) cols.push(c); });
      return [spec.keyField].concat(cols.filter(function (c) { return c !== spec.keyField; }));
    }

    function mount(root) {
      var s = State.get();
      view = null;
      if (!s.months.length || !s.month) {
        root.appendChild(UI.monthHeader({ title: spec.title, month: '', kickerId: p + '-caption' }));
        root.appendChild(UI.noData(p + '-empty'));
        return;
      }
      var per = State.period();
      // A period shows the inventory of its last month, compared with its first one (fromMonth).
      var v = { root: root, month: s.month, fromMonth: per.single ? '' : per.from, ctx: null, buttons: {} };
      // Page-level actions live in the header, enabled once the month is loaded. Lecteurs: CSV only.
      // One rule on every page: [Exporter CSV (secondary)] then [create action (primary)].
      v.buttons.csv = el('button', { type: 'button', class: 'btn btn-secondary', id: p + '-export-csv', disabled: true,
        tooltip: spec.csvTooltip, onClick: function () {
          if (!v.ctx) return;
          var out = spec.csv(v.ctx);
          UI.downloadCsv(out.file, out.columns, out.rows);
        } }, 'Exporter CSV');
      if (spec.secondary && State.canEdit()) {
        v.buttons.secondary = el('button', { type: 'button', class: 'btn btn-secondary', id: spec.secondary.id, disabled: true,
          tooltip: spec.secondary.tooltip || null,
          onClick: function () { if (v.ctx) spec.secondary.run(v.ctx, v.buttons.secondary); } }, spec.secondary.label);
      }
      if (spec.primary && State.canEdit()) {
        var prefetch = spec.primary.prefetch ? function () { if (v.ctx) spec.primary.prefetch(v.ctx); } : null;
        v.buttons.primary = el('button', { type: 'button', class: 'btn btn-primary', id: spec.primary.id, disabled: true,
          tooltip: spec.primary.tooltip || null, onPointerenter: prefetch, onFocus: prefetch,
          onClick: function () { if (v.ctx) spec.primary.run(v.ctx, v.buttons.primary); } }, spec.primary.label);
      }
      root.appendChild(UI.monthHeader({ title: spec.title, month: s.month, from: v.fromMonth, endLabel: 'inventaire',
        kickerId: p + '-caption', actions: [v.buttons.csv, v.buttons.secondary, v.buttons.primary].filter(Boolean) }));
      v.body = el('div', { class: 'block-stack ' + p + '-body', id: p + '-body' });
      root.appendChild(v.body);
      view = v;
      UI.asyncBlock(v.body, {
        load: function () {
          if (!v.fromMonth) return State.loadMonth(v.month);
          return Promise.all([State.loadMonth(v.month), State.loadMonth(v.fromMonth)]).then(function (r) { return r[0]; });
        },
        placeholder: function () { return UI.skeleton('table', { label: spec.nouns.loading, columns: 7 }); },
        error: UI.monthError(v.month),
        render: function (md) { renderBody(v, md); }
      });
    }

    /** Filter change: the body re-renders from the cache; header, buttons and scroll position stay. */
    function update(changed) {
      var v = view;
      if (!v || !v.ctx || changed.length !== 1 || changed[0] !== 'filters') return false;
      var md = State.getMonthData(v.month);
      if (!md) return false;
      UI.clear(v.body);
      renderBody(v, md);
      return true;
    }

    function renderBody(v, md) {
      var month = v.month;
      var cols = sourceColumns(md);
      var ctx = { month: month, columns: cols, table: null };
      ctx.live = function () { return view === v && v.ctx === ctx && v.body.isConnected; };
      ctx.md = function () { return State.getMonthData(month) || md; };
      ctx.conformity = function () { return conformity; };
      ctx.all = function () { return State.filtered(ctx.md())[spec.entity]; };
      // Period: Core.scoreEvolution of the first month -> this one (same filters), memoised until refresh().
      var evo = null;
      ctx.evolution = function () {
        if (!v.fromMonth) return null;
        var fmd = State.getMonthData(v.fromMonth);
        if (!fmd) return null;
        if (!evo) evo = Core.scoreEvolution(State.filtered(fmd)[spec.entity], ctx.all(), spec.keyField);
        return evo;
      };
      function evoOf(row) {
        var e = ctx.evolution();
        return e ? e.byKey[Core.normKey(row[spec.keyField])] || null : null;
      }
      ctx.visible = function () {
        var list = ctx.all();
        if (conformity === 'ok') list = list.filter(function (r) { return r._conforme; });
        if (conformity === 'ko') list = list.filter(function (r) { return !r._conforme; });
        if (changedOnly && ctx.evolution()) list = list.filter(function (r) { var x = evoOf(r); return x && x.status !== 'same'; });
        return list;
      };
      ctx.refresh = function () {
        if (!ctx.live()) return;
        evo = null;
        ctx.table.setRows(ctx.visible());
        renderStats();
      };
      ctx.openDrawer = function (id) { spec.openDrawer(id, ctx); };
      /** UI.drawer whose lifetime the page tracks (closed on unmount). */
      ctx.drawer = function (o) {
        var onClose = o.onClose;
        drawerHandle = UI.drawer(Object.assign({}, o, { onClose: function () {
          drawerHandle = null;
          if (onClose) onClose();
        } }));
        return drawerHandle;
      };
      ctx.drawerOpen = function () { return !!drawerHandle; };
      ctx.closeDrawer = function () { if (drawerHandle) drawerHandle.close(); };
      /** Refreshes the table of the page as it is now (the body may have been re-rendered since). */
      ctx.refreshPage = function () { if (view && view.ctx) view.ctx.refresh(); };
      /** Rebuilds the body of the page from the cache (the month gained a column). */
      ctx.rerenderPage = function () {
        var cur = view;
        var data = cur && cur.ctx ? State.getMonthData(cur.month) : null;
        if (!data) return;
        UI.clear(cur.body);
        renderBody(cur, data);
      };
      /** True when the record is a row of the table as filtered now (global filters, conformity, period). */
      ctx.isShown = function (id) {
        return !!(view && view.ctx && view.ctx.visible().some(function (r) { return r._id === id; }));
      };
      /** The table row of a record (null when it is filtered out or on another page of the table). */
      ctx.rowNode = function (id) {
        if (!view || !view.ctx || !view.ctx.table) return null;
        var rows = view.ctx.table.node.querySelectorAll('tbody tr[data-id]');
        for (var i = 0; i < rows.length; i++) if (rows[i].dataset.id === id) return rows[i];
        return null;
      };
      v.ctx = ctx;

      // Summary line (globally filtered records, before the conformity filter):
      // "7 postes   ■ 5 conformes 71,4 %   ■ 2 non conformes" (figures in mono) + the page's extras.
      var stats = el('div', { id: p + '-stats', class: p + '-stats-wrap', role: 'status' });
      function renderStats() {
        var all = ctx.all();
        var ok = all.filter(function (r) { return r._conforme; }).length;
        var ko = all.length - ok;
        UI.clear(stats).appendChild(statLine([
          count(all.length, spec.nouns.one, spec.nouns.many),
          [UI.statusMark(count(ok, 'conforme', 'conformes'), 'ok'),
            all.length ? [' ', el('span', { class: 'num' }, UI.fmtPctNode(ok / all.length * 100))] : null],
          UI.statusMark(count(ko, 'non conforme', 'non conformes'), ko ? 'ko' : 'neutral')
        ].concat(spec.statsExtra ? spec.statsExtra(all) : [], periodStats())));
        renderRemoved();
        if (spec.onStats) spec.onStats(all, ctx);
      }

      // Period summary: « +14 nouveaux · 2 retirés · 9 scores modifiés depuis avril » and the removed records.
      var fromName = v.fromMonth ? Fmt.MONTHS[Number(v.fromMonth.slice(5, 7)) - 1] : '';
      var removedBox = el('p', { class: 'field-help evo-removed', id: p + '-removed', hidden: true });
      var fem = spec.entity === 'applications';
      function periodStats() {
        var e = ctx.evolution();
        if (!e) return [];
        return [el('span', { class: 'evo-stats', id: p + '-evo-stats' },
          el('span', { class: 'num' }, '+' + UI.fmtNum(e.added)), ' ' + (fem ? (e.added > 1 ? 'nouvelles' : 'nouvelle') : (e.added > 1 ? 'nouveaux' : 'nouveau')) + ' · ',
          el('span', { class: 'num' }, UI.fmtNum(e.removed.length)), ' ' + (e.removed.length > 1 ? 'retiré' + (fem ? 'es' : 's') : 'retiré' + (fem ? 'e' : '')) + ' · ',
          el('span', { class: 'num' }, UI.fmtNum(e.changed)), ' ' + (e.changed > 1 ? 'scores modifiés' : 'score modifié') +
          ' depuis ' + fromName)];
      }
      function renderRemoved() {
        var e = ctx.evolution();
        UI.clear(removedBox);
        removedBox.hidden = !e || !e.removed.length;
        if (removedBox.hidden) return;
        var names = e.removed.map(function (r) { return Core.str(r[spec.keyField]) || '(sans nom)'; });
        removedBox.appendChild(document.createTextNode(UI.plural(names.length, spec.nouns.one + (fem ? ' retirée' : ' retiré'), spec.nouns.many + (fem ? ' retirées' : ' retirés')) +
          ' depuis ' + Fmt.monthLong(v.fromMonth) + ' : '));
        names.forEach(function (n, i) {
          removedBox.appendChild(el('span', { class: spec.entity === 'postes' ? 'mono' : null }, n));
          if (i < names.length - 1) removedBox.appendChild(document.createTextNode(', '));
        });
      }

      var mono = spec.monoColumns || {};
      var numeric = spec.numericColumns || {};
      var columns = cols.map(function (c, i) {
        if (i === 0) {
          return { key: c, label: c, editable: false, width: 150, render: function (row) {
            return el('button', { type: 'button', class: p + '-key', 'aria-haspopup': 'dialog',
              onClick: function () { ctx.openDrawer(row._id); } }, Core.str(row[c]) || '(sans nom)');
          } };
        }
        // Read view: Statut / Niveau de risque as status marks, « Non » criteria in --ko (the editor is unchanged).
        return { key: c, label: c, editable: true, mono: !!mono[c], numeric: !!numeric[c],
          options: Core.optionsForColumn(c, md.referentiel),
          render: numeric[c] ? function (row) {
            var n = Core.parseScore(row[c]);
            return n === null || n === undefined ? Core.str(row[c]) : UI.fmtPctNode(n);
          } : function (row) { return UI.cellMark(c, row[c]) || Core.str(row[c]); } };
      });
      // Computed columns right after the key column (what the user scans first); they are computed from
      // the displayed row (re-rendered after every edit), so they follow unsaved edits.
      var computed = spec.computedColumns(ctx);
      if (v.fromMonth) {
        computed.push({ key: '_evo', label: 'Évolution depuis ' + fromName, editable: false,
          render: function (row) {
            var x = evoOf(row);
            if (!x) return el('span', { class: 'faint' }, '—');
            if (x.status === 'new') return el('span', { class: 'evo evo-new' }, fem ? 'Nouvelle' : 'Nouveau');
            if (x.status === 'same') return el('span', { class: 'faint' }, '—');
            return el('span', { class: 'evo evo-' + x.status }, UI.fmtPctNode(x.from), ' → ', UI.fmtPctNode(x.to));
          },
          sortValue: function (row) {
            var x = evoOf(row);
            return !x ? 0 : x.status === 'new' ? 1000 : x.status === 'same' ? 0 : x.to - x.from;
          } });
      }
      Array.prototype.splice.apply(columns, [1, 0].concat(computed));

      var conformitySelect = UI.select({ id: p + '-conformity', label: 'Conformité', options: CONFORMITY_OPTIONS,
        value: conformity, onChange: function (val) { conformity = val; ctx.table.setRows(ctx.visible()); } });

      var changedBox = v.fromMonth ? UI.checkbox({ id: p + '-changed-only', label: 'Seulement ce qui a changé',
        checked: changedOnly, onChange: function (b) { changedOnly = b; ctx.table.setRows(ctx.visible()); } }) : null;

      var canEdit = State.canEdit();
      var n = spec.nouns;
      ctx.table = UI.editableTable({
        columns: columns,
        rows: ctx.visible(),
        readOnly: !canEdit,
        toolbar: [conformitySelect, changedBox].filter(Boolean),
        emptyText: !md[spec.entity].length ? n.inExport :
          (spec.filtered(State.get()) || conformity !== 'all' ? n.noMatch : n.none),
        onRowClick: function (row) { ctx.openDrawer(row._id); },
        onSave: !canEdit ? null : function (changes) {
          return api.call(spec.saveApi, { month: month, changes: changes }).then(function (res) {
            State.patchRecords(month, spec.entity, (res && res.updated) || []);
            ctx.refresh();
            var edits = changes.reduce(function (sum, c) { return sum + Object.keys(c.updates || {}).length; }, 0);
            UI.toast(UI.plural(edits, 'modification enregistrée', 'modifications enregistrées') +
              (res && res.sourceUpdated ? ' dans le Google Sheet source.' : ' (historique de ' + Fmt.monthLong(month) + ').'), 'success');
          });
        }
      });
      ctx.table.node.id = p + '-table';

      var note = UI.filterNote(spec.filterScope);
      if (note) v.body.appendChild(note);
      // Where an edit goes: the current month follows the source (written there), a past month is history.
      if (canEdit) {
        var live = month === State.get().currentMonth;
        v.body.appendChild(el('p', { class: 'alert alert-info edit-note', id: p + '-edit-note', dataset: { live: live ? '1' : '0' } },
          live ? 'Les modifications sont écrites dans le Google Sheet source' +
            (spec.entity === 'applications' ? ' (Galink et IDP restent dans l’application).' : '.') :
            'Mois figé : les modifications ne changent que l’historique de ' + Fmt.monthLong(month) + ', pas le Google Sheet source.'));
      }
      v.body.appendChild(stats);
      (spec.sections ? spec.sections(ctx) : []).forEach(function (section) { v.body.appendChild(section); });
      renderStats();
      var tableSection = UI.section('Inventaire', ctx.table.node, removedBox);
      tableSection.id = p + '-inventory';
      v.body.appendChild(tableSection);
      if (v.buttons.primary) v.buttons.primary.disabled = false;
      if (v.buttons.secondary) v.buttons.secondary.disabled = false;
      v.buttons.csv.disabled = false;
    }

    function unmount() {
      view = null;
      if (drawerHandle) drawerHandle.close();
      drawerHandle = null;
    }

    return { id: spec.id, title: spec.title, mount: mount, unmount: unmount, update: update };
  }

  window.InventoryPage = { create: create };

  // ============================================================================== EntityForm

  var OTHER_SECTION = 'autres';
  var NOTE_SECTION = 'conformite';   // the computed-columns note closes this section (else the first one)

  /** Footer note of the form: where the new record is written. */
  function whereNote(entity, month, live) {
    if (live) {
      return 'Écrit dans le Google Sheet source' + (entity === 'applications' ? ' (Galink et IDP restent dans l’application).' : '.');
    }
    return 'Mois figé : ajouté à l’historique de ' + Fmt.monthLong(month) + ' seulement, le Google Sheet source n’est pas modifié.';
  }

  /** Équipe / Bâtiment / Labo: the value of the single active filter of that kind ('' otherwise). */
  function filterDefault(name, entity) {
    var f = State.get().filters || {};
    var k = Core.normKey(name);
    var list = k === Core.normKey('Équipe') ? f.equipes :
      (entity === 'postes' && k === Core.normKey('Bâtiment / Labo') ? f.batiments : null);
    return list && list.length === 1 ? Core.str(list[0]) : '';
  }

  function uniq(list) {
    var seen = {};
    return list.filter(function (v) {
      var k = Core.normKey(v);
      if (!k || seen[k]) return false;
      seen[k] = true;
      return true;
    });
  }

  /** One schema column (api_getFormSchema) -> one UI.formFields field. */
  function fieldOf(col, md, cfg) {
    var f = { name: col.name, label: col.name, required: !!col.required };
    var options = Array.isArray(col.options) && col.options.length ? col.options.map(Core.str) : null;
    var strictList = (col.kind === 'select' || col.kind === 'checkbox') && !!col.strict;
    if (col.kind === 'date') {
      f.type = 'date';
    } else if (col.kind === 'checkbox') {
      f.type = 'select';
      f.options = options || ['Oui', 'Non'];
    } else if (col.kind === 'select' && strictList && options) {
      f.type = 'select';
      f.options = options;
    } else if (col.kind === 'select') {
      // A list that accepts other values (or whose values are unknown): a combobox suggesting them.
      f.type = 'select';
      f.allowCustom = true;
      f.options = options || Core.uniqueSorted(md[cfg.entity], col.name);
    } else {
      f.type = 'text';
    }
    var extra = presentationOf(cfg, col.name);
    if (typeof extra === 'function') extra = extra(md);
    extra = extra || {};
    if (!strictList && col.kind !== 'date' && col.kind !== 'checkbox') {
      if (extra.type === 'textarea' && f.type === 'text') f.type = 'textarea';
      if (extra.tokens) {
        f.type = 'select';
        f.allowCustom = true;
        f.tokens = true;
        f.options = uniq((f.options || []).concat(extra.options || []));
      }
      if (extra.placeholder) f.placeholder = extra.placeholder;
      if (extra.hint) f.hint = extra.hint;
    }
    if (extra.mono) f.mono = true;
    var def = filterDefault(col.name, cfg.entity);
    if (def && (!strictList || (f.options || []).indexOf(def) >= 0)) f.value = def;
    return f;
  }

  function presentationOf(cfg, name) {
    var map = cfg.presentation || {};
    var k = Core.normKey(name);
    var keys = Object.keys(map);
    for (var i = 0; i < keys.length; i++) if (Core.normKey(keys[i]) === k) return map[keys[i]];
    return null;
  }

  /** « Score conformité, Niveau de risque, Statut : calculés par le Google Sheet. » */
  function computedNote(names) {
    return names.join(', ') + ' : ' + (names.length > 1 ? 'calculés' : 'calculé') + ' par le Google Sheet.';
  }

  /** « Colonnes lues dans le Google Sheet source · 14:02 » and the like, from the schema's origin. */
  function schemaMeta(schema, month) {
    var at = schema.readAt ? Fmt.stamp(schema.readAt) : '';
    if (schema.origin === 'source') return 'Colonnes lues dans le Google Sheet source' + (at ? ' à ' + at : '') + '.';
    if (schema.origin === 'fallback') return 'Colonnes de la dernière synchronisation' + (at ? ' (' + at + ')' : '') + '.';
    return 'Colonnes de l’historique de ' + Fmt.monthLong(month) + '.';
  }

  /** {fields, groups, alert, meta} of UI.formPanel for a schema. */
  function buildForm(schema, md, cfg, month) {
    var sections = cfg.sections || [];
    var place = {};   // normKey(column) -> {index (section), rank}
    sections.forEach(function (sec, i) {
      (sec.columns || []).forEach(function (c, rank) { place[Core.normKey(c)] = { index: i, rank: rank }; });
    });
    var computed = [];
    var items = [];
    (schema.columns || []).forEach(function (col, order) {
      if (!col || !Core.str(col.name)) return;
      if (col.computed) { computed.push(col.name); return; }
      var at = place[Core.normKey(col.name)] || { index: sections.length, rank: order };
      var f = fieldOf(col, md, cfg);
      f.group = at.index < sections.length ? sections[at.index].id : OTHER_SECTION;
      items.push({ field: f, index: at.index, rank: at.rank, order: order });
    });
    items.sort(function (a, b) { return a.index - b.index || a.rank - b.rank || a.order - b.order; });
    var fields = items.map(function (it) { return it.field; });
    var groups = sections.concat([{ id: OTHER_SECTION, title: 'Autres colonnes', open: true }]).map(function (sec) {
      var mine = fields.filter(function (f) { return f.group === sec.id; });
      var open = sec.open !== false || mine.some(function (f) { return f.required || Core.str(f.value) !== ''; });
      return { id: sec.id, title: sec.title, open: open, count: mine.length };
    }).filter(function (g) { return g.count > 0; });
    if (computed.length && groups.length) {
      var target = groups.filter(function (g) { return g.id === NOTE_SECTION; })[0] || groups[0];
      target.note = computedNote(computed);
    }
    return {
      fields: fields,
      groups: groups.map(function (g) { return { id: g.id, title: g.title, open: g.open, note: g.note || null }; }),
      alert: schema.origin === 'fallback' ? (schema.warning || 'Le Google Sheet source n’a pas pu être lu.') : null,
      meta: schemaMeta(schema, month)
    };
  }

  /** EntityForm.open(ctx, cfg): see the header. */
  function openEntityForm(ctx, cfg) {
    var month = ctx.month;
    var entity = cfg.entity;
    var live = month === State.get().currentMonth;
    var created = null;
    var sent = null;
    var appOnly = {};
    return UI.formPanel({
      title: cfg.title,
      className: 'entity-form',
      submitLabel: cfg.submitLabel,
      note: whereNote(entity, month, live),
      reloadLabel: 'Relire les colonnes',
      open: ctx.drawer,
      load: function (o) {
        return State.loadFormSchema(entity, month, { force: !!(o && o.force) }).then(function (schema) {
          appOnly = {};
          (schema.columns || []).forEach(function (c) { if (c && c.appOnly) appOnly[c.name] = true; });
          return buildForm(schema, ctx.md(), cfg, month);
        });
      },
      onSubmit: function (values) {
        var record = {};
        Object.keys(values).forEach(function (k) { if (Core.str(values[k]) !== '') record[k] = values[k]; });
        sent = record;
        return api.call(cfg.api, { month: month, record: record }).then(function (rec) { created = rec; }, function (err) {
          if (cfg.fieldFallback && err && err.code === 'VALIDATION' && !err.field) err.field = cfg.fieldFallback;
          throw err;
        });
      }
    }).then(function (values) {
      if (!values || !created) return null;
      var grew = State.extendColumns(month, entity, Object.keys(sent || {}).filter(function (k) { return !appOnly[k]; }));
      State.addRecord(month, entity, created);
      if (grew) ctx.rerenderPage(); else ctx.refreshPage();
      var name = Core.str(created[cfg.keyField]);
      UI.toast(cfg.toast(name, { live: live, hidden: !ctx.isShown(created._id), month: month }), 'success');
      var row = ctx.rowNode(created._id);
      if (row && row.scrollIntoView) row.scrollIntoView({ block: 'nearest' });
      var button = cfg.button;
      if (button && button.isConnected && document.activeElement !== button) {
        try { button.focus({ preventScroll: true }); } catch (e) { button.focus(); }
      }
      return created;
    });
  }

  window.EntityForm = { open: openEntityForm };
})();
</script>
